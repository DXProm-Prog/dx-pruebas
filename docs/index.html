      {type === "sorteo" && (
        <div className="mb-3">
          <div className="dp-body text-[11px] mb-2" style={{ color: INK + "88" }}>
            <i className="ti ti-dice-5" style={{ marginRight: "4px" }}></i>
            {tf("nq.sorteoExplain", lang)}
          </div>
          {options.map((opt, i) => (
            <div key={i} className="flex items-center gap-2 mb-1.5">
              <input
                value={opt}
                onChange={(e) => updateOption(i, e.target.value)}
                placeholder={tf("nq.candidateN", lang, { n: i + 1 })}
                className="dp-body flex-1 rounded-lg px-2.5 py-1.5 text-sm outline-none"
                style={{ background: BLUE_SOFT, color: INK }}
              />
              {options.length > 2 && (
                <button onClick={() => removeOption(i)} className="dp-body text-xs px-1" style={{ color: CORAL }}><i className="ti ti-x"></i></button>
              )}
            </div>
          ))}
          <button onClick={addOption} className="dp-body text-xs font-medium" style={{ color: BLUE }}>{tf("nq.addCandidate", lang)}</button>
        </div>
      )}

      {type === "mayoria" && (
        <React.Fragment>
          <div className="mb-3">
            {options.map((opt, i) => (
              <div key={i} className="flex items-center gap-2 mb-1.5">
                <input
                  value={opt}
                  onChange={(e) => updateOption(i, e.target.value)}
                  placeholder={tf("nq.optionN", lang, { n: i + 1 })}
                  className="dp-body flex-1 rounded-lg px-2.5 py-1.5 text-sm outline-none"
                  style={{ background: BLUE_SOFT, color: INK }}
                />
                {options.length > 2 && (
                  <button onClick={() => removeOption(i)} className="dp-body text-xs px-1" style={{ color: CORAL }}><i className="ti ti-x"></i></button>
                )}
              </div>
            ))}
            <button onClick={addOption} className="dp-body text-xs font-medium" style={{ color: BLUE }}>{tf("nq.addOption", lang)}</button>
          </div>

          <div className="dp-body text-[10px] font-semibold mb-1.5" style={{ color: INK + "88", textTransform: "uppercase", letterSpacing: "0.03em" }}>
            {tf("nq.majoritySection", lang)}
          </div>
          <div className="flex gap-1.5 mb-2">
            {["simple", "absoluta", "calificada"].map((r) => (
              <button
                key={r}
                onClick={() => setMajorityRule(r)}
                className="dp-body text-[11px] px-2 py-1.5 rounded-full font-medium flex-1"
                style={majorityRule === r ? { background: BLUE, color: "#fff" } : { background: BLUE_SOFT, color: INK }}
              >
                {RULE_LABEL[r]}
              </button>
            ))}
          </div>
          {majorityRule === "calificada" && (
            <div className="dp-body flex items-center gap-2 text-xs mb-3" style={{ color: INK }}>
              {tf("nq.requiresMoreThan", lang)}
              <input type="number" min="51" max="99" value={qualifiedPct} onChange={(e) => setQualifiedPct(e.target.value)} className="dp-mono w-14 rounded-lg px-2 py-1 text-center outline-none" style={{ background: BLUE_SOFT }} />
              %
            </div>
          )}

          <div style={{ height: "1px", background: BLUE + "22", margin: "8px 0" }} />
          <button
            onClick={() => setMajorityRule("rankeado")}
            className="dp-body block w-full text-left text-xs font-medium px-2.5 py-2 rounded-lg mb-2"
            style={majorityRule === "rankeado" ? { background: BLUE, color: "#fff" } : { background: BLUE_SOFT, color: INK }}
          >
            {tf("nq.rule.rankeado", lang)}
          </button>

          <div style={{ height: "1px", background: BLUE + "22", margin: "8px 0" }} />
          <button
            onClick={() => setMajorityRule("segunda_vuelta")}
            className="dp-body block w-full text-left text-xs font-medium px-2.5 py-2 rounded-lg mb-2"
            style={majorityRule === "segunda_vuelta" ? { background: BLUE, color: "#fff" } : { background: BLUE_SOFT, color: INK }}
          >
            {tf("nq.rule.segundaVuelta", lang)}
          </button>
          {isSegundaVuelta && (
            <div className="flex gap-3 mb-2">
              <label className="dp-body flex items-center gap-1.5 text-xs" style={{ color: INK }}>
                {tf("nq.numRounds", lang)}
                <input type="number" min="1" value={numRounds} onChange={(e) => setNumRounds(e.target.value)} className="dp-mono w-11 rounded-lg px-1.5 py-1 text-center outline-none" style={{ background: BLUE_SOFT }} />
              </label>
            </div>
          )}
          {isSegundaVuelta && (
            <div className="flex gap-3 mb-1">
              <label className="dp-body flex items-center gap-1.5 text-xs" style={{ color: INK }}>
                {tf("nq.minPercentSurvive", lang)}
                <input type="number" min="0" max="100" value={eliminationThresholdPercent} onChange={(e) => setEliminationThresholdPercent(e.target.value)} className="dp-mono w-11 rounded-lg px-1.5 py-1 text-center outline-none" style={{ background: BLUE_SOFT }} />
              </label>
            </div>
          )}
          {isSegundaVuelta && (
            <div className="dp-body text-[10px] mb-3" style={{ color: INK + "77" }}>
              {tf("nq.roundsEliminateNote", lang)}
            </div>
          )}

          <button onClick={() => setShowDefs(!showDefs)} className="dp-body text-[11px] font-medium mb-2" style={{ color: BLUE }}>
            {showDefs ? tf("nq.hideDefs", lang) : tf("nq.whatMeans", lang)}
          </button>
          {showDefs && (
            <div className="rounded-lg p-2.5 mb-3 text-[11px] leading-relaxed" style={{ background: BLUE_SOFT, color: INK + "cc" }}>
              {Object.entries(RULE_LABEL).map(([k, l]) => (
                <div key={k} className="mb-1">
                  <b style={{ color: INK }}>{l}:</b> {RULE_DEF[k]}
                </div>
              ))}
            </div>
          )}
        </React.Fragment>
      )}

      {type !== "sorteo" && (
        <React.Fragment>
          <div className="dp-body text-xs font-medium mb-1.5" style={{ color: INK }}>
            {isSegundaVuelta ? tf("nq.timeLimitRound", lang) : tf("nq.timeLimitAnswer", lang)}
          </div>
          <div className="flex gap-1.5 mb-2">
            <button onClick={() => setUseLimit(false)} className="dp-body text-xs px-3 py-1.5 rounded-full font-medium flex-1" style={!useLimit ? { background: BLUE, color: "#fff" } : { background: BLUE_SOFT, color: INK }}>{tf("nq.no", lang)}</button>
            <button onClick={() => setUseLimit(true)} className="dp-body text-xs px-3 py-1.5 rounded-full font-medium flex-1" style={useLimit ? { background: BLUE, color: "#fff" } : { background: BLUE_SOFT, color: INK }}>{tf("nq.yes", lang)}</button>
          </div>
          {useLimit && (
            <div className="flex gap-2 mb-1">
              <label className="dp-body flex items-center gap-1.5 text-xs" style={{ color: INK + "99" }}>
                {tf("nq.days", lang)} <input type="number" min="0" value={days} onChange={(e) => setDays(e.target.value)} className="dp-mono w-11 rounded-lg px-1.5 py-1 text-center outline-none" style={{ background: BLUE_SOFT }} />
              </label>
              <label className="dp-body flex items-center gap-1.5 text-xs" style={{ color: INK + "99" }}>
                {tf("nq.hours", lang)} <input type="number" min="0" max="23" value={hours} onChange={(e) => setHours(e.target.value)} className="dp-mono w-11 rounded-lg px-1.5 py-1 text-center outline-none" style={{ background: BLUE_SOFT }} />
              </label>
              <label className="dp-body flex items-center gap-1.5 text-xs" style={{ color: INK + "99" }}>
                {tf("nq.minutes", lang)} <input type="number" min="0" max="59" value={minutes} onChange={(e) => setMinutes(e.target.value)} className="dp-mono w-11 rounded-lg px-1.5 py-1 text-center outline-none" style={{ background: BLUE_SOFT }} />
              </label>
            </div>
          )}
          {isSegundaVuelta && (
            <div className="dp-body text-[10px] mb-3" style={{ color: INK + "77" }}>
              {useLimit ? tf("nq.autoCloses", lang) : tf("nq.manualCloses", lang)}
            </div>
          )}
          {!isSegundaVuelta && <div className="mb-3" />}
        </React.Fragment>
      )}

      <button
        type="button"
        onClick={() => setShowPreview(!showPreview)}
        className="dp-body w-full flex items-center justify-center gap-1.5 text-xs py-2 rounded-full font-medium mb-2"
        style={{ background: BLUE_SOFT, color: INK }}
      >
        <i className="ti ti-eye" style={{ marginRight: "4px" }}></i>{showPreview ? tf("nq.hidePreview", lang) : tf("nq.preview", lang)}
      </button>

      {showPreview && (
        <div className="rounded-2xl p-3 mb-3" style={{ background: PAGE_BG, border: `1.5px dashed ${BLUE}55` }}>
          <div className="dp-body text-[10px] font-semibold mb-2" style={{ color: INK + "77", textTransform: "uppercase", letterSpacing: "0.03em" }}>
            {tf("nq.howTheyllSeeIt", lang)}
          </div>
          <div className="rounded-xl p-3.5" style={{ background: WARM_WHITE, border: `1px solid ${BLUE}33` }}>
            <div className="dp-body text-[15px] mb-1" style={{ color: INK }}>{text || tf("nq.writeQuestionAbove", lang)}</div>
            <div className="dp-body text-[11px] mb-3" style={{ color: INK + "77" }}>
              {type === "promedio"
                ? tf("nq.previewTrim", lang, { pct: trimPercent || 0 })
                : type === "sorteo"
                ? tf("nq.previewSorteo", lang)
                : majorityRule === "calificada"
                ? tf("nq.previewNeedsMoreThan", lang, { pct: qualifiedPct || 66 })
                : majorityRule === "absoluta"
                ? tf("nq.previewNeedsAbsoluta", lang)
                : majorityRule === "simple"
                ? tf("nq.previewWinsMostVoted", lang)
                : majorityRule === "rankeado"
                ? tf("nq.previewRanked", lang)
                : tf("nq.previewRounds", lang, { n: numRounds || 3, pct: eliminationThresholdPercent || 10 })}
            </div>

            {type === "promedio" && (
              <div className="flex items-center gap-2">
                <div className="flex-1 rounded-lg px-2.5 py-1.5 text-sm dp-mono" style={{ background: BLUE_SOFT, color: INK + "77" }}>{tf("input.yourProposal", lang)}</div>
                <div className="text-xs px-3 py-2 rounded-full text-white font-medium" style={{ background: GREEN, opacity: 0.6 }}><i className="ti ti-send" style={{ marginRight: "4px" }}></i>{tf("flow.send", lang)}</div>
              </div>
            )}

            {type === "sorteo" && (
              <div className="flex flex-col gap-1.5">
                {(options.map((o) => o.trim()).filter(Boolean).length ? options.map((o) => o.trim()).filter(Boolean) : [tf("nq.candidateN", lang, { n: 1 }), tf("nq.candidateN", lang, { n: 2 })]).map((opt, i) => (
                  <div key={i} className="dp-body text-left text-sm px-3 py-2 rounded-lg" style={{ background: BLUE_SOFT, color: INK }}>
                    {opt}
                  </div>
                ))}
                <div className="text-xs px-3 py-2 rounded-full text-white font-medium text-center" style={{ background: BLUE, opacity: 0.6 }}><i className="ti ti-dice-5" style={{ marginRight: "4px" }}></i>{tf("sorteo.drawButton", lang)}</div>
              </div>
            )}

            {type === "mayoria" && majorityRule !== "rankeado" && (
              <div className="flex flex-col gap-1.5">
                {(options.map((o) => o.trim()).filter(Boolean).length ? options.map((o) => o.trim()).filter(Boolean) : [tf("nq.optionN", lang, { n: 1 }), tf("nq.optionN", lang, { n: 2 })]).map((opt, i) => (
                  <div key={i} className="dp-body text-left text-sm px-3 py-2 rounded-lg" style={{ background: BLUE_SOFT, color: INK }}>
                    ○ {opt}
                  </div>
                ))}
              </div>
            )}

            {type === "mayoria" && majorityRule === "rankeado" && (
              <div className="flex flex-col gap-1.5">
                <div className="dp-body text-[11px] mb-1" style={{ color: INK + "77" }}>{tf("input.rankOrderShort", lang)}</div>
                {(options.map((o) => o.trim()).filter(Boolean).length ? options.map((o) => o.trim()).filter(Boolean) : [tf("nq.optionN", lang, { n: 1 }), tf("nq.optionN", lang, { n: 2 })]).map((opt, i) => (
                  <div key={i} className="dp-body flex items-center gap-2 text-left text-sm px-3 py-2 rounded-lg" style={{ background: BLUE_SOFT, color: INK }}>
                    <span className="dp-mono font-semibold" style={{ minWidth: "16px" }}>–</span>{opt}
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      )}

      {error && <div className="dp-body text-[12px] mb-2" style={{ color: CORAL }}>{error}</div>}

      <button
        onClick={submit}
        disabled={adding || !text}
        className="dp-body w-full flex items-center justify-center gap-1.5 text-xs py-2 rounded-full text-white font-medium disabled:opacity-40"
        style={{ background: BLUE }}
      >
        <i className="ti ti-plus" style={{ marginRight: "4px" }}></i>{adding ? tf("nq.adding", lang) : tf("nq.addQuestion", lang)}
      </button>
    </div>
  );
}


function StageInput({ stage, onSend, sending, disabled, flowConfig, approvedMemberNames }) {
  const siLang = useLang();
  const [numValue, setNumValue] = useState("");
  const [selected, setSelected] = useState("");
  const [texts, setTexts] = useState(() => {
    const suggested = stage.config.suggestedItems || [];
    const blanks = Array(Math.max(0, (stage.config.maxItemsPerPerson || 1) - suggested.length)).fill("");
    return suggested.length ? [...suggested, ...blanks] : Array(stage.config.maxItemsPerPerson || 1).fill("");
  });
  const [rankOrder, setRankOrder] = useState([]);
  const [catValues, setCatValues] = useState(() => stage.config.presetPercentages || {});
  const [selectedMulti, setSelectedMulti] = useState([]);
  const [myMergeGroups, setMyMergeGroups] = useState([]);

  if (stage.type === "promedio") {
    const singleMemberCount = stage.key === "singleQuota" ? flowConfig?.memberCounts?.single : null;
    return (
      <div className="mb-2">
        <div className="flex items-center gap-2">
          <input
            type="number"
            placeholder={tf("input.yourProposal", siLang)}
            value={numValue}
            disabled={disabled}
            onChange={(e) => setNumValue(e.target.value)}
            className="dp-mono flex-1 rounded-lg px-2.5 py-1.5 text-sm outline-none disabled:opacity-50"
            style={{ background: BLUE_SOFT, color: INK }}
          />
          <button
            onClick={() => onSend(Number(numValue))}
            disabled={sending || disabled || numValue === ""}
            className="dp-body flex items-center gap-1.5 text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40"
            style={{ background: GREEN }}
          >
            <i className="ti ti-send" style={{ marginRight: "4px" }}></i>{sending ? tf("flow.sending", siLang) : tf("flow.send", siLang)}
          </button>
        </div>
        {singleMemberCount > 0 && numValue !== "" && (
          <div className="dp-mono text-[11px] mt-1" style={{ color: INK + "77" }}>
            {tf("input.membersCollected", siLang, { count: singleMemberCount, value: numValue, total: formatMoney(singleMemberCount * Number(numValue)) })}
          </div>
        )}
      </div>
    );
  }

  if (stage.type === "mayoria") {
    return (
      <div className="flex flex-col gap-1.5 mb-2">
        {stage.config.explanation && (
          <div className="dp-body text-[11px] mb-1 p-2.5 rounded-lg whitespace-pre-line" style={{ background: PAGE_BG, color: INK + "99", lineHeight: 1.5 }}>
            {stage.config.explanation}
          </div>
        )}
        {stage.config.options.map((opt) => (
          <button
            key={opt}
            onClick={() => setSelected(opt)}
            disabled={disabled}
            className="dp-body text-left text-sm px-3 py-2 rounded-lg disabled:opacity-50"
            style={selected === opt ? { background: BLUE, color: "#fff" } : { background: BLUE_SOFT, color: INK }}
          >
            {selected === opt ? "● " : "○ "}{opt}
          </button>
        ))}
        <button
          onClick={() => onSend(selected)}
          disabled={sending || disabled || !selected}
          className="dp-body flex items-center justify-center gap-1.5 text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40 mt-1"
          style={{ background: GREEN }}
        >
          <i className="ti ti-send" style={{ marginRight: "4px" }}></i>{sending ? tf("flow.sending", siLang) : tf("flow.send", siLang)}
        </button>
      </div>
    );
  }

  if (stage.type === "recoleccion_abierta") {
    return (
      <div className="mb-2">
        {stage.config.fixedExpenseNames && stage.config.fixedExpenseNames.length > 0 && (
          <div className="rounded-lg p-2.5 mb-3" style={{ background: PAGE_BG }}>
            <div className="dp-body text-[10.5px] font-semibold mb-1" style={{ color: INK + "99" }}>{tf("input.alreadyCovered", siLang)}</div>
            <div className="dp-body text-[11px]" style={{ color: INK }}>{stage.config.fixedExpenseNames.join(", ")}</div>
          </div>
        )}
        {texts.map((t, i) => (
          <input
            key={i}
            value={t}
            disabled={disabled}
            onChange={(e) => {
              const arr = [...texts];
              arr[i] = e.target.value;
              setTexts(arr);
            }}
            placeholder={tf("input.proposalPlaceholder", siLang, { n: i + 1 })}
            className="dp-body w-full rounded-lg px-2.5 py-1.5 text-sm outline-none mb-1.5 disabled:opacity-50"
            style={{ background: BLUE_SOFT, color: INK }}
          />
        ))}
        {!disabled && (
          <button
            onClick={() => setTexts([...texts, ""])}
            className="dp-body text-xs font-medium mb-2"
            style={{ color: BLUE }}
          >
            {tf("input.addBox", siLang)}
          </button>
        )}
        <button
          onClick={() => onSend(texts.filter((t) => t.trim()))}
          disabled={sending || disabled || texts.every((t) => !t.trim())}
          className="dp-body flex items-center justify-center gap-1.5 w-full text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40"
          style={{ background: GREEN }}
        >
          <i className="ti ti-send" style={{ marginRight: "4px" }}></i>{sending ? tf("flow.sending", siLang) : tf("flow.send", siLang)}
        </button>
      </div>
    );
  }

  if (stage.type === "ranking_multiganador") {
    return (
      <div className="flex flex-col gap-1.5 mb-2">
        <div className="dp-body text-[11px] mb-1" style={{ color: INK + "77" }}>{tf("input.rankOrderShort", siLang)}</div>
        {stage.config.options.map((opt) => {
          const idx = rankOrder.indexOf(opt);
          return (
            <button
              key={opt}
              onClick={() => setRankOrder((prev) => (prev.includes(opt) ? prev.filter((o) => o !== opt) : [...prev, opt]))}
              disabled={disabled}
              className="dp-body flex items-center gap-2 text-left text-sm px-3 py-2 rounded-lg disabled:opacity-50"
              style={idx >= 0 ? { background: BLUE, color: "#fff" } : { background: BLUE_SOFT, color: INK }}
            >
              <span className="dp-mono font-semibold" style={{ minWidth: "16px" }}>{idx >= 0 ? idx + 1 : "–"}</span>
              {opt}
            </button>
          );
        })}
        <button
          onClick={() => onSend(rankOrder)}
          disabled={sending || disabled || rankOrder.length === 0}
          className="dp-body flex items-center justify-center gap-1.5 text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40 mt-1"
          style={{ background: GREEN }}
        >
          <i className="ti ti-send" style={{ marginRight: "4px" }}></i>{sending ? tf("flow.sending", siLang) : tf("flow.send", siLang)}
        </button>
      </div>
    );
  }

  if (stage.type === "promedio_por_categoria") {
    const memberCounts = flowConfig?.memberCounts || {};
    const hasAnyMemberCount = stage.config.categories.some((cat) => memberCounts[cat] > 0);
    const liveTotal = stage.config.categories.reduce((sum, cat) => {
      const mc = memberCounts[cat];
      const v = Number(catValues[cat]);
      return mc > 0 && !isNaN(v) ? sum + mc * v : sum;
    }, 0);
    return (
      <div className="mb-2">
        {stage.config.categories.map((cat) => {
          const mc = memberCounts[cat];
          return (
            <div key={cat} className="mb-1.5">
              <div className="flex items-center gap-2">
                <span className="dp-body text-xs flex-1" style={{ color: INK }}>{cat}</span>
                <input
                  type="number"
                  value={catValues[cat] || ""}
                  disabled={disabled}
                  onChange={(e) => setCatValues({ ...catValues, [cat]: e.target.value })}
                  className="dp-mono w-24 rounded-lg px-2 py-1.5 text-sm outline-none disabled:opacity-50"
                  style={{ background: BLUE_SOFT, color: INK }}
                />
              </div>
              {mc > 0 && catValues[cat] !== undefined && catValues[cat] !== "" && (
                <div className="dp-mono text-[10px] text-right" style={{ color: INK + "77" }}>
                  {tf("input.membersCollectedShort", siLang, { count: mc, value: catValues[cat], total: formatMoney(mc * Number(catValues[cat])) })}
                </div>
              )}
            </div>
          );
        })}
        {hasAnyMemberCount && (
          <div className="dp-mono text-[11px] mb-2" style={{ color: INK + "88" }}>
            {tf("input.totalCollected", siLang, { total: formatMoney(liveTotal) })}
          </div>
        )}
        <button
          onClick={() => {
            const obj = {};
            Object.entries(catValues).forEach(([k, v]) => {
              const n = Number(v);
              if (!isNaN(n)) obj[k] = n;
            });
            onSend(obj);
          }}
          disabled={sending || disabled}
          className="dp-body flex items-center justify-center gap-1.5 w-full text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40"
          style={{ background: GREEN }}
        >
          <i className="ti ti-send" style={{ marginRight: "4px" }}></i>{sending ? tf("flow.sending", siLang) : tf("flow.send", siLang)}
        </button>
      </div>
    );
  }

  if (stage.type === "seleccion_multiple") {
    return (
      <div className="mb-2">
        {stage.config.options.map((opt) => {
          const isSelected = selectedMulti.includes(opt);
          return (
            <button
              key={opt}
              onClick={() => setSelectedMulti((prev) => (isSelected ? prev.filter((o) => o !== opt) : [...prev, opt]))}
              disabled={disabled}
              className="dp-body flex items-center gap-2 text-left text-sm px-3 py-2 rounded-lg mb-1.5 disabled:opacity-50 w-full"
              style={isSelected ? { background: BLUE, color: "#fff" } : { background: BLUE_SOFT, color: INK }}
            >
              <i className={`ti ${isSelected ? "ti-square-check" : "ti-square"}`} style={{ marginRight: "5px" }}></i>{opt}
            </button>
          );
        })}
        <button
          onClick={() => onSend(selectedMulti)}
          disabled={sending || disabled || selectedMulti.length === 0}
          className="dp-body flex items-center justify-center gap-1.5 w-full text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40"
          style={{ background: GREEN }}
        >
          <i className="ti ti-send" style={{ marginRight: "4px" }}></i>{sending ? tf("flow.sending", siLang) : tf("flow.send", siLang)}
        </button>
      </div>
    );
  }

  if (stage.type === "porcentaje_por_categoria") {
    const total = Object.values(catValues).reduce((a, v) => a + (Number(v) || 0), 0);
    const totalRounded = Math.round(total * 10) / 10;
    const totalBudget = stage.config.totalBudget ?? flowConfig?.totalBudget;
    const pieData = stage.config.categories.map((cat) => ({ label: cat, value: Number(catValues[cat]) || 0 }));
    return (
      <div className="mb-2">
        <div className="mb-3">
          <PieChart data={pieData} />
        </div>
        {stage.config.categories.map((cat) => {
          const val = Number(catValues[cat]) || 0;
          const usedByOthers = stage.config.categories.reduce((s, c) => (c === cat ? s : s + (Number(catValues[c]) || 0)), 0);
          const maxForThis = Math.max(0, 100 - usedByOthers);
          const setCatVal = (v) => setCatValues({ ...catValues, [cat]: Math.max(0, Math.min(maxForThis, v)) });
          return (
            <div key={cat} className="rounded-lg p-2.5 mb-2" style={{ background: BLUE_SOFT }}>
              <div className="dp-body text-xs font-semibold mb-1.5" style={{ color: INK }}>{cat}</div>
              <div className="flex items-center gap-1.5">
                <button
                  onClick={() => setCatVal(val - 1)}
                  disabled={disabled}
                  className="rounded-full flex items-center justify-center disabled:opacity-40"
                  style={{ width: "24px", height: "24px", border: `1px solid ${BLUE}55`, background: "#fff", color: BLUE, flexShrink: 0 }}
                >
                  −
                </button>
                <input
                  type="range"
                  min="0"
                  max="100"
                  value={val}
                  disabled={disabled}
                  onChange={(e) => setCatVal(Number(e.target.value))}
                  className="flex-1"
                  style={{ background: `linear-gradient(to right, ${BLUE} ${val}%, #dfe3ea ${val}%)`, height: "6px", borderRadius: "3px", appearance: "none", WebkitAppearance: "none", outline: "none" }}
                />
                <button
                  onClick={() => setCatVal(val + 1)}
                  disabled={disabled}
                  className="rounded-full flex items-center justify-center disabled:opacity-40"
                  style={{ width: "24px", height: "24px", border: `1px solid ${BLUE}55`, background: "#fff", color: BLUE, flexShrink: 0 }}
                >
                  +
                </button>
                <input
                  type="number"
                  value={catValues[cat] || ""}
                  disabled={disabled}
                  onChange={(e) => setCatVal(Number(e.target.value) || 0)}
                  className="dp-mono text-center rounded-lg disabled:opacity-50"
                  style={{ width: "42px", border: `1px solid ${BLUE}55`, padding: "3px 4px", fontSize: "12px", color: BLUE, fontWeight: 700, background: "#fff", flexShrink: 0 }}
                />
                <span className="dp-mono text-xs" style={{ color: INK + "77", flexShrink: 0 }}>%</span>
              </div>
              {totalBudget > 0 && (
                <div className="dp-mono text-[10.5px] text-right mt-1" style={{ color: INK + "77" }}>
                  {tf("input.assignedAmount", siLang, { amount: formatMoney((val / 100) * totalBudget) })}
                </div>
              )}
            </div>
          );
        })}
        <div className="dp-mono text-[11px] mb-2 font-semibold" style={{ color: totalRounded === 100 ? GREEN : CORAL }}>
          {tf("input.assignedPercent", siLang, { pct: total })}{totalBudget > 0 ? ` (${formatMoney((total / 100) * totalBudget)} ${siLang === "en" ? "of" : "de"} ${formatMoney(totalBudget)})` : ""}
          {totalRounded > 100 ? tf("input.overBy", siLang, { pct: (totalRounded - 100).toFixed(1) }) : ""}
          {totalRounded < 100 ? tf("input.underBy", siLang, { pct: (100 - totalRounded).toFixed(1) }) : ""}
          {totalRounded === 100 ? tf("input.percentDone", siLang) : ""}
        </div>
        <button
          onClick={async () => {
            if (totalRounded > 100) {
              await customAlert(tf("input.alertOver", siLang, { pct: (totalRounded - 100).toFixed(1) }));
              return;
            }
            if (totalRounded < 100) {
              await customAlert(tf("input.alertUnder", siLang, { pct: (100 - totalRounded).toFixed(1) }));
              return;
            }
            const obj = {};
            Object.entries(catValues).forEach(([k, v]) => {
              const n = Number(v);
              if (!isNaN(n)) obj[k] = n;
            });
            onSend(obj);
          }}
          disabled={sending || disabled}
          className="dp-body flex items-center justify-center gap-1.5 w-full text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40"
          style={{ background: GREEN }}
        >
          <i className="ti ti-send" style={{ marginRight: "4px" }}></i>{sending ? tf("flow.sending", siLang) : tf("flow.send", siLang)}
        </button>
      </div>
    );
  }

  if (stage.type === "monto_por_puesto") {
    const amounts = stage.config.roles.map((role) => Number(catValues[role.id])).filter((n) => !isNaN(n) && n > 0);
    const ratio = amounts.length >= 2 ? Math.max(...amounts) / Math.min(...amounts) : 0;
    const overLimit = stage.config.limitTimes && ratio > stage.config.limitTimes + 0.001;
    const allFilled = stage.config.roles.every((role) => catValues[role.id] && Number(catValues[role.id]) > 0);
    return (
      <div className="mb-2">
        {stage.config.limitTimes && (
          <div className="dp-body text-[10.5px] mb-2 rounded-lg p-2" style={{ background: BLUE_SOFT, color: INK + "99" }}>
            {tf("montoPuesto.limitReminder", siLang, { limit: stage.config.limitTimes })}
          </div>
        )}
        {stage.config.roles.map((role) => (
          <div key={role.id} className="flex items-center gap-2 mb-1.5">
            <span className="dp-body text-xs flex-1" style={{ color: INK }}>{role.name}</span>
            <input
              type="number"
              value={catValues[role.id] || ""}
              disabled={disabled}
              onChange={(e) => setCatValues({ ...catValues, [role.id]: e.target.value })}
              placeholder="$"
              className="dp-mono w-24 rounded-lg px-2 py-1.5 text-sm outline-none disabled:opacity-50"
              style={{ background: BLUE_SOFT, color: INK }}
            />
            <span className="dp-mono text-xs" style={{ color: INK + "77" }}>/{tf(`tabulador.freq.${stage.config.frequency}`, siLang)}</span>
          </div>
        ))}
        {overLimit && (
          <div className="dp-body text-[10.5px] mb-2 rounded-lg p-2" style={{ background: CORAL + "15", color: CORAL }}>
            {tf("montoPuesto.overLimit", siLang, { ratio: ratio.toFixed(2), limit: stage.config.limitTimes })}
          </div>
        )}
        <button
          onClick={() => {
            const obj = {};
            stage.config.roles.forEach((role) => {
              const n = Number(catValues[role.id]);
              if (!isNaN(n)) obj[role.id] = n;
            });
            onSend(obj);
          }}
          disabled={sending || disabled || !allFilled || overLimit}
          className="dp-body flex items-center justify-center gap-1.5 w-full text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40"
          style={{ background: GREEN }}
        >
          <i className="ti ti-send" style={{ marginRight: "4px" }}></i>{sending ? tf("flow.sending", siLang) : tf("flow.send", siLang)}
        </button>
      </div>
    );
  }

  if (stage.type === "fusionar_categorias") {
    const groupedNames = new Set(myMergeGroups.flat());
    const available = stage.config.categories.filter((c) => !groupedNames.has(c));
    const toggleSelect = (name) => {
      setSelectedMulti(selectedMulti.includes(name) ? selectedMulti.filter((n) => n !== name) : [...selectedMulti, name]);
    };
    const confirmGroup = () => {
      if (selectedMulti.length < 2) return;
      setMyMergeGroups([...myMergeGroups, selectedMulti]);
      setSelectedMulti([]);
    };
    return (
      <div className="mb-2">
        {myMergeGroups.length > 0 && (
          <div className="mb-3">
            <div className="dp-body text-[11px] font-medium mb-1.5" style={{ color: INK }}>{tf("fusion.markedAs", siLang)}</div>
            {myMergeGroups.map((g, i) => (
              <div key={i} className="flex items-center justify-between rounded-lg p-2 mb-1.5" style={{ background: BLUE_SOFT }}>
                <span className="dp-body text-xs" style={{ color: INK }}>{g.join(" + ")}</span>
                <button onClick={() => setMyMergeGroups(myMergeGroups.filter((_, idx) => idx !== i))} style={{ color: CORAL }}>
                  <i className="ti ti-x"></i>
                </button>
              </div>
            ))}
          </div>
        )}
        {available.length > 0 && (
          <React.Fragment>
            <div className="dp-body text-[11px] font-semibold mb-1.5" style={{ color: INK }}>{tf("fusion.selectPrompt", siLang)}</div>
            {available.map((c) => (
              <label key={c} className="flex items-center gap-2 mb-1.5">
                <input type="checkbox" checked={selectedMulti.includes(c)} disabled={disabled} onChange={() => toggleSelect(c)} />
                <span className="dp-body text-sm" style={{ color: INK }}>{c}</span>
              </label>
            ))}
            {selectedMulti.length >= 2 && (
              <button
                onClick={confirmGroup}
                className="dp-body flex items-center justify-center gap-1.5 w-full text-sm py-2.5 rounded-full text-white font-semibold mb-3"
                style={{ background: "#E0A458" }}
              >
                <i className="ti ti-git-merge"></i> {tf("fusion.mergeButton", siLang, { n: selectedMulti.length })}
              </button>
            )}
          </React.Fragment>
        )}
        <button
          onClick={() => onSend(myMergeGroups)}
          disabled={sending || disabled}
          className="dp-body flex items-center justify-center gap-1.5 w-full text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40"
          style={{ background: GREEN }}
        >
          <i className="ti ti-send" style={{ marginRight: "4px" }}></i>
          {sending ? tf("flow.sending", siLang) : myMergeGroups.length > 0 ? tf("flow.send", siLang) : tf("fusion.continueWithout", siLang)}
        </button>
      </div>
    );
  }

  if (stage.type === "ajustar_candidatos") {
    const toggleRemove = (name) => {
      setSelectedMulti(selectedMulti.includes(name) ? selectedMulti.filter((n) => n !== name) : [...selectedMulti, name]);
    };
    return (
      <div className="mb-2">
        <div className="dp-body text-[11px] font-semibold mb-1.5" style={{ color: INK }}>{tf("ajustar.removePrompt", siLang)}</div>
        {stage.config.candidates.map((c) => (
          <label key={c} className="flex items-center gap-2 mb-1.5">
            <input type="checkbox" checked={selectedMulti.includes(c)} disabled={disabled} onChange={() => toggleRemove(c)} />
            <span className="dp-body text-sm" style={{ color: INK, textDecoration: selectedMulti.includes(c) ? "line-through" : "none" }}>{c}</span>
          </label>
        ))}
        <div className="dp-body text-[11px] font-semibold mt-3 mb-1.5" style={{ color: INK }}>{tf("ajustar.proposeNew", siLang)}</div>
        {texts.map((t, i) => (
          <input
            key={i}
            value={t}
            disabled={disabled}
            onChange={(e) => {
              const arr = [...texts];
              arr[i] = e.target.value;
              setTexts(arr);
            }}
            placeholder={tf("ajustar.newPlaceholder", siLang, { n: i + 1 })}
            className="dp-body w-full rounded-lg px-2.5 py-1.5 text-sm outline-none mb-1.5 disabled:opacity-50"
            style={{ background: BLUE_SOFT, color: INK }}
          />
        ))}
        {!disabled && (
          <button onClick={() => setTexts([...texts, ""])} className="dp-body text-xs font-medium mb-2" style={{ color: BLUE }}>
            {tf("ajustar.addNew", siLang)}
          </button>
        )}
        <button
          onClick={() => onSend({ remove: selectedMulti, add: texts.filter((t) => t.trim()) })}
          disabled={sending || disabled}
          className="dp-body flex items-center justify-center gap-1.5 w-full text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40"
          style={{ background: GREEN }}
        >
          <i className="ti ti-send" style={{ marginRight: "4px" }}></i>{sending ? tf("flow.sending", siLang) : tf("flow.send", siLang)}
        </button>
      </div>
    );
  }

  if (stage.type === "ajustar_gastos_fijos") {
    return (
      <div className="mb-2">
        {stage.config.gastos.map((g) => {
          const current = catValues[g.nombre] !== undefined ? catValues[g.nombre] : g.monto;
          const lowered = Number(current) < g.monto;
          return (
            <div key={g.nombre} className="mb-2.5">
              <div className="flex items-center gap-2 mb-1">
                <span className="dp-body text-xs flex-1" style={{ color: INK }}>{g.nombre}</span>
                <span className="dp-mono text-[10px]" style={{ color: INK + "77" }}>original: {formatMoney(g.monto)}</span>
              </div>
              <input
                type="number"
                value={current}
                disabled={disabled}
                onChange={(e) => setCatValues({ ...catValues, [g.nombre]: e.target.value })}
                className="dp-mono w-full rounded-lg px-2.5 py-1.5 text-sm outline-none disabled:opacity-50"
                style={{ background: BLUE_SOFT, color: lowered ? CORAL : INK }}
              />
              {lowered && (
                <div className="dp-body text-[10px] mt-1" style={{ color: CORAL }}>
                  <i className="ti ti-alert-triangle" style={{ marginRight: "4px" }}></i>{tf("input.lowerFixedWarning", siLang)}
                </div>
              )}
            </div>
          );
        })}
        <button
          onClick={() => {
            const obj = {};
            stage.config.gastos.forEach((g) => {
              const n = Number(catValues[g.nombre] !== undefined ? catValues[g.nombre] : g.monto);
              if (!isNaN(n)) obj[g.nombre] = n;
            });
            onSend(obj);
          }}
          disabled={sending || disabled}
          className="dp-body flex items-center justify-center gap-1.5 w-full text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40"
          style={{ background: GREEN }}
        >
          <i className="ti ti-send" style={{ marginRight: "4px" }}></i>{sending ? tf("flow.sending", siLang) : tf("flow.send", siLang)}
        </button>
      </div>
    );
  }

  return null;
}

function BigDecisionDisplay({ stage }) {

  const r = stage.result;
  if (stage.key === "singleQuota") {
    return (
      <div className="text-center">
        <div className="dp-display text-4xl font-extrabold" style={{ color: BLUE }}>
          {r.average.toFixed(2)}
        </div>
        {r.totalCollected !== undefined && (
          <div className="dp-mono text-sm mt-1" style={{ color: GREEN }}>
            {tf("big.membersCollected", bLang, { count: r.memberCount, total: formatMoney(r.totalCollected) })}
          </div>
        )}
      </div>
    );
  }
  if (stage.key === "quotas") {
    return (
      <div>
        {Object.entries(r.categories).map(([cat, cr]) => (
          <div key={cat} className="flex justify-between items-baseline mb-1.5">
            <span className="dp-body text-sm" style={{ color: INK }}>{cat}</span>
            <span className="text-right">
              <span className="dp-display text-2xl font-extrabold" style={{ color: BLUE }}>{cr.average.toFixed(2)}</span>
              {cr.collected !== undefined && (
                <div className="dp-mono text-xs" style={{ color: GREEN }}>{formatMoney(cr.collected)}</div>
              )}
            </span>
          </div>

        {r.totalCollected !== undefined && r.totalCollected !== null && (
          <div className="flex justify-between pt-2 mt-2" style={{ borderTop: `2px solid ${BLUE}33` }}>
            <span className="dp-body text-sm font-semibold" style={{ color: INK }}>{tf("result.totalCollectedLabel", bLang)}</span>
            <span className="dp-display text-xl font-extrabold" style={{ color: GREEN }}>{formatMoney(r.totalCollected)}</span>
          </div>
        )}
      </div>

  }
  if (stage.key === "budget") {
    return (
      <div>
        <div className="mb-3 flex justify-center">
          <PieChart data={Object.entries(r.categories).map(([cat, cr]) => ({ label: cat, value: cr.normalizedPercent }))} size={110} />
        </div>
        {Object.entries(r.categories).map(([cat, cr]) => (
          <div key={cat} className="flex justify-between items-baseline mb-1.5">
            <span className="dp-body text-sm" style={{ color: INK }}>{cat}</span>
            <span className="text-right">
              <span className="dp-display text-2xl font-extrabold" style={{ color: BLUE }}>{cr.normalizedPercent}%</span>
              {cr.amount !== undefined && (
                <div className="dp-mono text-xs" style={{ color: INK + "88" }}>{formatMoney(cr.amount)}</div>
              )}
            </span>
          </div>
        ))}
      </div>
    );
  }
  if (stage.key === "montoPorPuesto") {
    const roleName = (id) => (stage.config.roles.find((role) => role.id === id) || {}).name || id;
    return (
      <div>
        {Object.entries(r.puestos).map(([id, p]) => (
          <div key={id} className="flex justify-between items-baseline mb-1.5">
            <span className="dp-body text-sm" style={{ color: INK }}>{roleName(id)}</span>
            <span className="text-right">
              <span className="dp-display text-xl font-extrabold" style={{ color: p.adjusted ? CORAL : BLUE }}>{formatMoney(p.amount)}</span>
              <div className="dp-mono text-[10px]" style={{ color: INK + "77" }}>{tf("big.perFrequency", bLang, { frequency: tf(`tabulador.freq.${stage.config.frequency}`, bLang) })}{p.adjusted ? tf("big.adjustedWasOriginal", bLang, { original: formatMoney(p.original) }) : ""}</div>
            </span>
          </div>
        ))}
        {r.wasAdjusted && (
          <div className="dp-body text-[10.5px] mt-2 pt-2" style={{ color: CORAL, borderTop: `1px solid ${CORAL}33` }}>
            {tf("big.someAdjusted", bLang, { limit: r.limitTimes })}
          </div>
        )}
      </div>
    );
  }
  return null;
}

                <span className="dp-mono font-bold text-sm" style={{ color: p.adjusted ? CORAL : BLUE }}>{formatMoney(p.amount)}/{tf(`tabulador.freq.${stage.config.frequency}`, rLang)}</span>
              </div>
              {d && (
                <React.Fragment>
                  <div className="dp-mono text-[10px] mb-1" style={{ color: INK + "88" }}>
                    {tf("result.proposals", rLang, { list: d.sorted.map((v) => formatMoney(v)).join(", ") })}
                    {d.trimmedCount > 0 ? tf("result.discardedHighLow", rLang, { n: d.trimmedCount }) : ""}
                  </div>
                  <div className="dp-mono text-[10px]" style={{ color: INK + "88" }}>
                    ({d.kept.map((v) => formatMoney(v)).join(" + ")}) ÷ {d.kept.length} = {formatMoney(d.average)}
                  </div>
                </React.Fragment>
              )}
              {p.adjusted && (
                <div className="dp-body text-[10px] mt-1" style={{ color: CORAL }}>
                  {tf("result.trimmedTo", rLang, { original: formatMoney(p.original), amount: formatMoney(p.amount), limit: r.limitTimes })}
                </div>
              )}
            </div>
          );
        })}
      </div>
    );
  }

  if (stage.type === "gastos_fijos") {
    return (
      <div className="dp-body text-xs" style={{ color: INK + "99" }}>
        <div className="mb-1">{tf("flow.availableBudget.label", rLang)}: <b style={{ color: GREEN }}>{formatMoney(r.ingresos)}</b></div>
        {r.gastos.map((g) => (
          <div key={g.nombre} className="flex justify-between py-0.5">
            <span>{g.nombre}</span>
            <span className="dp-mono font-semibold">{formatMoney(g.monto)}</span>
          </div>
        ))}
      </div>
    );
  }

  if (stage.type === "fusionar_categorias") {
    return (
      <div className="dp-body text-xs" style={{ color: INK + "99" }}>
        {r.mergedGroups.length === 0 && <div>{tf("result.noneMerged.options", rLang)}</div>}
        {r.mergedGroups.map((g, i) => (
          <div key={i} className="mb-1">
            <span className="font-semibold" style={{ color: INK }}>{g.primary}</span> + {g.aliases.join(", ")}
          </div>
        ))}
        <div className="mt-1.5"><span className="font-semibold" style={{ color: INK }}>{tf("result.finalOptions", rLang)}</span> {r.finalCategories.join(", ")}</div>
      </div>
    );
  }

  if (stage.type === "ajustar_candidatos") {
    return (
      <div className="dp-body text-xs" style={{ color: INK + "99" }}>
        {r.removed.length > 0 && (
          <div className="mb-1.5">
            <span className="font-semibold" style={{ color: CORAL }}>{tf("result.removed", rLang)}</span> {r.removed.join(", ")}
          </div>
        )}
        {r.added.length > 0 && (
          <div className="mb-1.5">
            <span className="font-semibold" style={{ color: GREEN }}>{tf("result.added", rLang)}</span> {r.added.join(", ")}
          </div>
        )}
        <div><span className="font-semibold" style={{ color: INK }}>{tf("result.finalList", rLang)}</span> {r.finalCandidates.join(", ")}</div>
      </div>
    );
  }

  if (stage.type === "fusionar_candidatos") {
    return (
      <div className="dp-body text-xs" style={{ color: INK + "99" }}>
        {r.mergeGroups.length === 0 && <div>{tf("result.noneMerged.names", rLang)}</div>}
        {r.mergeGroups.map((g, i) => (
          <div key={i} className="mb-1">
            <span className="font-semibold" style={{ color: INK }}>{g.primary}</span> ← {g.aliases.join(", ")}
          </div>
        ))}
        <div className="mt-1.5"><span className="font-semibold" style={{ color: INK }}>{tf("result.finalList", rLang)}</span> {r.candidates.join(", ")}</div>
      </div>
    );
  }

  if (stage.type === "ajustar_gastos_fijos") {
    return (
      <div className="dp-body text-xs" style={{ color: INK + "99" }}>
        {r.gastos.map((g) => (
          <div key={g.nombre} className="flex justify-between py-0.5">
            <span>{g.nombre}</span>
            <span className="dp-mono font-semibold" style={{ color: g.montoFinal < g.montoOriginal ? CORAL : INK }}>
              {formatMoney(g.montoFinal)}{g.montoFinal !== g.montoOriginal ? tf("result.was", rLang, { amount: formatMoney(g.montoOriginal) }) : ""}
            </span>
          </div>
        ))}
        <div className="flex justify-between pt-1 mt-1 font-semibold" style={{ borderTop: `1px solid ${BLUE}22` }}>
          <span>{tf("result.fixedTotal", rLang)}</span>
          <span className="dp-mono">{formatMoney(r.totalFinal)}</span>
        </div>
      </div>
    );
  }

  if (stage.type === "realizar_sorteo") {
    const roleName = (id) => (r.roles.find((role) => role.id === id) || {}).name || id;
    if (r.frequency === "once") {
      return (
        <div className="rounded-lg p-2.5" style={{ background: GREEN + "15" }}>
          {r.roles.map((role) => (
            <div key={role.id} className="flex items-baseline justify-between py-0.5">
              <span className="dp-body text-xs" style={{ color: INK + "99" }}>{role.name}</span>
              <span className="dp-display text-sm font-bold" style={{ color: GREEN }}>{r.assignment[role.id] || "·"}</span>
            </div>
          ))}
        </div>
      );
    }
    return (
      <div>
        <DetailsToggle show={showDetails} onToggle={() => setShowDetails(!showDetails)} />
        {showDetails && (
          <div className="overflow-x-auto -mx-1">
            <table className="w-full" style={{ borderCollapse: "collapse", fontSize: "11px" }}>
              <thead>
                <tr style={{ color: INK + "99" }}>
                  <td className="pb-1.5 px-1 font-semibold">Mes</td>
                  {r.roles.map((role) => (
                    <td key={role.id} className="pb-1.5 px-1 text-center font-semibold">{role.name}</td>
                  ))}
                </tr>
              </thead>
              <tbody>
                {r.months.map((m) => (
                  <tr key={m.month} style={{ borderTop: `1px solid ${BLUE}22` }}>
                    <td className="py-1 px-1 dp-body font-medium" style={{ color: INK }}>{m.month}</td>
                    {r.roles.map((role) => (
                      <td key={role.id} className="py-1 px-1 text-center dp-mono font-semibold" style={{ color: GREEN }}>
                        {m.assignment[role.id] || "·"}
                      </td>
                    ))}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>
    );
  }

  if (stage.type === "promedio") {
    return (
      <div>
        <DetailsToggle show={showDetails} onToggle={() => setShowDetails(!showDetails)} />
        {showDetails && (
          <React.Fragment>
            <div className="flex flex-wrap gap-1.5 mb-2">
              {r.sorted.map((v, i) => {
                const isTrimmed = i < r.trimmedCount || i >= r.sorted.length - r.trimmedCount;
                return (
                  <span
                    key={i}
                    className="dp-mono text-xs px-2 py-1 rounded-md"
                    style={isTrimmed ? { background: CORAL + "22", color: CORAL, textDecoration: "line-through" } : { background: "#fff", color: INK }}
                  >
                    {v}
                  </span>
                );
              })}
            </div>
            <div className="dp-mono text-xs mb-1" style={{ color: INK + "aa" }}>
              ({r.kept.join(" + ")}) ÷ {r.kept.length} = {r.average.toFixed(2)}
            </div>
          </React.Fragment>
        )}
        <div className="dp-mono text-xs font-semibold" style={{ color: BLUE }}>→ {r.average.toFixed(2)}</div>
        {r.totalCollected !== undefined && (
          <div className="dp-mono text-[11px] mt-1" style={{ color: GREEN }}>
            {tf("input.membersCollected", rLang, { count: r.memberCount, value: r.average.toFixed(2), total: formatMoney(r.totalCollected) })}
          </div>
        )}
      </div>
    );
  }

  if (stage.type === "mayoria") {
    return (
      <div>
        <DetailsToggle show={showDetails} onToggle={() => setShowDetails(!showDetails)} />
        {showDetails && (
          <div className="mb-1">
            {r.tally.map((t) => (
              <OptionBar key={t.option} option={t.option} count={t.count} percent={t.percent} highlight={r.winner === t.option} />
            ))}
          </div>
        )}
        <div className="dp-mono text-xs font-semibold" style={{ color: r.winner ? GREEN : CORAL }}>→ {r.winner || tf("result.noWinner", rLang)}</div>
      </div>
    );
  }

  if (stage.type === "recoleccion_abierta") {
    return (
      <div>
        <DetailsToggle show={showDetails} onToggle={() => setShowDetails(!showDetails)} />
        {showDetails && (
          <div className="dp-body text-[10px] mb-1.5" style={{ color: INK + "77" }}>
            {tf("result.peopleProposedNames", rLang, { n: r.totalResponses, m: r.pool.length })}
          </div>
        )}
        {showDetails && (
          <div className="flex flex-wrap gap-1">
            {r.pool.map((p) => (
              <span key={p.text} className="dp-mono text-[11px] px-2 py-0.5 rounded-md" style={{ background: BLUE_SOFT, color: INK }}>
                {p.text} ({p.count})
              </span>
            ))}
          </div>
        )}
      </div>
    );
  }

  if (stage.type === "ranking_multiganador") {
    const maxScore = Math.max(1, ...r.ranked.map((x) => x.score));
    return (
      <div>
        <DetailsToggle show={showDetails} onToggle={() => setShowDetails(!showDetails)} />
        {showDetails && (
          <div className="mb-1">
            {r.ranked.map((x) => (
              <OptionBar
                key={x.option}
                option={x.option}
                count={x.score}
                percent={Math.round((x.score / maxScore) * 1000) / 10}
                highlight={r.winners.includes(x.option)}
              />
            ))}
          </div>
        )}
        <div className="dp-mono text-xs font-semibold" style={{ color: GREEN }}>→ {tf("result.chosen", rLang, { names: r.winners.join(", ") })}</div>
      </div>
    );
  }

  if (stage.type === "promedio_por_categoria") {
    return (
      <div>
        <DetailsToggle show={showDetails} onToggle={() => setShowDetails(!showDetails)} />
        {Object.entries(r.categories).map(([cat, cr]) => (
          <div key={cat} className="mb-2.5">
            <div className="dp-body text-[11px] font-medium mb-1" style={{ color: INK }}>{cat}</div>
            {showDetails && (
              <React.Fragment>
                <div className="flex flex-wrap gap-1.5 mb-1">
                  {cr.sorted.map((v, i) => {
                    const isTrimmed = i < cr.trimmedCount || i >= cr.sorted.length - cr.trimmedCount;
                    return (
                      <span
                        key={i}
                        className="dp-mono text-xs px-2 py-0.5 rounded-md"
                        style={isTrimmed ? { background: CORAL + "22", color: CORAL, textDecoration: "line-through" } : { background: "#fff", color: INK }}
                      >
                        {v}
                      </span>
                    );
                  })}
                </div>
                <div className="dp-mono text-[11px] mb-1" style={{ color: INK + "aa" }}>
                  ({cr.kept.join(" + ")}) ÷ {cr.kept.length} = {cr.average.toFixed(2)}
                </div>
              </React.Fragment>
            )}
            <div className="dp-mono text-xs font-semibold" style={{ color: BLUE }}>→ {cr.average.toFixed(2)}</div>
            {cr.collected !== undefined && (
              <div className="dp-mono text-[11px]" style={{ color: GREEN }}>
                {tf("input.membersCollectedShort", rLang, { count: cr.memberCount, value: cr.average.toFixed(2), total: formatMoney(cr.collected) })}
              </div>
            )}
          </div>
        ))}
        {r.totalCollected !== undefined && r.totalCollected !== null && (
          <div className="flex justify-between pt-2 mt-1 dp-mono text-xs font-semibold" style={{ borderTop: `1px solid ${BLUE}33`, color: GREEN }}>
            <span>{tf("result.totalCollectedLabel", rLang)}</span>
            <span>{formatMoney(r.totalCollected)}</span>
          </div>
        )}
      </div>
    );
  }

  if (stage.type === "seleccion_multiple") {
    return (
      <div>
        <DetailsToggle show={showDetails} onToggle={() => setShowDetails(!showDetails)} />
        {showDetails && (
          <div className="mb-1">
            {r.tally.map((t) => (
              <OptionBar key={t.option} option={t.option} count={t.count} percent={t.percent} highlight={false} />
            ))}
          </div>
        )}
      </div>
    );
  }

  if (stage.type === "porcentaje_por_categoria") {
    return (
      <div>
        <div className="mb-2.5">
          <PieChart data={Object.entries(r.categories).map(([cat, cr]) => ({ label: cat, value: cr.normalizedPercent }))} />
        </div>
        <DetailsToggle show={showDetails} onToggle={() => setShowDetails(!showDetails)} />
        {showDetails && r.wasNormalized && (
          <div className="dp-body text-[10px] mb-2" style={{ color: CORAL }}>
            {tf("result.sumAdjusted", rLang, { pct: r.rawSum })}
          </div>
        )}
        {Object.entries(r.categories).map(([cat, cr]) => (
          <div key={cat} className="mb-2">
            {showDetails && (
              <React.Fragment>
                <div className="dp-body text-[11px] font-medium mb-1" style={{ color: INK }}>{cat}</div>
                <div className="flex flex-wrap gap-1.5 mb-1">
                  {(cr.values || []).map((v, i) => (
                    <span key={i} className="dp-mono text-xs px-2 py-0.5 rounded-md" style={{ background: "#fff", color: INK }}>
                      {v}%
                    </span>
                  ))}
                </div>
                <div className="dp-mono text-[11px] mb-1" style={{ color: INK + "aa" }}>
                  ({(cr.values || []).join(" + ")}) ÷ {(cr.values || []).length} = {cr.rawAverage}%{r.wasNormalized ? tf("result.normalizedTo", rLang, { pct: cr.normalizedPercent }) : ""}
                </div>
              </React.Fragment>
            )}
            <div className="flex justify-between dp-mono text-xs" style={{ color: INK }}>
              <span>{!showDetails ? cat : ""}</span>
              <span>
                <b style={{ color: BLUE }}>{cr.normalizedPercent}%</b>
                {cr.amount !== undefined && <span style={{ color: INK + "77" }}> · {formatMoney(cr.amount)}</span>}
              </span>
            </div>
          </div>
        ))}
      </div>
    );
  }

  return null;
}

function LicitacionCategoryCard({ backendUrl, groupCode, memberId, flowId, category, state, proposals, isAdmin, onAdvance }) {
  const lang = useLang();
  const [name, setName] = useState("");
  const [costType, setCostType] = useState("mensual");
  const [costAmount, setCostAmount] = useState("");
  const [description, setDescription] = useState("");
  const [links, setLinks] = useState([""]);
  const [sending, setSending] = useState(false);
  const [error, setError] = useState("");
  const [votedHere, setVotedHere] = useState(false);
  const [votedProposalId, setVotedProposalId] = useState(null);
  const [editingId, setEditingId] = useState(null);
  const [editValues, setEditValues] = useState({});

  const monthlyBudget = state.monthlyBudget;
  const costNum = Number(costAmount) || 0;
  const overCap = costType === "mensual" && monthlyBudget > 0 && costNum > monthlyBudget;
  const monthsPreview = costType === "total" && monthlyBudget > 0 && costNum > monthlyBudget ? Math.ceil(costNum / monthlyBudget) : null;

  const submitProposal = async () => {
    setSending(true);
    setError("");
    try {
      const res = await fetch(`${backendUrl}/api/groups/${groupCode}/flows/${flowId}/proposals`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          memberId, category, name, costType, costAmount: costNum,
          description, links: links.map((l) => l.trim()).filter(Boolean),
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || tf("lic.errorSend", lang));
      setName(""); setCostAmount(""); setDescription(""); setLinks([""]);
      await onAdvance();
    } catch (e) {
      setError(e.message);
    } finally {
      setSending(false);
    }
  };

  const saveEdit = async (proposalId) => {
    setSending(true);
    setError("");
    try {
      const v = editValues;
      const res = await fetch(`${backendUrl}/api/groups/${groupCode}/flows/${flowId}/proposals/${proposalId}/edit`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          memberId, name: v.name, costType: v.costType, costAmount: Number(v.costAmount),
          description: v.description, links: (v.links || "").split("\n").map((l) => l.trim()).filter(Boolean),
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || tf("lic.errorEdit", lang));
      setEditingId(null);
      await onAdvance();
    } catch (e) {
      setError(e.message);
    } finally {
      setSending(false);
    }
  };

  const vote = async (proposalId) => {
    setSending(true);
    setError("");
    try {
      const res = await fetch(`${backendUrl}/api/groups/${groupCode}/flows/${flowId}/bid-vote`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ memberId, category, proposalId }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || tf("lic.errorVote", lang));
      setVotedHere(true);
      setVotedProposalId(proposalId);
    } catch (e) {
      setError(e.message);
    } finally {
      setSending(false);
    }
  };

  return (
    <div className="mb-4 pb-4" style={{ borderBottom: `1px dashed ${BLUE}33` }}>
      <div className="flex items-center justify-between mb-1.5">
        <div className="dp-body text-sm font-semibold" style={{ color: INK }}>{category}</div>
        {state.round > 1 && (
          <span className="dp-body text-[10px] font-semibold px-2 py-0.5 rounded-full" style={{ background: CORAL + "22", color: CORAL }}>
            {tf("lic.round", lang, { n: state.round })}
          </span>
        )}
      </div>

      {state.status === "collecting" && (
        <div>
          {state.round > 1 && (
            <div className="dp-body text-[11px] mb-2 p-2 rounded-lg" style={{ background: CORAL + "15", color: CORAL }}>
              {proposals.length > 0 ? tf("lic.tieCanEdit", lang) : tf("lic.emptyEncourage", lang)}
            </div>
          )}
          {state.closesAt && <CountdownBadge closesAt={state.closesAt} closed={false} />}

          {proposals.map((p) => (
            <div key={p.id} className="rounded-lg p-2.5 mb-1.5" style={{ background: BLUE_SOFT }}>
              {editingId === p.id ? (
                <div>
                  <input
                    value={editValues.name ?? p.name}
                    onChange={(e) => setEditValues({ ...editValues, name: e.target.value })}
                    className="dp-body w-full rounded-lg px-2 py-1 text-sm outline-none mb-1.5"
                    style={{ background: "#fff", color: INK }}
                  />
                  <textarea
                    value={editValues.description ?? p.description}
                    onChange={(e) => setEditValues({ ...editValues, description: e.target.value })}
                    rows={2}
                    className="dp-body w-full resize-none rounded-lg px-2 py-1 text-sm outline-none mb-1.5"
                    style={{ background: "#fff", color: INK }}
                  />
                  <div className="flex gap-1.5">
                    <button
                      onClick={() => saveEdit(p.id)}
                      disabled={sending}
                      className="dp-body flex-1 text-xs py-1.5 rounded-full text-white font-medium"
                      style={{ background: GREEN }}
                    >
                      {tf("flow.save", lang)}
                    </button>
                    <button
                      onClick={() => setEditingId(null)}
                      className="dp-body flex-1 text-xs py-1.5 rounded-full font-medium"
                      style={{ background: "#fff", color: INK, border: `1px solid ${BLUE}33` }}
                    >
                      {tf("lic.cancel", lang)}
                    </button>
                  </div>
                </div>
              ) : (
                <div>
                  <div className="dp-body text-sm font-medium" style={{ color: INK }}>{p.name}</div>
                  <div className="dp-body text-[11px]" style={{ color: INK + "77" }}>({p.memberName})</div>
                  {p.description && <div className="dp-body text-[11px] mt-1" style={{ color: INK + "99" }}>{p.description}</div>}
                  {p.memberId === memberId && state.round > 1 && (
                    <button
                      onClick={() => { setEditingId(p.id); setEditValues({ name: p.name, description: p.description, costType: p.costType, costAmount: p.costAmount }); }}
                      className="dp-body text-[11px] font-medium mt-1"
                      style={{ color: BLUE }}
                    >
                      <i className="ti ti-pencil" style={{ marginRight: "4px" }}></i>{tf("lic.editMyProposal", lang)}
                    </button>
                  )}
                </div>
              )}
            </div>
          ))}

          <div className="rounded-lg p-2.5 mb-2" style={{ background: "#fff", border: `1px dashed ${BLUE}44` }}>
            <input
              value={name}
              onChange={(e) => setName(e.target.value)}
              placeholder={tf("lic.newProposalName", lang)}
              className="dp-body w-full rounded-lg px-2 py-1.5 text-sm outline-none mb-1.5"
              style={{ background: BLUE_SOFT, color: INK }}
            />
            <div className="flex gap-1.5 mb-1.5">
              {[{ key: "mensual", label: tf("lic.monthly", lang) }, { key: "total", label: tf("lic.total", lang) }].map((t) => (
                <button
                  key={t.key}
                  onClick={() => setCostType(t.key)}
                  className="dp-body text-xs px-3 py-1 rounded-full font-medium flex-1"
                  style={costType === t.key ? { background: BLUE, color: "#fff" } : { background: BLUE_SOFT, color: INK }}
                >
                  {t.label}
                </button>
              ))}
              <input
                type="number"
                value={costAmount}
                onChange={(e) => setCostAmount(e.target.value)}
                placeholder={tf("lic.cost", lang)}
                className="dp-mono flex-1 rounded-lg px-2 py-1 text-sm outline-none"
                style={{ background: BLUE_SOFT, color: INK }}
              />
            </div>
            {monthlyBudget > 0 && (
              <div className="dp-body text-[10px] mb-1" style={{ color: INK + "77" }}>{tf("lic.monthlyBudget", lang, { amount: formatMoney(monthlyBudget) })}</div>
            )}
            {overCap && (
              <div className="dp-body text-[10px] mb-1.5 p-1.5 rounded-lg" style={{ background: CORAL + "15", color: CORAL }}>
                {tf("lic.cantExceed", lang, { amount: formatMoney(monthlyBudget) })}
              </div>
            )}
            {monthsPreview && (
              <div className="dp-body text-[10px] mb-1.5 p-1.5 rounded-lg" style={{ background: BLUE_SOFT, color: INK + "cc" }}>
                {tf("lic.wouldTake", lang, { n: monthsPreview })}
              </div>
            )}
            <textarea
              value={description}
              onChange={(e) => setDescription(e.target.value)}
              placeholder={tf("lic.descriptionOptional", lang)}
              rows={2}
              className="dp-body w-full resize-none rounded-lg px-2 py-1.5 text-sm outline-none mb-1.5"
              style={{ background: BLUE_SOFT, color: INK }}
            />
            {links.map((l, i) => (
              <input
                key={i}
                value={l}
                onChange={(e) => { const arr = [...links]; arr[i] = e.target.value; setLinks(arr); }}

        </div>
      )}

      {state.status === "resolved" && (() => {
        const winnerProposal = proposals.find((p) => p.id === state.winner);
        if (!winnerProposal) return null;
        return (
          <div className="rounded-lg p-2.5" style={{ background: GREEN + "15" }}>
            <div className="dp-body text-sm font-semibold flex items-center gap-1" style={{ color: GREEN }}><i className="ti ti-trophy"></i>{winnerProposal.name}</div>
            <div className="dp-body text-[11px]" style={{ color: INK + "88" }}>{tf("lic.proposedBy", lang, { name: winnerProposal.memberName })}</div>

      {state.status === "tie_final" && (
        <div className="dp-body text-[12px] p-2 rounded-lg" style={{ background: CORAL + "15", color: CORAL }}>

        <div className="dp-body text-[12px] p-2 rounded-lg" style={{ background: INK + "0d", color: INK + "77" }}>
          {state.status === "empty" ? tf("lic.emptyForNow", lang) : tf("lic.emptyAfterAttempts", lang, { n: state.round })}
        </div>
      )}
    </div>
  );
}

function LicitacionPanel({ backendUrl, groupCode, memberId, flow, isAdmin, onAdvance, onSwitchFlow }) {
  const lang = useLang();
  const lic = flow.licitacion;
  const categoryNames = Object.keys(lic.categories);
  const [closingCollecting, setClosingCollecting] = useState(false);
  const [collectingError, setCollectingError] = useState("");
  const [closingVoting, setClosingVoting] = useState(false);
  const [votingError, setVotingError] = useState("");

  const [reopenError, setReopenError] = useState("");

  const anyCollecting = categoryNames.some((c) => lic.categories[c].status === "collecting");
  const anyVoting = categoryNames.some((c) => lic.categories[c].status === "voting");
  const anyActive = categoryNames.some((c) => ["collecting", "voting"].includes(lic.categories[c].status));

  const closeCollecting = async () => {

        method: "POST",
        headers: { "Content-Type": "application/json" },

      if (!res.ok) throw new Error(data.error || tf("lic.errorClose", lang));
      await onAdvance();
    } catch (e) {
      setCollectingError(e.message);
    } finally {
      setClosingCollecting(false);
    }
  };

  const closeVoting = async () => {
    const ok = await customConfirm(tf("lic.confirmCloseVoting", lang));
    if (!ok) return;
    setClosingVoting(true);
    try {
      const res = await fetch(`${backendUrl}/api/groups/${groupCode}/flows/${flow.id}/close-voting`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ memberId }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || tf("lic.errorClose", lang));
      await onAdvance();
    } catch (e) {
      setVotingError(e.message);
    } finally {
      setClosingVoting(false);
    }
  };

  const reopenEmpty = async () => {
    const ok = await customConfirm(tf("lic.confirmReopen", lang));
    if (!ok) return;
    setReopening(true);
    setReopenError("");
    try {
      const res = await fetch(`${backendUrl}/api/groups/${groupCode}/flows/${flow.id}/reopen-empty`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ memberId }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || tf("lic.errorReopen", lang));
      await onAdvance();
    } catch (e) {
      setReopenError(e.message);
    } finally {
      setReopening(false);
    }

    <div className="rounded-2xl p-4 mb-4" style={{ background: WARM_WHITE, border: `1px solid ${BLUE}33` }}>
      <div className="dp-body text-xs font-semibold mb-3" style={{ color: BLUE }}>
        {tf("lic.proposalsForBudget", lang)}{allDone ? ` · ${tf("flow.finished", lang)}` : ""}

      <div className="dp-body text-[11px] mb-3" style={{ color: INK + "77" }}>
