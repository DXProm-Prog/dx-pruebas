function CountdownBadge({ closesAt, closed }) {
  const [now, setNow] = useState(Date.now());
  useEffect(() => {
    if (closed || !closesAt) return;
    const interval = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(interval);
  }, [closed, closesAt]);

  if (closed) {
    return (
      <span className="dp-body text-[11px] px-2 py-0.5 rounded-full font-medium" style={{ background: CORAL + "22", color: CORAL }}>
        cerrada
      </span>
    );
  }
  if (!closesAt) return null;

  const msLeft = new Date(closesAt).getTime() - now;
  if (msLeft <= 0) {
    return (
      <span className="dp-body text-[11px] px-2 py-0.5 rounded-full font-medium" style={{ background: CORAL + "22", color: CORAL }}>
        cerrando…
      </span>
    );
  }
  const hours = Math.floor(msLeft / 3600000);
  const mins = Math.floor((msLeft % 3600000) / 60000);
  const label = hours > 0 ? `${hours}h ${mins}m` : `${mins}m`;
  return (
    <span className="dp-body text-[11px] px-2 py-0.5 rounded-full font-medium" style={{ background: BLUE_SOFT, color: INK }}>
      ⏱ cierra en {label}
    </span>
  );
}

function formatMoney(n) {

// Reemplazo de window.confirm/window.alert nativos (que muestran el
// dominio de GitHub Pages como remitente) por una ventana propia, con
// la estética de la app. Se puede llamar desde cualquier función async
// en cualquier parte del árbol, sin tener que pasar props de un lado a
// otro — customConfirm/customAlert regresan una Promesa, igual que se
// usaría window.confirm/alert, solo que hay que ponerles "await".
let _dialogResolver = null;
let _setDialogState = null;

function customConfirm(message) {
  return new Promise((resolve) => {
    _dialogResolver = resolve;
    if (_setDialogState) _setDialogState({ message, type: "confirm" });
  });
}

function customAlert(message) {
  return new Promise((resolve) => {
    _dialogResolver = resolve;
    if (_setDialogState) _setDialogState({ message, type: "alert" });
  });
}

function customPrompt(message, defaultValue = "") {
  return new Promise((resolve) => {
    _dialogResolver = resolve;
    if (_setDialogState) _setDialogState({ message, type: "prompt", value: defaultValue });
  });
}

function DialogHost() {
  const [dialog, setDialog] = React.useState(null);
  const [promptValue, setPromptValue] = React.useState("");
  React.useEffect(() => {
    _setDialogState = (d) => {
      setPromptValue(d && d.value !== undefined ? d.value : "");
      setDialog(d);
    };
    return () => {
      _setDialogState = null;
    };
  }, []);

  const respond = (value) => {
    if (_dialogResolver) _dialogResolver(value);
    _dialogResolver = null;
    setDialog(null);
  };

  if (!dialog) return null;

  return (
    <div className="fixed inset-0 flex items-start justify-center p-4 py-10 overflow-y-auto" style={{ background: "rgba(20,33,61,0.55)", zIndex: 80 }}>
      <div className="rounded-2xl p-5 max-w-[320px] w-full shadow-xl" style={{ background: WARM_WHITE }}>
        <div className="dp-body text-sm mb-3 whitespace-pre-line" style={{ color: INK, lineHeight: 1.5 }}>{dialog.message}</div>
        {dialog.type === "prompt" && (
          <input
            autoFocus
            value={promptValue}
            onChange={(e) => setPromptValue(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && respond(promptValue)}
            className="dp-body w-full rounded-lg px-3 py-2 text-sm outline-none mb-4"
            style={{ border: `1.5px solid ${BLUE}55`, color: INK }}
          />
        )}
        {dialog.type !== "prompt" && <div className="mb-1" />}
        <div className="flex gap-2">
          {dialog.type !== "alert" && (
            <button
              onClick={() => respond(dialog.type === "prompt" ? null : false)}
              className="dp-body flex-1 text-xs py-2 rounded-full font-medium"
              style={{ background: "#fff", color: INK, border: `1.5px solid ${BLUE}55` }}
            >
              Cancelar
            </button>
          )}
          <button
            onClick={() => respond(dialog.type === "prompt" ? promptValue : true)}
            className="dp-body flex-1 text-xs py-2 rounded-full text-white font-medium"
            style={{ background: BLUE }}
          >
            {dialog.type === "alert" ? "Entendido" : "Confirmar"}
          </button>
        </div>
      </div>
    </div>
  );
}

// Arma la cadena completa de flujos encadenados (ej. dentro de
// Asociaciones o Cooperativas), del más viejo al más nuevo, siguiendo
// chainedFromFlowId hacia atrás desde el flujo actual.
function getFlowChain(flow, allFlows) {
  const chain = [flow];
  let current = flow;
  while (current.chainedFromFlowId) {
    const parent = (allFlows || []).find((f) => f.id === current.chainedFromFlowId);
    if (!parent) break;
    chain.unshift(parent);
    current = parent;
  }
  return chain;
}

function formatResponseValue(v) {
  if (typeof v === "number") return String(Math.round(v * 100) / 100);
  if (typeof v === "object" && v !== null) {
    return Object.entries(v)
      .map(([k, val]) => `${k}: ${typeof val === "number" ? Math.round(val * 100) / 100 : val}`)
      .join(", ");
  }
  return String(v);
}

// Convierte el contenido de arriba en un PDF paginado por BLOQUES (cada
// pregunta+respuesta, cada gráfica, cada tarjeta es un bloque completo)
// — así nunca se corte una gráfica a la mitad ni se separe una
// pregunta de su resultado entre dos hojas. Deja márgenes en los 4
// lados de cada hoja.
async function generateResultsPdf(containerNode, filename) {
  const pdf = new window.jspdf.jsPDF("p", "pt", "a4");
  const pageWidth = pdf.internal.pageSize.getWidth();
  const pageHeight = pdf.internal.pageSize.getHeight();
  const marginX = 34;
  const marginTop = 34;
  const marginBottom = 34;
  const usableWidth = pageWidth - marginX * 2;
  const maxBlockHeight = pageHeight - marginTop - marginBottom;
  const gap = 14;

  // Primero se "toma foto" a cada bloque y se mide su altura ya
  // escalada a la hoja — antes de empezar a colocarlos. Así, un bloque
  // marcado "pegado al siguiente" (ej. el título de una sección) puede
  // revisar si el bloque que sigue cabe junto con él en lo que queda
  // de la hoja, sin tener que volver a capturarlo dos veces.
  const blockNodes = Array.from(containerNode.querySelectorAll("[data-pdf-block]"));
  const blocks = [];
  for (const node of blockNodes) {
    const canvas = await window.html2canvas(node, { scale: 2, backgroundColor: "#ffffff", useCORS: true });
    const imgHeight = (canvas.height * usableWidth) / canvas.width;
    blocks.push({ canvas, imgHeight, keepWithNext: node.getAttribute("data-pdf-keep-with-next") === "true" });
  }

  let cursorY = marginTop;
  let placedOnPage = false;

  const placeBlock = (block) => {
    if (block.imgHeight > maxBlockHeight) {
      // Bloque más alto que una hoja completa (caso raro, ej. una lista
      // muy larga de respuestas individuales) — se reparte en varias
      // hojas, cortando por posición, en vez de encogerlo o dejarlo salir.
      let remainingPx = block.canvas.height;
      while (remainingPx > 0) {
        if (!placedOnPage) cursorY = marginTop;
        const availablePt = pageHeight - marginBottom - cursorY;
        const availablePx = Math.floor((availablePt * block.canvas.width) / usableWidth);
        const sliceHeightPx = Math.max(1, Math.min(availablePx, remainingPx));
        const sliceCanvas = document.createElement("canvas");
        sliceCanvas.width = block.canvas.width;
        sliceCanvas.height = sliceHeightPx;
        sliceCanvas.getContext("2d").drawImage(block.canvas, 0, block.canvas.height - remainingPx, block.canvas.width, sliceHeightPx, 0, 0, block.canvas.width, sliceHeightPx);
        const sliceHeightPt = (sliceHeightPx * usableWidth) / block.canvas.width;
        pdf.addImage(sliceCanvas.toDataURL("image/png"), "PNG", marginX, cursorY, usableWidth, sliceHeightPt);
        remainingPx -= sliceHeightPx;
        cursorY += sliceHeightPt;
        placedOnPage = true;
        if (remainingPx > 0) {
          pdf.addPage();
          placedOnPage = false;
        }
      }
      cursorY += gap;
      return;
    }
    pdf.addImage(block.canvas.toDataURL("image/png"), "PNG", marginX, cursorY, usableWidth, block.imgHeight);
    cursorY += block.imgHeight + gap;
    placedOnPage = true;
  };

  for (let i = 0; i < blocks.length; i++) {
    const block = blocks[i];
    const next = blocks[i + 1];

    // Si este bloque debe quedarse pegado al siguiente (ej. un título
    // de sección con su primer contenido), se calcula el espacio que
    // ocupan LOS DOS juntos — así nunca queda un título solo al final
    // de una hoja, con su contenido brincando a la siguiente.
    let neededHeight = block.imgHeight;
    if (block.keepWithNext && next && next.imgHeight <= maxBlockHeight) {
      neededHeight += gap + next.imgHeight;
    }

    if (placedOnPage && block.imgHeight <= maxBlockHeight && cursorY + neededHeight > pageHeight - marginBottom) {
      pdf.addPage();
      cursorY = marginTop;
      placedOnPage = false;
    }

    placeBlock(block);
  }

  pdf.save(filename);
}

const PIE_COLORS = ["#3A6EA5", "#E0A458", "#8B5A8F", "#4C9F70", "#D64550", "#6B4E9E", "#5C8A99", "#B5533C"];



function PieChart({ data, size }) {
  // data: [{ label, value }] — anillo segmentado, con espacio entre cada
  // categoría y puntas redondeadas (estilo dashboard moderno).
  const total = data.reduce((sum, d) => sum + (Number(d.value) || 0), 0);
  const px = size || 88;
  const r = 38;
  const thickness = px < 100 ? 9 : 12;
  const gap = 5;
  const circumference = 2 * Math.PI * r;
  let offset = 0;
  const segments = data.map((d, i) => {
    const frac = total > 0 ? (Number(d.value) || 0) / total : 0;
    const segLen = Math.max(0, frac * circumference - gap);
    const seg = { color: PIE_COLORS[i % PIE_COLORS.length], segLen, offset };
    offset += frac * circumference;
    return seg;
  });
  return (
    <div style={{ display: "flex", alignItems: "center", gap: "12px" }}>
      <svg width={px} height={px} viewBox="0 0 100 100" style={{ flexShrink: 0 }}>
        {total > 0 ? (
          segments.map((s, i) => (
            <circle
              key={i}
              cx="50" cy="50" r={r}
              fill="none"
              stroke={s.color}
              strokeWidth={thickness}
              strokeDasharray={`${s.segLen} ${circumference - s.segLen}`}
              strokeDashoffset={-s.offset}
              strokeLinecap="round"
              transform="rotate(-90 50 50)"
            />
          ))
        ) : (
          <circle cx="50" cy="50" r={r} fill="none" stroke={PAGE_BG} strokeWidth={thickness} />
        )}
      </svg>
      <div style={{ flex: 1 }}>
        {data.map((d, i) => (
          <div key={d.label} className="dp-body flex items-center gap-1.5 text-[11px] mb-0.5" style={{ color: INK + "cc" }}>
            <span style={{ width: "8px", height: "8px", borderRadius: "50%", background: PIE_COLORS[i % PIE_COLORS.length], flexShrink: 0 }} />
            <span style={{ flex: 1 }}>{d.label}</span>
            <span className="dp-mono">{(Number(d.value) || 0).toFixed(1)}%</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function SorteoRunner({ backendUrl, groupCode, memberId, question, isAdmin }) {
  const [drawing, setDrawing] = useState(false);
  const [error, setError] = useState("");
  const [showHistory, setShowHistory] = useState(false);
  const [draws, setDraws] = useState(question.draws || []);
  const [excluded, setExcluded] = useState(question.excluded || []);

  const lastDraw = draws.length > 0 ? draws[draws.length - 1] : null;
  const remaining = question.options.filter((o) => !excluded.includes(o));
  const cycleComplete = remaining.length === 0;

  const draw = async () => {
    setDrawing(true);
    setError("");
    try {
      const res = await fetch(`${backendUrl}/api/groups/${groupCode}/questions/${question.id}/draw`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ memberId }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Error al sortear");
      setDraws(data.draws);
      setExcluded(data.excluded);
    } catch (e) {
      setError(e.message);
    } finally {
      setDrawing(false);
    }
  };

  return (
    <div className="rounded-2xl p-4 mb-4 shadow-sm" style={{ background: WARM_WHITE, border: `1px solid ${BLUE}33` }}>
      <div className="flex items-start justify-between gap-2 mb-1">
        <div className="dp-body text-[15px]" style={{ color: INK }}>{question.text}</div>
      </div>
      <div className="dp-body text-[11px] mb-3 flex items-center gap-1" style={{ color: INK + "77" }}>
        <i className="ti ti-dice-5"></i> sorteo · nunca repite ganador hasta que todos salgan
      </div>

      {lastDraw && (
        <div className="rounded-lg p-3 mb-3 text-center" style={{ background: GREEN + "15" }}>
          <div className="dp-body text-[10px]" style={{ color: INK + "88" }}>Último resultado</div>
          <div className="dp-display text-xl font-bold" style={{ color: GREEN }}>{lastDraw.winner}</div>
        </div>
      )}

      <div className="mb-2">
        <button onClick={() => setShowHistory(!showHistory)} className="dp-body text-[11px] font-medium mb-1.5" style={{ color: BLUE }}>
          {showHistory ? "▼ " : "▶ "}candidatos {cycleComplete ? "(ciclo completo, se reinicia solo)" : `(${remaining.length} sin salir todavía)`}
        </button>
        {showHistory && (
          <div className="flex flex-wrap gap-1.5">
            {question.options.map((opt) => (
              <span
                key={opt}
                className="dp-body text-[11px] px-2 py-1 rounded-full"
                style={excluded.includes(opt) && !cycleComplete ? { background: PAGE_BG, color: INK + "66", textDecoration: "line-through" } : { background: BLUE_SOFT, color: INK }}
              >
                {opt}
              </span>
            ))}
          </div>
        )}
      </div>

      {draws.length > 1 && (
        <div className="dp-body text-[10.5px] mb-3" style={{ color: INK + "77" }}>
          Historial: {draws.slice(0, -1).reverse().map((d) => d.winner).join(", ")}
        </div>
      )}

      {isAdmin && (
        <button
          onClick={draw}
          disabled={drawing}
          className="dp-body flex items-center justify-center gap-1.5 w-full text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40"
          style={{ background: BLUE }}
        >
          <i className="ti ti-dice-5"></i> {drawing ? "Sorteando…" : lastDraw ? "Sortear de nuevo" : "Sortear"}
        </button>
      )}
      {error && <div className="dp-body text-[11px] mt-2" style={{ color: CORAL }}>{error}</div>}
    </div>
  );
}

function QuestionRunner({ backendUrl, groupCode, memberId, question, isAdmin, groupResponses, approvedMemberCount }) {
  const rule = question.majorityRule;
  const isRankeado = rule === "rankeado";
  const isSegundaVuelta = rule === "segunda_vuelta";

  const [value, setValue] = useState("");
  const [rankOrder, setRankOrder] = useState([]);
  const [sending, setSending] = useState(false);
  const [sendError, setSendError] = useState("");
  const [sent, setSent] = useState(false);
  const [result, setResult] = useState(null);
  const [computing, setComputing] = useState(false);
  const [resultError, setResultError] = useState("");
  const [closingRound, setClosingRound] = useState(false);
  const [showDetails, setShowDetails] = useState(true);
  const [showStatusCard, setShowStatusCard] = useState(false);

  const freshTieBreak = (result && result.tieBreak) || question.tieBreak;
  const inTieBreak = isRankeado && freshTieBreak && !freshTieBreak.finished;
  const rankeadoResolved = isRankeado && freshTieBreak && freshTieBreak.finished;

  const hasValue = isRankeado && !inTieBreak ? rankOrder.length > 0 : value !== "";

  const toggleRank = (opt) => {
    setRankOrder((prev) => (prev.includes(opt) ? prev.filter((o) => o !== opt) : [...prev, opt]));
  };

  const sendResponse = async () => {
    if (!memberId || !hasValue) return;
    setSending(true);
    setSendError("");
    try {
      const sendValue = isRankeado && !inTieBreak ? rankOrder : question.type === "promedio" ? Number(value) : value;
      const res = await fetch(
        `${backendUrl}/api/groups/${groupCode}/questions/${question.id}/responses`,
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ memberId, value: sendValue }),
        }
      );
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Error al enviar");
      setSent(true);
      setValue("");
      setRankOrder([]);
      await computeResults(false);
    } catch (e) {
      setSendError(e.message);
    } finally {
      setSending(false);
    }
  };

  const computeResults = async (silent) => {
    if (!silent) setComputing(true);
    setResultError("");
    try {
      const res = await fetch(`${backendUrl}/api/groups/${groupCode}/questions/${question.id}/results`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Error al calcular");
      setResult(data);
    } catch (e) {
      if (!silent) setResultError(e.message);
    } finally {
      if (!silent) setComputing(false);
    }
  };

  const closeRound = async () => {
    const ok = await customConfirm(
      "¿Seguro que quieres cerrar esta ronda? Nadie más podrá votar en ella después de esto. Esta acción no se puede deshacer."
    );
    if (!ok) return;
    setClosingRound(true);
    try {
      await fetch(`${backendUrl}/api/groups/${groupCode}/questions/${question.id}/close-round`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ memberId }),
      });
      await computeResults(true);
    } catch (e) {
      setResultError(e.message);
    } finally {
      setClosingRound(false);
    }
  };

  const needsLivePolling = isSegundaVuelta || Boolean(freshTieBreak);

  useEffect(() => {
    if (needsLivePolling) computeResults(true);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [needsLivePolling]);

  useEffect(() => {
    if (!result && !needsLivePolling) return;
    const interval = setInterval(() => computeResults(true), 15000);
    return () => clearInterval(interval);
  }, [Boolean(result), needsLivePolling]);

  const ruleLabel = {
    simple: "gana la más votada",
    absoluta: "necesita más del 50%",
    calificada: `necesita más del ${question.qualifiedPct}%`,
    rankeado: "voto ranqueado (automático)",
    segunda_vuelta: `${question.numRounds} rondas · elimina menos del ${question.eliminationThresholdPercent}%`,
  }[rule];

  const currentOptions = isSegundaVuelta && result ? result.currentOptions : question.options;

  const liveVoteCount = React.useMemo(() => {
    if (!groupResponses) return null;
    if (isSegundaVuelta) {
      return groupResponses.filter((r) => r.questionId === question.id && r.roundNum === question.currentRound).length;
    }
    if (inTieBreak) {
      return groupResponses.filter((r) => r.questionId === question.id && r.tieBreakRound === freshTieBreak.currentRound).length;
    }
    if (isRankeado) {
      return groupResponses.filter((r) => r.questionId === question.id && !r.tieBreakRound).length;
    }
    return groupResponses.filter((r) => r.questionId === question.id).length;
  }, [groupResponses, question.id, isSegundaVuelta, isRankeado, inTieBreak, question.currentRound, freshTieBreak && freshTieBreak.currentRound]);
  const isClosedForVoting = isSegundaVuelta ? Boolean(result && result.finished) : question.closed;

  // Para la tarjeta de aviso: "resolved" cuando ya hay una decisión
  // final, "tied" cuando se necesita otra ronda por empate. Se guarda
  // en una sola variable para poder detectar el MOMENTO en que cambia
  // (y solo ahí mostrar la tarjeta, no en cada render).
  const decisionStatus = (() => {
    if (question.type === "promedio") return result ? "resolved" : null;
    if (rule === "simple" || rule === "absoluta" || rule === "calificada") {
      if (!result) return null;
      return result.winner ? "resolved" : "tied";
    }
    if (isRankeado) {
      if (freshTieBreak) return freshTieBreak.finished ? "resolved" : "tied";
      if (!result) return null;
      return result.winner ? "resolved" : null;
    }
    if (isSegundaVuelta) {
      if (!result) return null;
      if (result.finished) return "resolved";
      if (result.inTieBreak) return "tied";
    }
    return null;
  })();
  const decisionLabel = question.type === "promedio" ? (result ? result.average.toFixed(2) : "") : result ? result.winner || "" : "";

  const prevDecisionStatus = React.useRef(null);
  useEffect(() => {
    if (decisionStatus && decisionStatus !== prevDecisionStatus.current) {
      setShowStatusCard(true);
    }
    prevDecisionStatus.current = decisionStatus;
  }, [decisionStatus]);

  return (
    <div className="rounded-2xl p-4 mb-4 shadow-sm" style={{ background: WARM_WHITE, border: `1px solid ${BLUE}33` }}>
      <div className="flex items-start justify-between gap-2 mb-1">
        <div className="dp-body text-[15px]" style={{ color: INK }}>{question.text}</div>
        {!isSegundaVuelta && !inTieBreak && !rankeadoResolved && <CountdownBadge closesAt={question.closesAt} closed={question.closed} />}
        {isSegundaVuelta && result && (
          <CountdownBadge closesAt={result.finished ? null : question.roundClosesAt} closed={result.finished} />
        )}
      </div>
      <div className="dp-body text-[11px] mb-3" style={{ color: INK + "77" }}>
        {question.type === "promedio" ? `recorte: ${question.trimPercent}%` : ruleLabel}
        {isSegundaVuelta && result && !result.finished && ` · ronda ${result.currentRound}${result.inTieBreak ? " (desempate)" : ""}`}
        {inTieBreak && ` · ronda de desempate ${freshTieBreak.currentRound}`}
      </div>
      {liveVoteCount !== null && (
        <div className="dp-body text-[11px] mb-3 flex items-center gap-1.5" style={{ color: INK + "88" }}>
          <span style={{ display: "inline-block", width: "6px", height: "6px", borderRadius: "50%", background: GREEN }} />
          {liveVoteCount} de {approvedMemberCount} miembro(s) han votado
        </div>
      )}

      {/* ---------- Proceso / resultados: siempre arriba ---------- */}

      {result && question.type === "promedio" && (
        <div className="mb-4 rounded-xl p-3.5" style={{ background: BLUE_SOFT }}>
          <DetailsToggle show={showDetails} onToggle={() => setShowDetails(!showDetails)} />
          {showDetails && (
            <React.Fragment>
              <div className="dp-body text-[11px] font-medium mb-2.5" style={{ color: INK + "99" }}>
                {result.n} propuestas · {result.trimmedCount} recortadas de cada extremo
                {result.suggestedMinPercent > question.trimPercent && <> · mínimo sugerido: {result.suggestedMinPercent}%</>}
              </div>
              <div className="flex flex-wrap gap-1.5 mb-3">
                {result.sorted.map((v, i) => {
                  const isTrimmed = i < result.trimmedCount || i >= result.sorted.length - result.trimmedCount;
                  const named = result.sortedWithNames && result.sortedWithNames[i];
                  return (
                    <span
                      key={i}
                      className="dp-mono text-xs px-2 py-1 rounded-md"
                      style={isTrimmed ? { background: CORAL + "22", color: CORAL, textDecoration: "line-through" } : { background: "#fff", color: INK }}
                    >
                      {named ? `${named.name}: ${named.value}` : v}
                    </span>
                  );
                })}
              </div>
              <div className="dp-mono text-xs mb-2.5 leading-relaxed" style={{ color: INK + "aa" }}>
                ({result.kept.join(" + ")}) ÷ {result.kept.length} = {result.average.toFixed(2)}
              </div>
            </React.Fragment>
          )}
          <div className="flex items-baseline justify-between pt-2.5" style={{ borderTop: `1px solid ${BLUE}33` }}>
            <span className="dp-body text-xs font-medium" style={{ color: INK + "99" }}>Decisión colectiva</span>
            <span className="dp-display text-3xl font-bold" style={{ color: BLUE }}>{result.average.toFixed(2)}</span>
          </div>
        </div>
      )}

      {result && (rule === "simple" || rule === "absoluta" || rule === "calificada") && (
        <div className="mb-4 rounded-xl p-3.5" style={{ background: BLUE_SOFT }}>
          <DetailsToggle show={showDetails} onToggle={() => setShowDetails(!showDetails)} />
          {showDetails && (
            <React.Fragment>
              <div className="dp-body text-[11px] font-medium mb-3" style={{ color: INK + "99" }}>{result.totalVoters} voto(s)</div>
              {result.tally.map((t) => (
                <OptionBar key={t.option} option={t.option} count={t.count} percent={t.percent} highlight={result.winner === t.option} />
              ))}
            </React.Fragment>
          )}
          <div className="flex items-baseline justify-between pt-2.5 mt-1" style={{ borderTop: `1px solid ${BLUE}33` }}>
            <span className="dp-body text-xs font-medium" style={{ color: INK + "99" }}>Decisión colectiva</span>
            <span className="dp-display text-lg font-bold" style={{ color: result.winner ? GREEN : CORAL }}>
              {result.winner || "sin ganador todavía"}
            </span>
          </div>
        </div>
      )}

      {result && isRankeado && result.rounds && (
        <div className="mb-4 rounded-xl p-3.5" style={{ background: BLUE_SOFT }}>
          <DetailsToggle show={showDetails} onToggle={() => setShowDetails(!showDetails)} />
          {showDetails && result.rounds.map((rd, i) => (

              <div className="dp-body text-[11px] font-medium mb-1.5" style={{ color: INK + "99" }}>

              </div>
              {rd.tally.map((t) => (
                <OptionBar key={t.option} option={t.option} count={t.count} percent={t.percent} highlight={rd.winner === t.option} />
              ))}
            </div>
          ))}
          {result.winner && !freshTieBreak && (
            <div className="flex items-baseline justify-between pt-2.5 mt-1" style={{ borderTop: `1px solid ${BLUE}33` }}>
              <span className="dp-body text-xs font-medium" style={{ color: INK + "99" }}>Decisión colectiva</span>
              <span className="dp-display text-lg font-bold" style={{ color: GREEN }}>{result.winner}</span>
            </div>
          )}
        </div>
      )}

      {freshTieBreak && (
        <div className="mb-4 rounded-xl p-3.5" style={{ background: CORAL + "12", border: `1px solid ${CORAL}33` }}>
          <div className="dp-body text-[11px] font-semibold mb-2" style={{ color: CORAL }}>Desempate</div>
          <DetailsToggle show={showDetails} onToggle={() => setShowDetails(!showDetails)} color={CORAL} />
          {showDetails && freshTieBreak.completedRounds.map((rd, i) => (
            <div key={i} className="mb-2">
              <div className="dp-body text-[10px] font-medium mb-1" style={{ color: INK + "99" }}>Ronda de desempate {rd.roundNum}</div>

                <OptionBar key={t.option} option={t.option} count={t.count} percent={t.percent} highlight={false} />
              ))}

          ))}
          {freshTieBreak.finished ? (
            <div className="flex items-baseline justify-between pt-2 mt-1" style={{ borderTop: `1px solid ${CORAL}33` }}>
              <span className="dp-body text-xs font-medium" style={{ color: INK + "99" }}>Decisión colectiva</span>
              <span className="dp-display text-lg font-bold" style={{ color: GREEN }}>{freshTieBreak.winner}</span>
            </div>

                  </div>

                  {result.liveTally.map((t) => (
                    <OptionBar key={t.option} option={t.option} count={t.count} percent={t.percent} highlight={false} />
                  ))}
                </div>
              )}
            </React.Fragment>
          )}
          {result.finished && (
            <div className="flex items-baseline justify-between pt-2.5 mt-1" style={{ borderTop: `1px solid ${BLUE}33` }}>
              <span className="dp-body text-xs font-medium" style={{ color: INK + "99" }}>Decisión colectiva</span>

            placeholder="tu propuesta"

            style={{ background: BLUE_SOFT, color: INK }}

            onClick={sendResponse}
            disabled={sending || !hasValue || !memberId || isClosedForVoting}
            className="dp-body flex items-center gap-1.5 text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40"
            style={{ background: GREEN }}
          >
            <i className="ti ti-send" style={{ marginRight: "4px" }}></i>{sending ? "Enviando…" : "Enviar"}
          </button>
        </div>
      )}

      {question.type === "mayoria" && !isRankeado && (
        <div className="flex flex-col gap-1.5 mb-2">
          {currentOptions.map((opt) => (
            <button
              key={opt}
              onClick={() => setValue(opt)}
              disabled={isClosedForVoting}
              className="dp-body text-left text-sm px-3 py-2 rounded-lg disabled:opacity-50"

          <button
            onClick={sendResponse}

            className="dp-body flex items-center justify-center gap-1.5 text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40 mt-1"
            style={{ background: GREEN }}
          >
            <i className="ti ti-send" style={{ marginRight: "4px" }}></i>{sending ? "Enviando…" : "Enviar"}
          </button>
        </div>
      )}

      {isRankeado && inTieBreak && (
        <div className="flex flex-col gap-1.5 mb-2">
          <div className="dp-body text-[11px] mb-1" style={{ color: CORAL }}>
            Hubo empate — vota de nuevo solo entre las opciones empatadas.

          {freshTieBreak.currentOptions.map((opt) => (
            <button
              key={opt}
              onClick={() => setValue(opt)}
              className="dp-body text-left text-sm px-3 py-2 rounded-lg"
              style={value === opt ? { background: BLUE, color: "#fff" } : { background: BLUE_SOFT, color: INK }}
            >
              {value === opt ? "● " : "○ "}{opt}
            </button>
          ))}
          <button
            onClick={sendResponse}
            disabled={sending || !hasValue || !memberId}
            className="dp-body flex items-center justify-center gap-1.5 text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40 mt-1"
            style={{ background: GREEN }}
          >
            <i className="ti ti-send" style={{ marginRight: "4px" }}></i>{sending ? "Enviando…" : "Enviar"}
          </button>
        </div>
      )}

      {isRankeado && !inTieBreak && !rankeadoResolved && (
        <div className="flex flex-col gap-1.5 mb-2">
          <div className="dp-body text-[11px] mb-1" style={{ color: INK + "77" }}>toca en orden de preferencia (1ª, 2ª…)</div>
          {question.options.map((opt) => {
            const idx = rankOrder.indexOf(opt);
            return (
              <button
                key={opt}
                onClick={() => toggleRank(opt)}
                disabled={question.closed}
                className="dp-body flex items-center gap-2 text-left text-sm px-3 py-2 rounded-lg disabled:opacity-50"
                style={idx >= 0 ? { background: BLUE, color: "#fff" } : { background: BLUE_SOFT, color: INK }}
              >
                <span className="dp-mono font-semibold" style={{ minWidth: "16px" }}>{idx >= 0 ? idx + 1 : "–"}</span>
                {opt}
              </button>
            );
          })}
          <button
            onClick={sendResponse}
            disabled={sending || !hasValue || !memberId || question.closed}
            className="dp-body flex items-center justify-center gap-1.5 text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40 mt-1"
            style={{ background: GREEN }}
          >
            <i className="ti ti-send" style={{ marginRight: "4px" }}></i>{sending ? "Enviando…" : "Enviar"}
          </button>
        </div>
      )}

      {sent && (
        <div className="dp-body text-[11px] flex items-center gap-1 mb-2" style={{ color: GREEN }}>

      )}

      {isSegundaVuelta && isAdmin && result && !result.finished && (
        <button
          onClick={closeRound}

          style={{ background: BLUE }}
        >
          <i className="ti ti-lock" style={{ marginRight: "4px" }}></i>{closingRound ? "Cerrando…" : "Cerrar ronda y avanzar"}

      {inTieBreak && isAdmin && (

          onClick={closeRound}
          disabled={closingRound}
          className="dp-body flex items-center justify-center gap-1.5 w-full text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40 mb-2"
          style={{ background: BLUE }}
        >
          <i className="ti ti-lock" style={{ marginRight: "4px" }}></i>{closingRound ? "Cerrando…" : "Cerrar ronda de desempate"}
        </button>
      )}

      {!isSegundaVuelta && !isRankeado && !result && (
        <button
          onClick={() => computeResults(false)}
          disabled={computing}
          className="dp-body flex items-center gap-1.5 text-xs px-3 py-2 rounded-full font-medium disabled:opacity-40"
          style={{ background: BLUE, color: "#fff" }}
        >
          <i className="ti ti-sparkles" style={{ marginRight: "4px" }}></i>{computing ? "Calculando…" : "Calcular decisión colectiva"}
        </button>
      )}
      {isRankeado && !freshTieBreak && !result && (
        <button
          onClick={() => computeResults(false)}
          disabled={computing}
          className="dp-body flex items-center gap-1.5 text-xs px-3 py-2 rounded-full font-medium disabled:opacity-40"
          style={{ background: BLUE, color: "#fff" }}
        >
          <i className="ti ti-sparkles" style={{ marginRight: "4px" }}></i>{computing ? "Calculando…" : "Calcular decisión colectiva"}

      {resultError && <div className="dp-body text-[11px] mt-2" style={{ color: CORAL }}>{resultError}</div>}

      {showStatusCard && decisionStatus && (

            <div className="text-center mb-2">

                {decisionStatus === "resolved" ? "¡Felicidades!" : "¡Empate!"}

    </div>
  );
}

function AdminReturnScreen({ backendUrl, onBack, onEntered }) {
  const [code, setCode] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");

  const submit = async () => {
    if (!code) return;
    setLoading(true);
    setError("");
    try {
      const res = await fetch(`${backendUrl}/api/groups/${code.trim()}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Grupo no encontrado");
      onEntered({ code: code.trim(), memberId: data.admin.id });
    } catch (e) {
      setError(
        e.message === "Failed to fetch"
          ? "No se pudo conectar al backend. ¿Sigue corriendo npm start en tu terminal?"
          : e.message
      );
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="px-4 py-6">
      <BackButton onClick={onBack} />
      <div className="rounded-2xl p-4" style={{ background: WARM_WHITE, border: `1px solid ${BLUE}33` }}>
        <div className="dp-body text-sm font-medium mb-1" style={{ color: INK }}>Ingresar a un grupo que administras</div>
        <p className="dp-body text-[12px] mb-3" style={{ color: INK + "77" }}>
          Solo necesitas el código del grupo que creaste.
        </p>
        <div className="flex flex-col gap-2.5 mb-3">
          <Field label="Código del grupo" value={code} onChange={setCode} placeholder="ej. MC231G" />
        </div>
        <PrimaryButton onClick={submit} disabled={loading || !code}>
          {loading ? "Entrando…" : "Entrar como facilitador"}
        </PrimaryButton>
        {error && <div className="dp-body text-[12px] mt-2" style={{ color: CORAL }}>{error}</div>}
      </div>
    </div>
  );
}

function buildJoinLink(code) {
  const base = window.location.origin + window.location.pathname;
  return `${base}?code=${code}`;
}

function ShareGroup({ groupName, code }) {
  const [copiedCode, setCopiedCode] = useState(false);
  const [copiedLink, setCopiedLink] = useState(false);
  const link = buildJoinLink(code);

  const copy = async (text, setFlag) => {
    try {
      await navigator.clipboard.writeText(text);
      setFlag(true);
      setTimeout(() => setFlag(false), 1500);
    } catch (e) {
      // Si el navegador bloquea el portapapeles, no pasa nada grave.
    }
  };

  const mailtoHref =
    `mailto:?subject=${encodeURIComponent(`Invitación a "${groupName}" en Organicen y decidan`)}` +
    `&body=${encodeURIComponent(`Únete a nuestro grupo con este código: ${code}\n\nO abre este link directo:\n${link}`)}`;

  return (
    <div className="flex flex-col gap-2">
      <div className="flex items-center justify-between rounded-lg px-2.5 py-1.5" style={{ background: BLUE_SOFT }}>
        <span className="dp-mono text-sm font-semibold" style={{ color: INK }}>{code}</span>
        <button onClick={() => copy(code, setCopiedCode)} className="dp-body text-[11px] font-medium" style={{ color: BLUE }}>
          {copiedCode ? <span><i className="ti ti-check" style={{ marginRight: "3px" }}></i>copiado</span> : "copiar código"}
        </button>
      </div>
      <div className="flex items-center justify-between rounded-lg px-2.5 py-1.5" style={{ background: BLUE_SOFT }}>
        <span className="dp-mono text-[11px] truncate mr-2" style={{ color: INK + "aa" }}>{link}</span>
        <button onClick={() => copy(link, setCopiedLink)} className="dp-body text-[11px] font-medium shrink-0" style={{ color: BLUE }}>
          {copiedLink ? <span><i className="ti ti-check" style={{ marginRight: "3px" }}></i>copiado</span> : "copiar link"}
        </button>
      </div>
      <a
        href={mailtoHref}
        className="dp-body text-center text-[12px] px-2.5 py-2 rounded-full font-medium"
        style={{ background: BLUE, color: "#fff" }}
      >
        <i className="ti ti-mail" style={{ marginRight: "4px" }}></i>Enviar código y link por correo
      </a>
    </div>
  );
}

function OnbPresupuestoTable() {
  const cats = ["Filtro de agua", "Recolección de agua", "Iluminación", "Seguridad", "Mant. del jardín"];
  const marta = [20, 15, 20, 30, 15];
  const pedro = [10, 25, 10, 40, 15];
  const totalBudget = 2000;
  return (
    <div className="rounded-lg p-2.5" style={{ background: PAGE_BG }}>
      <table className="w-full" style={{ borderCollapse: "collapse", fontSize: "10px" }}>
        <thead>
          <tr style={{ color: INK + "99", fontWeight: 600 }}>
            <td className="pb-1.5">Categoría</td>
            <td className="pb-1.5 text-center">Martha<br />propone</td>
            <td className="pb-1.5 text-center">Pedro<br />propone</td>
            <td className="pb-1.5 text-center" style={{ color: GREEN }}>Promedio</td>
          </tr>
        </thead>
        <tbody>
          {cats.map((c, i) => {
            const prom = Math.round((marta[i] + pedro[i]) / 2);
            return (
              <tr key={c} style={{ borderTop: `1px solid ${BLUE}22` }}>
                <td className="py-1" style={{ color: INK }}>{c}</td>
                <td className="py-1 text-center dp-mono" style={{ color: INK + "aa" }}>{marta[i]}%</td>
                <td className="py-1 text-center dp-mono" style={{ color: INK + "aa" }}>{pedro[i]}%</td>
                <td className="py-1 text-center dp-mono font-bold" style={{ color: GREEN }}>{prom}%</td>
              </tr>
            );
          })}
        </tbody>
      </table>
      <div className="dp-body text-[9.5px] mt-2 pt-1.5" style={{ color: INK + "88", borderTop: `1px dashed ${BLUE}33` }}>
        Así se calcula cada renglón: Iluminación → (20% + 10%) ÷ 2 = <b style={{ color: GREEN }}>15%</b>
      </div>
      <div className="dp-body text-[9.5px] mt-1.5" style={{ color: INK + "88" }}>Con un presupuesto total de ${totalBudget}/mes, la decisión final por categoría queda así:</div>
      <table className="w-full mt-1" style={{ borderCollapse: "collapse", fontSize: "10px" }}>
        <tbody>
          {cats.map((c, i) => {
            const prom = Math.round((marta[i] + pedro[i]) / 2);
            const dollars = Math.round((totalBudget * prom) / 100);
            return (
              <tr key={c}>
                <td className="py-0.5" style={{ color: INK + "cc" }}>{c}</td>
                <td className="py-0.5 text-right dp-mono font-semibold" style={{ color: INK }}>${dollars}</td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

// específicas de cada plantilla (al unirse a un grupo por invitación).
const ONBOARDING_GROUP_SLIDES = {
  cuotas: [2, 7],
  presupuesto: [2, 8],
  asociaciones: [2, 7, 8, 9],
};

function OnboardingCarousel({ slides, onClose, overlay = true }) {
  const [idx, setIdx] = useState(0);
  const s = slides[idx];
  const touchStartX = React.useRef(null);

  const goNext = () => (idx < slides.length - 1 ? setIdx(idx + 1) : onClose());
  const goBack = () => idx > 0 && setIdx(idx - 1);

  // Swipe hacia la izquierda = siguiente tarjeta; hacia la derecha =
  // tarjeta anterior. Para salir sigue haciendo falta la ✕ a propósito.
  const handleTouchStart = (e) => {
    touchStartX.current = e.touches[0].clientX;
  };
  const handleTouchEnd = (e) => {
    if (touchStartX.current === null) return;
    const deltaX = e.changedTouches[0].clientX - touchStartX.current;
    const threshold = 45;
    if (deltaX < -threshold && idx < slides.length - 1) setIdx(idx + 1);
    else if (deltaX > threshold && idx > 0) setIdx(idx - 1);
    touchStartX.current = null;
  };

  const card = (
    <div
      onTouchStart={handleTouchStart}
      onTouchEnd={handleTouchEnd}
      className="rounded-2xl p-5"
      style={{ background: WARM_WHITE, border: overlay ? "none" : `1px solid ${BLUE}33`, maxWidth: overlay ? "360px" : "none" }}
    >
      {overlay && (
        <div className="flex justify-between items-center mb-1.5">
          <span className="dp-mono text-[10px]" style={{ color: INK + "66" }}>{idx + 1} / {slides.length}</span>
          <button onClick={onClose} className="dp-body text-sm" style={{ color: INK + "88" }}><i className="ti ti-x"></i></button>
        </div>
      )}
      <div className="mb-2.5"><OnbIcon name={s.icon} /></div>
      <div className="dp-display text-base font-bold mb-1.5" style={{ color: INK }}>{s.title}</div>
      <div className="dp-body text-[12.5px] mb-2.5 whitespace-pre-line" style={{ color: INK + "99", lineHeight: 1.55 }}>{s.text}</div>
      {s.example && <div className="mb-2">{s.example()}</div>}
      <div className="flex gap-1 justify-center flex-wrap my-3">
        {slides.map((_, i) => (
          <span key={i} style={{ width: "6px", height: "6px", borderRadius: "50%", background: i === idx ? BLUE : BLUE + "33" }} />
        ))}
      </div>
      <div className="flex gap-2">
        {idx > 0 && (
          <button onClick={goBack} className="dp-body flex-1 text-xs py-2 rounded-full font-medium" style={{ background: "#fff", color: INK, border: `1.5px solid ${BLUE}55` }}>
            Atrás
          </button>
        )}
        <button
          onClick={goNext}
          className="dp-body text-xs py-2 rounded-full text-white font-medium"
          style={{ background: BLUE, flex: idx > 0 ? 2 : 1 }}
        >
          {idx === slides.length - 1 ? "Entendido" : "Siguiente"}
        </button>
      </div>
    </div>
  );

  if (!overlay) return card;

  return (
    <div className="fixed inset-0 flex items-start justify-center p-4 py-10 overflow-y-auto" style={{ background: "rgba(20,33,61,0.55)", zIndex: 60 }}>
      {card}
    </div>
  );
}

function MunPieSVG({ slices }) {
  const total = slices.reduce((s, x) => s + x.value, 0);
  const cx = 70, cy = 70, r = 60;
  let start = -90;
  const paths = slices.map((sl, i) => {
    const angle = (sl.value / total) * 360;
    const end = start + angle;
    const x1 = cx + r * Math.cos((start * Math.PI) / 180), y1 = cy + r * Math.sin((start * Math.PI) / 180);
    const x2 = cx + r * Math.cos((end * Math.PI) / 180), y2 = cy + r * Math.sin((end * Math.PI) / 180);
    const large = angle > 180 ? 1 : 0;
    const d = `M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2} Z`;
    start = end;
    return <path key={i} d={d} fill={sl.color} />;
  });
  return <svg viewBox="0 0 140 140" width="110" height="110">{paths}</svg>;
}

function MunPresupuestoTab({ onNext, onSubmitResult, savedResult }) {
  const [deptos, setDeptos] = useState(MUN_DEPTOS_DEFAULT.map((d) => ({ ...d, subs: d.subs.map((n) => ({ n, pct: 0 })) })));
  const [expanded, setExpanded] = useState({});
  const [submitted, setSubmitted] = useState(!!savedResult);
  const [resultExpanded, setResultExpanded] = useState({});

  const setDeptPct = (i, v) => {
    const used = deptos.reduce((s, d, idx) => (idx === i ? s : s + d.pct), 0);
    const clamped = Math.max(0, Math.min(100 - used, v));
    setDeptos(deptos.map((d, idx) => (idx === i ? { ...d, pct: clamped } : d)));
  };
  const setSubPct = (di, si, delta) => {
    const dept = deptos[di];
    const used = dept.subs.reduce((s, x, idx) => (idx === si ? s : s + x.pct), 0);
    const clamped = Math.max(0, Math.min(100 - used, dept.subs[si].pct + delta));
    const newSubs = dept.subs.map((s, idx) => (idx === si ? { ...s, pct: clamped } : s));
    setDeptos(deptos.map((d, idx) => (idx === di ? { ...d, subs: newSubs } : d)));
  };
  const addSub = async (di) => {
    const name = await customPrompt("Nombre de la sub-secretaría o proyecto:");
    if (!name) return;
    setDeptos(deptos.map((d, idx) => (idx === di ? { ...d, subs: [...d.subs, { n: name, pct: 0 }] } : d)));
  };
  const addDept = async () => {
    const name = await customPrompt("Nombre de la nueva secretaría:");
    if (!name) return;
    setDeptos([...deptos, { id: `custom_${Date.now()}`, label: name, pct: 0, subs: [] }]);
  };

  const totalPct = deptos.reduce((s, d) => s + d.pct, 0);

  const computeAvgDeptos = () => {
    // Se promedia con 2 respuestas ficticias que favorecen Salud y Educación.
    const favored = { salud: true, educacion: true };
    let avgDeptos = deptos.map((d) => {
      const boost = favored[d.id] ? d.pct * 0.6 + 18 : d.pct * 0.85;
      return { ...d, avgPct: (d.pct + boost + boost) / 3 };
    });
    const sumPct = avgDeptos.reduce((s, d) => s + d.avgPct, 0) || 1;
    return avgDeptos.map((d) => ({ ...d, avgPct: (d.avgPct / sumPct) * 100 }));
  };

  if (submitted) {
    const avgDeptos = savedResult || computeAvgDeptos();
    return (
      <div className="rounded-xl p-3.5" style={{ background: PAGE_BG }}>
        <div className="dp-display text-sm font-bold" style={{ color: INK }}>Propuesta enviada</div>
        <div className="dp-body text-[10.5px] mb-2.5" style={{ color: INK + "88" }}>Se promedió con las respuestas de otros ciudadanos del ejemplo.</div>
        <div className="dp-body text-[11px] font-semibold mb-1.5" style={{ color: INK }}>Resultados colectivos por secretaría</div>
        {avgDeptos.map((d, i) => (
          <div key={d.id} className="py-1" style={{ borderTop: `1px solid ${BLUE}15` }}>
            <div className="flex justify-between items-center">
              <span className="dp-body text-[10.5px] font-semibold" style={{ color: INK }}>{d.label}</span>
              <span className="flex items-center gap-1.5">
                <span className="dp-mono text-[11px] font-bold" style={{ color: BLUE }}>{d.avgPct.toFixed(1)}%</span>
                {d.subs.length > 0 && (
                  <button onClick={() => setResultExpanded({ ...resultExpanded, [i]: !resultExpanded[i] })} className="dp-body text-[9px]" style={{ color: BLUE }}>{resultExpanded[i] ? "▼" : "▶"}</button>
                )}
              </span>
            </div>
            <div className="dp-mono text-[9.5px]" style={{ color: INK + "77" }}>{munFmt(MUN_TOTAL_BUDGET * (d.avgPct / 100))}</div>
            {resultExpanded[i] && d.subs.length > 0 && (
              <div className="mt-1 pl-2" style={{ borderLeft: `2px solid ${BLUE}33` }}>
                {d.subs.map((s, si) => {
                  const subPctOfTotal = (d.avgPct * (100 / d.subs.length)) / 100;
                  return (
                    <div key={si} className="flex justify-between dp-body text-[9.5px] py-0.5" style={{ color: INK + "88" }}>
                      <span>{s.n}</span>
                      <span>{munFmt(MUN_TOTAL_BUDGET * (subPctOfTotal / 100))}</span>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        ))}
        <button onClick={onNext} className="dp-body w-full mt-3 text-xs py-2 rounded-full text-white font-medium" style={{ background: BLUE }}>Continuar →</button>
      </div>
    );
  }

  return (
    <div>
      <div className="mb-2"><OnbIcon name="ti-chart-pie" /></div>
      <div className="dp-display text-base font-bold mb-1" style={{ color: INK }}>Presupuesto participativo</div>
      <div className="dp-body text-[10.5px] mb-2.5" style={{ color: INK + "99", lineHeight: 1.5 }}>
        Reparte lo recaudado entre secretaría, sub-secretaría, o un proyecto específico que creas importante. Las respuestas de todos se promedian por categoría.
      </div>
      {deptos.map((dept, i) => (
        <MunDeptRow
          key={dept.id}
          dept={dept}
          deptos={deptos}
          idx={i}
          onSetPct={(v) => setDeptPct(i, v)}
          expanded={!!expanded[i]}
          onToggle={() => setExpanded({ ...expanded, [i]: !expanded[i] })}
          onSetSubPct={(si, delta) => setSubPct(i, si, delta)}
          onAddSub={() => addSub(i)}
        />
      ))}
      <div className="dp-body text-xs font-bold text-center my-2 py-2 rounded-lg" style={{ background: totalPct === 100 ? GREEN + "18" : BLUE_SOFT, color: totalPct === 100 ? GREEN : INK }}>
        {totalPct}% repartido · {100 - totalPct}% por repartir
      </div>
      <button onClick={addDept} className="dp-body w-full text-xs py-2 rounded-full font-medium mb-2" style={{ border: `1.5px dashed ${BLUE}55`, color: BLUE }}>+ agregar otra secretaría</button>
      <button
        onClick={() => {
          if (onSubmitResult) onSubmitResult(computeAvgDeptos());
          setSubmitted(true);
        }}
        className="dp-body w-full text-xs py-2.5 rounded-full text-white font-medium"
        style={{ background: BLUE }}
      >
        <i className="ti ti-send" style={{ marginRight: "4px" }}></i>Enviar mi propuesta
      </button>
    </div>
  );
}

function CreateGroupScreen({ backendUrl, onBack, onCreated, prefillName, prefillEmail, userId }) {
  const [name, setName] = useState("");
  const [adminName, setAdminName] = useState(prefillName || "");
  const [adminEmail, setAdminEmail] = useState(prefillEmail || "");
  const [requireApproval, setRequireApproval] = useState(true);
  const [secretResponses, setSecretResponses] = useState(true);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");

  const submit = async () => {
    if (!name || !adminName) return;
    setLoading(true);
    setError("");
    try {
      const res = await fetch(`${backendUrl}/api/groups`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, adminName, adminEmail, requireApproval, secretResponses, userId: userId || null }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "No se pudo crear el grupo");
      onCreated({ code: data.code, memberId: data.adminId, groupName: name });
    } catch (e) {
      setError(
        e.message === "Failed to fetch"
          ? "No se pudo conectar al backend. ¿Sigue corriendo npm start en tu terminal?"
          : e.message
      );
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="px-4 py-6">
      <BackButton onClick={onBack} />
      <div className="rounded-2xl p-4" style={{ background: WARM_WHITE, border: `1px solid ${BLUE}33` }}>
        <div className="dp-body text-sm font-medium mb-3" style={{ color: INK }}>Crear un grupo nuevo</div>
        <div className="flex flex-col gap-2.5 mb-3">
          <Field label="Nombre del grupo" value={name} onChange={setName} placeholder="ej. Condominio Las Flores" />
          <Field label="Tu nombre (facilitador)" value={adminName} onChange={setAdminName} placeholder="ej. Bernardo" />
          <Field label="Tu correo (para avisarte de solicitudes nuevas)" value={adminEmail} onChange={setAdminEmail} placeholder="ej. bernardo@correo.com" type="email" />
        </div>

        <div className="dp-body text-xs font-medium mb-1.5" style={{ color: INK }}>
          ¿Quién puede participar?
        </div>
        <div className="flex flex-col gap-2 mb-3">
          <button
            onClick={() => setRequireApproval(true)}
            className="dp-body text-left rounded-lg px-3 py-2 text-[13px]"
            style={
              requireApproval
                ? { background: BLUE, color: "#fff" }
                : { background: BLUE_SOFT, color: INK }
            }
          >
            Yo apruebo cada solicitud antes de que participen
          </button>
          <button
            onClick={() => setRequireApproval(false)}
            className="dp-body text-left rounded-lg px-3 py-2 text-[13px]"
            style={
              !requireApproval
                ? { background: BLUE, color: "#fff" }
                : { background: BLUE_SOFT, color: INK }
            }
          >
            Cualquiera con el código puede participar de inmediato
          </button>
        </div>

        <div className="dp-body text-xs font-medium mb-1.5" style={{ color: INK }}>
          ¿Las propuestas son secretas?
        </div>
        <div className="flex flex-col gap-2 mb-3">
          <button
            onClick={() => setSecretResponses(true)}
            className="dp-body text-left rounded-lg px-3 py-2 text-[13px]"
            style={
              secretResponses
                ? { background: BLUE, color: "#fff" }
                : { background: BLUE_SOFT, color: INK }
            }
          >
            Secretas — solo se ven los números, no quién propuso qué
          </button>
          <button
            onClick={() => setSecretResponses(false)}
            className="dp-body text-left rounded-lg px-3 py-2 text-[13px]"
            style={
              !secretResponses
                ? { background: BLUE, color: "#fff" }
                : { background: BLUE_SOFT, color: INK }
            }
          >
            Visibles — se muestra el nombre junto a cada propuesta
          </button>
        </div>

        <PrimaryButton onClick={submit} disabled={loading || !name || !adminName}>
          {loading ? "Creando…" : "Crear grupo"}
        </PrimaryButton>
        {error && <div className="dp-body text-[12px] mt-2" style={{ color: CORAL }}>{error}</div>}
      </div>
    </div>
  );
}
