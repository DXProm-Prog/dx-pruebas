  const RULE_LABEL = { simple: "Simple", absoluta: "Absoluta", calificada: "Calificada", rankeado: "Voto ranqueado", segunda_vuelta: "Segunda vuelta electoral" };
  const RULE_DEF = {
    simple: "Gana la opción con más votos, sin importar el porcentaje.",
    absoluta: "La opción ganadora necesita más del 50% de los votos.",
    calificada: "La opción ganadora necesita superar el porcentaje que tú definas (mayor al 50%).",
    rankeado: "Cada quien ordena las opciones por preferencia. La app calcula sola, en rondas, quién gana: elimina la menos votada y reparte esos votos a la siguiente preferencia, hasta que alguien pase el 50%.",
    segunda_vuelta: "Se vota por una sola opción a la vez, en rondas. Al cerrarse una ronda (por tiempo o porque tú la cierras), se elimina a las opciones menos votadas que definas, y se vuelve a votar entre las que quedan.",
  };

  const submit = async () => {
    if (!text) return;
    const cleanOptions = options.map((o) => o.trim()).filter(Boolean);
    if (type === "mayoria" && cleanOptions.length < 2) {
      setError("Agrega al menos 2 opciones");
      return;
    }
    setAdding(true);
    setError("");
    try {
      const body = { type, text };
      const mins = useLimit ? totalMinutes() : 0;

      if (type === "promedio") {
        body.trimPercent = Number(trimPercent);
        if (mins > 0) body.closesInMinutes = mins;
      } else {
        body.options = cleanOptions;
        body.majorityRule = majorityRule;
        if (majorityRule === "calificada") body.qualifiedPct = Number(qualifiedPct);
        if (majorityRule === "segunda_vuelta") {
          body.numRounds = Number(numRounds);
          body.eliminationThresholdPercent = Number(eliminationThresholdPercent);
          if (mins > 0) body.roundDurationMinutes = mins;
        } else if (mins > 0) {
          body.closesInMinutes = mins;
        }
      }

      const res = await fetch(`${backendUrl}/api/groups/${groupCode}/questions`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Error al crear la pregunta");
      setText("");
      setOptions(["", ""]);
      setUseLimit(false);
      setDays("0"); setHours("0"); setMinutes("0");
      await onAdded();
    } catch (e) {
      setError(e.message);
    } finally {
      setAdding(false);
    }
  };

  const isSegundaVuelta = majorityRule === "segunda_vuelta";

  return (
    <div className="rounded-2xl p-4 mb-4" style={{ background: WARM_WHITE, border: `1px solid ${BLUE}33` }}>
      <div className="dp-body text-xs font-medium mb-3" style={{ color: INK }}>Nueva pregunta</div>

      <div className="flex gap-1.5 mb-3">
        {[{ key: "promedio", label: "Promedio" }, { key: "mayoria", label: "Mayoría" }].map((t) => (
          <button
            key={t.key}
            onClick={() => setType(t.key)}
            className="dp-body text-xs px-3 py-1.5 rounded-full font-medium flex-1"
            style={type === t.key ? { background: BLUE, color: "#fff" } : { background: BLUE_SOFT, color: INK }}
          >
            {t.label}
          </button>
        ))}
      </div>

      <textarea
        rows={2}
        value={text}
        onChange={(e) => setText(e.target.value)}
        placeholder="Escribe la pregunta…"
        className="dp-body w-full resize-none rounded-lg px-2.5 py-2 text-sm outline-none mb-2"
        style={{ background: BLUE_SOFT, color: INK }}
      />

      {type === "promedio" && (
        <div className="dp-body flex items-center gap-1.5 text-xs px-2.5 py-1.5 rounded-full mb-3 w-fit" style={{ background: BLUE_SOFT, color: INK }}>
          <span style={{ opacity: 0.6 }}>Recorte</span>
          <input type="number" value={trimPercent} onChange={(e) => setTrimPercent(e.target.value)} className="w-9 bg-transparent dp-mono text-center outline-none font-medium" />
          <span style={{ opacity: 0.6 }}>%</span>
        </div>
      )}

      {type === "mayoria" && (
        <React.Fragment>
          <div className="mb-3">
            {options.map((opt, i) => (
              <div key={i} className="flex items-center gap-2 mb-1.5">
                <input
                  value={opt}
                  onChange={(e) => updateOption(i, e.target.value)}
                  placeholder={`Opción ${i + 1}`}
                  className="dp-body flex-1 rounded-lg px-2.5 py-1.5 text-sm outline-none"
                  style={{ background: BLUE_SOFT, color: INK }}
                />
                {options.length > 2 && (
                  <button onClick={() => removeOption(i)} className="dp-body text-xs px-1" style={{ color: CORAL }}>✕</button>
                )}
              </div>
            ))}
            <button onClick={addOption} className="dp-body text-xs font-medium" style={{ color: BLUE }}>+ agregar opción</button>
          </div>

          <div className="dp-body text-[10px] font-semibold mb-1.5" style={{ color: INK + "88", textTransform: "uppercase", letterSpacing: "0.03em" }}>
            Mayoría
          </div>
          <div className="flex gap-1.5 mb-2">
            {["simple", "absoluta", "calificada"].map((r) => (
              <button
                key={r}
                onClick={() => setMajorityRule(r)}
                className="dp-body text-[11px] px-2 py-1.5 rounded-full font-medium flex-1"
                style={majorityRule === r ? { background: BLUE, color: "#fff" } : { background: BLUE_SOFT, color: INK }}
              >
                {RULE_LABEL[r]}
              </button>
            ))}
          </div>
          {majorityRule === "calificada" && (
            <div className="dp-body flex items-center gap-2 text-xs mb-3" style={{ color: INK }}>
              requiere más de
              <input type="number" min="51" max="99" value={qualifiedPct} onChange={(e) => setQualifiedPct(e.target.value)} className="dp-mono w-14 rounded-lg px-2 py-1 text-center outline-none" style={{ background: BLUE_SOFT }} />
              %
            </div>
          )}

          <div style={{ height: "1px", background: BLUE + "22", margin: "8px 0" }} />
          <button
            onClick={() => setMajorityRule("rankeado")}
            className="dp-body block w-full text-left text-xs font-medium px-2.5 py-2 rounded-lg mb-2"
            style={majorityRule === "rankeado" ? { background: BLUE, color: "#fff" } : { background: BLUE_SOFT, color: INK }}
          >
            Voto ranqueado
          </button>

          <div style={{ height: "1px", background: BLUE + "22", margin: "8px 0" }} />
          <button
            onClick={() => setMajorityRule("segunda_vuelta")}
            className="dp-body block w-full text-left text-xs font-medium px-2.5 py-2 rounded-lg mb-2"
            style={majorityRule === "segunda_vuelta" ? { background: BLUE, color: "#fff" } : { background: BLUE_SOFT, color: INK }}
          >
            Segunda vuelta electoral
          </button>
          {isSegundaVuelta && (
            <div className="flex gap-3 mb-2">
              <label className="dp-body flex items-center gap-1.5 text-xs" style={{ color: INK }}>
                Número de rondas
                <input type="number" min="1" value={numRounds} onChange={(e) => setNumRounds(e.target.value)} className="dp-mono w-11 rounded-lg px-1.5 py-1 text-center outline-none" style={{ background: BLUE_SOFT }} />
              </label>
            </div>
          )}
          {isSegundaVuelta && (
            <div className="flex gap-3 mb-1">
              <label className="dp-body flex items-center gap-1.5 text-xs" style={{ color: INK }}>
                % mínimo para sobrevivir
                <input type="number" min="0" max="100" value={eliminationThresholdPercent} onChange={(e) => setEliminationThresholdPercent(e.target.value)} className="dp-mono w-11 rounded-lg px-1.5 py-1 text-center outline-none" style={{ background: BLUE_SOFT }} />
              </label>
            </div>
          )}
          {isSegundaVuelta && (
            <div className="dp-body text-[10px] mb-3" style={{ color: INK + "77" }}>
              en cada ronda se eliminan las opciones sin votos y las que estén por debajo de este %
            </div>
          )}

          <button onClick={() => setShowDefs(!showDefs)} className="dp-body text-[11px] font-medium mb-2" style={{ color: BLUE }}>
            {showDefs ? "ocultar definiciones" : "¿qué significa cada una?"}
          </button>
          {showDefs && (
            <div className="rounded-lg p-2.5 mb-3 text-[11px] leading-relaxed" style={{ background: BLUE_SOFT, color: INK + "cc" }}>
              {Object.entries(RULE_LABEL).map(([k, l]) => (
                <div key={k} className="mb-1">
                  <b style={{ color: INK }}>{l}:</b> {RULE_DEF[k]}
                </div>
              ))}
            </div>
          )}
        </React.Fragment>
      )}

      <div className="dp-body text-xs font-medium mb-1.5" style={{ color: INK }}>
        Límite de tiempo{isSegundaVuelta ? " por ronda" : " para responder"}:
      </div>
      <div className="flex gap-1.5 mb-2">
        <button onClick={() => setUseLimit(false)} className="dp-body text-xs px-3 py-1.5 rounded-full font-medium flex-1" style={!useLimit ? { background: BLUE, color: "#fff" } : { background: BLUE_SOFT, color: INK }}>No</button>
        <button onClick={() => setUseLimit(true)} className="dp-body text-xs px-3 py-1.5 rounded-full font-medium flex-1" style={useLimit ? { background: BLUE, color: "#fff" } : { background: BLUE_SOFT, color: INK }}>Sí</button>
      </div>
      {useLimit && (
        <div className="flex gap-2 mb-1">
          <label className="dp-body flex items-center gap-1.5 text-xs" style={{ color: INK + "99" }}>
            Días <input type="number" min="0" value={days} onChange={(e) => setDays(e.target.value)} className="dp-mono w-11 rounded-lg px-1.5 py-1 text-center outline-none" style={{ background: BLUE_SOFT }} />
          </label>
          <label className="dp-body flex items-center gap-1.5 text-xs" style={{ color: INK + "99" }}>
            Horas <input type="number" min="0" max="23" value={hours} onChange={(e) => setHours(e.target.value)} className="dp-mono w-11 rounded-lg px-1.5 py-1 text-center outline-none" style={{ background: BLUE_SOFT }} />
          </label>
          <label className="dp-body flex items-center gap-1.5 text-xs" style={{ color: INK + "99" }}>
            Min <input type="number" min="0" max="59" value={minutes} onChange={(e) => setMinutes(e.target.value)} className="dp-mono w-11 rounded-lg px-1.5 py-1 text-center outline-none" style={{ background: BLUE_SOFT }} />
          </label>
        </div>
      )}
      {isSegundaVuelta && (
        <div className="dp-body text-[10px] mb-3" style={{ color: INK + "77" }}>
          {useLimit ? "al pasar el tiempo, la ronda se cierra sola y avanza." : "sin límite: tú cierras cada ronda a mano."}
        </div>
      )}
      {!isSegundaVuelta && <div className="mb-3" />}

      <button
        type="button"
        onClick={() => setShowPreview(!showPreview)}
        className="dp-body w-full flex items-center justify-center gap-1.5 text-xs py-2 rounded-full font-medium mb-2"
        style={{ background: BLUE_SOFT, color: INK }}
      >
        👁 {showPreview ? "Ocultar vista previa" : "Vista previa"}
      </button>

      {showPreview && (
        <div className="rounded-2xl p-3 mb-3" style={{ background: PAGE_BG, border: `1.5px dashed ${BLUE}55` }}>
          <div className="dp-body text-[10px] font-semibold mb-2" style={{ color: INK + "77", textTransform: "uppercase", letterSpacing: "0.03em" }}>
            Así lo verán los participantes
          </div>
          <div className="rounded-xl p-3.5" style={{ background: WARM_WHITE, border: `1px solid ${BLUE}33` }}>
            <div className="dp-body text-[15px] mb-1" style={{ color: INK }}>{text || "Escribe tu pregunta arriba…"}</div>
            <div className="dp-body text-[11px] mb-3" style={{ color: INK + "77" }}>
              {type === "promedio"
                ? `recorte: ${trimPercent || 0}%`
                : majorityRule === "calificada"
                ? `necesita más del ${qualifiedPct || 66}%`
                : majorityRule === "absoluta"
                ? "necesita más del 50%"
                : majorityRule === "simple"
                ? "gana la más votada"
                : majorityRule === "rankeado"
                ? "voto ranqueado (automático)"
                : `${numRounds || 3} rondas · elimina menos del ${eliminationThresholdPercent || 10}%`}
            </div>

            {type === "promedio" && (
              <div className="flex items-center gap-2">
                <div className="flex-1 rounded-lg px-2.5 py-1.5 text-sm dp-mono" style={{ background: BLUE_SOFT, color: INK + "77" }}>tu propuesta</div>
                <div className="text-xs px-3 py-2 rounded-full text-white font-medium" style={{ background: GREEN, opacity: 0.6 }}>📤 Enviar</div>
              </div>
            )}

            {type === "mayoria" && majorityRule !== "rankeado" && (
              <div className="flex flex-col gap-1.5">
                {(options.map((o) => o.trim()).filter(Boolean).length ? options.map((o) => o.trim()).filter(Boolean) : ["Opción 1", "Opción 2"]).map((opt, i) => (
                  <div key={i} className="dp-body text-left text-sm px-3 py-2 rounded-lg" style={{ background: BLUE_SOFT, color: INK }}>
                    ○ {opt}
                  </div>
                ))}
              </div>
            )}

            {type === "mayoria" && majorityRule === "rankeado" && (
              <div className="flex flex-col gap-1.5">
                <div className="dp-body text-[11px] mb-1" style={{ color: INK + "77" }}>toca en orden de preferencia (1ª, 2ª…)</div>
                {(options.map((o) => o.trim()).filter(Boolean).length ? options.map((o) => o.trim()).filter(Boolean) : ["Opción 1", "Opción 2"]).map((opt, i) => (
                  <div key={i} className="dp-body flex items-center gap-2 text-left text-sm px-3 py-2 rounded-lg" style={{ background: BLUE_SOFT, color: INK }}>
                    <span className="dp-mono font-semibold" style={{ minWidth: "16px" }}>–</span>{opt}
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      )}

      {error && <div className="dp-body text-[12px] mb-2" style={{ color: CORAL }}>{error}</div>}

      <button
        onClick={submit}
        disabled={adding || !text}
        className="dp-body w-full flex items-center justify-center gap-1.5 text-xs py-2 rounded-full text-white font-medium disabled:opacity-40"
        style={{ background: BLUE }}
      >
        ➕ {adding ? "Agregando…" : "Agregar pregunta"}
      </button>
    </div>
  );
}


function StageInput({ stage, onSend, sending, disabled }) {
  const [numValue, setNumValue] = useState("");
  const [selected, setSelected] = useState("");
  const [texts, setTexts] = useState(Array(stage.config.maxItemsPerPerson || 1).fill(""));
  const [rankOrder, setRankOrder] = useState([]);
  const [catValues, setCatValues] = useState({});
  const [selectedMulti, setSelectedMulti] = useState([]);

  if (stage.type === "promedio") {
    return (
      <div className="flex items-center gap-2 mb-2">
        <input
          type="number"
          placeholder="tu propuesta"
          value={numValue}
          disabled={disabled}
          onChange={(e) => setNumValue(e.target.value)}
          className="dp-mono flex-1 rounded-lg px-2.5 py-1.5 text-sm outline-none disabled:opacity-50"
          style={{ background: BLUE_SOFT, color: INK }}
        />
        <button
          onClick={() => onSend(Number(numValue))}
          disabled={sending || disabled || numValue === ""}
          className="dp-body flex items-center gap-1.5 text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40"
          style={{ background: GREEN }}
        >
          📤 {sending ? "Enviando…" : "Enviar"}
        </button>
      </div>
    );
  }

  if (stage.type === "mayoria") {
    return (
      <div className="flex flex-col gap-1.5 mb-2">
        {stage.config.options.map((opt) => (
          <button
            key={opt}
            onClick={() => setSelected(opt)}
            disabled={disabled}
            className="dp-body text-left text-sm px-3 py-2 rounded-lg disabled:opacity-50"
            style={selected === opt ? { background: BLUE, color: "#fff" } : { background: BLUE_SOFT, color: INK }}
          >
            {selected === opt ? "● " : "○ "}{opt}
          </button>
        ))}
        <button
          onClick={() => onSend(selected)}
          disabled={sending || disabled || !selected}
          className="dp-body flex items-center justify-center gap-1.5 text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40 mt-1"
          style={{ background: GREEN }}
        >
          📤 {sending ? "Enviando…" : "Enviar"}
        </button>
      </div>
    );
  }

  if (stage.type === "recoleccion_abierta") {
    return (
      <div className="mb-2">
        {texts.map((t, i) => (
          <input
            key={i}
            value={t}
            disabled={disabled}
            onChange={(e) => {
              const arr = [...texts];
              arr[i] = e.target.value;
              setTexts(arr);
            }}
            placeholder={`Propuesta ${i + 1}`}
            className="dp-body w-full rounded-lg px-2.5 py-1.5 text-sm outline-none mb-1.5 disabled:opacity-50"
            style={{ background: BLUE_SOFT, color: INK }}
          />
        ))}
        <button
          onClick={() => onSend(texts.filter((t) => t.trim()))}
          disabled={sending || disabled || texts.every((t) => !t.trim())}
          className="dp-body flex items-center justify-center gap-1.5 w-full text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40"
          style={{ background: GREEN }}
        >
          📤 {sending ? "Enviando…" : "Enviar"}
        </button>
      </div>
    );
  }

  if (stage.type === "ranking_multiganador") {
    return (
      <div className="flex flex-col gap-1.5 mb-2">
        <div className="dp-body text-[11px] mb-1" style={{ color: INK + "77" }}>toca en orden de preferencia (1ª, 2ª…)</div>
        {stage.config.options.map((opt) => {
          const idx = rankOrder.indexOf(opt);
          return (
            <button
              key={opt}
              onClick={() => setRankOrder((prev) => (prev.includes(opt) ? prev.filter((o) => o !== opt) : [...prev, opt]))}
              disabled={disabled}
              className="dp-body flex items-center gap-2 text-left text-sm px-3 py-2 rounded-lg disabled:opacity-50"
              style={idx >= 0 ? { background: BLUE, color: "#fff" } : { background: BLUE_SOFT, color: INK }}
            >
              <span className="dp-mono font-semibold" style={{ minWidth: "16px" }}>{idx >= 0 ? idx + 1 : "–"}</span>
              {opt}
            </button>
          );
        })}
        <button
          onClick={() => onSend(rankOrder)}
          disabled={sending || disabled || rankOrder.length === 0}
          className="dp-body flex items-center justify-center gap-1.5 text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40 mt-1"
          style={{ background: GREEN }}
        >
          📤 {sending ? "Enviando…" : "Enviar"}
        </button>
      </div>
    );
  }

  if (stage.type === "promedio_por_categoria") {
    return (
      <div className="mb-2">
        {stage.config.categories.map((cat) => (
          <div key={cat} className="flex items-center gap-2 mb-1.5">
            <span className="dp-body text-xs flex-1" style={{ color: INK }}>{cat}</span>
            <input
              type="number"
              value={catValues[cat] || ""}
              disabled={disabled}
              onChange={(e) => setCatValues({ ...catValues, [cat]: e.target.value })}
              className="dp-mono w-24 rounded-lg px-2 py-1.5 text-sm outline-none disabled:opacity-50"
              style={{ background: BLUE_SOFT, color: INK }}
            />
          </div>
        ))}
        <button
          onClick={() => {
            const obj = {};
            Object.entries(catValues).forEach(([k, v]) => {
              const n = Number(v);
              if (!isNaN(n)) obj[k] = n;
            });
            onSend(obj);
          }}
          disabled={sending || disabled}
          className="dp-body flex items-center justify-center gap-1.5 w-full text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40"
          style={{ background: GREEN }}
        >
          📤 {sending ? "Enviando…" : "Enviar"}
        </button>
      </div>
    );
  }

  if (stage.type === "seleccion_multiple") {
    return (
      <div className="mb-2">
        {stage.config.options.map((opt) => {
          const isSelected = selectedMulti.includes(opt);
          return (
            <button
              key={opt}
              onClick={() => setSelectedMulti((prev) => (isSelected ? prev.filter((o) => o !== opt) : [...prev, opt]))}
              disabled={disabled}
              className="dp-body flex items-center gap-2 text-left text-sm px-3 py-2 rounded-lg mb-1.5 disabled:opacity-50 w-full"
              style={isSelected ? { background: BLUE, color: "#fff" } : { background: BLUE_SOFT, color: INK }}
            >
              {isSelected ? "☑" : "☐"} {opt}
            </button>
          );
        })}
        <button
          onClick={() => onSend(selectedMulti)}
          disabled={sending || disabled || selectedMulti.length === 0}
          className="dp-body flex items-center justify-center gap-1.5 w-full text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40"
          style={{ background: GREEN }}
        >
          📤 {sending ? "Enviando…" : "Enviar"}
        </button>
      </div>
    );
  }

  if (stage.type === "porcentaje_por_categoria") {
    const total = Object.values(catValues).reduce((a, v) => a + (Number(v) || 0), 0);
    return (
      <div className="mb-2">
        {stage.config.categories.map((cat) => (
          <div key={cat} className="flex items-center gap-2 mb-1.5">
            <span className="dp-body text-xs flex-1" style={{ color: INK }}>{cat}</span>
            <input
              type="number"
              value={catValues[cat] || ""}
              disabled={disabled}
              onChange={(e) => setCatValues({ ...catValues, [cat]: e.target.value })}
              className="dp-mono w-20 rounded-lg px-2 py-1.5 text-sm outline-none disabled:opacity-50"
              style={{ background: BLUE_SOFT, color: INK }}
            />
            <span className="dp-mono text-xs" style={{ color: INK + "77" }}>%</span>
          </div>
        ))}
        <div className="dp-mono text-[11px] mb-2" style={{ color: total > 100 ? CORAL : INK + "88" }}>
          asignado: {total}% de 100%{total > 100 ? " — pasa del tope" : ""}
        </div>
        <button
          onClick={() => {
            const obj = {};
            Object.entries(catValues).forEach(([k, v]) => {
              const n = Number(v);
              if (!isNaN(n)) obj[k] = n;
            });
            onSend(obj);
          }}
          disabled={sending || disabled}
          className="dp-body flex items-center justify-center gap-1.5 w-full text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40"
          style={{ background: GREEN }}
        >
          📤 {sending ? "Enviando…" : "Enviar"}
        </button>
      </div>
    );
  }

  return null;
}

function BigDecisionDisplay({ stage }) {
  const r = stage.result;
  if (stage.key === "singleQuota") {
    return (
      <div className="dp-display text-4xl font-extrabold text-center" style={{ color: BLUE }}>
        {r.average.toFixed(2)}
      </div>
    );
  }
  if (stage.key === "quotas") {
    return (
      <div>
        {Object.entries(r.categories).map(([cat, cr]) => (
          <div key={cat} className="flex justify-between items-baseline mb-1.5">
            <span className="dp-body text-sm" style={{ color: INK }}>{cat}</span>
            <span className="dp-display text-2xl font-extrabold" style={{ color: BLUE }}>{cr.average.toFixed(2)}</span>
          </div>
        ))}
      </div>
    );
  }
  if (stage.key === "budget") {
    return (
      <div>
        {Object.entries(r.categories).map(([cat, cr]) => (
          <div key={cat} className="flex justify-between items-baseline mb-1.5">
            <span className="dp-body text-sm" style={{ color: INK }}>{cat}</span>
            <span className="dp-display text-2xl font-extrabold" style={{ color: BLUE }}>{cr.normalizedPercent}%</span>
          </div>
        ))}
      </div>
    );
  }
  return null;
}

function StageResultView({ stage }) {
  const [showDetails, setShowDetails] = useState(true);
  const r = stage.result;

  if (stage.type === "promedio") {
    return (
      <div>
        <DetailsToggle show={showDetails} onToggle={() => setShowDetails(!showDetails)} />
        {showDetails && (
          <React.Fragment>
            <div className="flex flex-wrap gap-1.5 mb-2">
              {r.sorted.map((v, i) => {
                const isTrimmed = i < r.trimmedCount || i >= r.sorted.length - r.trimmedCount;
                return (
                  <span
                    key={i}
                    className="dp-mono text-xs px-2 py-1 rounded-md"
                    style={isTrimmed ? { background: CORAL + "22", color: CORAL, textDecoration: "line-through" } : { background: "#fff", color: INK }}
                  >
                    {v}
                  </span>
                );
              })}
            </div>
            <div className="dp-mono text-xs mb-1" style={{ color: INK + "aa" }}>
              ({r.kept.join(" + ")}) ÷ {r.kept.length} = {r.average.toFixed(2)}
            </div>
          </React.Fragment>
        )}
        <div className="dp-mono text-xs font-semibold" style={{ color: BLUE }}>→ {r.average.toFixed(2)}</div>
      </div>
    );
  }

  if (stage.type === "mayoria") {
    return (
      <div>
        <DetailsToggle show={showDetails} onToggle={() => setShowDetails(!showDetails)} />
        {showDetails && (
          <div className="mb-1">
            {r.tally.map((t) => (
              <OptionBar key={t.option} option={t.option} count={t.count} percent={t.percent} highlight={r.winner === t.option} />
            ))}
          </div>
        )}
        <div className="dp-mono text-xs font-semibold" style={{ color: r.winner ? GREEN : CORAL }}>→ {r.winner || "sin ganador"}</div>
      </div>
    );
  }

  if (stage.type === "recoleccion_abierta") {
    return (
      <div>
        <DetailsToggle show={showDetails} onToggle={() => setShowDetails(!showDetails)} />
        {showDetails && (
          <div className="dp-body text-[10px] mb-1.5" style={{ color: INK + "77" }}>
            {r.totalResponses} persona(s) propusieron {r.pool.length} nombre(s) distintos:
          </div>
        )}
        {showDetails && (
          <div className="flex flex-wrap gap-1">
            {r.pool.map((p) => (
              <span key={p.text} className="dp-mono text-[11px] px-2 py-0.5 rounded-md" style={{ background: BLUE_SOFT, color: INK }}>
                {p.text} ({p.count})
              </span>
            ))}
          </div>
        )}
      </div>
    );
  }

  if (stage.type === "ranking_multiganador") {
    const maxScore = Math.max(1, ...r.ranked.map((x) => x.score));
    return (
      <div>
        <DetailsToggle show={showDetails} onToggle={() => setShowDetails(!showDetails)} />
        {showDetails && (
          <div className="mb-1">
            {r.ranked.map((x) => (
              <OptionBar
                key={x.option}
                option={x.option}
                count={x.score}
                percent={Math.round((x.score / maxScore) * 1000) / 10}
                highlight={r.winners.includes(x.option)}
              />
            ))}
          </div>
        )}
        <div className="dp-mono text-xs font-semibold" style={{ color: GREEN }}>→ elegidas: {r.winners.join(", ")}</div>
      </div>
    );
  }

  if (stage.type === "promedio_por_categoria") {
    return (
      <div>
        <DetailsToggle show={showDetails} onToggle={() => setShowDetails(!showDetails)} />
        {Object.entries(r.categories).map(([cat, cr]) => (
          <div key={cat} className="mb-2.5">
            <div className="dp-body text-[11px] font-medium mb-1" style={{ color: INK }}>{cat}</div>
            {showDetails && (
              <React.Fragment>
                <div className="flex flex-wrap gap-1.5 mb-1">
                  {cr.sorted.map((v, i) => {
                    const isTrimmed = i < cr.trimmedCount || i >= cr.sorted.length - cr.trimmedCount;
                    return (
                      <span
                        key={i}
                        className="dp-mono text-xs px-2 py-0.5 rounded-md"
                        style={isTrimmed ? { background: CORAL + "22", color: CORAL, textDecoration: "line-through" } : { background: "#fff", color: INK }}
                      >
                        {v}
                      </span>
                    );
                  })}
                </div>
                <div className="dp-mono text-[11px] mb-1" style={{ color: INK + "aa" }}>
                  ({cr.kept.join(" + ")}) ÷ {cr.kept.length} = {cr.average.toFixed(2)}
                </div>
              </React.Fragment>
            )}
            <div className="dp-mono text-xs font-semibold" style={{ color: BLUE }}>→ {cr.average.toFixed(2)}</div>
          </div>
        ))}
      </div>
    );
  }

  if (stage.type === "seleccion_multiple") {
    return (
      <div>
        <DetailsToggle show={showDetails} onToggle={() => setShowDetails(!showDetails)} />
        {showDetails && (
          <div className="mb-1">
            {r.tally.map((t) => (
              <OptionBar key={t.option} option={t.option} count={t.count} percent={t.percent} highlight={false} />
            ))}
          </div>
        )}
      </div>
    );
  }

  if (stage.type === "porcentaje_por_categoria") {
    return (
      <div>
        <DetailsToggle show={showDetails} onToggle={() => setShowDetails(!showDetails)} />
        {showDetails && r.wasNormalized && (
          <div className="dp-body text-[10px] mb-2" style={{ color: CORAL }}>
            La suma de promedios dio {r.rawSum}% — se ajustó proporcionalmente a 100%.
          </div>
        )}
        {Object.entries(r.categories).map(([cat, cr]) => (
          <div key={cat} className="flex justify-between dp-mono text-xs mb-1" style={{ color: INK }}>
            <span>{cat}</span>
            <b style={{ color: BLUE }}>{cr.normalizedPercent}%</b>
          </div>
        ))}
      </div>
    );
  }

  return null;
}

function FlowRunner({ backendUrl, groupCode, memberId, flow, isAdmin, groupResponses, approvedMemberCount, onAdvance }) {
  const [sending, setSending] = useState(false);
  const [sendError, setSendError] = useState("");
  const [sent, setSent] = useState(false);
  const [closingStage, setClosingStage] = useState(false);
  const [categoryThresholdPercent, setCategoryThresholdPercent] = useState(
    flow.config?.categoryThresholdPercent ?? flow.config?.selectionThresholdPercent ?? 10
  );
  const [quotaTrimPercent, setQuotaTrimPercent] = useState(flow.config?.quotaTrimPercent ?? 10);
  const [savingConfig, setSavingConfig] = useState(false);
  const [showCelebration, setShowCelebration] = useState(flow.status === "finished");
  const prevStatus = React.useRef(flow.status);
  const stage = flow.status === "active" ? flow.currentStage : null;

  useEffect(() => {
    if (prevStatus.current !== "finished" && flow.status === "finished") {
      setShowCelebration(true);
    }
    prevStatus.current = flow.status;
  }, [flow.status]);

  const saveConfig = async () => {
    setSavingConfig(true);
    try {
      const config =
        flow.template === "cuotas"
          ? { categoryThresholdPercent: Number(categoryThresholdPercent), quotaTrimPercent: Number(quotaTrimPercent) }
          : { selectionThresholdPercent: Number(categoryThresholdPercent) };
      await fetch(`${backendUrl}/api/groups/${groupCode}/flows/${flow.id}/config`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ memberId, config }),
      });
      await onAdvance();
    } catch (e) {
      setSendError(e.message);
    } finally {
      setSavingConfig(false);
    }
  };

  useEffect(() => {
    setSent(false);
    setSendError("");
  }, [stage && stage.key]);

  const liveCount = stage
    ? (groupResponses || []).filter((r) => r.flowId === flow.id && r.stageKey === stage.key).length
    : 0;

  const sendResponse = async (value) => {
    setSending(true);
    setSendError("");
    try {
      const res = await fetch(`${backendUrl}/api/groups/${groupCode}/flows/${flow.id}/responses`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ memberId, value }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Error al enviar");
      setSent(true);
    } catch (e) {
      setSendError(e.message);
    } finally {
      setSending(false);
    }
  };

  const closeStage = async () => {
    const ok = window.confirm("¿Seguro que quieres cerrar esta etapa? Nadie más podrá responder después de esto.");
    if (!ok) return;
    setClosingStage(true);
    try {
      const res = await fetch(`${backendUrl}/api/groups/${groupCode}/flows/${flow.id}/close-stage`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ memberId }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Error al cerrar la etapa");
      await onAdvance();
    } catch (e) {
      setSendError(e.message);
    } finally {
      setClosingStage(false);
    }
  };

  return (
    <div className="rounded-2xl p-4 mb-4" style={{ background: WARM_WHITE, border: `1px solid ${BLUE}33` }}>
      <div className="dp-body text-xs font-semibold mb-3" style={{ color: BLUE }}>
        {flow.template === "cuotas" ? "Cuotas participativas" : "Presupuesto participativo"}{flow.status === "finished" ? " · terminado" : ""}
      </div>

      {isAdmin && flow.status === "active" && (
        <div className="rounded-lg p-3 mb-3" style={{ background: BLUE_SOFT }}>
          <label className="dp-body flex items-center justify-between text-xs mb-3" style={{ color: INK }}>
            % mínimo de apoyo para que sobreviva una categoría
            <input
              type="number" min="0" max="100" value={categoryThresholdPercent}
              onChange={(e) => setCategoryThresholdPercent(e.target.value)}
              className="dp-mono w-14 rounded-lg px-2 py-1 text-center outline-none ml-2"
              style={{ background: "#fff" }}
            />
          </label>
          {flow.template === "cuotas" && (
            <label className="dp-body flex items-center justify-between text-xs mb-3" style={{ color: INK }}>
              % de recorte (alto y bajo) en las cuotas
              <input
                type="number" min="0" max="45" value={quotaTrimPercent}
                onChange={(e) => setQuotaTrimPercent(e.target.value)}
                className="dp-mono w-14 rounded-lg px-2 py-1 text-center outline-none ml-2"
                style={{ background: "#fff" }}
              />
            </label>
          )}
          <div className="dp-body text-[10px] mb-2" style={{ color: INK + "77" }}>
            Solo afecta las etapas que todavía no se han calculado.
          </div>
          <button
            onClick={saveConfig}
            disabled={savingConfig}
            className="dp-body w-full text-xs py-1.5 rounded-full text-white font-medium disabled:opacity-40"
            style={{ background: BLUE }}
          >
            {savingConfig ? "Guardando…" : "Guardar"}
          </button>
        </div>
      )}

      {flow.stages.map((s, i) => (
        <div key={i} className="mb-3 pb-3" style={{ borderBottom: `1px dashed ${BLUE}33` }}>
          <div className="dp-body text-[12px] font-medium mb-1" style={{ color: INK }}>{s.text}</div>
          <StageResultView stage={s} />
        </div>
      ))}

      {flow.status === "finished" && (() => {
        const finalStage = [...flow.stages].reverse().find((s) => s.key === "quotas" || s.key === "singleQuota" || s.key === "budget");
        if (!finalStage) return null;
        return (
          <div className="rounded-xl p-3.5 mb-3" style={{ background: BLUE_SOFT }}>
            <div className="dp-display text-lg font-bold mb-2" style={{ color: INK }}>Decisión colectiva:</div>
            <BigDecisionDisplay stage={finalStage} />
          </div>
        );
      })()}

      {stage && (
        <div>
          <div className="dp-body text-[14px] mb-1" style={{ color: INK }}>{stage.text}</div>
          <div className="dp-body text-[11px] mb-2" style={{ color: INK + "88" }}>
            {liveCount} de {approvedMemberCount} miembro(s) han respondido
          </div>
          <StageInput key={stage.key} stage={stage} onSend={sendResponse} sending={sending} disabled={sent} />
          {sent && <div className="dp-body text-[11px] mb-2" style={{ color: GREEN }}>✅ Guardado</div>}
          {sendError && <div className="dp-body text-[11px] mb-2" style={{ color: CORAL }}>{sendError}</div>}
          {isAdmin && (
            <button
              onClick={closeStage}
              disabled={closingStage}
              className="dp-body w-full text-xs py-2 rounded-full text-white font-medium disabled:opacity-40"
              style={{ background: BLUE }}
            >
              🔒 {closingStage ? "Cerrando…" : "Cerrar etapa y avanzar"}
            </button>
          )}
        </div>
      )}

      {flow.status === "finished" && (
        <div className="dp-body text-[12px]" style={{ color: GREEN }}>
          ✅ Flujo completo — si dejaste tu correo, ahí te llega el resumen.
        </div>
      )}

      {showCelebration && flow.status === "finished" && (
        <div className="fixed inset-0 flex items-center justify-center p-4" style={{ background: "rgba(32,48,43,0.55)", zIndex: 50 }}>
          <div className="rounded-2xl p-5 max-w-[320px] w-full shadow-xl" style={{ background: WARM_WHITE }}>
            <div className="flex justify-end mb-1">
              <button onClick={() => setShowCelebration(false)} className="dp-body text-sm" style={{ color: INK + "77" }}>✕</button>
            </div>
            <div className="text-center mb-3">
              <div style={{ fontSize: "36px" }}>🎉</div>
              <div className="dp-display text-lg font-bold mt-1" style={{ color: INK }}>¡Felicidades!</div>
              <div className="dp-body text-[13px] mt-1" style={{ color: INK + "99" }}>
                Llegaron a una decisión colectiva.
              </div>
            </div>
            {(() => {
              const finalStage = [...flow.stages].reverse().find((s) => s.key === "quotas" || s.key === "singleQuota" || s.key === "budget");
              if (!finalStage) return null;
              return (
                <div className="rounded-lg p-3" style={{ background: BLUE_SOFT }}>
                  <BigDecisionDisplay stage={finalStage} />
                </div>
              );
            })()}
            <button
              onClick={() => setShowCelebration(false)}
              className="dp-body w-full mt-3 text-xs py-2 rounded-full text-white font-medium"
              style={{ background: BLUE }}
            >
              Ver todo el proceso
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

function ConnectedScreen({ backendUrl, groupCode, memberId, onExit }) {
  const [group, setGroup] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");
  const [approving, setApproving] = useState("");
  const prevPendingCount = React.useRef(null);

  const fetchGroup = async () => {
    setLoading(true);
    setError("");
    try {
      const res = await fetch(`${backendUrl}/api/groups/${groupCode}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Grupo no encontrado");
      setGroup(data);

      const isAdminNow = data.admin.id === memberId;
      const pendingCount = data.members.filter((m) => !m.approved).length;
      if (
        isAdminNow &&
        prevPendingCount.current !== null &&
        pendingCount > prevPendingCount.current &&
        typeof Notification !== "undefined" &&
        Notification.permission === "granted"
      ) {
        new Notification("Nueva solicitud pendiente", {
          body: `Alguien quiere unirse a "${data.name}". Entra a la app para aprobar o rechazar.`,
        });
      }
      prevPendingCount.current = pendingCount;
    } catch (e) {
      setError(
        e.message === "Failed to fetch"
          ? "No se pudo conectar al backend. ¿Sigue corriendo npm start en tu terminal?"
          : e.message
      );
    } finally {
      setLoading(false);
    }
  };

  useEffect(() => {
    fetchGroup();
    const interval = setInterval(fetchGroup, 15000);
    if (typeof Notification !== "undefined" && Notification.permission === "default") {
      Notification.requestPermission();
    }
    return () => clearInterval(interval);
  }, []);

  const approve = async (id) => {
    setApproving(id);
    try {
      await fetch(`${backendUrl}/api/groups/${groupCode}/members/${id}/approve`, { method: "POST" });
      await fetchGroup();
    } catch (e) {
      setError(e.message);
    } finally {
      setApproving("");
    }
  };

  const reject = async (id) => {
    setApproving(id);
    try {
      await fetch(`${backendUrl}/api/groups/${groupCode}/members/${id}/reject`, { method: "POST" });
      await fetchGroup();
    } catch (e) {
      setError(e.message);
    } finally {
      setApproving("");
    }
  };

  if (loading && !group) {
    return <div className="dp-body text-sm text-center py-10" style={{ color: INK + "88" }}>Conectando…</div>;
  }
  if (error && !group) {
    return (
      <div className="px-4 py-6">
        <div className="dp-body text-[13px]" style={{ color: CORAL }}>{error}</div>
        <button onClick={onExit} className="dp-body text-xs mt-3" style={{ color: INK + "88" }}>← Volver</button>
      </div>
    );
  }
  if (!group) return null;

  const me = group.members.find((m) => m.id === memberId);
  const isAdmin = group.admin.id === memberId;
  const flows = group.flows || [];
  const activeFlow = [...flows].reverse().find((f) => f.status === "active") || flows[flows.length - 1];
  const pendingMembers = group.members.filter((m) => !m.approved);

  return (
    <div className="px-4 py-4">
      <div className="rounded-2xl p-4 mb-4" style={{ background: WARM_WHITE, border: `1px solid ${BLUE}33` }}>
        <div className="flex items-start justify-between">
          <div>
            <div className="dp-body text-sm font-semibold" style={{ color: INK }}>{group.name}</div>
            <div className="dp-mono text-xs mt-0.5" style={{ color: INK + "88" }}>código: {group.code}</div>
          </div>
          <button onClick={onExit} className="dp-body text-[11px]" style={{ color: INK + "77" }}>Salir</button>
        </div>
        <div className="dp-body text-[11px] mt-2" style={{ color: INK + "88" }}>
          {group.members.filter((m) => m.approved).length} miembro(s) aprobado(s)
          {isAdmin && " · eres el administrador"}
        </div>
        {me && !me.approved && (
          <div className="dp-body text-[12px] mt-2 rounded-lg px-2.5 py-1.5" style={{ background: CORAL + "22", color: CORAL }}>
            Tu participación está pendiente de aprobación del administrador.
          </div>
        )}
        <div className="flex gap-2 mt-2.5">
          <a href={`${backendUrl}/api/groups/${groupCode}/export/respuestas.csv`} className="dp-body text-[11px] px-2.5 py-1.5 rounded-full font-medium" style={{ background: BLUE_SOFT, color: INK }}>⬇ Respuestas (CSV)</a>
          <a href={`${backendUrl}/api/groups/${groupCode}/export/resultados.csv`} className="dp-body text-[11px] px-2.5 py-1.5 rounded-full font-medium" style={{ background: BLUE_SOFT, color: INK }}>⬇ Resultados (CSV)</a>
        </div>
        {isAdmin && (
          <div className="mt-3 pt-3" style={{ borderTop: `1px solid ${BLUE}22` }}>
            <div className="dp-body text-xs font-medium mb-2" style={{ color: INK }}>
              Link directo para invitar usuarios a este grupo
            </div>
            <ShareGroup groupName={group.name} code={group.code} />
          </div>
        )}
      </div>

      {isAdmin && pendingMembers.length > 0 && (
        <div className="rounded-2xl p-4 mb-4" style={{ background: CORAL + "15", border: `1.5px solid ${CORAL}55` }}>
          <div className="dp-body text-xs font-semibold mb-2.5" style={{ color: CORAL }}>
            {pendingMembers.length} solicitud(es) pendiente(s)
          </div>
          <div className="flex flex-col gap-2">
            {pendingMembers.map((m) => (
              <div key={m.id} className="flex items-center justify-between">
                <span className="dp-body text-sm" style={{ color: INK }}>{m.name}</span>
                <div className="flex gap-1.5">
                  <button
                    onClick={() => approve(m.id)}
                    disabled={approving === m.id}
                    className="dp-body text-[11px] px-2.5 py-1.5 rounded-full text-white font-medium disabled:opacity-40"
                    style={{ background: GREEN }}
                  >
                    {approving === m.id ? "…" : "Aprobar"}
                  </button>
                  <button
                    onClick={() => reject(m.id)}
                    disabled={approving === m.id}
                    className="dp-body text-[11px] px-2.5 py-1.5 rounded-full font-medium disabled:opacity-40"
                    style={{ background: "#fff", color: CORAL, border: `1px solid ${CORAL}55` }}
                  >
                    Rechazar
                  </button>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {activeFlow ? (
        <FlowRunner
          backendUrl={backendUrl}
          groupCode={groupCode}
          memberId={memberId}
          flow={activeFlow}
          isAdmin={isAdmin}
          groupResponses={group.responses}
          approvedMemberCount={group.members.filter((m) => m.approved).length}
          onAdvance={fetchGroup}
        />
      ) : (
        isAdmin && (
          <div className="flex flex-col gap-2 mb-4">
            <button
              onClick={async () => {
                await fetch(`${backendUrl}/api/groups/${groupCode}/flows`, {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ template: "cuotas", memberId }),
                });
                await fetchGroup();
              }}
              className="dp-body w-full text-left rounded-2xl p-4 shadow-sm"
              style={{ background: BLUE_SOFT, border: `1.5px solid ${BLUE}` }}
            >
              <div className="text-sm font-semibold mb-1" style={{ color: INK }}>💰 Iniciar Cuotas participativas</div>
              <div className="text-xs" style={{ color: INK + "88" }}>
                Un flujo guiado de varias etapas para decidir las cuotas del grupo.
              </div>
            </button>
            <button
              onClick={async () => {
                await fetch(`${backendUrl}/api/groups/${groupCode}/flows`, {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ template: "presupuesto", memberId }),
                });
                await fetchGroup();
              }}
              className="dp-body w-full text-left rounded-2xl p-4 shadow-sm"
              style={{ background: BLUE_SOFT, border: `1.5px solid ${BLUE}` }}
            >
              <div className="text-sm font-semibold mb-1" style={{ color: INK }}>📊 Iniciar Presupuesto participativo</div>
              <div className="text-xs" style={{ color: INK + "88" }}>
                Un flujo guiado para decidir en qué se gasta el presupuesto del grupo.
              </div>
            </button>
            <button
              onClick={async () => {
                await fetch(`${backendUrl}/api/groups/${groupCode}/flows`, {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ template: "cuotas", memberId, chainNext: "presupuesto" }),
                });
                await fetchGroup();
              }}
              className="dp-body w-full text-left rounded-2xl p-4 shadow-sm"
              style={{ background: BLUE_SOFT, border: `1.5px solid ${BLUE}` }}
            >
              <div className="text-sm font-semibold mb-1" style={{ color: INK }}>🏘️ Iniciar Asociaciones (Cuotas + Presupuesto)</div>
              <div className="text-xs" style={{ color: INK + "88" }}>
                Corre los dos flujos, uno después del otro.
              </div>
            </button>
          </div>
        )
      )}

      {!activeFlow && (
        <React.Fragment>
          {isAdmin && <NewQuestionForm backendUrl={backendUrl} groupCode={groupCode} onAdded={fetchGroup} />}

          {group.questions.length === 0 && (
            <div className="dp-body text-xs text-center py-4" style={{ color: INK + "77" }}>
              Este grupo todavía no tiene preguntas.
            </div>
          )}

          {group.questions.map((q) => (
            <QuestionRunner
              key={q.id}
              backendUrl={backendUrl}
              groupCode={groupCode}
              memberId={memberId}
              question={q}
              isAdmin={isAdmin}
              groupResponses={group.responses}
              approvedMemberCount={group.members.filter((m) => m.approved).length}
            />
          ))}
        </React.Fragment>
      )}
    </div>
  );
}

function DemocraciaPorPromedioConectada() {
  const [backendUrl, setBackendUrl] = useState("https://democracia-por-promedio.onrender.com");
  const [showSettings, setShowSettings] = useState(false);
  const [view, setView] = useState("home"); // home | custom | explain | create | groupCreated | adminReturn | join | connected
  const [groupCode, setGroupCode] = useState("");
  const [memberId, setMemberId] = useState("");
  const [createdGroupName, setCreatedGroupName] = useState("");
  const [urlCode, setUrlCode] = useState("");
  const [entryPurpose, setEntryPurpose] = useState(null); // null | "cuotas"

  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const member = params.get("member");
    if (code && member) {
      // Link de sesión propia (admin o miembro ya identificado): entra directo, sin pedir nada.
      setGroupCode(code);
      setMemberId(member);
      setView("connected");
    } else if (code) {
      // Link de invitación compartido: pide nombre antes de unirse.
      setUrlCode(code);
      setView("join");
    }
  }, []);

  const persistSession = (code, member) => {
    const url = `${window.location.pathname}?code=${code}&member=${member}`;
    window.history.replaceState(null, "", url);
  };

  const clearSession = () => {
    window.history.replaceState(null, "", window.location.pathname);
  };

  return (
    <div className="min-h-screen flex justify-center py-8 px-3" style={{ background: PAGE_BG }}>
      <div className="w-full max-w-[420px] rounded-[32px] overflow-hidden shadow-xl" style={{ background: PAGE_BG, border: `1px solid ${BLUE}33` }}>
        <div className="px-6 pt-7 pb-5" style={{ background: WARM_WHITE }}>
          <div
            className="dp-body inline-block text-[10px] font-semibold tracking-wide px-2.5 py-1 rounded-full mb-2.5"
            style={{ background: BLUE_SOFT, color: INK + "aa" }}
          >
            D×% · DEMOCRACIA POR PROMEDIO
          </div>
          <h1 className="dp-display text-2xl font-bold leading-tight" style={{ color: INK }}>Organízate y decide</h1>
          <div className="dp-body text-[12px] mt-2.5 leading-relaxed" style={{ color: INK + "99" }}>
            {["Arma tu grupo", "Escribe las preguntas", "Elige el proceso", "Envía a tu grupo", "¡Decidan juntos!"].map((f, i, arr) => (
              <React.Fragment key={i}>
                <span>{f}</span>
                {i < arr.length - 1 && <span style={{ color: BLUE, margin: "0 4px" }}>→</span>}
              </React.Fragment>
            ))}
          </div>
        </div>

        {view === "home" && (
          <HomeScreen
            onChooseExplain={() => setView("explain")}
            onChooseCustom={() => {
              setEntryPurpose(null);
              setView("custom");
            }}
            onChooseCuotas={() => {
              setEntryPurpose("cuotas");
              setView("custom");
            }}
            onChoosePresupuesto={() => {
              setEntryPurpose("presupuesto");
              setView("custom");
            }}
            onChooseAsociaciones={() => {
              setEntryPurpose("asociaciones");
              setView("custom");
            }}
          />
        )}
        {view === "custom" && (
          <CustomEntryScreen
            onBack={() => setView("home")}
            onChooseCreate={() => setView("create")}
            onChooseAdminReturn={() => setView("adminReturn")}
            onChooseJoin={() => setView("join")}
          />
        )}
        {view === "explain" && <ExplanationScreen onBack={() => setView("home")} />}
        {view === "create" && (
          <CreateGroupScreen
            backendUrl={backendUrl}
            onBack={() => setView("custom")}
            onCreated={async ({ code, memberId, groupName }) => {
              setGroupCode(code);
              setMemberId(memberId);
              setCreatedGroupName(groupName);
              persistSession(code, memberId);
              if (entryPurpose === "cuotas" || entryPurpose === "presupuesto") {
                await fetch(`${backendUrl}/api/groups/${code}/flows`, {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ template: entryPurpose, memberId }),
                });
              } else if (entryPurpose === "asociaciones") {
                await fetch(`${backendUrl}/api/groups/${code}/flows`, {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ template: "cuotas", memberId, chainNext: "presupuesto" }),
                });
              }
              setView("groupCreated");
            }}
          />
        )}
        {view === "groupCreated" && (
          <GroupCreatedScreen
            groupName={createdGroupName}
            code={groupCode}
            onContinue={() => setView("connected")}
          />
        )}
        {view === "adminReturn" && (
          <AdminReturnScreen
            backendUrl={backendUrl}
            onBack={() => setView("custom")}
            onEntered={({ code, memberId }) => {
              setGroupCode(code);
              setMemberId(memberId);
              persistSession(code, memberId);
              setView("connected");
            }}
          />
        )}
        {view === "join" && (
          <JoinGroupScreen
            backendUrl={backendUrl}
            initialCode={urlCode}
            onBack={() => setView("custom")}
            onJoined={({ code, memberId }) => {
              setGroupCode(code);
              setMemberId(memberId);
              persistSession(code, memberId);
              setView("connected");
            }}
          />
        )}
        {view === "connected" && (
          <ConnectedScreen
            backendUrl={backendUrl}
            groupCode={groupCode}
            memberId={memberId}
            onExit={() => {
              setGroupCode("");
              setMemberId("");
              setEntryPurpose(null);
              clearSession();
              setView("home");
            }}
          />
        )}

        <div className="px-4 pb-4">
          <button
            onClick={() => setShowSettings(!showSettings)}
            className="dp-body text-[10px]"
            style={{ color: INK + "55" }}
          >
            servidor: {backendUrl} {showSettings ? "▲" : "▼"}
          </button>
          {showSettings && (
            <input
              value={backendUrl}
              onChange={(e) => setBackendUrl(e.target.value)}
              className="dp-mono w-full mt-1.5 rounded-lg px-2.5 py-1.5 text-xs outline-none"
              style={{ background: BLUE_SOFT, color: INK }}
            />
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<DemocraciaPorPromedioConectada />);
</script>
</body>
</html>
