        const confirmMerge = (primary) => {
          const aliases = selectedForMerge.filter((n) => n !== primary);
          setMergeGroups([...mergeGroups, { primary, aliases }]);
          setSelectedForMerge([]);
          setChoosingPrimaryFor(null);
        };
        return (
          <div className="rounded-xl p-3.5" style={{ background: BLUE_SOFT }}>
            <div className="dp-body text-[14px] mb-2" style={{ color: INK }}>{stage.text}</div>
            {isAdmin ? (
              <React.Fragment>
                {mergeGroups.length > 0 && (
                  <div className="mb-3">
                    <div className="dp-body text-[11px] font-medium mb-1.5" style={{ color: INK }}>Ya fusionados:</div>
                    {mergeGroups.map((g, i) => (
                      <div key={i} className="flex items-center justify-between rounded-lg p-2 mb-1.5" style={{ background: "#fff" }}>
                        <span className="dp-body text-xs" style={{ color: INK }}>
                          {g.primary} <span style={{ color: INK + "77" }}>({g.aliases.join(", ")})</span>
                        </span>
                        <button onClick={() => setMergeGroups(mergeGroups.filter((_, idx) => idx !== i))} className="dp-body text-xs" style={{ color: CORAL }}>deshacer</button>
                      </div>
                    ))}
                  </div>
                )}
                {choosingPrimaryFor ? (
                  <div className="mb-3">
                    <div className="dp-body text-[11px] font-medium mb-1.5" style={{ color: INK }}>¿Cuál es el nombre correcto?</div>
                    {choosingPrimaryFor.map((name) => (
                      <button
                        key={name}
                        onClick={() => confirmMerge(name)}
                        className="dp-body block w-full text-left text-xs px-3 py-2 rounded-lg mb-1.5"
                        style={{ background: "#fff", color: INK, border: `1.5px solid ${BLUE}55` }}
                      >
                        {name}
                      </button>
                    ))}
                    <button onClick={() => setChoosingPrimaryFor(null)} className="dp-body text-xs" style={{ color: INK + "77" }}>cancelar</button>
                  </div>
                ) : (
                  <React.Fragment>
                    <div className="dp-body text-[11px] font-medium mb-1.5" style={{ color: INK }}>
                      Marca 2 o más nombres que sean la misma persona:
                    </div>
                    {available.map((c) => (
                      <label key={c} className="flex items-center gap-2 mb-1.5">
                        <input type="checkbox" checked={selectedForMerge.includes(c)} onChange={() => toggleSelect(c)} />
                        <span className="dp-body text-sm" style={{ color: INK }}>{c}</span>
                      </label>
                    ))}
                    {selectedForMerge.length >= 2 && (
                      <button
                        onClick={() => setChoosingPrimaryFor(selectedForMerge)}
                        className="dp-body text-xs font-medium mb-3"
                        style={{ color: BLUE }}
                      >
                        Fusionar los {selectedForMerge.length} seleccionados →
                      </button>
                    )}
                  </React.Fragment>
                )}
                {sendError && <div className="dp-body text-[11px] mb-2" style={{ color: CORAL }}>{sendError}</div>}
                <button
                  onClick={async () => {
                    await submitAndClose(mergeGroups);
                    setMergeGroups([]);
                    setSelectedForMerge([]);
                  }}
                  disabled={sending}
                  className="dp-body w-full text-xs py-2 rounded-full text-white font-medium disabled:opacity-40"
                  style={{ background: GREEN }}
                >
                  {sending ? "Guardando…" : mergeGroups.length > 0 ? "Guardar y continuar" : "No hay nombres repetidos, continuar"}
                </button>
              </React.Fragment>
            ) : (
              <div className="dp-body text-[13px] text-center py-3" style={{ color: INK + "88" }}>⏳ El facilitador está revisando la lista de candidatos…</div>
            )}
          </div>
        );
      })()}

      {stage && !["conteo_miembros", "configurar_puestos", "configurar_candidatos", "realizar_sorteo", "gastos_fijos", "fusionar_candidatos"].includes(stage.type) && (
        <div>
          <div className="dp-body text-[14px] mb-1" style={{ color: INK }}>{stage.text}</div>
          <div className="dp-body text-[11px] mb-2" style={{ color: INK + "88" }}>
            {liveCount} de {approvedMemberCount} miembro(s) han respondido
          </div>
          <StageInput key={stage.key} stage={stage} onSend={sendResponse} sending={sending} disabled={sent} flowConfig={{ ...flow.config, totalBudget: effectiveTotalBudget }} approvedMemberNames={approvedMemberNames} />
          {sent && <div className="dp-body text-[11px] mb-2 flex items-center gap-1" style={{ color: GREEN }}><i className="ti ti-circle-check"></i>Guardado</div>}
          {sendError && <div className="dp-body text-[11px] mb-2" style={{ color: CORAL }}>{sendError}</div>}
          {isAdmin && (
            <button
              onClick={closeStage}
              disabled={closingStage}
              className="dp-body w-full text-xs py-2 rounded-full text-white font-medium disabled:opacity-40"
              style={{ background: BLUE }}
            >
              <i className="ti ti-lock" style={{ marginRight: "4px" }}></i>{closingStage ? "Cerrando…" : "Cerrar etapa y avanzar"}
            </button>
          )}
        </div>
      )}

      {flow.licitacion && (
        <LicitacionPanel
          backendUrl={backendUrl}
          groupCode={groupCode}
          memberId={memberId}
          flow={flow}
          isAdmin={isAdmin}
          onAdvance={onAdvance}
          onSwitchFlow={onSwitchFlow}
        />
      )}

      {flow.status === "finished" && (
        <div className="mb-3">
          <div className="dp-body text-[12px] mb-2" style={{ color: GREEN }}>
            <i className="ti ti-circle-check" style={{ marginRight: "4px" }}></i>Flujo completo — si dejaste tu correo, ahí te llega el resumen.
          </div>
          {(() => {
            const nextFlow = (allFlows || []).find((f) => f.chainedFromFlowId === flow.id);
            if (nextFlow && onSwitchFlow) {
              return (
                <button
                  onClick={() => onSwitchFlow(nextFlow.id)}
                  className="dp-body text-xs px-3 py-2 rounded-full text-white font-medium"
                  style={{ background: BLUE }}
                >
                  Continuar hacia: {flowTemplateLabel(nextFlow.template)} →
                </button>
              );
            }
            if (!flow.chainNext && cooperativasMode && onFinishedStandalone) {
              return (
                <button
                  onClick={() => onFinishedStandalone()}
                  className="dp-body text-xs px-3 py-2 rounded-full text-white font-medium"
                  style={{ background: BLUE }}
                >
                  ¿Hacer otro proceso? →
                </button>
              );
            }
            return null;
          })()}
        </div>
      )}

      {showCelebration && (justApproved || flow.status === "finished") && (
        <div className="fixed inset-0 flex items-start justify-center p-4 py-10 overflow-y-auto" style={{ background: "rgba(32,48,43,0.55)", zIndex: 50 }}>
          <div className="rounded-2xl p-5 max-w-[320px] w-full shadow-xl" style={{ background: WARM_WHITE }}>
            <div className="flex justify-end mb-1">
              <button onClick={() => setShowCelebration(false)} className="dp-body text-sm" style={{ color: INK + "77" }}><i className="ti ti-x"></i></button>
            </div>
            <div className="text-center mb-3">
              <div style={{ fontSize: "36px" }}><i className="ti ti-confetti" style={{ color: GREEN }}></i></div>
              <div className="dp-display text-lg font-bold mt-1" style={{ color: INK }}>¡Felicidades!</div>
              <div className="dp-body text-[13px] mt-1" style={{ color: INK + "99" }}>
                Decidieron {{
                  cuotas: "las cuotas",
                  presupuesto: "el presupuesto",
                  tabuladorSueldos: "los sueldos",
                  presupuestoCooperativa: "el presupuesto",
                  responsabilidades: "los responsables",
                }[flow.template] || "el resultado"} de forma colectiva.
              </div>
            </div>
            {(() => {
              const finalStage = [...flow.stages].reverse().find((s) => s.key === "quotas" || s.key === "singleQuota" || s.key === "budget" || s.key === "montoPorPuesto");
              if (!finalStage && !flow.licitacion) return null;
              return (
                <div className="rounded-lg p-3" style={{ background: BLUE_SOFT }}>
                  {finalStage && <BigDecisionDisplay stage={finalStage} />}
                  <LicitacionResultsDisplay flow={flow} />
                </div>
              );
            })()}
            <button
              onClick={() => {
                setShowCelebration(false);
                if (flow.status === "finished" && flow.chainNext && onSwitchFlow) {
                  const nextFlow = (allFlows || []).find((f) => f.chainedFromFlowId === flow.id);
                  if (nextFlow) onSwitchFlow(nextFlow.id);
                } else if (flow.status === "finished" && !flow.chainNext && cooperativasMode && onFinishedStandalone) {
                  onFinishedStandalone();
                }
              }}
              className="dp-body w-full mt-3 text-xs py-2.5 rounded-full text-white font-medium"
              style={{ background: BLUE }}
            >
              {nextStepLabel ? `Continuar hacia: ${nextStepLabel}` : flow.status === "finished" && !flow.chainNext && cooperativasMode ? "Continuar" : "Ver todo el proceso"}
            </button>
            {onDownloadPdf && (
              <button
                onClick={() => onDownloadPdf()}
                className="dp-body w-full mt-2 text-xs py-2 rounded-full font-medium"
                style={{ border: `1.5px solid ${BLUE}55`, color: BLUE, background: "#fff" }}
              >
                ⬇ Descargar resultados (PDF)
              </button>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

function ConnectedScreen({ backendUrl, groupCode, memberId, onExit, onGroupNameChange, hideFlowStarters, cooperativasMode }) {
  const [group, setGroup] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");
  const [approving, setApproving] = useState("");
  const [pinnedFlowId, setPinnedFlowId] = useState(null);
  const [showCooperativasChooser, setShowCooperativasChooser] = useState(false);
  const [generatingPdf, setGeneratingPdf] = useState(false);
  const pdfContentRef = React.useRef(null);
  const prevPendingCount = React.useRef(null);

  const flows = group ? group.flows || [] : [];
  // Si venimos de "Selección de responsables" o de "Cooperativas" (sin
  // pasar por Asociaciones), solo nos interesan flujos de esos tipos —
  // así, un grupo reciclado que ya tuviera Cuotas o Presupuesto de
  // pruebas anteriores no se cuela aquí ni confunde la pantalla.
  const relevantFlows = hideFlowStarters
    ? flows.filter((f) => f.template === "responsabilidades")
    : cooperativasMode
    ? flows.filter((f) => ["tabuladorSueldos", "presupuestoCooperativa", "responsabilidades"].includes(f.template))
    : flows;
  const latestOrActive = [...relevantFlows].reverse().find((f) => f.status === "active") || relevantFlows[relevantFlows.length - 1];
  // Se muestra el flujo "fijado" (para que una tarjeta de felicidades o
  // resultado recién terminado no desaparezca de golpe si se encadena a
  // otro flujo) — solo se avanza al siguiente cuando el usuario lo pide
  // explícitamente (ej. el botón "Continuar hacia" de la celebración).
  React.useEffect(() => {
    if (!pinnedFlowId && latestOrActive) setPinnedFlowId(latestOrActive.id);
  }, [latestOrActive ? latestOrActive.id : null, pinnedFlowId]);

  const fetchGroup = async () => {
    setLoading(true);
    setError("");
    try {
      const res = await fetch(`${backendUrl}/api/groups/${groupCode}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Grupo no encontrado");
      setGroup(data);
      if (onGroupNameChange) onGroupNameChange(data.name);

      const isAdminNow = data.admin.id === memberId;
      const pendingCount = data.members.filter((m) => !m.approved).length;
      if (
        isAdminNow &&
        prevPendingCount.current !== null &&
        pendingCount > prevPendingCount.current &&
        typeof Notification !== "undefined" &&
        Notification.permission === "granted"
      ) {
        new Notification("Nueva solicitud pendiente", {
          body: `Alguien quiere unirse a "${data.name}". Entra a la app para aprobar o rechazar.`,
        });
      }
      prevPendingCount.current = pendingCount;
      return data;
    } catch (e) {
      setError(
        e.message === "Failed to fetch"
          ? "No se pudo conectar al backend. ¿Sigue corriendo npm start en tu terminal?"
          : e.message
      );
      return null;
    } finally {
      setLoading(false);
    }
  };

  React.useEffect(() => {
    if (generatingPdf && pdfContentRef.current) {
      generateResultsPdf(pdfContentRef.current, `${(group && group.name) || "resultados"}.pdf`)
        .catch((e) => customAlert("No se pudo generar el PDF: " + e.message))
        .finally(() => setGeneratingPdf(false));
    }
  }, [generatingPdf]);

  const downloadPdf = () => setGeneratingPdf(true);

  useEffect(() => {
    fetchGroup();
    const interval = setInterval(fetchGroup, 15000);
    if (typeof Notification !== "undefined" && Notification.permission === "default") {
      Notification.requestPermission();
    }
    return () => clearInterval(interval);
  }, []);

  const approve = async (id) => {
    setApproving(id);
    try {
      await fetch(`${backendUrl}/api/groups/${groupCode}/members/${id}/approve`, { method: "POST" });
      await fetchGroup();
    } catch (e) {
      setError(e.message);
    } finally {
      setApproving("");
    }
  };

  const reject = async (id) => {
    setApproving(id);
    try {
      await fetch(`${backendUrl}/api/groups/${groupCode}/members/${id}/reject`, { method: "POST" });
      await fetchGroup();
    } catch (e) {
      setError(e.message);
    } finally {
      setApproving("");
    }
  };

  if (loading && !group) {
    return <div className="dp-body text-sm text-center py-10" style={{ color: INK + "88" }}>Conectando…</div>;
  }
  if (error && !group) {
    return (
      <div className="px-4 py-6">
        <div className="dp-body text-[13px]" style={{ color: CORAL }}>{error}</div>
        <BackButton onClick={onExit} />
      </div>
    );
  }
  if (!group) return null;

  const me = group.members.find((m) => m.id === memberId);
  const isAdmin = group.admin.id === memberId;
  const activeFlow = relevantFlows.find((f) => f.id === pinnedFlowId) || latestOrActive;
  const pendingMembers = group.members.filter((m) => !m.approved);

  return (
    <div className="px-4 py-4">
      <div className="rounded-2xl p-4 mb-4" style={{ background: WARM_WHITE, border: `1px solid ${BLUE}33` }}>
        <div className="flex items-start justify-between">
          <div>
            <div className="dp-body text-sm font-semibold" style={{ color: INK }}>{group.name}</div>
            <div className="dp-mono text-xs mt-0.5" style={{ color: INK + "88" }}>código: {group.code}</div>
          </div>
          <button onClick={onExit} className="dp-body text-[11px]" style={{ color: INK + "77" }}>Salir</button>
        </div>
        <div className="dp-body text-[11px] mt-2" style={{ color: INK + "88" }}>
          {group.members.filter((m) => m.approved).length} miembro(s) aprobado(s)
          {isAdmin && " · eres el facilitador"}
        </div>
        {me && !me.approved && (
          <div className="dp-body text-[12px] mt-2 rounded-lg px-2.5 py-1.5" style={{ background: CORAL + "22", color: CORAL }}>
            Tu participación está pendiente de aprobación del facilitador.
          </div>
        )}
        {flows.length > 0 && (
          <div className="mt-2.5">
            <button
              onClick={downloadPdf}
              disabled={generatingPdf}
              className="dp-body text-[11px] px-3 py-1.5 rounded-full font-medium disabled:opacity-50"
              style={{ background: BLUE_SOFT, color: INK }}
            >
              {generatingPdf ? "Generando PDF…" : "⬇ Descargar resultados (PDF)"}
            </button>
          </div>
        )}
        {isAdmin && (
          <div className="mt-3 pt-3" style={{ borderTop: `1px solid ${BLUE}22` }}>
            <div className="dp-body text-xs font-medium mb-2" style={{ color: INK }}>
              Link directo para invitar usuarios a este grupo
            </div>
            <ShareGroup groupName={group.name} code={group.code} />
          </div>
        )}
      </div>

      {isAdmin && pendingMembers.length > 0 && (
        <div className="rounded-2xl p-4 mb-4" style={{ background: CORAL + "15", border: `1.5px solid ${CORAL}55` }}>
          <div className="dp-body text-xs font-semibold mb-2.5" style={{ color: CORAL }}>
            {pendingMembers.length} solicitud(es) pendiente(s)
          </div>
          <div className="flex flex-col gap-2">
            {pendingMembers.map((m) => (
              <div key={m.id} className="flex items-center justify-between">
                <span className="dp-body text-sm" style={{ color: INK }}>{m.name}</span>
                <div className="flex gap-1.5">
                  <button
                    onClick={() => approve(m.id)}
                    disabled={approving === m.id}
                    className="dp-body text-[11px] px-2.5 py-1.5 rounded-full text-white font-medium disabled:opacity-40"
                    style={{ background: GREEN }}
                  >
                    {approving === m.id ? "…" : "Aprobar"}
                  </button>
                  <button
                    onClick={() => reject(m.id)}
                    disabled={approving === m.id}
                    className="dp-body text-[11px] px-2.5 py-1.5 rounded-full font-medium disabled:opacity-40"
                    style={{ background: "#fff", color: CORAL, border: `1px solid ${CORAL}55` }}
                  >
                    Rechazar
                  </button>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {activeFlow && !showCooperativasChooser ? (
        <React.Fragment>
          {getFlowChain(activeFlow, flows)
            .slice(0, -1)
            .map((f) => (
              <PreviousFlowSummary key={f.id} flow={f} />
            ))}
          <FlowRunner
            key={activeFlow.id}
            backendUrl={backendUrl}
            groupCode={groupCode}
            memberId={memberId}
            flow={activeFlow}
            allFlows={flows}
            isAdmin={isAdmin}
            groupResponses={group.responses}
            approvedMemberCount={group.members.filter((m) => m.approved).length}
            approvedMemberNames={group.members.filter((m) => m.approved).map((m) => m.name)}
            onAdvance={fetchGroup}
            onSwitchFlow={setPinnedFlowId}
            cooperativasMode={cooperativasMode}
            onFinishedStandalone={() => setShowCooperativasChooser(true)}
            onDownloadPdf={downloadPdf}
          />
        </React.Fragment>
      ) : (
        isAdmin && !hideFlowStarters && !cooperativasMode && (
          <div className="flex flex-col gap-2 mb-4">
            <button
              onClick={async () => {
                await fetch(`${backendUrl}/api/groups/${groupCode}/flows`, {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ template: "cuotas", memberId }),
                });
                setPinnedFlowId(null);
                await fetchGroup();
              }}
              className="dp-body w-full text-left rounded-2xl p-4 shadow-sm"
              style={{ background: BLUE_SOFT, border: `1.5px solid ${BLUE}` }}
            >
              <div className="text-sm font-semibold mb-1 flex items-center gap-1.5" style={{ color: INK }}><i className="ti ti-coin"></i>Iniciar Cuotas participativas</div>
              <div className="text-xs" style={{ color: INK + "88" }}>
                Un flujo guiado de varias etapas para decidir las cuotas del grupo.
              </div>
            </button>
            <button
              onClick={async () => {
                await fetch(`${backendUrl}/api/groups/${groupCode}/flows`, {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ template: "presupuesto", memberId }),
                });
                setPinnedFlowId(null);
                await fetchGroup();
              }}
              className="dp-body w-full text-left rounded-2xl p-4 shadow-sm"
              style={{ background: BLUE_SOFT, border: `1.5px solid ${BLUE}` }}
            >
              <div className="text-sm font-semibold mb-1 flex items-center gap-1.5" style={{ color: INK }}><i className="ti ti-chart-pie"></i>Iniciar Presupuesto participativo</div>
              <div className="text-xs" style={{ color: INK + "88" }}>
                Un flujo guiado para decidir en qué se gasta el presupuesto del grupo.
              </div>
            </button>
            <button
              onClick={async () => {
                await fetch(`${backendUrl}/api/groups/${groupCode}/flows`, {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ template: "cuotas", memberId, chainNext: "presupuesto" }),
                });
                setPinnedFlowId(null);
                await fetchGroup();
              }}
              className="dp-body w-full text-left rounded-2xl p-4 shadow-sm"
              style={{ background: BLUE_SOFT, border: `1.5px solid ${BLUE}` }}
            >
              <div className="text-sm font-semibold mb-1 flex items-center gap-1.5" style={{ color: INK }}><i className="ti ti-building-community"></i>Iniciar Asociaciones (Cuotas + Presupuesto)</div>
              <div className="text-xs" style={{ color: INK + "88" }}>
                Corre los dos flujos, uno después del otro.
              </div>
            </button>
          </div>
        )
      )}

      {(!activeFlow || showCooperativasChooser) && cooperativasMode && (
        isAdmin ? (
          <div className="flex flex-col gap-2 mb-4">
            <div className="dp-body text-[12.5px] rounded-xl p-3 mb-1" style={{ background: BLUE_SOFT, color: INK + "cc", lineHeight: 1.5 }}>
              {showCooperativasChooser
                ? "¿Quieren hacer otro proceso con esta cooperativa?"
                : "Para facilitar la toma de decisiones eficiente en una cooperativa, combinamos Democracia por Promedio con procesos de mayoría y sorteo."}
            </div>
            <button
              onClick={async () => {
                await fetch(`${backendUrl}/api/groups/${groupCode}/flows`, {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ template: "tabuladorSueldos", memberId }),
                });
                setShowCooperativasChooser(false);
                setPinnedFlowId(null);
                await fetchGroup();
              }}
              className="dp-body w-full text-left rounded-2xl p-4 shadow-sm"
              style={{ background: BLUE_SOFT, border: `1.5px solid ${BLUE}` }}
            >
              <div className="text-sm font-semibold mb-1 flex items-center gap-1.5" style={{ color: INK }}><i className="ti ti-cash"></i>Tabulador de sueldos</div>
              <div className="text-xs" style={{ color: INK + "88" }}>
                Definan los puestos y decidan cuánto gana cada uno, con o sin límite de desigualdad.
              </div>
            </button>
            <button
              onClick={async () => {
                await fetch(`${backendUrl}/api/groups/${groupCode}/flows`, {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ template: "presupuestoCooperativa", memberId }),
                });
                setShowCooperativasChooser(false);
                setPinnedFlowId(null);
                await fetchGroup();
              }}
              className="dp-body w-full text-left rounded-2xl p-4 shadow-sm"
              style={{ background: BLUE_SOFT, border: `1.5px solid ${BLUE}` }}
            >
              <div className="text-sm font-semibold mb-1 flex items-center gap-1.5" style={{ color: INK }}><i className="ti ti-chart-pie"></i>Presupuesto participativo</div>
              <div className="text-xs" style={{ color: INK + "88" }}>
                Con gastos fijos que se pueden ajustar, y el resto repartido entre los rubros que propongan.
              </div>
            </button>
            <button
              onClick={async () => {
                await fetch(`${backendUrl}/api/groups/${groupCode}/flows`, {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ template: "responsabilidades", memberId }),
                });
                setShowCooperativasChooser(false);
                setPinnedFlowId(null);
                await fetchGroup();
              }}
              className="dp-body w-full text-left rounded-2xl p-4 shadow-sm"
              style={{ background: BLUE_SOFT, border: `1.5px solid ${BLUE}` }}
            >
              <div className="text-sm font-semibold mb-1 flex items-center gap-1.5" style={{ color: INK }}><i className="ti ti-dice-5"></i>Selección de responsables</div>
              <div className="text-xs" style={{ color: INK + "88" }}>
                Repartan cargos y responsabilidades por sorteo, con o sin rotación mensual.
              </div>
            </button>
            {showCooperativasChooser && (
              <button onClick={() => setShowCooperativasChooser(false)} className="dp-body text-xs mt-1" style={{ color: INK + "77" }}>
                No, ya terminamos por ahora
              </button>
            )}
          </div>
        ) : (
          <div className="dp-body text-[13px] text-center py-4" style={{ color: INK + "88" }}>⏳ El facilitador todavía no elige qué proceso iniciar…</div>
        )
      )}

      {!activeFlow && !cooperativasMode && (
        <React.Fragment>
          {isAdmin && <NewQuestionForm backendUrl={backendUrl} groupCode={groupCode} onAdded={fetchGroup} />}

          {group.questions.length === 0 && (
            <div className="dp-body text-xs text-center py-4" style={{ color: INK + "77" }}>
              Este grupo todavía no tiene preguntas.
            </div>
          )}

          {group.questions.map((q) =>
            q.type === "sorteo" ? (
              <SorteoRunner key={q.id} backendUrl={backendUrl} groupCode={groupCode} memberId={memberId} question={q} isAdmin={isAdmin} />
            ) : (
              <QuestionRunner
                key={q.id}
                backendUrl={backendUrl}
                groupCode={groupCode}
                memberId={memberId}
                question={q}
                isAdmin={isAdmin}
                groupResponses={group.responses}
                approvedMemberCount={group.members.filter((m) => m.approved).length}
              />
            )
          )}
        </React.Fragment>
      )}

      {generatingPdf && (
        <div style={{ position: "fixed", left: "-9999px", top: 0, zIndex: -1 }}>
          <div ref={pdfContentRef}>
            <PdfExportContent groupName={group.name} flowChain={flows.filter((f) => f.stages.length > 0)} showNames={group.secretResponses === false} />
          </div>
        </div>
      )}
    </div>
  );
}

function MyGroupsScreen({ backendUrl, userId, onBack, onEnterGroup, onGoJoin, onGoCreate }) {
  const [groups, setGroups] = useState(null);
  const [error, setError] = useState("");

  useEffect(() => {
    fetch(`${backendUrl}/api/my-groups?userId=${userId}`)
      .then((res) => (res.ok ? res.json() : Promise.reject(new Error("No se pudieron cargar tus grupos"))))
      .then((data) => setGroups(data.groups))
      .catch((e) => setError(e.message));
  }, [userId]);

  return (
    <div className="px-4 py-6">
      <BackButton onClick={onBack} />

      {error && <div className="dp-body text-[12px] mb-3" style={{ color: CORAL }}>{error}</div>}

      {groups === null && !error && (
        <div className="dp-body text-xs text-center py-6" style={{ color: INK + "77" }}>Cargando tus grupos…</div>
      )}

      {groups && groups.length === 0 && (
        <div className="dp-body text-xs text-center py-6" style={{ color: INK + "77" }}>
          Todavía no perteneces a ningún grupo con esta cuenta.
        </div>
      )}

      {groups && groups.map((g) => (
        <button
          key={g.code}
          onClick={() => onEnterGroup(g)}
          className="dp-body w-full text-left rounded-2xl p-3.5 mb-2 flex items-center justify-between"
          style={{ background: WARM_WHITE, border: `1px solid ${BLUE}33` }}
        >
          <div>
            <div className="text-sm font-semibold" style={{ color: INK }}>{g.name}</div>
            <div className="dp-mono text-[10px] mt-0.5" style={{ color: INK + "77" }}>{g.code}</div>
          </div>
          <span
            className="dp-body text-[9px] font-semibold px-2 py-1 rounded-full"
            style={g.isAdmin ? { background: GREEN + "22", color: GREEN } : { background: BLUE_SOFT, color: BLUE }}
          >
            {g.isAdmin ? "ADMINISTRAS" : "PARTICIPAS"}
          </span>
        </button>
      ))}

      <button
        onClick={onGoJoin}
        className="dp-body w-full text-left rounded-2xl p-3.5 mb-2 mt-2"
        style={{ background: "none", border: `1.5px dashed ${BLUE}55`, color: BLUE }}
      >
        <i className="ti ti-door-enter" style={{ marginRight: "6px" }}></i>Unirme a otro grupo con un código
      </button>
      <button
        onClick={onGoCreate}
        className="dp-body w-full text-left rounded-2xl p-3.5"
        style={{ background: "none", border: `1.5px dashed ${BLUE}55`, color: BLUE }}
      >
        <i className="ti ti-plus" style={{ marginRight: "6px" }}></i>Crear un grupo nuevo
      </button>
    </div>
  );
}

function LoginScreen({ onBack }) {
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [sending, setSending] = useState(false);
  const [sent, setSent] = useState(false);
  const [error, setError] = useState("");

  const sendLink = async () => {
    if (!email.trim() || !name.trim()) return;
    setSending(true);
    setError("");
    try {
      const { error: sendError } = await supabaseClient.auth.signInWithOtp({
        email: email.trim(),
        options: {
          emailRedirectTo: window.location.origin + window.location.pathname,
          data: { name: name.trim() },
        },
      });
      if (sendError) throw sendError;
      setSent(true);
    } catch (e) {
      setError(e.message || "No se pudo enviar el link. Intenta de nuevo.");
    } finally {
      setSending(false);
    }
  };

  if (sent) {
    return (
      <div className="px-4 py-6">
        <div className="rounded-2xl p-5 text-center" style={{ background: WARM_WHITE, border: `1px solid ${BLUE}33` }}>
          <i className="ti ti-mail-opened" style={{ fontSize: "32px", color: BLUE }}></i>
          <div className="dp-display text-base font-semibold mt-2 mb-1.5" style={{ color: INK }}>Revisa tu correo</div>
          <div className="dp-body text-[13px] leading-relaxed" style={{ color: INK + "99" }}>
            Te mandamos un link a<br /><b style={{ color: INK }}>{email}</b><br />ábrelo para entrar — no hace falta contraseña.
          </div>
          <div className="rounded-lg p-2.5 mt-3 text-left" style={{ background: CORAL + "15" }}>
            <span className="dp-body text-[11px]" style={{ color: CORAL }}>
              <i className="ti ti-alert-triangle" style={{ marginRight: "4px" }}></i>Cuida ese link — es tu forma de entrar a tu cuenta. No lo compartas ni lo borres hasta haber entrado.
            </span>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="px-4 py-6">
      <BackButton onClick={onBack} />
      <div className="rounded-2xl p-4" style={{ background: WARM_WHITE, border: `1px solid ${BLUE}33` }}>
        <div className="dp-body text-sm font-medium mb-1" style={{ color: INK }}>Iniciar sesión</div>
        <p className="dp-body text-[12px] mb-3" style={{ color: INK + "88" }}>
          Con tu cuenta vas a poder entrar a todos tus grupos (donde administras o participas) desde un solo lugar, en cualquier dispositivo. Cuando crees un grupo o te unas a uno, tu nombre y correo ya van a estar llenos.
        </p>
        <div className="flex flex-col gap-2.5">
          <Field label="Tu nombre" value={name} onChange={setName} placeholder="ej. Luis" />
          <Field label="Tu correo" value={email} onChange={setEmail} placeholder="ej. luis@correo.com" type="email" />
        </div>
        <div className="mt-3">
          <PrimaryButton onClick={sendLink} disabled={sending || !email.trim() || !name.trim()}>
            {sending ? "Enviando…" : "Enviarme un link para entrar"}
          </PrimaryButton>
        </div>
        {error && <div className="dp-body text-[12px] mt-2" style={{ color: CORAL }}>{error}</div>}
      </div>
    </div>
  );
}

function DemocraciaPorPromedioConectada() {
  const [backendUrl, setBackendUrl] = useState("https://democracia-por-promedio.onrender.com");
  const [showSettings, setShowSettings] = useState(false);
  const [view, setView] = useState("home"); // home | login | myGroups | custom | explain | create | groupCreated | adminReturn | join | connected
  const [groupCode, setGroupCode] = useState("");
  const [memberId, setMemberId] = useState("");
  const [createdGroupName, setCreatedGroupName] = useState("");
  const [urlCode, setUrlCode] = useState("");
  const [entryPurpose, setEntryPurpose] = useState(null); // null | "cuotas"
  const [selectedOption, setSelectedOption] = useState(null); // null | "explain" | "custom" | "cuotas" | "presupuesto" | "asociaciones"
  const [connectedGroupName, setConnectedGroupName] = useState("");
  const [session, setSession] = useState(null);
  const [showWelcome, setShowWelcome] = useState(false);

  const closeWelcome = () => {
    localStorage.setItem("org_onboarding_seen", "true");
    setShowWelcome(false);
  };

  useEffect(() => {
    supabaseClient.auth.getSession().then(({ data }) => {
      setSession(data.session);
      // Solo se muestra la bienvenida si no hay sesión iniciada Y nunca
      // se ha visto antes en este navegador.
      if (!data.session && !localStorage.getItem("org_onboarding_seen")) {
        setShowWelcome(true);
      }
    });
    const { data: listener } = supabaseClient.auth.onAuthStateChange((event, newSession) => {
      setSession(newSession);
      if (newSession) setShowWelcome(false);
      if (event === "SIGNED_IN" && window.location.hash.includes("access_token")) {
        window.history.replaceState({}, "", window.location.pathname + window.location.search);
      }
    });
    return () => listener.subscription.unsubscribe();
  }, []);

  const OPTION_TITLES = {
    explain: "Explicación y ejemplos",
    custom: "Crea tu grupo y tus propias preguntas",
    cuotas: "Cuotas participativas",
    presupuesto: "Presupuestos participativos",
    asociaciones: "Asociaciones, clubes y orgs",
    responsables: "Selección de responsables",
    municipios: "Municipios o países",
    cooperativas: "Cooperativas",
  };
  const STEP_CHAINS = {
    default: ["Arma tu grupo", "Escribe las preguntas", "Elige el proceso", "Envía a tu grupo", "¡Decidan juntos!"],
    responsables: ["Arma tu grupo", "Define los cargos", "Agrega candidatos", "Sortea", "¡Responsable elegido!"],
    cuotas: ["Arma tu grupo", "Decidan las categorías", "Propongan la cuota", "Aprueben el resultado", "¡Cobren juntos!"],
    presupuesto: ["Arma tu grupo", "Propongan categorías", "Repartan el %", "Aprueben el resultado", "¡Gasten juntos!"],
    asociaciones: ["Arma tu grupo", "Decidan las cuotas", "Repartan el presupuesto", "Propongan proyectos", "¡Decidan juntos!"],
    municipios: ["Impuestos", "Presupuesto", "Otras preguntas"],
    cooperativas: ["Arma tu grupo", "Elige un proceso", "Decidan juntos", "¡Listo!"],
  };
  const HOME_TAGLINE = "¿Cuánto tenemos que pagar? ¿En qué usamos los recursos? ¿Quién tiene qué responsabilidades? — Decidan juntos, con procesos horizontales, rápidos y efectivos, sin darle poder a nadie y sin dividir al grupo.";
  const headerTitle = connectedGroupName || OPTION_TITLES[selectedOption] || "Organicen y decidan";
  const sessionName = session ? (session.user.user_metadata && session.user.user_metadata.name) || "" : "";
  const sessionEmail = session ? session.user.email : "";
  const isHomeHeader = !connectedGroupName && !selectedOption;
  const headerSteps = STEP_CHAINS[selectedOption] || STEP_CHAINS.default;

  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const member = params.get("member");
    if (code && member) {
      // Link de sesión propia (admin o miembro ya identificado): entra directo, sin pedir nada.
      setGroupCode(code);
      setMemberId(member);
      setView("connected");
    } else if (code) {
      // Link de invitación compartido: pide nombre antes de unirse.
      setUrlCode(code);
      setView("join");
    }
  }, []);

  const persistSession = (code, member) => {
    const url = `${window.location.pathname}?code=${code}&member=${member}`;
    window.history.replaceState(null, "", url);
  };

  const clearSession = () => {
    window.history.replaceState(null, "", window.location.pathname);
  };

  return (
    <div className="min-h-screen flex justify-center py-8 px-3" style={{ background: PAGE_BG }}>
      <div className="w-full max-w-[420px] rounded-[32px] overflow-hidden shadow-xl" style={{ background: PAGE_BG, border: `1px solid ${BLUE}33` }}>
        <div className="px-6 pt-7 pb-5" style={{ background: WARM_WHITE }}>
          <div className="flex items-center justify-between mb-2.5">
            {!isHomeHeader && (
              <div
                className="dp-body inline-block text-[10px] font-semibold tracking-wide px-2.5 py-1 rounded-full"
                style={{ background: BLUE_SOFT, color: INK + "aa" }}
              >
                ORGANICEN Y DECIDAN
              </div>
            )}
            {view === "home" && (
              session ? (
                <div className="flex flex-col items-start gap-1">
                  <span className="dp-body text-[10px]" style={{ color: INK + "88" }}>
                    <i className="ti ti-user-circle" style={{ marginRight: "3px" }}></i>{session.user.email}
                  </span>
                  <button
                    onClick={() => setView("myGroups")}
                    className="dp-body flex items-center gap-1 text-[10px] font-semibold px-2.5 py-1 rounded-full"
                    style={{ background: BLUE_SOFT, color: BLUE }}
                  >
                    <i className="ti ti-users-group" style={{ fontSize: "11px" }}></i>Mis grupos
                  </button>
                </div>
              ) : isHomeHeader ? (
                <button onClick={() => setView("login")} className="dp-body text-[10px] font-semibold" style={{ color: BLUE }}>
                  <i className="ti ti-login" style={{ marginRight: "3px" }}></i>Iniciar sesión
                </button>
              ) : null
            )}
          </div>
          <h1 className="dp-display text-2xl font-bold leading-tight" style={{ color: INK }}>{headerTitle}</h1>
          <div className="dp-body text-[12px] mt-2.5 leading-relaxed" style={{ color: INK + "99" }}>
            {isHomeHeader ? (
              <span>{HOME_TAGLINE}</span>
            ) : (
              headerSteps.map((f, i, arr) => (
                <React.Fragment key={i}>
                  <span>{f}</span>
                  {i < arr.length - 1 && <span style={{ color: BLUE, margin: "0 4px" }}>→</span>}
                </React.Fragment>
              ))
            )}
          </div>
        </div>

        {view === "login" && <LoginScreen onBack={() => setView("home")} />}

        {view === "myGroups" && session && (
          <MyGroupsScreen
            backendUrl={backendUrl}
            userId={session.user.id}
            onBack={() => setView("home")}
            onEnterGroup={(g) => {
              setGroupCode(g.code);
              setMemberId(g.memberId);
              persistSession(g.code, g.memberId);
              setView("connected");
            }}
            onGoJoin={() => {
              setSelectedOption("custom");
              setView("join");
            }}
            onGoCreate={() => {
              setSelectedOption("custom");
              setEntryPurpose(null);
              setView("create");
            }}
          />
        )}

        {view === "home" && (
          <HomeScreen
            onChooseExplain={() => {
              setSelectedOption("explain");
              setView("explain");
            }}
            onChooseCustom={() => {
              setEntryPurpose(null);
              setSelectedOption("custom");
              setView("custom");
            }}
            onChooseCuotas={() => {
              setEntryPurpose("cuotas");
              setSelectedOption("cuotas");
              setView("custom");
            }}
            onChoosePresupuesto={() => {
              setEntryPurpose("presupuesto");
              setSelectedOption("presupuesto");
              setView("custom");
            }}
            onChooseAsociaciones={() => {
              setEntryPurpose("asociaciones");
              setSelectedOption("asociaciones");
              setView("custom");
            }}
            onChooseResponsables={() => {
              setEntryPurpose("responsabilidades");
              setSelectedOption("responsables");
              setView("custom");
            }}
            onChooseMunicipios={() => {
              setSelectedOption("municipios");
              setView("municipios");
            }}
            onChooseCooperativas={() => {
              setEntryPurpose(null);
              setSelectedOption("cooperativas");
              setView("custom");
            }}
          />
        )}
        {view === "municipios" && (
          <MunicipiosDemo
            onBack={() => {
              setSelectedOption(null);
              setView("home");
            }}
          />
        )}
        {view === "custom" && (
          <CustomEntryScreen
            onBack={() => {
              setSelectedOption(null);
              setView("home");
            }}
            onChooseCreate={() => setView("create")}
            onChooseAdminReturn={() => setView("adminReturn")}
            onChooseJoin={() => setView("join")}
          />
        )}
        {view === "explain" && (
          <ExplanationScreen
            onBack={() => {
              setSelectedOption(null);
              setView("home");
            }}
          />
        )}
        {view === "create" && (
          <CreateGroupScreen
            backendUrl={backendUrl}
            onBack={() => setView("custom")}
            prefillName={sessionName}
            prefillEmail={sessionEmail}
            userId={session ? session.user.id : null}
            onCreated={async ({ code, memberId, groupName }) => {
              setGroupCode(code);
              setMemberId(memberId);
              setCreatedGroupName(groupName);
              persistSession(code, memberId);
              if (entryPurpose === "cuotas" || entryPurpose === "presupuesto" || entryPurpose === "responsabilidades") {
                await fetch(`${backendUrl}/api/groups/${code}/flows`, {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ template: entryPurpose, memberId }),
                });
              } else if (entryPurpose === "asociaciones") {
                await fetch(`${backendUrl}/api/groups/${code}/flows`, {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ template: "cuotas", memberId, chainNext: "presupuesto" }),
                });
              }
              setView("groupCreated");
            }}
          />
        )}
        {view === "groupCreated" && (
          <GroupCreatedScreen
            groupName={createdGroupName}
            code={groupCode}
            onContinue={() => setView("connected")}
          />
        )}
        {view === "adminReturn" && (
          <AdminReturnScreen
            backendUrl={backendUrl}
            onBack={() => setView("custom")}
            onEntered={({ code, memberId }) => {
              setGroupCode(code);
              setMemberId(memberId);
              persistSession(code, memberId);
              setView("connected");
            }}
          />
        )}
        {view === "join" && (
          <JoinGroupScreen
            backendUrl={backendUrl}
            initialCode={urlCode}
            onBack={() => setView("custom")}
            prefillName={sessionName}
            prefillEmail={sessionEmail}
            userId={session ? session.user.id : null}
            onJoined={({ code, memberId }) => {
              setGroupCode(code);
              setMemberId(memberId);
              persistSession(code, memberId);
              setView("connected");
            }}
          />
        )}
        {view === "connected" && (
          <ConnectedScreen
            backendUrl={backendUrl}
            groupCode={groupCode}
            memberId={memberId}
            onGroupNameChange={setConnectedGroupName}
            hideFlowStarters={selectedOption === "responsables"}
            cooperativasMode={selectedOption === "cooperativas"}
            onExit={() => {
              setGroupCode("");
              setMemberId("");
              setEntryPurpose(null);
              setSelectedOption(null);
              setConnectedGroupName("");
              clearSession();
              setView("home");
            }}
          />
        )}

        <div className="px-4 pb-4">
          <button
            onClick={() => setShowSettings(!showSettings)}
            className="dp-body text-[10px]"
            style={{ color: INK + "55" }}
          >
            servidor: {backendUrl} {showSettings ? "▲" : "▼"}
          </button>
          {showSettings && (
            <input
              value={backendUrl}
              onChange={(e) => setBackendUrl(e.target.value)}
              className="dp-mono w-full mt-1.5 rounded-lg px-2.5 py-1.5 text-xs outline-none"
              style={{ background: BLUE_SOFT, color: INK }}
            />
          )}
        </div>
      </div>

      {showWelcome && view === "home" && <OnboardingCarousel slides={ONBOARDING_SLIDES} onClose={closeWelcome} overlay={true} />}
      <DialogHost />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<DemocraciaPorPromedioConectada />);
</script>
</body>
</html>
