function StageResultView({ stage }) {
  const [showDetails, setShowDetails] = useState(true);
  const r = stage.result;

  if (stage.type === "conteo_miembros") {
    if (r.skipped) {
      return <div className="dp-body text-xs" style={{ color: INK + "77" }}>El administrador omitió este paso.</div>;
    }
    return (
      <div className="dp-mono text-xs" style={{ color: INK + "99" }}>
        {Object.entries(r.memberCounts).map(([k, v]) => (
          <div key={k}>{k === "single" ? "Miembros" : k}: {v}</div>
        ))}
      </div>
    );
  }

  if (stage.type === "promedio") {
    return (
      <div>
        <DetailsToggle show={showDetails} onToggle={() => setShowDetails(!showDetails)} />
        {showDetails && (
          <React.Fragment>
            <div className="flex flex-wrap gap-1.5 mb-2">
              {r.sorted.map((v, i) => {
                const isTrimmed = i < r.trimmedCount || i >= r.sorted.length - r.trimmedCount;
                return (
                  <span
                    key={i}
                    className="dp-mono text-xs px-2 py-1 rounded-md"
                    style={isTrimmed ? { background: CORAL + "22", color: CORAL, textDecoration: "line-through" } : { background: "#fff", color: INK }}
                  >
                    {v}
                  </span>
                );
              })}
            </div>
            <div className="dp-mono text-xs mb-1" style={{ color: INK + "aa" }}>
              ({r.kept.join(" + ")}) ÷ {r.kept.length} = {r.average.toFixed(2)}
            </div>
          </React.Fragment>
        )}
        <div className="dp-mono text-xs font-semibold" style={{ color: BLUE }}>→ {r.average.toFixed(2)}</div>
        {r.totalCollected !== undefined && (
          <div className="dp-mono text-[11px] mt-1" style={{ color: GREEN }}>
            {r.memberCount} miembros × {r.average.toFixed(2)} = {formatMoney(r.totalCollected)} recaudados
          </div>
        )}
      </div>
    );
  }

  if (stage.type === "mayoria") {
    return (
      <div>
        <DetailsToggle show={showDetails} onToggle={() => setShowDetails(!showDetails)} />
        {showDetails && (
          <div className="mb-1">
            {r.tally.map((t) => (
              <OptionBar key={t.option} option={t.option} count={t.count} percent={t.percent} highlight={r.winner === t.option} />
            ))}
          </div>
        )}
        <div className="dp-mono text-xs font-semibold" style={{ color: r.winner ? GREEN : CORAL }}>→ {r.winner || "sin ganador"}</div>
      </div>
    );
  }

  if (stage.type === "recoleccion_abierta") {
    return (
      <div>
        <DetailsToggle show={showDetails} onToggle={() => setShowDetails(!showDetails)} />
        {showDetails && (
          <div className="dp-body text-[10px] mb-1.5" style={{ color: INK + "77" }}>
            {r.totalResponses} persona(s) propusieron {r.pool.length} nombre(s) distintos:
          </div>
        )}
        {showDetails && (
          <div className="flex flex-wrap gap-1">
            {r.pool.map((p) => (
              <span key={p.text} className="dp-mono text-[11px] px-2 py-0.5 rounded-md" style={{ background: BLUE_SOFT, color: INK }}>
                {p.text} ({p.count})
              </span>
            ))}
          </div>
        )}
      </div>
    );
  }

  if (stage.type === "ranking_multiganador") {
    const maxScore = Math.max(1, ...r.ranked.map((x) => x.score));
    return (
      <div>
        <DetailsToggle show={showDetails} onToggle={() => setShowDetails(!showDetails)} />
        {showDetails && (
          <div className="mb-1">
            {r.ranked.map((x) => (
              <OptionBar
                key={x.option}
                option={x.option}
                count={x.score}
                percent={Math.round((x.score / maxScore) * 1000) / 10}
                highlight={r.winners.includes(x.option)}
              />
            ))}
          </div>
        )}
        <div className="dp-mono text-xs font-semibold" style={{ color: GREEN }}>→ elegidas: {r.winners.join(", ")}</div>
      </div>
    );
  }

  if (stage.type === "promedio_por_categoria") {
    return (
      <div>
        <DetailsToggle show={showDetails} onToggle={() => setShowDetails(!showDetails)} />
        {Object.entries(r.categories).map(([cat, cr]) => (
          <div key={cat} className="mb-2.5">
            <div className="dp-body text-[11px] font-medium mb-1" style={{ color: INK }}>{cat}</div>
            {showDetails && (
              <React.Fragment>
                <div className="flex flex-wrap gap-1.5 mb-1">
                  {cr.sorted.map((v, i) => {
                    const isTrimmed = i < cr.trimmedCount || i >= cr.sorted.length - cr.trimmedCount;
                    return (
                      <span
                        key={i}
                        className="dp-mono text-xs px-2 py-0.5 rounded-md"
                        style={isTrimmed ? { background: CORAL + "22", color: CORAL, textDecoration: "line-through" } : { background: "#fff", color: INK }}
                      >
                        {v}
                      </span>
                    );
                  })}
                </div>
                <div className="dp-mono text-[11px] mb-1" style={{ color: INK + "aa" }}>
                  ({cr.kept.join(" + ")}) ÷ {cr.kept.length} = {cr.average.toFixed(2)}
                </div>
              </React.Fragment>
            )}
            <div className="dp-mono text-xs font-semibold" style={{ color: BLUE }}>→ {cr.average.toFixed(2)}</div>
            {cr.collected !== undefined && (
              <div className="dp-mono text-[11px]" style={{ color: GREEN }}>
                {cr.memberCount} miembros × {cr.average.toFixed(2)} = {formatMoney(cr.collected)}
              </div>
            )}
          </div>
        ))}
        {r.totalCollected !== undefined && r.totalCollected !== null && (
          <div className="flex justify-between pt-2 mt-1 dp-mono text-xs font-semibold" style={{ borderTop: `1px solid ${BLUE}33`, color: GREEN }}>
            <span>TOTAL RECAUDADO</span>
            <span>{formatMoney(r.totalCollected)}</span>
          </div>
        )}
      </div>
    );
  }

  if (stage.type === "seleccion_multiple") {
    return (
      <div>
        <DetailsToggle show={showDetails} onToggle={() => setShowDetails(!showDetails)} />
        {showDetails && (
          <div className="mb-1">
            {r.tally.map((t) => (
              <OptionBar key={t.option} option={t.option} count={t.count} percent={t.percent} highlight={false} />
            ))}
          </div>
        )}
      </div>
    );
  }

  if (stage.type === "porcentaje_por_categoria") {
    return (
      <div>
        <div className="mb-2.5">
          <PieChart data={Object.entries(r.categories).map(([cat, cr]) => ({ label: cat, value: cr.normalizedPercent }))} />
        </div>
        <DetailsToggle show={showDetails} onToggle={() => setShowDetails(!showDetails)} />
        {showDetails && r.wasNormalized && (
          <div className="dp-body text-[10px] mb-2" style={{ color: CORAL }}>
            La suma de promedios dio {r.rawSum}% — se ajustó proporcionalmente a 100%.
          </div>
        )}
        {Object.entries(r.categories).map(([cat, cr]) => (
          <div key={cat} className="mb-2">
            {showDetails && (
              <React.Fragment>
                <div className="dp-body text-[11px] font-medium mb-1" style={{ color: INK }}>{cat}</div>
                <div className="flex flex-wrap gap-1.5 mb-1">
                  {(cr.values || []).map((v, i) => (
                    <span key={i} className="dp-mono text-xs px-2 py-0.5 rounded-md" style={{ background: "#fff", color: INK }}>
                      {v}%
                    </span>
                  ))}
                </div>
                <div className="dp-mono text-[11px] mb-1" style={{ color: INK + "aa" }}>
                  ({(cr.values || []).join(" + ")}) ÷ {(cr.values || []).length} = {cr.rawAverage}%{r.wasNormalized ? ` → normalizado a ${cr.normalizedPercent}%` : ""}
                </div>
              </React.Fragment>
            )}
            <div className="flex justify-between dp-mono text-xs" style={{ color: INK }}>
              <span>{!showDetails ? cat : ""}</span>
              <span>
                <b style={{ color: BLUE }}>{cr.normalizedPercent}%</b>
                {cr.amount !== undefined && <span style={{ color: INK + "77" }}> · {formatMoney(cr.amount)}</span>}
              </span>
            </div>
          </div>
        ))}
      </div>
    );
  }

  return null;
}

function LicitacionCategoryCard({ backendUrl, groupCode, memberId, flowId, category, state, proposals, isAdmin, onAdvance }) {
  const [name, setName] = useState("");
  const [costType, setCostType] = useState("mensual");
  const [costAmount, setCostAmount] = useState("");
  const [description, setDescription] = useState("");
  const [links, setLinks] = useState([""]);
  const [sending, setSending] = useState(false);
  const [error, setError] = useState("");
  const [closingPhase, setClosingPhase] = useState(false);
  const [votedHere, setVotedHere] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [editValues, setEditValues] = useState({});

  const monthlyBudget = state.monthlyBudget;
  const costNum = Number(costAmount) || 0;
  const overCap = costType === "mensual" && monthlyBudget > 0 && costNum > monthlyBudget;
  const monthsPreview = costType === "total" && monthlyBudget > 0 && costNum > monthlyBudget ? Math.ceil(costNum / monthlyBudget) : null;

  const submitProposal = async () => {
    setSending(true);
    setError("");
    try {
      const res = await fetch(`${backendUrl}/api/groups/${groupCode}/flows/${flowId}/proposals`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          memberId, category, name, costType, costAmount: costNum,
          description, links: links.map((l) => l.trim()).filter(Boolean),
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Error al enviar");
      setName(""); setCostAmount(""); setDescription(""); setLinks([""]);
      await onAdvance();
    } catch (e) {
      setError(e.message);
    } finally {
      setSending(false);
    }
  };

  const saveEdit = async (proposalId) => {
    setSending(true);
    setError("");
    try {
      const v = editValues;
      const res = await fetch(`${backendUrl}/api/groups/${groupCode}/flows/${flowId}/proposals/${proposalId}/edit`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          memberId, name: v.name, costType: v.costType, costAmount: Number(v.costAmount),
          description: v.description, links: (v.links || "").split("\n").map((l) => l.trim()).filter(Boolean),
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Error al editar");
      setEditingId(null);
      await onAdvance();
    } catch (e) {
      setError(e.message);
    } finally {
      setSending(false);
    }
  };

  const closeThisCategory = async () => {
    const ok = window.confirm(`¿Cerrar la recepción de propuestas de "${category}"? Nadie más podrá mandar o editar propuestas de esta categoría después de esto.`);
    if (!ok) return;
    setClosingPhase(true);
    try {
      const res = await fetch(`${backendUrl}/api/groups/${groupCode}/flows/${flowId}/close-collecting`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ memberId, category }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Error al cerrar");
      await onAdvance();
    } catch (e) {
      setError(e.message);
    } finally {
      setClosingPhase(false);
    }
  };

  const vote = async (proposalId) => {
    setSending(true);
    setError("");
    try {
      const res = await fetch(`${backendUrl}/api/groups/${groupCode}/flows/${flowId}/bid-vote`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ memberId, category, proposalId }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Error al votar");
      setVotedHere(true);
    } catch (e) {
      setError(e.message);
    } finally {
      setSending(false);
    }
  };

  return (
    <div className="mb-4 pb-4" style={{ borderBottom: `1px dashed ${BLUE}33` }}>
      <div className="flex items-center justify-between mb-1.5">
        <div className="dp-body text-sm font-semibold" style={{ color: INK }}>{category}</div>
        {state.round > 1 && (
          <span className="dp-body text-[10px] font-semibold px-2 py-0.5 rounded-full" style={{ background: CORAL + "22", color: CORAL }}>
            ronda {state.round}
          </span>
        )}
      </div>

      {state.status === "collecting" && (
        <div>
          {state.round > 1 && (
            <div className="dp-body text-[11px] mb-2 p-2 rounded-lg" style={{ background: CORAL + "15", color: CORAL }}>
              {proposals.length > 0 ? "Empate en la ronda anterior — pueden editar sus propuestas o agregar nuevas antes de volver a votar." : "Esta categoría se quedó sin propuestas — ¡anímense a proponer algo!"}
            </div>
          )}
          {state.closesAt && <CountdownBadge closesAt={state.closesAt} closed={false} />}

          {proposals.map((p) => (
            <div key={p.id} className="rounded-lg p-2.5 mb-1.5" style={{ background: BLUE_SOFT }}>
              {editingId === p.id ? (
                <div>
                  <input
                    value={editValues.name ?? p.name}
                    onChange={(e) => setEditValues({ ...editValues, name: e.target.value })}
                    className="dp-body w-full rounded-lg px-2 py-1 text-sm outline-none mb-1.5"
                    style={{ background: "#fff", color: INK }}
                  />
                  <textarea
                    value={editValues.description ?? p.description}
                    onChange={(e) => setEditValues({ ...editValues, description: e.target.value })}
                    rows={2}
                    className="dp-body w-full resize-none rounded-lg px-2 py-1 text-sm outline-none mb-1.5"
                    style={{ background: "#fff", color: INK }}
                  />
                  <div className="flex gap-1.5">
                    <button
                      onClick={() => saveEdit(p.id)}
                      disabled={sending}
                      className="dp-body flex-1 text-xs py-1.5 rounded-full text-white font-medium"
                      style={{ background: GREEN }}
                    >
                      Guardar
                    </button>
                    <button
                      onClick={() => setEditingId(null)}
                      className="dp-body flex-1 text-xs py-1.5 rounded-full font-medium"
                      style={{ background: "#fff", color: INK, border: `1px solid ${BLUE}33` }}
                    >
                      Cancelar
                    </button>
                  </div>
                </div>
              ) : (
                <div>
                  <div className="dp-body text-sm font-medium" style={{ color: INK }}>{p.name}</div>
                  <div className="dp-body text-[11px]" style={{ color: INK + "77" }}>— {p.memberName}</div>
                  {p.description && <div className="dp-body text-[11px] mt-1" style={{ color: INK + "99" }}>{p.description}</div>}
                  {p.memberId === memberId && state.round > 1 && (
                    <button
                      onClick={() => { setEditingId(p.id); setEditValues({ name: p.name, description: p.description, costType: p.costType, costAmount: p.costAmount }); }}
                      className="dp-body text-[11px] font-medium mt-1"
                      style={{ color: BLUE }}
                    >
                      ✏️ editar mi propuesta
                    </button>
                  )}
                </div>
              )}
            </div>
          ))}

          <div className="rounded-lg p-2.5 mb-2" style={{ background: "#fff", border: `1px dashed ${BLUE}44` }}>
            <input
              value={name}
              onChange={(e) => setName(e.target.value)}
              placeholder="Nombre de la propuesta nueva"
              className="dp-body w-full rounded-lg px-2 py-1.5 text-sm outline-none mb-1.5"
              style={{ background: BLUE_SOFT, color: INK }}
            />
            <div className="flex gap-1.5 mb-1.5">
              {[{ key: "mensual", label: "Mensual" }, { key: "total", label: "Total" }].map((t) => (
                <button
                  key={t.key}
                  onClick={() => setCostType(t.key)}
                  className="dp-body text-xs px-3 py-1 rounded-full font-medium flex-1"
                  style={costType === t.key ? { background: BLUE, color: "#fff" } : { background: BLUE_SOFT, color: INK }}
                >
                  {t.label}
                </button>
              ))}
              <input
                type="number"
                value={costAmount}
                onChange={(e) => setCostAmount(e.target.value)}
                placeholder="costo"
                className="dp-mono flex-1 rounded-lg px-2 py-1 text-sm outline-none"
                style={{ background: BLUE_SOFT, color: INK }}
              />
            </div>
            {monthlyBudget > 0 && (
              <div className="dp-body text-[10px] mb-1" style={{ color: INK + "77" }}>presupuesto mensual: {formatMoney(monthlyBudget)}</div>
            )}
            {overCap && (
              <div className="dp-body text-[10px] mb-1.5 p-1.5 rounded-lg" style={{ background: CORAL + "15", color: CORAL }}>
                No puede pasar de {formatMoney(monthlyBudget)}/mes. Usa "Total" si tu proyecto cuesta más.
              </div>
            )}
            {monthsPreview && (
              <div className="dp-body text-[10px] mb-1.5 p-1.5 rounded-lg" style={{ background: BLUE_SOFT, color: INK + "cc" }}>
                Tomaría ~{monthsPreview} mes(es) pagarlo con el presupuesto mensual.
              </div>
            )}
            <textarea
              value={description}
              onChange={(e) => setDescription(e.target.value)}
              placeholder="Descripción (opcional)"
              rows={2}
              className="dp-body w-full resize-none rounded-lg px-2 py-1.5 text-sm outline-none mb-1.5"
              style={{ background: BLUE_SOFT, color: INK }}
            />
            {links.map((l, i) => (
              <input
                key={i}
                value={l}
                onChange={(e) => { const arr = [...links]; arr[i] = e.target.value; setLinks(arr); }}
                placeholder="Link (opcional)"
                className="dp-body w-full rounded-lg px-2 py-1.5 text-sm outline-none mb-1.5"
                style={{ background: BLUE_SOFT, color: INK }}
              />
            ))}
            <button onClick={() => setLinks([...links, ""])} className="dp-body text-[11px] font-medium mb-2" style={{ color: BLUE }}>
              + agregar link
            </button>
            <button
              onClick={submitProposal}
              disabled={sending || !name.trim() || !costAmount || overCap}
              className="dp-body flex items-center justify-center gap-1.5 w-full text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40"
              style={{ background: GREEN }}
            >
              📤 {sending ? "Enviando…" : "Enviar propuesta"}
            </button>
          </div>

          {error && <div className="dp-body text-[11px] mb-2" style={{ color: CORAL }}>{error}</div>}

          {isAdmin && (
            <button
              onClick={closeThisCategory}
              disabled={closingPhase}
              className="dp-body w-full text-xs py-1.5 rounded-full text-white font-medium disabled:opacity-40"
              style={{ background: BLUE }}
            >
              🔒 {closingPhase ? "Cerrando…" : `Cerrar recepción de "${category}"`}
            </button>
          )}
        </div>
      )}

      {state.status === "voting" && (
        <div>
          {proposals.map((p) => (
            <div key={p.id} className="rounded-lg p-2.5 mb-1.5" style={{ background: BLUE_SOFT }}>
              <button
                onClick={() => vote(p.id)}
                disabled={votedHere || sending}
                className="dp-body text-left text-sm font-medium w-full disabled:opacity-70"
                style={{ color: INK }}
              >
                {votedHere ? "○" : "🗳️"} {p.name} <span className="dp-body text-[11px] font-normal" style={{ color: INK + "77" }}>— {p.memberName}</span>
              </button>
              <div className="dp-mono text-[11px] mt-0.5" style={{ color: INK + "88" }}>
                {p.costType === "mensual" ? `${formatMoney(p.costAmount)}/mes` : `${formatMoney(p.costAmount)} total${p.monthsNeeded ? ` (~${p.monthsNeeded} meses)` : ""}`}
              </div>
              {p.description && <div className="dp-body text-[11px] mt-1" style={{ color: INK + "99" }}>{p.description}</div>}
              {p.links.length > 0 && p.links.map((l, i) => (
                <a key={i} href={l} target="_blank" rel="noreferrer" className="dp-body text-[11px] block underline" style={{ color: BLUE }}>{l}</a>
              ))}
            </div>
          ))}
          {votedHere && <div className="dp-body text-[11px]" style={{ color: GREEN }}>✅ Ya votaste en esta categoría</div>}
          {error && <div className="dp-body text-[11px]" style={{ color: CORAL }}>{error}</div>}
        </div>
      )}

      {state.status === "resolved" && (() => {
        const winnerProposal = proposals.find((p) => p.id === state.winner);
        if (!winnerProposal) return null;
        return (
          <div className="rounded-lg p-2.5" style={{ background: GREEN + "15" }}>
            <div className="dp-body text-sm font-semibold" style={{ color: GREEN }}>🏆 {winnerProposal.name}</div>
            <div className="dp-body text-[11px]" style={{ color: INK + "88" }}>propuesto por {winnerProposal.memberName}</div>
          </div>
        );
      })()}

      {state.status === "tie_final" && (
        <div className="dp-body text-[12px] p-2 rounded-lg" style={{ background: CORAL + "15", color: CORAL }}>
          Empate definitivo después de {state.round} rondas — sin ganador claro en esta categoría.
        </div>
      )}

      {(state.status === "empty" || state.status === "empty_closed") && (
        <div className="dp-body text-[12px] p-2 rounded-lg" style={{ background: INK + "0d", color: INK + "77" }}>
          {state.status === "empty" ? "Sin propuestas por ahora — el administrador puede reabrirla cuando terminen las demás categorías." : `Sin propuestas después de ${state.round} intento(s).`}
        </div>
      )}
    </div>
  );
}

function LicitacionPanel({ backendUrl, groupCode, memberId, flow, isAdmin, onAdvance }) {
  const lic = flow.licitacion;
  const categoryNames = Object.keys(lic.categories);
  const [closingVoting, setClosingVoting] = useState(false);
  const [votingError, setVotingError] = useState("");
  const [reopening, setReopening] = useState(false);
  const [reopenError, setReopenError] = useState("");

  const anyVoting = categoryNames.some((c) => lic.categories[c].status === "voting");
  const anyActive = categoryNames.some((c) => ["collecting", "voting"].includes(lic.categories[c].status));
  const anyReopenableEmpty = !anyActive && categoryNames.some((c) => lic.categories[c].status === "empty");
  const allDone = categoryNames.every((c) => ["resolved", "empty_closed", "tie_final"].includes(lic.categories[c].status));

  const closeVoting = async () => {
    const ok = window.confirm("¿Cerrar la votación de las categorías listas? Se calculan los resultados y nadie más podrá votar en ellas.");
    if (!ok) return;
    setClosingVoting(true);
    try {
      const res = await fetch(`${backendUrl}/api/groups/${groupCode}/flows/${flow.id}/close-voting`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ memberId }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Error al cerrar");
      await onAdvance();
    } catch (e) {
      setVotingError(e.message);
    } finally {
      setClosingVoting(false);
    }
  };

  const reopenEmpty = async () => {
    const ok = window.confirm("¿Reabrir las categorías vacías para que reciban propuestas de nuevo?");
    if (!ok) return;
    setReopening(true);
    setReopenError("");
    try {
      const res = await fetch(`${backendUrl}/api/groups/${groupCode}/flows/${flow.id}/reopen-empty`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ memberId }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Error al reabrir");
      await onAdvance();
    } catch (e) {
      setReopenError(e.message);
    } finally {
      setReopening(false);
    }
  };

  return (
    <div className="rounded-2xl p-4 mb-4" style={{ background: WARM_WHITE, border: `1px solid ${BLUE}33` }}>
      <div className="dp-body text-xs font-semibold mb-3" style={{ color: BLUE }}>
        Propuestas para el presupuesto{allDone ? " · terminado" : ""}
      </div>
      <div className="dp-body text-[11px] mb-3" style={{ color: INK + "77" }}>
        💬 Recomendación: discutan las propuestas en persona antes de votar, si pueden.
      </div>

      {categoryNames.map((cat) => (
        <LicitacionCategoryCard
          key={`${cat}-${lic.categories[cat].round}`}
          backendUrl={backendUrl}
          groupCode={groupCode}
          memberId={memberId}
          flowId={flow.id}
          category={cat}
          state={lic.categories[cat]}
          proposals={lic.proposals.filter((p) => p.category === cat)}
          isAdmin={isAdmin}
          onAdvance={onAdvance}
        />
      ))}

      {votingError && <div className="dp-body text-[11px] mb-2" style={{ color: CORAL }}>{votingError}</div>}
      {reopenError && <div className="dp-body text-[11px] mb-2" style={{ color: CORAL }}>{reopenError}</div>}

      {isAdmin && anyVoting && (
        <button
          onClick={closeVoting}
          disabled={closingVoting}
          className="dp-body w-full text-xs py-2 rounded-full text-white font-medium disabled:opacity-40 mb-2"
          style={{ background: BLUE }}
        >
          🔒 {closingVoting ? "Cerrando…" : "Cerrar votación de las categorías listas"}
        </button>
      )}

      {isAdmin && anyReopenableEmpty && (
        <button
          onClick={reopenEmpty}
          disabled={reopening}
          className="dp-body w-full text-xs py-2 rounded-full text-white font-medium disabled:opacity-40"
          style={{ background: CORAL }}
        >
          🔁 {reopening ? "Reabriendo…" : "Reabrir categorías vacías"}
        </button>
      )}
    </div>
  );
}

function FlowRunner({ backendUrl, groupCode, memberId, flow, allFlows, isAdmin, groupResponses, approvedMemberCount, onAdvance, onSwitchFlow }) {
  const [sending, setSending] = useState(false);
  const [sendError, setSendError] = useState("");
  const [sent, setSent] = useState(false);
  const [closingStage, setClosingStage] = useState(false);
  const [categoryThresholdPercent, setCategoryThresholdPercent] = useState(
    flow.config?.categoryThresholdPercent ?? flow.config?.selectionThresholdPercent ?? 10
  );
  const [quotaTrimPercent, setQuotaTrimPercent] = useState(flow.config?.quotaTrimPercent ?? 10);
  const [totalBudget, setTotalBudget] = useState(flow.config?.totalBudget ?? "");
  const [extraAmount, setExtraAmount] = useState(flow.config?.extraAmount ?? "");
  const [memberCounts, setMemberCounts] = useState(flow.config?.memberCounts || {});
  const [tieRoundMinutes, setTieRoundMinutes] = useState(flow.config?.tieRoundMinutes ?? "");
  const [reopenEmptyMinutes, setReopenEmptyMinutes] = useState(flow.config?.reopenEmptyMinutes ?? "");
  const [savingConfig, setSavingConfig] = useState(false);
  const lastClosedStage = flow.stages[flow.stages.length - 1];
  const justApproved = Boolean(lastClosedStage && lastClosedStage.key === "approval" && lastClosedStage.result.winner === "Sí");
  const [showCelebration, setShowCelebration] = useState(justApproved || flow.status === "finished");
  const prevApproved = React.useRef(justApproved);
  const prevStatus = React.useRef(flow.status);
  const stage = flow.status === "active" ? flow.currentStage : null;
  const TEMPLATE_LABELS = { cuotas: "Cuotas participativas", presupuesto: "Presupuesto participativo" };
  const nextStepLabel = stage ? stage.text : flow.chainNext ? TEMPLATE_LABELS[flow.chainNext] || flow.chainNext : null;

  // Si este presupuesto viene encadenado de un flujo de cuotas ya
  // terminado (Asociaciones), y esa etapa de cuotas calculó cuánto se
  // recauda, el presupuesto total sale solo de ahí + el monto extra.
  const cuotasFlow = flow.chainedFromFlowId ? (allFlows || []).find((f) => f.id === flow.chainedFromFlowId) : null;
  const cuotasFinalStage = cuotasFlow ? [...cuotasFlow.stages].reverse().find((s) => s.key === "quotas" || s.key === "singleQuota") : null;
  const cuotasTotal = cuotasFinalStage && cuotasFinalStage.result.totalCollected ? cuotasFinalStage.result.totalCollected : null;
  const isChainedBudget = flow.template === "presupuesto" && cuotasTotal !== null;
  const effectiveTotalBudget = isChainedBudget ? Math.round((cuotasTotal + (Number(extraAmount) || 0)) * 100) / 100 : (totalBudget === "" ? null : Number(totalBudget));

  useEffect(() => {
    if (!prevApproved.current && justApproved) {
      setShowCelebration(true);
    }
    if (prevStatus.current !== "finished" && flow.status === "finished") {
      setShowCelebration(true);
    }
    prevApproved.current = justApproved;
    prevStatus.current = flow.status;
  }, [flow.status, justApproved]);

  const saveConfig = async () => {
    setSavingConfig(true);
    try {
      const licitacionConfig = { tieRoundMinutes: tieRoundMinutes === "" ? null : Number(tieRoundMinutes), reopenEmptyMinutes: reopenEmptyMinutes === "" ? null : Number(reopenEmptyMinutes) };
      const config =
        flow.template === "cuotas"
          ? { categoryThresholdPercent: Number(categoryThresholdPercent), quotaTrimPercent: Number(quotaTrimPercent), memberCounts }
          : isChainedBudget
          ? { selectionThresholdPercent: Number(categoryThresholdPercent), extraAmount: extraAmount === "" ? 0 : Number(extraAmount), ...licitacionConfig }
          : { selectionThresholdPercent: Number(categoryThresholdPercent), totalBudget: totalBudget === "" ? null : Number(totalBudget), ...licitacionConfig };
      await fetch(`${backendUrl}/api/groups/${groupCode}/flows/${flow.id}/config`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ memberId, config }),
      });
      await onAdvance();
    } catch (e) {
      setSendError(e.message);
    } finally {
      setSavingConfig(false);
    }
  };

  useEffect(() => {
    setSent(false);
    setSendError("");
  }, [stage && stage.key]);

  const liveCount = stage
    ? (groupResponses || []).filter((r) => r.flowId === flow.id && r.stageInstanceIndex === stage.instanceIndex).length
    : 0;

  const sendResponse = async (value) => {
    setSending(true);
    setSendError("");
    try {
      const res = await fetch(`${backendUrl}/api/groups/${groupCode}/flows/${flow.id}/responses`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ memberId, value }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Error al enviar");
      setSent(true);
    } catch (e) {
      setSendError(e.message);
    } finally {
      setSending(false);
    }
  };

  const closeStage = async () => {
    const ok = window.confirm("¿Seguro que quieres cerrar esta etapa? Nadie más podrá responder después de esto.");
    if (!ok) return;
    setClosingStage(true);
    try {
      const res = await fetch(`${backendUrl}/api/groups/${groupCode}/flows/${flow.id}/close-stage`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ memberId }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Error al cerrar la etapa");
      await onAdvance();
    } catch (e) {
      setSendError(e.message);
    } finally {
      setClosingStage(false);
    }
  };

  const submitMemberSetup = async (rawCounts) => {
    setSending(true);
    setSendError("");
    try {
      const cleaned = {};
      Object.entries(rawCounts).forEach(([k, v]) => {
        const n = Number(v);
        if (!isNaN(n) && n > 0) cleaned[k] = n;
      });
      const res1 = await fetch(`${backendUrl}/api/groups/${groupCode}/flows/${flow.id}/responses`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ memberId, value: cleaned }),
      });
      const data1 = await res1.json();
      if (!res1.ok) throw new Error(data1.error || "Error al guardar");
      const res2 = await fetch(`${backendUrl}/api/groups/${groupCode}/flows/${flow.id}/close-stage`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ memberId }),
      });
      const data2 = await res2.json();
      if (!res2.ok) throw new Error(data2.error || "Error al continuar");
      await onAdvance();
    } catch (e) {
      setSendError(e.message);
    } finally {
      setSending(false);
    }
  };

  return (
    <div className="rounded-2xl p-4 mb-4" style={{ background: WARM_WHITE, border: `1px solid ${BLUE}33` }}>
      <div className="dp-body text-xs font-semibold mb-3" style={{ color: BLUE }}>
        {flow.template === "cuotas" ? "Cuotas participativas" : "Presupuesto participativo"}{flow.status === "finished" ? " · terminado" : ""}
      </div>

      {isAdmin && flow.status === "active" && (
        <div className="rounded-lg p-3 mb-3" style={{ background: BLUE_SOFT }}>
          <label className="dp-body flex items-center justify-between text-xs mb-3" style={{ color: INK }}>
            % mínimo de apoyo para que sobreviva una categoría
            <input
              type="number" min="0" max="100" value={categoryThresholdPercent}
              onChange={(e) => setCategoryThresholdPercent(e.target.value)}
              className="dp-mono w-14 rounded-lg px-2 py-1 text-center outline-none ml-2"
              style={{ background: "#fff" }}
            />
          </label>
          {flow.template === "cuotas" && (
            <label className="dp-body flex items-center justify-between text-xs mb-3" style={{ color: INK }}>
              % de recorte (alto y bajo) en las cuotas
              <input
                type="number" min="0" max="45" value={quotaTrimPercent}
                onChange={(e) => setQuotaTrimPercent(e.target.value)}
                className="dp-mono w-14 rounded-lg px-2 py-1 text-center outline-none ml-2"
                style={{ background: "#fff" }}
              />
            </label>
          )}
          {flow.template === "presupuesto" && isChainedBudget && (
            <div className="mb-3">
              <div className="dp-body text-xs mb-1.5" style={{ color: INK }}>Presupuesto total (de Cuotas + extra)</div>
              <div className="dp-mono text-[11px] mb-1.5" style={{ color: INK + "99" }}>
                De cuotas: {formatMoney(cuotasTotal)}
              </div>
              <label className="dp-body flex items-center justify-between text-xs mb-1.5" style={{ color: INK }}>
                Monto extra (ahorros, otros ingresos)
                <input
                  type="number" min="0" value={extraAmount}
                  onChange={(e) => setExtraAmount(e.target.value)}
                  placeholder="0"
                  className="dp-mono w-24 rounded-lg px-2 py-1 text-center outline-none ml-2"
                  style={{ background: "#fff" }}
                />
              </label>
              <div className="dp-mono text-xs font-semibold" style={{ color: BLUE }}>
                Total: {formatMoney(effectiveTotalBudget)}
              </div>
            </div>
          )}
          {flow.template === "presupuesto" && !isChainedBudget && (
            <label className="dp-body flex items-center justify-between text-xs mb-3" style={{ color: INK }}>
              Presupuesto total (opcional, para ver $)
              <input
                type="number" min="0" value={totalBudget}
                onChange={(e) => setTotalBudget(e.target.value)}
                placeholder="ej. 20000"
                className="dp-mono w-24 rounded-lg px-2 py-1 text-center outline-none ml-2"
                style={{ background: "#fff" }}
              />
            </label>
          )}
          {flow.licitacion && (
            <React.Fragment>
              <label className="dp-body flex items-center justify-between text-xs mb-1.5" style={{ color: INK }}>
                Minutos para rondas de desempate (vacío = tú cierras a mano)
                <input
                  type="number" min="0" value={tieRoundMinutes}
                  onChange={(e) => setTieRoundMinutes(e.target.value)}
                  placeholder="ej. 1440"
                  className="dp-mono w-20 rounded-lg px-2 py-1 text-center outline-none ml-2"
                  style={{ background: "#fff" }}
                />
              </label>
              <label className="dp-body flex items-center justify-between text-xs mb-1.5" style={{ color: INK }}>
                Minutos al reabrir categorías vacías
                <input
                  type="number" min="0" value={reopenEmptyMinutes}
                  onChange={(e) => setReopenEmptyMinutes(e.target.value)}
                  placeholder="ej. 1440"
                  className="dp-mono w-20 rounded-lg px-2 py-1 text-center outline-none ml-2"
                  style={{ background: "#fff" }}
                />
              </label>
            </React.Fragment>
          )}
          <div className="dp-body text-[10px] mb-2" style={{ color: INK + "77" }}>
            Solo afecta las etapas que todavía no se han calculado.
          </div>
          <button
            onClick={saveConfig}
            disabled={savingConfig}
            className="dp-body w-full text-xs py-1.5 rounded-full text-white font-medium disabled:opacity-40"
            style={{ background: BLUE }}
          >
            {savingConfig ? "Guardando…" : "Guardar"}
          </button>
        </div>
      )}

      {flow.stages.map((s, i) => (
        <div key={i} className="mb-3 pb-3" style={{ borderBottom: `1px dashed ${BLUE}33`, opacity: 0.55 }}>
          <div className="dp-body text-[12px] font-medium mb-1 flex items-center gap-1.5" style={{ color: INK }}>
            <span>🔒</span>
            <span>{s.text}</span>
          </div>
          <StageResultView stage={s} />
        </div>
      ))}

      {flow.status === "finished" && (() => {
        const finalStage = [...flow.stages].reverse().find((s) => s.key === "quotas" || s.key === "singleQuota" || s.key === "budget");
        if (!finalStage) return null;
        return (
          <div className="rounded-xl p-3.5 mb-3" style={{ background: BLUE_SOFT }}>
            <div className="dp-display text-lg font-bold mb-2" style={{ color: INK }}>Decisión colectiva:</div>
            <BigDecisionDisplay stage={finalStage} />
          </div>
        );
      })()}

      {stage && stage.type === "conteo_miembros" && (
        <div className="rounded-xl p-3.5" style={{ background: BLUE_SOFT }}>
          <div className="dp-body text-[14px] mb-2" style={{ color: INK }}>{stage.text}</div>
          {isAdmin ? (() => {
            const fields = stage.config.mode === "single" ? ["single"] : stage.config.categories;
            const allFilled = fields.every((k) => memberCounts[k] !== undefined && memberCounts[k] !== "" && Number(memberCounts[k]) > 0);
            return (
              <React.Fragment>
                {stage.config.mode === "single" && (
                  <label className="dp-body flex items-center justify-between text-xs mb-2" style={{ color: INK }}>
                    Número de miembros
                    <input
                      type="number" min="0" value={memberCounts.single ?? ""}
                      onChange={(e) => setMemberCounts({ ...memberCounts, single: e.target.value })}
                      className="dp-mono w-20 rounded-lg px-2 py-1 text-center outline-none ml-2"
                      style={{ background: "#fff" }}
                    />
                  </label>
                )}
                {stage.config.mode === "categories" && stage.config.categories.map((cat) => (
                  <label key={cat} className="dp-body flex items-center justify-between text-xs mb-1.5" style={{ color: INK }}>
                    {cat}
                    <input
                      type="number" min="0" value={memberCounts[cat] ?? ""}
                      onChange={(e) => setMemberCounts({ ...memberCounts, [cat]: e.target.value })}
                      className="dp-mono w-20 rounded-lg px-2 py-1 text-center outline-none ml-2"
                      style={{ background: "#fff" }}
                    />
                  </label>
                ))}
                {sendError && <div className="dp-body text-[11px] mb-2 mt-1" style={{ color: CORAL }}>{sendError}</div>}
                <div className="flex gap-2 mt-2">
                  <button
                    onClick={() => submitMemberSetup(memberCounts)}
                    disabled={sending || !allFilled}
                    className="dp-body flex-1 text-xs py-2 rounded-full text-white font-medium disabled:opacity-40"
                    style={{ background: GREEN }}
                  >
                    {sending ? "Guardando…" : "Guardar y continuar"}
                  </button>
                  <button
                    onClick={() => submitMemberSetup({})}
                    disabled={sending}
                    className="dp-body flex-1 text-xs py-2 rounded-full font-medium disabled:opacity-40"
                    style={{ background: "#fff", color: INK, border: `1px solid ${BLUE}55` }}
                  >
                    Omitir, no es necesario
                  </button>
                </div>
              </React.Fragment>
            );
          })() : (
            <div className="dp-body text-[13px] text-center py-3" style={{ color: INK + "88" }}>
              ⏳ El administrador está indicando el número de miembros…
            </div>
          )}
        </div>
      )}

      {stage && stage.type !== "conteo_miembros" && (
        <div>
          <div className="dp-body text-[14px] mb-1" style={{ color: INK }}>{stage.text}</div>
          <div className="dp-body text-[11px] mb-2" style={{ color: INK + "88" }}>
            {liveCount} de {approvedMemberCount} miembro(s) han respondido
          </div>
          <StageInput key={stage.key} stage={stage} onSend={sendResponse} sending={sending} disabled={sent} flowConfig={{ ...flow.config, totalBudget: effectiveTotalBudget }} />
          {sent && <div className="dp-body text-[11px] mb-2" style={{ color: GREEN }}>✅ Guardado</div>}
          {sendError && <div className="dp-body text-[11px] mb-2" style={{ color: CORAL }}>{sendError}</div>}
          {isAdmin && (
            <button
              onClick={closeStage}
              disabled={closingStage}
              className="dp-body w-full text-xs py-2 rounded-full text-white font-medium disabled:opacity-40"
              style={{ background: BLUE }}
            >
              🔒 {closingStage ? "Cerrando…" : "Cerrar etapa y avanzar"}
            </button>
          )}
        </div>
      )}

      {flow.licitacion && (
        <LicitacionPanel
          backendUrl={backendUrl}
          groupCode={groupCode}
          memberId={memberId}
          flow={flow}
          isAdmin={isAdmin}
          onAdvance={onAdvance}
        />
      )}

      {flow.status === "finished" && (
        <div className="dp-body text-[12px]" style={{ color: GREEN }}>
          ✅ Flujo completo — si dejaste tu correo, ahí te llega el resumen.
        </div>
      )}

      {showCelebration && (justApproved || flow.status === "finished") && (
        <div className="fixed inset-0 flex items-center justify-center p-4" style={{ background: "rgba(32,48,43,0.55)", zIndex: 50 }}>
          <div className="rounded-2xl p-5 max-w-[320px] w-full shadow-xl" style={{ background: WARM_WHITE }}>
            <div className="flex justify-end mb-1">
              <button onClick={() => setShowCelebration(false)} className="dp-body text-sm" style={{ color: INK + "77" }}>✕</button>
            </div>
            <div className="text-center mb-3">
              <div style={{ fontSize: "36px" }}>🎉</div>
              <div className="dp-display text-lg font-bold mt-1" style={{ color: INK }}>¡Felicidades!</div>
              <div className="dp-body text-[13px] mt-1" style={{ color: INK + "99" }}>
                Decidieron {flow.template === "cuotas" ? "las cuotas" : "el presupuesto"} de forma colectiva.
              </div>
            </div>
            {(() => {
              const finalStage = [...flow.stages].reverse().find((s) => s.key === "quotas" || s.key === "singleQuota" || s.key === "budget");
              if (!finalStage) return null;
              return (
                <div className="rounded-lg p-3" style={{ background: BLUE_SOFT }}>
                  <BigDecisionDisplay stage={finalStage} />
                </div>
              );
            })()}
            <button
              onClick={() => {
                setShowCelebration(false);
                if (flow.status === "finished" && flow.chainNext && onSwitchFlow) {
                  const nextFlow = (allFlows || []).find((f) => f.chainedFromFlowId === flow.id);
                  if (nextFlow) onSwitchFlow(nextFlow.id);
                }
              }}
              className="dp-body w-full mt-3 text-xs py-2.5 rounded-full text-white font-medium"
              style={{ background: BLUE }}
            >
              {nextStepLabel ? `Continuar hacia: ${nextStepLabel}` : "Ver todo el proceso"}
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

function ConnectedScreen({ backendUrl, groupCode, memberId, onExit, onGroupNameChange }) {
  const [group, setGroup] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");
  const [approving, setApproving] = useState("");
  const [pinnedFlowId, setPinnedFlowId] = useState(null);
  const prevPendingCount = React.useRef(null);

  const flows = group ? group.flows || [] : [];
  const latestOrActive = [...flows].reverse().find((f) => f.status === "active") || flows[flows.length - 1];
  // Se muestra el flujo "fijado" (para que una tarjeta de felicidades o
  // resultado recién terminado no desaparezca de golpe si se encadena a
  // otro flujo) — solo se avanza al siguiente cuando el usuario lo pide
  // explícitamente (ej. el botón "Continuar hacia" de la celebración).
  React.useEffect(() => {
    if (!pinnedFlowId && latestOrActive) setPinnedFlowId(latestOrActive.id);
  }, [latestOrActive ? latestOrActive.id : null, pinnedFlowId]);

  const fetchGroup = async () => {
    setLoading(true);
    setError("");
    try {
      const res = await fetch(`${backendUrl}/api/groups/${groupCode}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Grupo no encontrado");
      setGroup(data);
      if (onGroupNameChange) onGroupNameChange(data.name);

      const isAdminNow = data.admin.id === memberId;
      const pendingCount = data.members.filter((m) => !m.approved).length;
      if (
        isAdminNow &&
        prevPendingCount.current !== null &&
        pendingCount > prevPendingCount.current &&
        typeof Notification !== "undefined" &&
        Notification.permission === "granted"
      ) {
        new Notification("Nueva solicitud pendiente", {
          body: `Alguien quiere unirse a "${data.name}". Entra a la app para aprobar o rechazar.`,
        });
      }
      prevPendingCount.current = pendingCount;
    } catch (e) {
      setError(
        e.message === "Failed to fetch"
          ? "No se pudo conectar al backend. ¿Sigue corriendo npm start en tu terminal?"
          : e.message
      );
    } finally {
      setLoading(false);
    }
  };

  useEffect(() => {
    fetchGroup();
    const interval = setInterval(fetchGroup, 15000);
    if (typeof Notification !== "undefined" && Notification.permission === "default") {
      Notification.requestPermission();
    }
    return () => clearInterval(interval);
  }, []);

  const approve = async (id) => {
    setApproving(id);
    try {
      await fetch(`${backendUrl}/api/groups/${groupCode}/members/${id}/approve`, { method: "POST" });
      await fetchGroup();
    } catch (e) {
      setError(e.message);
    } finally {
      setApproving("");
    }
  };

  const reject = async (id) => {
    setApproving(id);
    try {
      await fetch(`${backendUrl}/api/groups/${groupCode}/members/${id}/reject`, { method: "POST" });
      await fetchGroup();
    } catch (e) {
      setError(e.message);
    } finally {
      setApproving("");
    }
  };

  if (loading && !group) {
    return <div className="dp-body text-sm text-center py-10" style={{ color: INK + "88" }}>Conectando…</div>;
  }
  if (error && !group) {
    return (
      <div className="px-4 py-6">
        <div className="dp-body text-[13px]" style={{ color: CORAL }}>{error}</div>
        <button onClick={onExit} className="dp-body text-xs mt-3" style={{ color: INK + "88" }}>← Volver</button>
      </div>
    );
  }
  if (!group) return null;

  const me = group.members.find((m) => m.id === memberId);
  const isAdmin = group.admin.id === memberId;
  const activeFlow = flows.find((f) => f.id === pinnedFlowId) || latestOrActive;
  const pendingMembers = group.members.filter((m) => !m.approved);

  return (
    <div className="px-4 py-4">
      <div className="rounded-2xl p-4 mb-4" style={{ background: WARM_WHITE, border: `1px solid ${BLUE}33` }}>
        <div className="flex items-start justify-between">
          <div>
            <div className="dp-body text-sm font-semibold" style={{ color: INK }}>{group.name}</div>
            <div className="dp-mono text-xs mt-0.5" style={{ color: INK + "88" }}>código: {group.code}</div>
          </div>
          <button onClick={onExit} className="dp-body text-[11px]" style={{ color: INK + "77" }}>Salir</button>
        </div>
        <div className="dp-body text-[11px] mt-2" style={{ color: INK + "88" }}>
          {group.members.filter((m) => m.approved).length} miembro(s) aprobado(s)
          {isAdmin && " · eres el administrador"}
        </div>
        {me && !me.approved && (
          <div className="dp-body text-[12px] mt-2 rounded-lg px-2.5 py-1.5" style={{ background: CORAL + "22", color: CORAL }}>
            Tu participación está pendiente de aprobación del administrador.
          </div>
        )}
        <div className="flex gap-2 mt-2.5">
          <a href={`${backendUrl}/api/groups/${groupCode}/export/respuestas.csv`} className="dp-body text-[11px] px-2.5 py-1.5 rounded-full font-medium" style={{ background: BLUE_SOFT, color: INK }}>⬇ Respuestas (CSV)</a>
          <a href={`${backendUrl}/api/groups/${groupCode}/export/resultados.csv`} className="dp-body text-[11px] px-2.5 py-1.5 rounded-full font-medium" style={{ background: BLUE_SOFT, color: INK }}>⬇ Resultados (CSV)</a>
        </div>
        {isAdmin && (
          <div className="mt-3 pt-3" style={{ borderTop: `1px solid ${BLUE}22` }}>
            <div className="dp-body text-xs font-medium mb-2" style={{ color: INK }}>
              Link directo para invitar usuarios a este grupo
            </div>
            <ShareGroup groupName={group.name} code={group.code} />
          </div>
        )}
      </div>

      {isAdmin && pendingMembers.length > 0 && (
        <div className="rounded-2xl p-4 mb-4" style={{ background: CORAL + "15", border: `1.5px solid ${CORAL}55` }}>
          <div className="dp-body text-xs font-semibold mb-2.5" style={{ color: CORAL }}>
            {pendingMembers.length} solicitud(es) pendiente(s)
          </div>
          <div className="flex flex-col gap-2">
            {pendingMembers.map((m) => (
              <div key={m.id} className="flex items-center justify-between">
                <span className="dp-body text-sm" style={{ color: INK }}>{m.name}</span>
                <div className="flex gap-1.5">
                  <button
                    onClick={() => approve(m.id)}
                    disabled={approving === m.id}
                    className="dp-body text-[11px] px-2.5 py-1.5 rounded-full text-white font-medium disabled:opacity-40"
                    style={{ background: GREEN }}
                  >
                    {approving === m.id ? "…" : "Aprobar"}
                  </button>
                  <button
                    onClick={() => reject(m.id)}
                    disabled={approving === m.id}
                    className="dp-body text-[11px] px-2.5 py-1.5 rounded-full font-medium disabled:opacity-40"
                    style={{ background: "#fff", color: CORAL, border: `1px solid ${CORAL}55` }}
                  >
                    Rechazar
                  </button>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {activeFlow ? (
        <FlowRunner
          backendUrl={backendUrl}
          groupCode={groupCode}
          memberId={memberId}
          flow={activeFlow}
          allFlows={flows}
          isAdmin={isAdmin}
          groupResponses={group.responses}
          approvedMemberCount={group.members.filter((m) => m.approved).length}
          onAdvance={fetchGroup}
          onSwitchFlow={setPinnedFlowId}
        />
      ) : (
        isAdmin && (
          <div className="flex flex-col gap-2 mb-4">
            <button
              onClick={async () => {
                await fetch(`${backendUrl}/api/groups/${groupCode}/flows`, {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ template: "cuotas", memberId }),
                });
                setPinnedFlowId(null);
                await fetchGroup();
              }}
              className="dp-body w-full text-left rounded-2xl p-4 shadow-sm"
              style={{ background: BLUE_SOFT, border: `1.5px solid ${BLUE}` }}
            >
              <div className="text-sm font-semibold mb-1" style={{ color: INK }}>💰 Iniciar Cuotas participativas</div>
              <div className="text-xs" style={{ color: INK + "88" }}>
                Un flujo guiado de varias etapas para decidir las cuotas del grupo.
              </div>
            </button>
            <button
              onClick={async () => {
                await fetch(`${backendUrl}/api/groups/${groupCode}/flows`, {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ template: "presupuesto", memberId }),
                });
                setPinnedFlowId(null);
                await fetchGroup();
              }}
              className="dp-body w-full text-left rounded-2xl p-4 shadow-sm"
              style={{ background: BLUE_SOFT, border: `1.5px solid ${BLUE}` }}
            >
              <div className="text-sm font-semibold mb-1" style={{ color: INK }}>📊 Iniciar Presupuesto participativo</div>
              <div className="text-xs" style={{ color: INK + "88" }}>
                Un flujo guiado para decidir en qué se gasta el presupuesto del grupo.
              </div>
            </button>
            <button
              onClick={async () => {
                await fetch(`${backendUrl}/api/groups/${groupCode}/flows`, {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ template: "cuotas", memberId, chainNext: "presupuesto" }),
                });
                setPinnedFlowId(null);
                await fetchGroup();
              }}
              className="dp-body w-full text-left rounded-2xl p-4 shadow-sm"
              style={{ background: BLUE_SOFT, border: `1.5px solid ${BLUE}` }}
            >
              <div className="text-sm font-semibold mb-1" style={{ color: INK }}>🏘️ Iniciar Asociaciones (Cuotas + Presupuesto)</div>
              <div className="text-xs" style={{ color: INK + "88" }}>
                Corre los dos flujos, uno después del otro.
              </div>
            </button>
          </div>
        )
      )}

      {!activeFlow && (
        <React.Fragment>
          {isAdmin && <NewQuestionForm backendUrl={backendUrl} groupCode={groupCode} onAdded={fetchGroup} />}

          {group.questions.length === 0 && (
            <div className="dp-body text-xs text-center py-4" style={{ color: INK + "77" }}>
              Este grupo todavía no tiene preguntas.
            </div>
          )}

          {group.questions.map((q) => (
            <QuestionRunner
              key={q.id}
              backendUrl={backendUrl}
              groupCode={groupCode}
              memberId={memberId}
              question={q}
              isAdmin={isAdmin}
              groupResponses={group.responses}
              approvedMemberCount={group.members.filter((m) => m.approved).length}
            />
          ))}
        </React.Fragment>
      )}
    </div>
  );
}

function DemocraciaPorPromedioConectada() {
  const [backendUrl, setBackendUrl] = useState("https://democracia-por-promedio.onrender.com");
  const [showSettings, setShowSettings] = useState(false);
  const [view, setView] = useState("home"); // home | custom | explain | create | groupCreated | adminReturn | join | connected
  const [groupCode, setGroupCode] = useState("");
  const [memberId, setMemberId] = useState("");
  const [createdGroupName, setCreatedGroupName] = useState("");
  const [urlCode, setUrlCode] = useState("");
  const [entryPurpose, setEntryPurpose] = useState(null); // null | "cuotas"
  const [selectedOption, setSelectedOption] = useState(null); // null | "explain" | "custom" | "cuotas" | "presupuesto" | "asociaciones"
  const [connectedGroupName, setConnectedGroupName] = useState("");

  const OPTION_TITLES = {
    explain: "Explicación y ejemplos",
    custom: "Crea tu grupo y tus propias preguntas",
    cuotas: "Cuotas participativas",
    presupuesto: "Presupuestos participativos",
    asociaciones: "Asociaciones, clubes y orgs",
  };
  const STEP_CHAINS = {
    default: ["Arma tu grupo", "Escribe las preguntas", "Elige el proceso", "Envía a tu grupo", "¡Decidan juntos!"],
    cuotas: ["Arma tu grupo", "Decidan las categorías", "Propongan la cuota", "Aprueben el resultado", "¡Cobren juntos!"],
    presupuesto: ["Arma tu grupo", "Propongan categorías", "Repartan el %", "Aprueben el resultado", "¡Gasten juntos!"],
    asociaciones: ["Arma tu grupo", "Decidan las cuotas", "Repartan el presupuesto", "Propongan proyectos", "¡Decidan juntos!"],
  };
  const headerTitle = connectedGroupName || OPTION_TITLES[selectedOption] || "Organízate y decide";
  const headerSteps = STEP_CHAINS[selectedOption] || STEP_CHAINS.default;

  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const member = params.get("member");
    if (code && member) {
      // Link de sesión propia (admin o miembro ya identificado): entra directo, sin pedir nada.
      setGroupCode(code);
      setMemberId(member);
      setView("connected");
    } else if (code) {
      // Link de invitación compartido: pide nombre antes de unirse.
      setUrlCode(code);
      setView("join");
    }
  }, []);

  const persistSession = (code, member) => {
    const url = `${window.location.pathname}?code=${code}&member=${member}`;
    window.history.replaceState(null, "", url);
  };

  const clearSession = () => {
    window.history.replaceState(null, "", window.location.pathname);
  };

  return (
    <div className="min-h-screen flex justify-center py-8 px-3" style={{ background: PAGE_BG }}>
      <div className="w-full max-w-[420px] rounded-[32px] overflow-hidden shadow-xl" style={{ background: PAGE_BG, border: `1px solid ${BLUE}33` }}>
        <div className="px-6 pt-7 pb-5" style={{ background: WARM_WHITE }}>
          <div
            className="dp-body inline-block text-[10px] font-semibold tracking-wide px-2.5 py-1 rounded-full mb-2.5"
            style={{ background: BLUE_SOFT, color: INK + "aa" }}
          >
            D×% · DEMOCRACIA POR PROMEDIO
          </div>
          <h1 className="dp-display text-2xl font-bold leading-tight" style={{ color: INK }}>{headerTitle}</h1>
          <div className="dp-body text-[12px] mt-2.5 leading-relaxed" style={{ color: INK + "99" }}>
            {headerSteps.map((f, i, arr) => (
              <React.Fragment key={i}>
                <span>{f}</span>
                {i < arr.length - 1 && <span style={{ color: BLUE, margin: "0 4px" }}>→</span>}
              </React.Fragment>
            ))}
          </div>
        </div>

        {view === "home" && (
          <HomeScreen
            onChooseExplain={() => {
              setSelectedOption("explain");
              setView("explain");
            }}
            onChooseCustom={() => {
              setEntryPurpose(null);
              setSelectedOption("custom");
              setView("custom");
            }}
            onChooseCuotas={() => {
              setEntryPurpose("cuotas");
              setSelectedOption("cuotas");
              setView("custom");
            }}
            onChoosePresupuesto={() => {
              setEntryPurpose("presupuesto");
              setSelectedOption("presupuesto");
              setView("custom");
            }}
            onChooseAsociaciones={() => {
              setEntryPurpose("asociaciones");
              setSelectedOption("asociaciones");
              setView("custom");
            }}
          />
        )}
        {view === "custom" && (
          <CustomEntryScreen
            onBack={() => {
              setSelectedOption(null);
              setView("home");
            }}
            onChooseCreate={() => setView("create")}
            onChooseAdminReturn={() => setView("adminReturn")}
            onChooseJoin={() => setView("join")}
          />
        )}
        {view === "explain" && (
          <ExplanationScreen
            onBack={() => {
              setSelectedOption(null);
              setView("home");
            }}
          />
        )}
        {view === "create" && (
          <CreateGroupScreen
            backendUrl={backendUrl}
            onBack={() => setView("custom")}
            onCreated={async ({ code, memberId, groupName }) => {
              setGroupCode(code);
              setMemberId(memberId);
              setCreatedGroupName(groupName);
              persistSession(code, memberId);
              if (entryPurpose === "cuotas" || entryPurpose === "presupuesto") {
                await fetch(`${backendUrl}/api/groups/${code}/flows`, {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ template: entryPurpose, memberId }),
                });
              } else if (entryPurpose === "asociaciones") {
                await fetch(`${backendUrl}/api/groups/${code}/flows`, {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ template: "cuotas", memberId, chainNext: "presupuesto" }),
                });
              }
              setView("groupCreated");
            }}
          />
        )}
        {view === "groupCreated" && (
          <GroupCreatedScreen
            groupName={createdGroupName}
            code={groupCode}
            onContinue={() => setView("connected")}
          />
        )}
        {view === "adminReturn" && (
          <AdminReturnScreen
            backendUrl={backendUrl}
            onBack={() => setView("custom")}
            onEntered={({ code, memberId }) => {
              setGroupCode(code);
              setMemberId(memberId);
              persistSession(code, memberId);
              setView("connected");
            }}
          />
        )}
        {view === "join" && (
          <JoinGroupScreen
            backendUrl={backendUrl}
            initialCode={urlCode}
            onBack={() => setView("custom")}
            onJoined={({ code, memberId }) => {
              setGroupCode(code);
              setMemberId(memberId);
              persistSession(code, memberId);
              setView("connected");
            }}
          />
        )}
        {view === "connected" && (
          <ConnectedScreen
            backendUrl={backendUrl}
            groupCode={groupCode}
            memberId={memberId}
            onGroupNameChange={setConnectedGroupName}
            onExit={() => {
              setGroupCode("");
              setMemberId("");
              setEntryPurpose(null);
              setSelectedOption(null);
              setConnectedGroupName("");
              clearSession();
              setView("home");
            }}
          />
        )}

        <div className="px-4 pb-4">
          <button
            onClick={() => setShowSettings(!showSettings)}
            className="dp-body text-[10px]"
            style={{ color: INK + "55" }}
          >
            servidor: {backendUrl} {showSettings ? "▲" : "▼"}
          </button>
          {showSettings && (
            <input
              value={backendUrl}
              onChange={(e) => setBackendUrl(e.target.value)}
              className="dp-mono w-full mt-1.5 rounded-lg px-2.5 py-1.5 text-xs outline-none"
              style={{ background: BLUE_SOFT, color: INK }}
            />
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<DemocraciaPorPromedioConectada />);
</script>
</body>
</html>
