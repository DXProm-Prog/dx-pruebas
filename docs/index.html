function CountdownBadge({ closesAt, closed }) {
  const cbLang = useLang();
  const [now, setNow] = useState(Date.now());
  useEffect(() => {
    if (closed || !closesAt) return;
    const interval = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(interval);
  }, [closed, closesAt]);

  if (closed) {
    return (
      <span className="dp-body text-[11px] px-2 py-0.5 rounded-full font-medium" style={{ background: CORAL + "22", color: CORAL }}>
        {tf("badge.closed", cbLang)}
      </span>
    );
  }
  if (!closesAt) return null;

  const msLeft = new Date(closesAt).getTime() - now;
  if (msLeft <= 0) {
    return (
      <span className="dp-body text-[11px] px-2 py-0.5 rounded-full font-medium" style={{ background: CORAL + "22", color: CORAL }}>
        {tf("badge.closing", cbLang)}
      </span>
    );
  }
  const hours = Math.floor(msLeft / 3600000);
  const mins = Math.floor((msLeft % 3600000) / 60000);
  const label = hours > 0 ? `${hours}h ${mins}m` : `${mins}m`;
  return (
    <span className="dp-body text-[11px] px-2 py-0.5 rounded-full font-medium" style={{ background: BLUE_SOFT, color: INK }}>
      {tf("badge.closesIn", cbLang, { time: label })}
    </span>
  );
}

function formatMoney(n) {
  return "$" + Math.round(n).toLocaleString("es-MX");
}

// Sistema de idiomas del frontend — mismo patrón que el backend
// (strings.js): un diccionario por idioma, y una función que busca la
// clave pedida, cayendo de regreso al español si falta en el otro
// idioma. LangContext hace que cualquier componente pueda leer el
// idioma actual sin tener que pasarlo a mano por cada nivel.
// Cada llamada al servidor lleva el idioma actual (?lang=es o ?lang=en),
// para que los textos de las preguntas salgan en el idioma de quien las ve
// y no en el idioma con el que se creó el grupo.
const nativeFetch = window.fetch.bind(window);
window.fetch = function (input, init) {
  try {
    if (typeof input === "string" && input.includes("/api/") && !/[?&]lang=/.test(input)) {
      const current = localStorage.getItem("org_lang") === "en" ? "en" : "es";
      input += (input.includes("?") ? "&" : "?") + "lang=" + current;
    }
  } catch (e) {}
  return nativeFetch(input, init);
};

const LangContext = React.createContext("es");
function useLang() {
  return React.useContext(LangContext);
}

    "secex.tabulador.5": "Un grupo decide que sí habrá límite. Las propuestas de todos dan un promedio de 3 veces.\nPuestos: Coordinación, Taller y Limpieza. Los sueldos son por mes.\nDespués del recorte, los promedios son: Coordinación 12,000, Taller 8,000 y Limpieza 5,000.\nLa diferencia entre quien más gana y quien menos gana es de 2.4 veces, dentro del límite de 3.",
    "secex.asociaciones.1": "Creas el grupo una sola vez y corres cuatro procesos conectados, uno después del otro: cuotas, presupuesto, propuestas de proyectos y selección de responsabilidades.\nAl cerrar un proceso, la app te lleva al siguiente. El dinero que se recauda con las cuotas llega solo como presupuesto a repartir.\nTú decides cuándo cerrar cada etapa. Las propuestas de proyectos y la selección de responsabilidades solo se abren si el grupo lo vota.",
    "secex.asociaciones.2": "Participan en orden:\n1. Cuotas: proponen cuánto debe pagar cada categoría y aprueban el resultado.\n2. Presupuesto: proponen categorías de gasto, eligen las que importan y reparten el 100%.\n3. Propuestas de proyectos: en cada categoría, cada quien puede proponer proyectos con su costo. Se revelan todos juntos al cerrar la recepción, y después cada quien vota por un proyecto en cada categoría.\n4. Responsabilidades: proponen puestos, aprueban candidatos y se hace el sorteo.",
    "secex.asociaciones.3": "• Cuotas y presupuesto: tienen las mismas opciones que cuando se usan por separado.\n• Propuestas de proyectos: el grupo vota si las abre. Tú cierras la recepción para pasar a votación, cierras la votación y puedes reabrir las categorías que se quedaron sin propuestas.\n• Responsabilidades: se abren solo si más del 50% del grupo vota que sí.\n• Tiempos: cierras cada etapa a tu ritmo.",
    "secex.asociaciones.4": "• Cuotas y presupuesto: se calculan igual que por separado.\n• Dinero: lo recaudado con las cuotas se convierte en el presupuesto a repartir.\n• Proyectos: en cada categoría gana el proyecto con más votos. Si hay empate, se abre otra ronda en la que se pueden editar o agregar propuestas. Si el empate sigue después de varias rondas, esa categoría queda sin ganador.\n• Responsabilidades: se sortean entre los candidatos, sin repetir.",
    "secex.asociaciones.5": "Un club de 10 personas. Cuotas: se recaudan 5,800.\nPresupuesto: Mantenimiento recibe 50%, es decir 2,900.\nProyectos: para Mantenimiento se proponen pintar el salón y arreglar la bomba de agua, cada uno con su costo. Al cerrar la recepción se revelan y el club vota. Gana el que tenga más votos.\nResponsabilidades: el club vota si quiere sortear puestos y la app asigna Tesorero, Auditor y Facilitador.",
    "qwel.title": "Te damos la bienvenida a: {group}",
    "qwel.invited": "{admin} te invitó a este grupo.",
    "qwel.invitedNoAdmin": "Te invitaron a este grupo.",
    "qwel.decide": "Juntos van a decidir:",
    "qwel.how": "¿Cómo vamos a decidir?",
    "qwel.part": "¿Cómo participas?",
    "qwel.ruleIntro1": "El facilitador eligió esta forma de decidir:",
    "qwel.ruleIntroN": "El facilitador eligió estas formas de decidir, una por pregunta:",
    "qwel.prom": "Cada integrante propone un número para cada pregunta.\n\nDespués se promedian todas las propuestas, y ese promedio es la decisión colectiva. Si el facilitador pidió recorte, antes se descartan las propuestas más altas y más bajas.\n\nA esta forma de decidir se le llama democracia por promedio.",
    "qwel.promPart": "Cada persona entra con el link y escribe su nombre.\nVe las preguntas una por una, escribe el número que le parece justo y lo envía.\nNo hace falta ponerse de acuerdo antes: cada quien propone lo que piensa.\nSi elegiste propuestas secretas, al final solo se ven los números, no quién propuso cuál.\nCuando cierras, todas las personas ven el resultado del grupo.",
    "qwel.mayPart": "Cada pregunta tiene las mismas opciones para todos. Eliges la que prefieres y envías tu voto.\n\nSi hay límite de tiempo, verás una cuenta regresiva.",
    "qwel.mayPartRank": "Para ordenar, toca las opciones en el orden de tu preferencia: primero la que más te gusta.",
    "qwel.mayPartSeg": "Vas a votar en más de una ronda. Cuando cierre una ronda, vuelves a votar entre las opciones que quedan.",
    "qwel.rule.simple": "Cada persona vota por una opción. Gana la opción con más votos, sin importar el porcentaje.\n\nPor ejemplo, si Sábado tiene 5 votos, Viernes 4 y Domingo 2, gana Sábado.",
    "qwel.rule.absoluta": "Cada persona vota por una opción. Para ganar, una opción necesita más del 50% de los votos.\n\nPor ejemplo, con 11 votos, una opción necesita al menos 6. Si la más votada tiene 5, nadie gana y hace falta otra ronda de participación.",
    "qwel.rule.calificada": "Cada persona vota por una opción. Para ganar, una opción necesita superar un porcentaje que definió el facilitador, mayor al 50%.\n\nPor ejemplo, si el porcentaje es 66% y votan 11 personas, una opción necesita al menos 8 votos.",
    "qwel.rule.rankeado": "No votas por una sola opción: las ordenas de la que más te gusta a la que menos. La app cuenta los primeros lugares. Si ninguna pasa del 50%, elimina la opción con menos votos y reparte esos votos a la siguiente preferencia de cada persona. Repite hasta que una opción pase del 50%.\n\nAsí tu voto no se pierde si tu opción favorita queda eliminada.",
    "qwel.rule.segunda_vuelta": "Votas por una sola opción en cada ronda. Cuando se cierra la ronda, se eliminan las opciones sin votos y las que quedaron por debajo del porcentaje mínimo que definió el facilitador. Después se vota de nuevo entre las que quedan.\n\nPor ejemplo, si Domingo queda con 18% y el mínimo es 20%, Domingo se elimina y la ronda 2 es solo entre Sábado y Viernes.",
    "home.title": "Organicen y decidan",

    "flow.thresholdInfo.title": "% mínimo de apoyo",
    "flow.thresholdInfo.text.categorias": "Cuando todos proponen opciones (categorías) y después votan por las que les importan, esto decide qué tan popular tiene que ser una opción para quedarse.\n\nPor ejemplo, con 10%: si menos del 10% del grupo votó por una opción, se elimina. La idea es quitar del camino las propuestas casi sin apoyo, sin necesitar que el facilitador decida a mano cuáles sobreviven.\n\nSolo afecta las etapas que todavía no se han calculado. Cambiarlo no revive ni elimina nada que ya se haya decidido antes.",
    "flow.thresholdInfo.text.puestos": "Cuando todos proponen opciones (puestos) y después votan por las que les importan, esto decide qué tan popular tiene que ser una opción para quedarse.\n\nPor ejemplo, con 10%: si menos del 10% del grupo votó por una opción, se elimina. La idea es quitar del camino las propuestas casi sin apoyo, sin necesitar que el facilitador decida a mano cuáles sobreviven.\n\nSolo afecta las etapas que todavía no se han calculado. Cambiarlo no revive ni elimina nada que ya se haya decidido antes.",
    "flow.trimLabel.cuotas": "% de recorte (alto y bajo) en las cuotas",
    "flow.trimInfo.title": "% de recorte",
    "flow.trimInfo.text.cuotas": "Antes de promediar las propuestas de todos, se descartan las más extremas: las más altas y las más bajas, en la misma proporción.\n\nPor ejemplo, con 10%: se descarta el 10% de las propuestas más altas y el 10% más bajas, y solo se promedia lo que queda en medio.\n\nEsto es el corazón de Democracia por Promedio, evita que una sola persona (o un grupito) jale el resultado hacia un extremo proponiendo un número absurdo a propósito.",

    "obj.backToResults": "← Volver a los resultados",
    "obj.title": "Objetivocracia",
    "obj.subtitle": "Una sociedad horizontal donde decidimos entre todos",
    "obj.intro": "La Objetivocracia es una forma de organizar una sociedad sin gobernantes que manden. En lugar de elegir a quienes decidirán por nosotros, todas las personas deciden juntas qué quieren lograr, y los proyectos para lograrlo los proponen, los ejecutan y los vigilan ciudadanos comunes.\n\nSe apoya en tres herramientas:\n• Democracia por Promedio: para decidir entre todos los objetivos, los impuestos y cuánto invertir en cada cosa, sin ganadores ni perdedores.\n• Decisiones por etapas: para separar qué queremos lograr, cuánto invertir y cómo hacerlo.\n• Democracia por Sorteo: para que la administración de lo común quede en manos de comités de ciudadanos, sin campañas ni carreras políticas.\n\nLo que viste en esta demostración, los impuestos y presupuestos participativos, es solo el primer paso. Aquí te explicamos el sistema completo, por partes. Toca cada título para leer más.",
    "obj.expandAll": "Abrir todo",
    "obj.collapseAll": "Cerrar todo",
    "obj.closing": "Las herramientas existen. Lo que falta es atrevernos a imaginar que millones de personas pueden decidir juntas. Tal vez entonces dejemos de marchar para pedirles a los políticos que lleven agua limpia a nuestros hogares, porque las decisiones sobre el agua, y sobre todo lo demás, estarán en nuestras manos.",
    "obj.soonNote": "Próximamente, la aplicación te permitirá practicar el sistema completo.",
    "obj.s1.title": "1. Los objetivos son lo que decidimos financiar",
    "obj.s1.body": "Los objetivos de una sociedad son aquello en lo que está dispuesta a invertir sus recursos. Por eso no hace falta una votación aparte: los objetivos se obtienen del presupuesto participativo.\n\nCada persona reparte el 100% del presupuesto entre las áreas que le importan, como educación, seguridad, salud o protección del medio ambiente. Puede dividir un área en subáreas. Por ejemplo, dentro de educación: primaria, secundaria, superior o educación continua.\n\nSe promedian los porcentajes de todas las personas, contando como 0% a quien no puso nada en un área. El resultado es la escala de objetivos de la sociedad. Nadie pesa más que nadie. Por ejemplo, si una persona le da 30% a la educación y otra le da 40%, para la sociedad la educación recibe 35%.\n\nAsí, cada objetivo recibe del dinero público justo lo que la sociedad decidió invertir en él: un objetivo que recibe el 10% del presupuesto recibe el 10% de los fondos públicos.",
    "obj.s2.title": "2. Cómo se lleva a cabo lo que decidimos",
    "obj.s2.body": "Una vez decididos el presupuesto o los objetivos, hay que decidir cómo se ejercen los recursos. Hay tres caminos, que se pueden combinar:\n• La república actual: el Poder Ejecutivo ejerce el presupuesto que definió la ciudadanía y el Legislativo hace leyes con base en los objetivos. Puede ser el inicio del proceso, pero por las fallas propias de la república no resuelve por completo los problemas estructurales.\n• Licitaciones: una licitación es una convocatoria abierta en la que cooperativas, universidades, investigadores y ciudadanos presentan proyectos o leyes que cumplan los objetivos y compiten por los fondos públicos. Por ejemplo, una universidad puede diseñar una presa y supervisar su construcción, que realizan trabajadores del Estado o cooperativas. Así las universidades se vuelven motores de investigación y desarrollo.\n• Comités ciudadanos: poco a poco se sustituye la estructura de la república por comités de ciudadanos que prestan un servicio social. Es la parte más radical de la propuesta. Quien esté de acuerdo con los impuestos y presupuestos participativos pero no con los comités puede quedarse con los dos primeros caminos.",
    "obj.s3.title": "3. Quién hace qué",
    "obj.s3.body": "En lugar de gobierno hay administraciones, porque nadie es gobernado. Cada una está formada por:\n• Ciudadanos: reparten el presupuesto, que es lo que define los objetivos, deciden los impuestos y otros temas, como los derechos laborales y los límites a la desigualdad. También pueden vetar decisiones, pedir cambios y pedir auditorías.\n• Administradores: una asamblea elegida por sorteo, dividida en comités por tema. No hacen leyes ni ejecutan obras. Recaudan, reparten los fondos según la escala de objetivos, abren licitaciones, evalúan las propuestas y firman los contratos en nombre de todos.\n• Licitantes: cualquier ciudadano, cooperativa, universidad o investigador que presente un proyecto o un contrato colectivo para lograr los objetivos. No pueden participar quienes estén o hayan estado en la administración, ni quienes hayan sido condenados por corrupción o fraude.\n• Auditores: otra asamblea elegida por sorteo. Vigilan a administradores y licitantes y pueden cancelar proyectos.\n• Otros comités: evaluadores que estudian a fondo un tema, tesoreros que cobran y entregan los recursos, organizadores de las consultas y procesos participativos, y comités judiciales, cuyos jurados también se eligen por sorteo.\n• Trabajadores permanentes: hacen las tareas que requieren continuidad, como el mantenimiento de presas y carreteras, siguiendo los proyectos ganadores y bajo la supervisión de los auditores.",
    "obj.s4.title": "4. Contratos colectivos y proyectos",
    "obj.s4.body": "Las leyes se sustituyen por contratos colectivos. Y las acciones que hoy hace el gobierno, como construir caminos, operar escuelas o dar seguridad, se convierten en proyectos que ganan una licitación. Esto no significa que los servicios sean privados: significa que ciudadanos y grupos son quienes los administran y los proporcionan.\n\nPara que un proyecto sea elegido:\n• Quien lo propone: explica a qué objetivos aporta, qué hará, quién lo hará, cuánto cuesta cada parte, qué resultados medibles promete a corto, mediano y largo plazo, y qué efectos negativos obligarían a detenerlo. También declara si trabajará con familiares o amigos y por qué.\n• Los administradores: lo evalúan por su apego a los objetivos, su eficiencia (qué resultados da por lo que cuesta), su viabilidad y el historial de quien lo propone. Pueden contratar expertos para ayudarse, y las razones de su decisión son públicas.\n• Las personas más afectadas: pueden pedir cambios antes de que se apruebe.\n• Todos los ciudadanos: pueden juntar firmas para vetarlo. El número de firmas necesario también se decide por promedio. Si nadie lo veta, los administradores lo firman en nombre de todos.\n\nUna vez en marcha, los auditores revisan los resultados al menos una vez al año:\n• Menos del 70% de lo prometido: el proyecto se cancela.\n• Menos del 50% de lo prometido: además se puede investigar y llevar a juicio por fraude a quien lo propuso.\n• Una administración completa por debajo del 70%: se investiga y se le puede quitar el cargo.\n• Otras causas de cancelación: mal uso de fondos, corrupción, falta de transparencia, ganancias no declaradas para quien lo propuso o su familia, o efectos secundarios contrarios a los objetivos.",
    "obj.s5.title": "5. Servicio social y comités por sorteo",
    "obj.s5.body": "La propuesta es pedir a cada persona un par de años de servicio social remunerado cuando es joven adulta, y otros antes de retirarse. Es decir, dedicar los primeros y los últimos años de la vida laboral a organizar la sociedad. Así se juntan la mirada hacia el futuro y la fuerza innovadora de la juventud con la experiencia y la estabilidad de las personas mayores.\n\nCuánto tiempo dedica cada edad también se decide por promedio. Por ejemplo, 1 mes al año entre los 13 y los 15 años, 2 años entre los 16 y los 22, y 1 año entre los 66 y los 70. Todas las personas reciben el mismo pago por su servicio, sin importar su nivel económico ni el tipo de servicio.\n\nEntre quienes hacen su servicio cada año se elige por sorteo a los integrantes de comités numerosos, locales, estatales y federales, que poco a poco sustituyen a las secretarías y a los legisladores. Sus integrantes se renuevan de forma escalonada, para que quienes terminan capaciten a quienes llegan.\n\nPor qué reduce la corrupción:\n• Sin campañas: no deciden el dinero, los contactos, el carisma ni la desinformación.\n• Sin sobornos: nadie sabe de antemano quién integrará un comité.\n• Grupos grandes y diversos: es difícil corromperlos a todos.\n• Sin carreras políticas: al terminar su servicio, cada quien regresa a su vida.\n• Con vigilancia: los auditores revisan el trabajo y la ciudadanía puede apelar sus decisiones.\n\nAdemás, todas las personas participan directamente en administrar su sociedad en algún momento de su vida, y eso fortalece la cohesión social. En México, por ejemplo, si jóvenes y adultos mayores dieran dos años de servicio, más de cinco millones de personas lo estarían haciendo al mismo tiempo. Parte de ese servicio puede ser primera respuesta ante emergencias, reforestación, limpieza de zonas, apoyo en seguridad pública tras recibir capacitación o construcción de obras públicas.",
    "obj.s6.title": "6. Qué es público y qué es privado",
    "obj.s6.body": "En cada elección, cada persona dice qué recursos, servicios, sectores y mercados quiere que sean públicos, es decir, de todos, y en qué porcentaje. También qué actividades o productos se limitarán o eliminarán, como la tala de árboles o los contaminantes del agua. Lo que no se decide que sea público puede ser privado, siempre dentro de los contratos colectivos.\n\nSe promedia así: se suman los porcentajes de todas las personas, contando también a quienes eligieron 0%, y se divide entre el número total de personas. Por ejemplo, en una sociedad de 10 personas, 1 elige controlar la educación al 100%, 5 al 90%, 3 al 50% y 1 al 0%. La suma es 690, y 690 entre 10 personas da 69%. Entonces el 69% de la educación lo maneja la sociedad en conjunto.\n\n¿Por qué promedio y no mayoría? Una decisión por mayoría deja una minoría perdedora, y eso implica cierta opresión. El promedio incluye a todos con el mismo peso.\n\nHay dos extremos:\n• Todo público: protege del abuso del poder económico, pero cada actividad dependería de la aprobación de una asamblea, y se limitaría la libertad de emprender proyectos personales y de desarrollar lo que la mayoría no prioriza. Es la Objetivocracia Comunista Democrática.\n• Todo privado: sin límites comunes, el poder económico se concentra en pocas manos.\n\nPor eso la propuesta es que los ciudadanos decidan juntos cuánto es público y cuánto privado. Es la Objetivocracia Social Democrática: quien no quiera trabajar en proyectos de la sociedad puede dedicarse a lo que elija, siempre que cumpla los contratos colectivos.",
    "obj.s7.title": "7. Cómo se limita el poder económico",
    "obj.s7.body": "Para que la desigualdad no se convierta en poder sobre los demás, los ciudadanos deciden por promedio cuánta desigualdad aceptan y cómo se limita. Algunas herramientas:\n• Impuestos por nivel de ingresos: se divide a la sociedad en 10 niveles, del más pobre al más rico. Cada persona propone el impuesto para cada nivel y el promedio es el impuesto que se aplica. Si todos eligen 0% para el nivel más pobre, ese nivel no paga impuestos.\n• Impuestos al consumo: bajos para lo básico y altos para lo de lujo. Por ejemplo, 0% para lo indispensable, 10% para lo no necesario pero que conviene que esté al alcance de todos, 30% para lo no básico pero tampoco de lujo, 50% para el lujo y 60% para el lujo exclusivo. Cada porcentaje es el promedio de lo que eligen todas las personas.\n• Tope a la desigualdad: cuántas veces más que el promedio puede acumular una persona al año. Si el tope es 10 y el promedio es 1, la persona más rica puede conservar 10. El excedente se paga a la sociedad en forma de impuestos.\n• Tope a la propiedad privada: cuántas veces más propiedad puede tener quien más tiene que quien menos tiene. Si quien menos tiene 100 metros cuadrados y el límite es 10, quien más tiene puede tener 1,000. Se limita el poder de excluir a otros, no la libertad de usar. Además, se puede cobrar un impuesto anual a las propiedades, como un porcentaje de su valor, también elegido por promedio.\n• Derechos laborales: por promedio se decide el máximo de horas de trabajo al día y de días a la semana, las vacaciones mínimas, la edad de jubilación, la pensión (como porcentaje del salario promedio) y la compensación por accidente laboral. Así todas las empresas compiten bajo las mismas reglas.\n• Cooperativas: se recomienda que las empresas sean cooperativas, donde todos los trabajadores son dueños por igual y deciden juntos. El sueldo de cada puesto es el promedio de lo que eligen los trabajadores y las ganancias se reparten por igual. Pueden trabajar menos horas que el máximo de la sociedad, pero no más.\n\nCon impuestos al consumo y un tope a la desigualdad, puede no ser necesario cobrar impuestos a los salarios ni a las ganancias.",
    "obj.s8.title": "8. Ampliar las oportunidades: préstamos e inversión",
    "obj.s8.body": "Limitar el poder no basta. También hay que darle a todas las personas la posibilidad de emprender. Se propone un sistema de financiamiento que no sea un negocio en sí mismo:\n• Préstamos personales sin intereses: están disponibles para cualquier persona y funcionan como adelanto de sueldo. Por promedio se decide cuántos meses de sueldo se pueden pedir y por cuánto se multiplican para obtener el plazo de pago. Por ejemplo, con un sueldo de $100 al mes, 12 meses adelantados son $1,200, y si el multiplicador elegido es 4, el plazo para pagar es de 48 meses. Solo se niega a quien aún debe un préstamo anterior o fue condenado por corrupción o fraude.\n• Préstamos a cooperativas sin intereses: se calculan con el sueldo promedio de toda la sociedad, por los meses adelantados y por el número de integrantes. Así, los hijos de quienes más tienen y los de quienes menos tienen piden lo mismo. Por ejemplo, $100 por 20 integrantes por 12 meses son $24,000. Mientras se paga, los sueldos de la cooperativa no pueden superar el promedio de la sociedad y los dividendos se usan para pagar la deuda.\n• Inversión de la sociedad: para proyectos más grandes, un comité elegido por sorteo evalúa el plan de negocios. Si lo aprueba, la sociedad se vuelve dueña parcial y recibe dividendos proporcionales. Si la cooperativa quiebra, no queda deuda para sus integrantes. Esta inversión sí puede rechazarse.\n• Ahorros de los integrantes: pueden prestarlos sin intereses a su cooperativa. Los recuperan después de pagar los préstamos de la sociedad, pero eso no les da más poder de decisión ni más ganancias que a los demás.\n• Inversión extranjera: los ciudadanos eligen por promedio el máximo de dividendos que puede llevarse una cooperativa extranjera y el impuesto que se le cobra, para que el trabajo de la sociedad beneficie a la propia sociedad.",
    "obj.s9.title": "9. Comercio exterior, banco central y emergencias",
    "obj.s9.body": "• Comercio exterior: por promedio se decide qué productos conviene producir dentro de la sociedad aunque importarlos sea más barato, cuáles se venden primero en la sociedad antes de exportarse, qué recursos naturales pueden extraer cooperativas extranjeras y cuánto puede depender la economía de otras sociedades.\n• Banco central: los ciudadanos eligen sus objetivos. Por ejemplo, como bajar el desempleo suele implicar más inflación, cada persona elige la inflación que acepta, y el promedio (digamos 4.6%) es el objetivo. Luego los licitantes proponen planes para reducir el desempleo lo más posible con esa inflación, los administradores eligen uno, y los auditores y los ciudadanos juzgan los resultados. Si no funciona, se abre una nueva licitación. Las personas expertas ayudan a lograr los objetivos, pero los objetivos los decide la ciudadanía.\n• Transparencia: se recomienda que la actividad económica sea pública, como la capacidad de producción, el inventario, las ventas y el número de trabajadores, para que licitantes y emprendedores decidan dónde invertir.\n• Emergencias: ante una crisis, como una pandemia, los administradores pueden redirigir recursos y convocar una elección exprés para que los ciudadanos decidan las prioridades, por ejemplo cuánto servicio social se dedica a la emergencia.",
    "obj.s10.title": "10. Cómo empezar poco a poco",
    "obj.s10.body": "No hace falta cambiarlo todo de la noche a la mañana, ni de la misma forma en todas partes. Un camino posible:\n• Primero: impuestos y presupuestos participativos que convivan con el trabajo de los legisladores.\n• Después: objetivos definidos por la ciudadanía y proyectos desarrollados por universidades y cooperativas.\n• Poco a poco: legisladores elegidos por sorteo, una asamblea de auditores y un servicio social que permita sustituir a la Cámara de Diputados y a las secretarías por comités de ciudadanos.\n\nEstos procesos se pueden poner a prueba hoy en una asociación vecinal, una cooperativa o una escuela, y crecer desde ahí.\n\nPruébalo: contesta las preguntas como si vivieras en una Objetivocracia, pide a conocidos que las contesten también, saquen el promedio, comparen sus respuestas con el resultado y debatan si lo aceptarían como legítimo. Esta aplicación sirve justo para eso.\n\nQuedan preguntas abiertas, como las decisiones que no se expresan en números y los derechos de las minorías. Cada una merece su propio texto.",

    "mun.intro.title": "Antes de empezar: esto es solo una demostración",
    "mun.intro.p1": "Lo que vas a ver a continuación no es un proceso real de tu grupo, es una demostración con datos reales, para que sientas cómo se viviría decidir estas cosas de forma horizontal.",
    "mun.intro.p2": "En la antigüedad, muchos filósofos y pensadores no consideraban que votar por personas fuera un proceso democrático. Para ellos, elegir representantes era un proceso aristocrático u oligárquico; pues el poder de decidir se le entregaba a unos cuantos, no se repartía entre todos.",
    "mun.intro.p3": "Concentrar demasiado poder en pocas manos tiende a generar los mismos problemas, sin importar la época: polariza a la sociedad, y termina formando una clase política que vela más por sus propios intereses que por los del ciudadano común.",
    "mun.intro.p4": "Ante las crisis que hoy viven las repúblicas capitalistas, muchas personas buscan la salida en algún salvador a quien entregarle el poder, o simplemente se desencantan de la política y dejan de participar.",
    "mun.intro.p5": "Pero existe otro camino: podemos inyectar procesos de democracia de verdad al sistema actual, para quitarle poder a la clase política y repartirlo entre todos los ciudadanos. Lo que verás aquí son solo algunos de los primeros cambios posibles para transformar una república capitalista en una verdadera democracia.",
    "mun.intro.p6": "En los ejemplos podrás elegir los impuestos de un país, y en qué se gastan, de las decisiones más importantes que cualquier sociedad tiene que tomar.",
    "mun.intro.p7": "Y al final, te adelantamos otro sistema de organización política que podría remplazar por completo a la república, para repartir el poder y las responsabilidades entre todos los ciudadanos.",
    "mun.intro.button": "Entendido, empezar la demostración",
    "onb.welcome.title": "¡Bienvenido a Organicen y decidan!",
    "onb.welcome.text": "¡Vamos a organizarnos y tomar decisiones de forma justa, transparente y eficiente, sin votar para darle poder a una o varias personas, y sin dividir a la sociedad!",
    "onb.trueDemocracy.title": "¿Qué es la verdadera democracia?",
    "onb.trueDemocracy.text": "Elegir representantes, o solo poder escoger entre las opciones que quienes ya tienen el poder nos presentan, no es lo mismo que decidir juntos. Esos procesos concentran el poder en pocas manos, y ahí es más fácil que se abuse de ese poder, o que se divida a la sociedad en bandos.\n\nPor eso creamos esta app: para que cualquier grupo tome decisiones de forma horizontal, sin entregarle el poder a una sola persona, con total transparencia y con procesos muy rápidos y eficientes.\n\nCon los procesos adecuados, decidir juntos une y fortalece al grupo, mientras que votar para darle poder a unas cuantas personas puede dividirlo.",
    "onb.howDecide.title": "¿Cómo se decide sin darle mucho poder a alguien y sin dividir al grupo?",
    "onb.howDecide.text": "Existen formas de decidir que sí reparten el poder entre todos por igual. Aquí usamos tres:",
    "onb.promedio.title": "Democracia por Promedio",
    "onb.promedio.text": "Se presenta una pregunta a los miembros del grupo. Todos proponen una cantidad, y las propuestas de todos se promedian para obtener la decisión grupal.\n\nPara evitar abusos, el facilitador puede pedir que se eliminen los extremos más altos y más bajos.",
    "onb.mayoria.title": "Elección por Mayoría",
    "onb.mayoria.text": "Cuando hay que elegir entre opciones (no números), cada quien vota, y hay distintas formas de definir quién gana:",
    "onb.sorteo.title": "Elección por Sorteo",
    "onb.sorteo.text": "En vez de votar, se elige al azar entre las opciones (o personas) que cumplen ciertos requisitos. Así nadie gana por tener más dinero, fama o presión social, todos parten con las mismas posibilidades.\n\nEs una práctica antigua: en la Atenas clásica, muchos cargos públicos se asignaban por sorteo, precisamente para que el poder no se concentrara en quienes tenían más recursos o influencia.",
    "onb.combining.title": "Combinando estos procesos",
    "onb.combining.text": "Promedio, mayoría y sorteo se pueden combinar para organizar decisiones complejas, en un grupo pequeño, como un condominio, o en una sociedad grande, como una ciudad o un país, sin entregarle demasiado poder a una sola persona ni a un grupo reducido.",
    "onb.3questions.title": "3 preguntas que todo grupo tiene que contestar",
    "onb.3questions.text": "Sin importar el tamaño, los grupos y las sociedades suelen enfrentar las mismas preguntas:",
    "onb.cuotas.title": "Cuotas participativas",
    "onb.cuotas.text": "El grupo decide junto cuánto debe aportar cada quien, usando Democracia por Promedio:",
    "onb.cuotas.closing": "Este mismo proceso lo pueden usar los ciudadanos de una ciudad o un país para decidir sus impuestos.",
    "onb.presupuesto.title": "Presupuesto participativo",
    "onb.presupuesto.text": "Cualquier grupo con dinero disponible, ya sea de cuotas, impuestos, ingresos de un negocio o donativos, puede decidir juntos en qué gastarlo, con un presupuesto participativo.\n\nPrimero, cada quien propone categorías en las que le gustaría invertir el dinero. Una vez que todos pueden verlas, cada quien reparte el 100% del presupuesto entre ellas, según lo que le parezca más importante. Los porcentajes que cada persona asignó a cada categoría se promedian, y así se llega a la decisión grupal de cuánto gastar en cada una.",
    "onb.asociaciones.title": "Asociaciones, clubes y organizaciones",
    "onb.asociaciones.text": "Unimos varios procesos en un solo flujo conectado: primero, el grupo decide las Cuotas participativas de cada quien; ese dinero recaudado se convierte automáticamente en el Presupuesto participativo a repartir entre categorías.\n\nDespués de decidir colectivamente en qué categorías se va a gastar el dinero, los miembros pueden proponer proyectos específicos que usen los recursos de cada categoría. Por ejemplo, si se decidió que el 30% del presupuesto (unos $2,000) se destinará a iluminación, los integrantes pueden proponer cómo usar ese dinero: alguien puede sugerir tiras de luces LED que cuestan $1,800, otra persona lámparas para las esquinas por $1,000, y así sucesivamente. Después, todos votan para elegir el proyecto ganador en cada categoría.\n\nFinalmente, se reparten las responsabilidades del grupo por sorteo entre los miembros.",
    "onb.scale.title": "De grupos chicos a sociedades enteras",
    "onb.scale.text": "Estos mismos procesos se pueden usar en grupos pequeños o en sociedades muy grandes, sin cambiar de fondo cómo funcionan.\n\nPor ejemplo, una ciudad o un país, en vez de elegir cuotas, puede elegir sus impuestos: los ciudadanos deciden juntos cuánto cobrar en cada nivel económico, de la misma forma que un grupo decide su cuota.\n\nDe la misma manera, pueden decidir su presupuesto: primero, qué porcentaje va a cada secretaría del gobierno; con el tiempo, pueden proponer proyectos específicos y detallar su presupuesto tanto como quieran. Los presupuestos que propone cada quien se promedian entre todos, para llegar a la decisión final.",
    "onbEx.personProposes": "{name} propone",
    "onbEx.trimmedNote": "se recortan el más alto y el más bajo",

    "welcome.s1.title": "Te damos la bienvenida a {group}",
    "welcome.s1.text": "{admin} te invitó a este grupo.\n\nJuntos van a decidir las cuotas del grupo.",
    "welcome.s1.textNoAdmin": "Te invitaron a este grupo.\n\nJuntos van a decidir las cuotas del grupo.",
    "welcome.how.title": "¿Cómo vamos a decidir?",
    "welcome.how.text": "Cada integrante envía su propia propuesta de cuánto debería ser la cuota.\n\nDespués se promedian todas las propuestas, y ese promedio es la decisión colectiva.\n\nA esta forma de decidir se le llama democracia por promedio.",
    "welcome.d3.title": "Primero, ¿todos pagan lo mismo?",
    "welcome.d3.text": "Para decidir las cuotas, lo primero es decidir si todos pagan lo mismo o si algunos grupos pagan diferente.\n\nPor ejemplo, en un vecindario los locales comerciales podrían pagar más que las casas.\n\nEsta decisión la tomamos entre todos los integrantes.",
    "welcome.d4.title": "¿Cómo se elige cuántas categorías hay?",
    "welcome.d4.text": "Cada integrante propone cuántas categorías cree que debe haber.\n\nSe suman las propuestas y se dividen entre el número de participantes.\n\nPor ejemplo, si un vecino propone 3 y otro propone 1, entonces (3 + 1) ÷ 2 = 2. La decisión colectiva es de 2 categorías.",
    "welcome.d4.exampleQuestion": "Pregunta: ¿cuántas categorías de cuota debe haber?",
    "welcome.d5.title": "¿Cómo decidimos cuáles son las categorías?",
    "welcome.d5.text": "Cada vecino puede escribir los nombres de las categorías que se le ocurran. Después, todos reciben la lista completa de nombres.\n\nEntonces se les pide que unan las categorías que creen que son la misma. Si más de la mitad unió dos categorías, esas dos pasan a ser una sola.\n\nCuando termina esa etapa, cada vecino elige, entre las que quedaron, las categorías que considera más adecuadas (tantas como se decidió en el paso anterior, por ejemplo dos). Avanzan las que tengan más votos.",
    "welcome.d6.title": "¿Y cuánto paga cada categoría?",
    "welcome.d6.text": "Cada vecino elige cuánto debería ser la cuota de cada una de las categorías que resultaron.\n\nLas respuestas se promedian por categoría, y así sale la cuota de cada una.",

  en: {
    "home.explain.title": "Explanation and examples",
    "home.explain.subtitle": "How average-based democracy and the app work.",
    "home.cuotas.title": "Participatory dues or fees",

    "home.asociaciones.title": "Complete flow for associations and organizations",

    "home.cooperativas.title": "Cooperatives",

    "home.promedio.title": "Average-Based Democracy",
    "home.promedio.subtitle": "Everyone proposes a number and the group decides with the average.",
    "home.mayoria.title": "Democracy by majority",
    "home.mayoria.subtitle": "Choose between options: simple, absolute or qualified majority, ranked voting or runoff.",
    "home.tabulador.title": "Wage tabulator",
    "home.tabulador.subtitle": "Define the roles and decide how much each one earns, with or without an inequality limit.",
    "home.howBtn": "How does the app work?",
    "hdr.steps.promedio": "Build your group|Write the questions|Share the link|Take part too|Decide together!",
    "hdr.steps.mayoria": "Build your group|Questions and options|Share the link|Take part too|Decide together!",
    "hdr.steps.tabulador": "Build your group|Define the roles|Propose the wages|Approve the result|Decide together!",
    "mun.tab.objetivocracia": "Objetivocracia",
    "secex.ask.title": "Do you want to see how this section works?",
    "secex.ask.body": "I will explain with an example what you do as the facilitator, how each person takes part, what options you have and how the results are calculated.",
    "secex.ask.yes": "See the explanation",
    "secex.ask.no": "Continue without it",
    "secex.ask.again": "See this section's explanation",
    "secex.title.1": "What you do as the facilitator",
    "secex.title.2": "How people take part",
    "secex.title.3": "Your options",
    "secex.title.4": "How the results are calculated",
    "secex.title.5": "An example",
    "secex.promedio.1": "You create the group and write one or more questions whose answer is a number. For example: how many hours a week do we spend cleaning the park?\nYou choose whether to trim the extremes and whether there will be a time limit.\nYou share the group link. If you chose to approve requests, you decide who gets in.\nYou can also take part with your own proposal, just like any member.\nWhen time runs out, or when you decide, you close the questions and the app calculates the result.",
    "secex.promedio.2": "Each person enters with the link and writes their name.\nThey see the questions one by one, write the number they think is fair and send it.\nNobody needs to agree beforehand: each person proposes what they think.\nIf you chose anonymous proposals, only the numbers are shown at the end, not who proposed which.\nWhen you close, everyone sees the group's result.",
    "secex.promedio.3": "• More questions: you can add several questions to the same group, before setting the time limit.\n• Trim: a percentage that removes the highest and lowest extremes before averaging. With 0% everything is averaged.\n• Time limit: yes or no, in days, hours and minutes. When it ends, the app closes and calculates on its own. With no limit, you close.\n• Who takes part: you approve each request, or anyone with the code can join.\n• Proposals: anonymous, numbers only, or visible, with each person's name.",
    "secex.promedio.4": "The app sorts all the proposals from lowest to highest.\nIt removes the trim percentage at each end: the same number of very low and very high proposals.\nIt averages the ones that remain. That average is the group's decision.\nNo one weighs more than anyone else: each person contributes a single number and all count the same.",
    "secex.promedio.5": "Question: how many hours a week do we spend cleaning the park?\n10 people propose: 2, 3, 3, 4, 4, 5, 5, 6, 8 and 10.\nWith a 10% trim, the 2 and the 10 are discarded.\n3, 3, 4, 4, 5, 5, 6 and 8 are averaged. They add up to 38, and 38 divided by 8 is 4.75.\nThe group's decision is 4.75 hours a week.",
    "secex.mayoria.1": "You create the group and write a question with the options everyone will see. For example: which day do we hold the assembly?\nYou choose how the winner is defined: simple, absolute or qualified majority, ranked voting or a runoff election.\nYou can add more questions, each with its own options and its own rule, and you decide whether there will be a time limit.\nYou share the link. When time runs out, or when you decide, the app calculates the result. In a runoff, if you set no limit, you close each round.\nYou can also vote, just like any member.",
    "secex.mayoria.2": "Each person sees the question and the same options as everyone else.\nThey vote for the option they prefer. In ranked voting they rank all the options, from the one they like most to the one they like least.\nIn a runoff they vote in rounds: when each round closes the least-voted options are eliminated and people vote again among the ones left.\nAt the end everyone sees the result and how it was calculated.",
    "secex.mayoria.3": "• Simple: the option with the most votes wins, regardless of the percentage.\n• Absolute: the winning option needs more than 50% of the votes.\n• Qualified: the winning option needs to pass the percentage you set, over 50%.\n• Ranked voting: each person ranks the options and the app calculates the winner on its own, in rounds.\n• Runoff: voting happens in rounds. You set how many rounds there are and the minimum % to survive.\n• More questions: you add them before the time limit. Each one can have a different rule.\n• Time limit: yes or no. In a runoff it applies to each round.",
    "secex.mayoria.4": "• Simple: the votes are counted and the option with the most wins. If there is a tie, people vote again only among the tied options.\n• Absolute: the one that passes 50% wins. If none does, another round of participation is needed.\n• Qualified: the same as absolute, but with the percentage you set.\n• Ranked voting: first places are counted. If nobody passes 50%, the option with the fewest votes is eliminated and those votes pass to each person's next preference. This repeats until someone passes 50%.\n• Runoff: in each round the options with no votes and those below the minimum % are eliminated. Then people vote again among the ones left.",
    "secex.mayoria.5": "Question: which day do we hold the assembly? 11 people vote: Saturday 5, Friday 4 and Sunday 2.\nSimple majority: Saturday wins, because it has the most votes.\nAbsolute majority: there is no winner, because 5 of 11 is 45% and no option passes 50%.\nRanked voting: Sunday is eliminated and its 2 votes pass to each person's next preference. If one goes to Saturday and one to Friday, Saturday ends with 6 votes and Friday with 5. Saturday wins with 55%.",
    "secex.cuotas.1": "You create the group and choose one of two versions.\nSimplified version: you write how many dues or fees categories there are and what they are called (for example, Houses and Shops, or just one if everyone pays the same), decide whether there will be a time limit and send the questions.\nMore democratic version: the group decides everything, from how many categories there are to how much each one pays.\nIn both, at the end the group approves or rejects the result. If it is rejected, the process starts again.",
    "secex.cuotas.2": "Simplified version: each person proposes how much the dues or fees of each category should be.\nDemocratic version: first they propose how many categories there should be and what they are called, mark together the ones that are the same, rank them by preference and then propose the amount for each one.\nAt the end everyone votes on whether they approve the result.",
    "secex.cuotas.3": "• Version: simplified, which is faster, or more democratic, which is more participatory.\n• Categories: in the simplified one you write them. You can enter how many people are in each one, so the app calculates how much is collected.\n• Time limit: in the simplified version, yes or no, in minutes, hours or days. The maximum is 60 days.\n• Trim: the highest and lowest extremes are removed before averaging. The default is 10%.\n• Minimum % of support: in the democratic one, a proposed category needs this support to stay. The default is 10%.",
    "secex.cuotas.4": "• How many categories: the proposals are averaged and rounded. If it lands exactly on .5, it rounds down.\n• Names: the support for each name is counted. Those that do not reach the minimum % are discarded, and if more than half merged two names, they become one. Then they are ranked by preference and the number decided stays.\n• Amount for each category: the proposals are averaged, after removing the trim at the extremes.\n• Total collected: if you entered how many people are in each category, the app multiplies and adds.\n• Approval: Yes or No wins by simple majority.",
    "secex.cuotas.5": "A condo with 10 neighbors. With the simplified version, you write two categories: Houses, with 8 people, and Shops, with 2.\nThe neighbors propose the amount for each one. After the trim, the averages are 500 for Houses and 900 for Shops.\nThe app calculates: 8 × 500 + 2 × 900 = 5,800 collected in total.\nThen the neighbors vote on whether they approve the result.",
    "secex.presupuesto.1": "You create the group and write the fixed expenses that already exist, such as rent or utilities. If you want, also the available budget.\nYou share the link. The group proposes spending categories, merges the ones that are the same, chooses the ones that matter and distributes 100% of the budget.\nYou close each stage when everyone has answered or whenever you want to move on.\nAt the end the group approves the result and decides whether to open a project proposal process.",
    "secex.presupuesto.2": "1. Each person proposes spending categories, up to 5.\n2. Everyone sees the full list and marks together the ones that are the same.\n3. Each person chooses the categories that matter to them.\n4. Each person distributes 100% of the budget among the categories that remain. Fixed expenses already come with a reference % that can be moved.\n5. Everyone votes on whether they approve the result.",
    "secex.presupuesto.3": "• Fixed expenses: you write them, with their amount. They are preloaded as a reference percentage.\n• Available budget: it is optional. If you enter it, the app converts each % into money.\n• Minimum % of support: a category needs this support to stay. The default is 10%.\n• Closing stages: you decide when each one ends and move on.\n• Project proposals: at the end, the group decides whether to open that process.",
    "secex.presupuesto.4": "• Categories: those that do not reach the minimum % of support are discarded. If none does, the most supported one stays.\n• Distribution: the % each person assigned to each category is averaged. Anyone who left it blank counts as 0%.\n• Adjustment: if the averages do not add up to 100%, the app adjusts them proportionally.\n• Money: if you entered the available budget, each % is also shown as money.",
    "secex.presupuesto.5": "A group with 10,000 available and three categories: Maintenance, Parties and Savings.\nEveryone's averages are: Maintenance 50%, Parties 30% and Savings 20%.\nThe app shows the split as money: 5,000, 3,000 and 2,000.\nThe group votes on whether it approves the result.",
    "secex.responsables.1": "You create the group and share the link. You do not pick anyone by hand: the app guides the process.\nThe group proposes the roles (some are already suggested: Treasurer, Auditor and Facilitator), decides which ones stay and whether the drawing is just once or a rotating 12-month schedule.\nThe candidate list fills itself with the group's members, and the group approves or adjusts it.\nWhen everything is ready, you run the drawing.",
    "secex.responsables.2": "Each person proposes roles and marks together the ones that are the same.\nThey choose the roles they think the group should have.\nThey vote on whether roles are assigned just once or with a rotating schedule.\nThey approve the candidate list, or ask to remove or add people.\nNobody votes for people: the drawing decides.",
    "secex.responsables.3": "• Just once: each role is drawn once, with no schedule, and that person stays indefinitely.\n• Rotating schedule: a 12-month calendar is drawn all at once saying who holds each role, month by month.\n• Candidates: they are filled in with the group's members. If the group does not approve the list, people are removed or added.\n• Minimum % of support: a proposed role needs this support to stay. The default is 10%.",
    "secex.responsables.4": "The app picks at random among the candidates, securely and impossible to manipulate.\nNo one repeats the same role twice in a row or holds two roles in the same period.\nIn the rotating schedule, each person drops out of the drawing once they get a role, until everyone has had one. Then everyone is back in the pool and the assigning continues.\nEveryone sees the result of the drawing and the history.",
    "secex.responsables.5": "A group of 6 people with 3 roles: Treasurer, Auditor and Facilitator.\nThe app draws the 12-month calendar all at once.\nIn the first month Marta, Luis and Ana come out, and they leave the drawing. In the second month the draw is among the other 3 people.\nFrom the third month on everyone goes back in and the cycle repeats.",
    "secex.tabulador.1": "You create the group and share the link.\nThe group first decides whether it wants a limit on the inequality between the highest and lowest earner.\nYou define the roles, and the group approves the list.\nThe group chooses whether wages are decided per hour or per month, and proposes how much each role earns.\nYou close each stage whenever you want to move on.",
    "secex.tabulador.2": "They vote on whether they want an inequality limit. If they say yes, each person proposes how many times more the highest earner should make.\nThey approve or reject the list of roles you defined.\nThey vote on whether wages are per hour or per month.\nThey propose how much each role should earn. If there is a limit, the app does not let a proposal that goes over it be sent.\nAt the end they approve or reject the result.",
    "secex.tabulador.3": "• Inequality limit: the group decides whether it exists. If it does, it sets how many times more the best paid role can earn.\n• Roles: you define them. If the group does not approve them, you adjust them.\n• Per hour or per month: the group decides by simple majority.\n• Trim: the highest and lowest extremes of the proposed wages are removed. The default is 10%.",
    "secex.tabulador.4": "• Limit: everyone's answers are averaged, with no trim. If the average is 3, the best paid role cannot earn more than 3 times the lowest paid.\n• Wage for each role: the proposals for that role are averaged, after removing the trim.\n• Approvals: the list of roles and the final result need more than 50%. If they are not approved, people propose again.",
    "secex.tabulador.5": "A group decides there will be a limit. Everyone's proposals average 3 times.\nRoles: Coordination, Workshop and Cleaning. Wages are per month.\nAfter the trim, the averages are: Coordination 12,000, Workshop 8,000 and Cleaning 5,000.\nThe difference between the highest and lowest earner is 2.4 times, within the limit of 3.",
    "secex.asociaciones.1": "You create the group once and run four connected processes, one after the other: dues or fees, budget, project proposals and assigning responsibilities.\nWhen a process closes, the app takes you to the next one. The money collected with the dues or fees arrives on its own as the budget to distribute.\nYou decide when to close each stage. Project proposals and assigning responsibilities only open if the group votes for it.",
    "secex.asociaciones.2": "They take part in order:\n1. Dues or fees: they propose how much each category should pay and approve the result.\n2. Budget: they propose spending categories, choose the ones that matter and distribute 100%.\n3. Project proposals: in each category, anyone can propose projects with their cost. They are all revealed together when submissions close, and then each person votes for one project in each category.\n4. Responsibilities: they propose roles, approve candidates and the drawing is run.",
    "secex.asociaciones.3": "• Dues or fees and budget: they have the same options as when used separately.\n• Project proposals: the group votes on whether to open them. You close submissions to move to voting, close the voting and can reopen the categories that got no proposals.\n• Responsibilities: they only open if more than 50% of the group votes yes.\n• Timing: you close each stage at your own pace.",
    "secex.asociaciones.4": "• Dues or fees and budget: they are calculated the same way as separately.\n• Money: what is collected with the dues or fees becomes the budget to distribute.\n• Projects: in each category the project with the most votes wins. If there is a tie, another round opens in which proposals can be edited or added. If the tie continues after several rounds, that category is left with no winner.\n• Responsibilities: they are drawn among the candidates, with no repeats.",
    "secex.asociaciones.5": "A club of 10 people. Dues or fees: 5,800 are collected.\nBudget: Maintenance receives 50%, that is 2,900.\nProjects: for Maintenance, painting the hall and fixing the water pump are proposed, each with its cost. When submissions close they are revealed and the club votes. The one with the most votes wins.\nResponsibilities: the club votes on whether it wants to draw roles and the app assigns Treasurer, Auditor and Facilitator.",
    "qwel.title": "Welcome to: {group}",
    "qwel.invited": "{admin} invited you to this group.",
    "qwel.invitedNoAdmin": "You were invited to this group.",
    "qwel.decide": "Together you will decide:",
    "qwel.how": "How are we going to decide?",
    "qwel.part": "How do you take part?",
    "qwel.ruleIntro1": "The facilitator chose this way of deciding:",
    "qwel.ruleIntroN": "The facilitator chose these ways of deciding, one per question:",
    "qwel.prom": "Each member proposes a number for each question.\n\nThen all the proposals are averaged, and that average is the collective decision. If the facilitator asked for a trim, the highest and lowest proposals are discarded first.\n\nThis way of deciding is called average-based democracy.",
    "qwel.promPart": "Each person enters with the link and writes their name.\nThey see the questions one by one, write the number they think is fair and send it.\nNobody needs to agree beforehand: each person proposes what they think.\nIf you chose anonymous proposals, only the numbers are shown at the end, not who proposed which.\nWhen you close, everyone sees the group's result.",
    "qwel.mayPart": "Each question has the same options for everyone. You choose the one you prefer and send your vote.\n\nIf there is a time limit, you will see a countdown.",
    "qwel.mayPartRank": "To rank, tap the options in the order of your preference: the one you like most first.",
    "qwel.mayPartSeg": "You will vote in more than one round. When a round closes, you vote again among the options that remain.",
    "qwel.rule.simple": "Each person votes for one option. The option with the most votes wins, regardless of the percentage.\n\nFor example, if Saturday has 5 votes, Friday 4 and Sunday 2, Saturday wins.",
    "qwel.rule.absoluta": "Each person votes for one option. To win, an option needs more than 50% of the votes.\n\nFor example, with 11 votes, an option needs at least 6. If the most voted has 5, nobody wins and another round of participation is needed.",
    "qwel.rule.calificada": "Each person votes for one option. To win, an option needs to pass a percentage the facilitator set, over 50%.\n\nFor example, if the percentage is 66% and 11 people vote, an option needs at least 8 votes.",
    "qwel.rule.rankeado": "You do not vote for a single option: you rank them from the one you like most to the one you like least. The app counts first places. If none passes 50%, it eliminates the option with the fewest votes and passes those votes to each person's next preference. It repeats until one option passes 50%.\n\nThis way your vote is not lost if your favorite option is eliminated.",
    "qwel.rule.segunda_vuelta": "You vote for a single option in each round. When the round closes, the options with no votes and those below the minimum percentage the facilitator set are eliminated. Then people vote again among the ones left.\n\nFor example, if Sunday ends with 18% and the minimum is 20%, Sunday is eliminated and round 2 is only between Saturday and Friday.",

    "flow.thresholdInfo.title": "Minimum support %",
    "flow.thresholdInfo.text.categorias": "When everyone proposes options (categories) and then votes for the ones that matter to them, this decides how popular an option needs to be to survive.\n\nFor example, with 10%: if less than 10% of the group voted for an option, it gets removed. The idea is to clear away proposals with almost no support, without the facilitator having to decide by hand which ones survive.\n\nThis only affects stages that haven't been calculated yet. Changing it doesn't revive or remove anything already decided.",
    "flow.thresholdInfo.text.puestos": "When everyone proposes options (roles) and then votes for the ones that matter to them, this decides how popular an option needs to be to survive.\n\nFor example, with 10%: if less than 10% of the group voted for an option, it gets removed. The idea is to clear away proposals with almost no support, without the facilitator having to decide by hand which ones survive.\n\nThis only affects stages that haven't been calculated yet. Changing it doesn't revive or remove anything already decided.",
    "flow.trimLabel.cuotas": "Trim % (highest and lowest) on the dues or fees",
    "flow.trimInfo.title": "Trim %",
    "flow.trimInfo.text.cuotas": "Before averaging everyone's proposals, the most extreme ones are discarded: the highest and the lowest, in the same proportion.\n\nFor example, with 10%: the top 10% of proposals and the bottom 10% are discarded, and only what's left in the middle gets averaged.\n\nThis is the heart of Average-Based Democracy. It stops a single person (or a small group) from pulling the result toward an extreme by proposing an absurd number on purpose.",

    "mun.trueSystemNote": "A truly democratic system to replace republics.",
    "mun.openObjetivocracia": "Learn about Objetivocracia",
    "obj.backToResults": "← Back to the results",
    "obj.title": "Objetivocracia",
    "obj.subtitle": "A horizontal society where we decide together",
    "obj.intro": "Objetivocracia is a way of organizing a society without rulers who give orders. Instead of electing people to decide for us, everyone decides together what they want to achieve, and the projects to achieve it are proposed, carried out and watched over by ordinary citizens.\n\nIt rests on three tools:\n• Average-Based Democracy: to decide together on the objectives, the taxes and how much to invest in each thing, with no winners or losers.\n• Decisions in stages: to separate what we want to achieve, how much to invest and how to do it.\n• Democracy by Lottery: so that the administration of what we share is in the hands of citizen committees, with no campaigns and no political careers.\n\nWhat you saw in this demo, participatory taxes and budgets, is only the first step. Here we explain the whole system, part by part. Tap each title to read more.",
    "obj.expandAll": "Open all",
    "obj.collapseAll": "Close all",
    "obj.closing": "The tools exist. What we lack is the courage to imagine that millions of people can decide together. Maybe then we will stop marching to ask politicians to bring clean water to our homes, because the decisions about water, and about everything else, will be in our hands.",
    "obj.soonNote": "Coming soon, the app will let you practice the complete system.",
    "obj.s1.title": "1. The objectives are what we decide to fund",
    "obj.s1.body": "The objectives of a society are what it is willing to invest its resources in. That is why no separate vote is needed: the objectives come from the participatory budget.\n\nEach person distributes 100% of the budget among the areas they care about, such as education, safety, health or environmental protection. They can split an area into sub-areas. For example, within education: primary, secondary, higher or continuing education.\n\nEveryone's percentages are averaged, counting as 0% anyone who left an area blank. The result is the society's scale of objectives. Nobody weighs more than anybody else. For example, if one person gives 30% to education and another gives 40%, then for society education receives 35%.\n\nThis way, each objective receives from public money exactly what society decided to invest in it: an objective that receives 10% of the budget receives 10% of the public funds.",
    "obj.s2.title": "2. How we carry out what we decide",
    "obj.s2.body": "Once the budget or the objectives are decided, we need to decide how the resources are used. There are three paths, which can be combined:\n• The current republic: the Executive branch spends the budget that citizens defined and the Legislature makes laws based on the objectives. It can be the start of the process, but because of the republic's own flaws it does not fully solve the structural problems.\n• Open bids: an open bid is a public call in which cooperatives, universities, researchers and citizens present projects or laws that meet the objectives and compete for public funds. For example, a university can design a dam and supervise its construction, which is carried out by state workers or cooperatives. This way universities become engines of research and development.\n• Citizen committees: little by little, the republic's structure is replaced by committees of citizens who perform social service. This is the most radical part of the proposal. Whoever agrees with participatory taxes and budgets but not with the committees can stay with the first two paths.",
    "obj.s3.title": "3. Who does what",
    "obj.s3.body": "Instead of a government there are administrations, because nobody is ruled. Each one is made up of:\n• Citizens: they distribute the budget, which is what defines the objectives, decide the taxes and other issues, such as labor rights and limits on inequality. They can also veto decisions, ask for changes and ask for audits.\n• Administrators: an assembly chosen by lottery, divided into committees by topic. They do not make laws or carry out works. They collect funds, distribute them according to the scale of objectives, open bids, evaluate proposals and sign contracts on behalf of everyone.\n• Bidders: any citizen, cooperative, university or researcher who presents a project or a collective contract to achieve the objectives. People who are or have been in the administration cannot take part, nor can anyone convicted of corruption or fraud.\n• Auditors: another assembly chosen by lottery. They watch over administrators and bidders and can cancel projects.\n• Other committees: evaluators who study a topic in depth, treasurers who collect and deliver the resources, organizers of consultations and participatory processes, and judicial committees, whose juries are also chosen by lottery.\n• Permanent workers: they do the tasks that need continuity, such as maintaining dams and roads, following the winning projects and under the supervision of the auditors.",
    "obj.s4.title": "4. Collective contracts and projects",
    "obj.s4.body": "Laws are replaced by collective contracts. And the actions that governments do today, such as building roads, running schools or providing security, become projects that win an open bid. This does not mean services become private: it means citizens and groups are the ones who manage and provide them.\n\nFor a project to be chosen:\n• Whoever proposes it: explains which objectives it serves, what will be done, who will do it, what each part costs, what measurable results it promises in the short, medium and long term, and what negative effects would force it to stop. They also state whether they will work with relatives or friends, and why.\n• The administrators: evaluate it by how well it fits the objectives, its efficiency (what results it gives for what it costs), its viability and the track record of whoever proposes it. They can hire experts to help, and the reasons for their decision are public.\n• The people most affected: can ask for changes before it is approved.\n• All citizens: can gather signatures to veto it. The number of signatures needed is also decided by averaging. If nobody vetoes it, the administrators sign it on behalf of everyone.\n\nOnce a project is running, the auditors review the results at least once a year:\n• Less than 70% of what was promised: the project is canceled.\n• Less than 50% of what was promised: whoever proposed it can also be investigated and taken to trial for fraud.\n• A whole administration below 70%: it is investigated and can be removed from office.\n• Other reasons for cancellation: misuse of funds, corruption, lack of transparency, undisclosed gains for the proposer or their family, or side effects that go against the objectives.",
    "obj.s5.title": "5. Social service and committees by lottery",
    "obj.s5.body": "The proposal is to ask each person for a couple of years of paid social service as a young adult, and a couple more before retiring. In other words, to dedicate the first and last years of working life to organizing society. This brings together the forward-looking view and innovative strength of youth with the experience and stability of older people.\n\nHow much time each age group gives is also decided by averaging. For example, 1 month a year between ages 13 and 15, 2 years between 16 and 22, and 1 year between 66 and 70. Everyone is paid the same for their service, regardless of their economic level or the type of service.\n\nAmong the people doing their service each year, members of large local, state and federal committees are chosen by lottery, and little by little they replace the ministries and legislators. Members are renewed in staggered turns, so that those finishing train those arriving.\n\nWhy this reduces corruption:\n• No campaigns: money, contacts, charisma and disinformation do not decide.\n• No bribes: nobody knows in advance who will be on a committee.\n• Large, diverse groups: it is hard to corrupt all of them.\n• No political careers: when their service ends, everyone returns to their own life.\n• Oversight: auditors review the work and citizens can appeal its decisions.\n\nIn addition, everyone takes part directly in administering their society at some point in their life, which strengthens social cohesion. In Mexico, for example, if young people and older adults gave two years of service, more than five million people would be doing it at the same time. Part of that service can be emergency first response, reforestation, cleaning up areas, support in public safety after training, or building public works.",
    "obj.s6.title": "6. What is public and what is private",
    "obj.s6.body": "In each election, every person says which resources, services, sectors and markets they want to be public, that is, owned by everyone, and in what percentage. They also say which activities or products should be limited or eliminated, such as logging or water pollutants. What is not decided to be public can be private, always within the collective contracts.\n\nThe average works like this: the percentages of all people are added up, including those who chose 0%, and divided by the total number of people. For example, in a society of 10 people, 1 chooses to control education at 100%, 5 at 90%, 3 at 50% and 1 at 0%. The sum is 690, and 690 divided by 10 people gives 69%. So 69% of education is run by society together.\n\nWhy an average and not a majority? A majority decision leaves a losing minority, and that implies a certain oppression. The average includes everyone with the same weight.\n\nThere are two extremes:\n• Everything public: it protects against abuse of economic power, but every activity would depend on an assembly's approval, and the freedom to pursue personal projects and to develop what the majority does not prioritize would be limited. This is the Democratic Communist Objetivocracia.\n• Everything private: without common limits, economic power concentrates in a few hands.\n\nThat is why the proposal is for citizens to decide together how much is public and how much is private. This is the Democratic Social Objetivocracia: whoever does not want to work on society's projects can dedicate themselves to whatever they choose, as long as they comply with the collective contracts.",
    "obj.s7.title": "7. How economic power is limited",
    "obj.s7.body": "So that inequality does not turn into power over others, citizens decide by averaging how much inequality they accept and how it is limited. Some tools:\n• Taxes by income level: society is divided into 10 levels, from poorest to richest. Each person proposes the tax for each level and the average is the tax that applies. If everyone chooses 0% for the poorest level, that level pays no taxes.\n• Taxes on consumption: low for basics and high for luxuries. For example, 0% for essentials, 10% for things that are not necessary but are good to keep within everyone's reach, 30% for things that are not basic but not luxury either, 50% for luxury and 60% for exclusive luxury. Each percentage is the average of what everyone chooses.\n• A cap on inequality: how many times more than the average a person can accumulate in a year. If the cap is 10 and the average is 1, the richest person can keep 10. The excess is paid to society as taxes.\n• A cap on private property: how many times more property the person with the most can own compared to the person with the least. If the person with the least owns 100 square meters and the limit is 10, the person with the most can own 1,000. This limits the power to exclude others, not the freedom to use. A yearly property tax can also be charged, as a percentage of the property's value, also chosen by averaging.\n• Labor rights: by averaging, citizens decide the maximum hours of work per day and days per week, the minimum vacation, the retirement age, the pension (as a percentage of the average salary) and the compensation for work accidents. This way all companies compete under the same rules.\n• Cooperatives: it is recommended that businesses be cooperatives, where all workers are equal owners and decide together. The pay for each position is the average of what the workers choose, and profits are shared equally. They can work fewer hours than the society's maximum, but not more.\n\nWith consumption taxes and a cap on inequality, taxes on salaries and profits may not be necessary.",
    "obj.s8.title": "8. Expanding opportunities: loans and investment",
    "obj.s8.body": "Limiting power is not enough. Everyone must also have the chance to start something of their own. A financing system is proposed that is not a business in itself:\n• Interest-free personal loans: they are available to anyone and work as a salary advance. By averaging, citizens decide how many months of salary can be requested and what number multiplies them to get the repayment period. For example, with a salary of $100 a month, 12 months in advance is $1,200, and if the chosen multiplier is 4, the repayment period is 48 months. A loan is only denied to someone who still owes a previous loan or was convicted of corruption or fraud.\n• Interest-free loans to cooperatives: they are calculated using the average salary of the whole society, times the months in advance, times the number of members. This way, the children of the wealthiest and of the poorest can request the same. For example, $100 times 20 members times 12 months is $24,000. While it is being repaid, the cooperative's salaries cannot exceed the society's average and the dividends are used to pay the debt.\n• Investment by society: for larger projects, a committee chosen by lottery evaluates the business plan. If approved, society becomes a partial owner and receives proportional dividends. If the cooperative goes bankrupt, its members are left with no debt. This investment can be rejected.\n• Members' savings: they can lend them interest-free to their cooperative. They are paid back after the society's loans are repaid, but this gives them no more decision power or profits than anyone else.\n• Foreign investment: citizens choose by averaging the maximum dividends a foreign cooperative can take and the tax charged on them, so that the work of the society benefits the society itself.",
    "obj.s9.title": "9. Foreign trade, the central bank and emergencies",
    "obj.s9.body": "• Foreign trade: by averaging, citizens decide which products should be made inside the society even if importing them is cheaper, which are sold first inside the society before being exported, which natural resources foreign cooperatives can extract, and how much the economy can depend on other societies.\n• Central bank: citizens choose its objectives. For example, since lowering unemployment usually means more inflation, each person chooses the inflation they accept, and the average (say 4.6%) is the target. Then bidders propose plans to reduce unemployment as much as possible within that inflation, the administrators choose one, and auditors and citizens judge the results. If it does not work, a new open bid is held. Experts help achieve the objectives, but the objectives are decided by the citizens.\n• Transparency: it is recommended that economic activity be public, such as production capacity, inventory, sales and number of workers, so that bidders and entrepreneurs can decide where to invest.\n• Emergencies: in a crisis, such as a pandemic, administrators can redirect resources and call an express election so citizens decide the priorities, for example how much social service goes to the emergency.",
    "obj.s10.title": "10. How to start little by little",
    "obj.s10.body": "There is no need to change everything overnight, or in the same way everywhere. One possible path:\n• First: participatory taxes and budgets that coexist with the work of legislators.\n• Then: objectives defined by citizens and projects developed by universities and cooperatives.\n• Little by little: legislators chosen by lottery, an assembly of auditors and a social service that makes it possible to replace the Chamber of Deputies and the ministries with committees of citizens.\n\nThese processes can be tested today in a neighborhood association, a cooperative or a school, and grow from there.\n\nTry it: answer the questions as if you lived in an Objetivocracia, ask people you know to answer them too, calculate the average, compare your answers with the result and debate whether you would accept it as legitimate. This app is made for exactly that.\n\nOpen questions remain, such as decisions that cannot be expressed in numbers and the rights of minorities. Each one deserves its own text.",
