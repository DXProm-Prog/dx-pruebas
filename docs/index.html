    "mun.intro.title": "Before you start: this is just a demo",
    "mun.intro.p1": "What you're about to see is not a real process for your group, it's a demo using real data, so you can get a feel for what deciding these things horizontally would be like.",
    "mun.intro.p2": "In antiquity, many philosophers and thinkers didn't consider voting for people to be a democratic process. To them, electing representatives was an aristocratic or oligarchic process; the power to decide was handed to a few, not shared among everyone.",
    "mun.intro.p3": "Concentrating too much power in few hands tends to produce the same problems, regardless of the era: it polarizes society, and ends up forming a political class that looks out for its own interests more than the average citizen's.",
    "mun.intro.p4": "Faced with the crises capitalist republics live through today, many people look for a way out in some savior to hand power to, or simply become disillusioned with politics and stop participating.",
    "mun.intro.p5": "But there's another path: we can inject real democracy processes into the current system, to take power away from the political class and share it among all citizens. What you'll see here is just some of the first possible changes to transform a capitalist republic into a real democracy.",
    "mun.intro.p6": "In the examples you'll be able to choose a country's taxes, and what they're spent on, some of the most important decisions any society has to make.",
    "mun.intro.p7": "And at the end, we'll give you a preview of another political system that could fully replace the republic, to share power and responsibilities among all citizens.",
    "mun.intro.button": "Got it, start the demo",
    "onb.welcome.title": "Welcome to Organize and Decide!",
    "onb.welcome.text": "Let's organize and make decisions in a fair, transparent, and efficient way, without voting to give power to one or a few people, and without dividing society!",
    "onb.trueDemocracy.title": "What is real democracy?",
    "onb.trueDemocracy.text": "Electing representatives, or only being able to choose among the options that those already in power present to us, isn't the same as deciding together. Those processes concentrate power in few hands, and that makes it easier for that power to be abused, or for society to split into factions.\n\nThat's why we built this app: so any group can make decisions horizontally, without handing power to a single person, with full transparency and very fast, efficient processes.\n\nWith the right processes, deciding together unites and strengthens the group, while voting to give power to a few people can divide it.",
    "onb.howDecide.title": "How do you decide without giving too much power to anyone, and without dividing the group?",
    "onb.howDecide.text": "There are ways to decide that really do split power equally among everyone. Here we use three:",
    "onb.promedio.title": "Average-Based Democracy",
    "onb.promedio.text": "A question is presented to the group's members. Everyone proposes an amount, and everyone's proposals are averaged to reach the group decision.\n\nTo prevent abuse, the facilitator can ask for the highest and lowest extremes to be removed.",
    "onb.mayoria.title": "Majority Vote",
    "onb.mayoria.text": "When choosing between options (not numbers), everyone votes, and there are different ways to define who wins:",
    "onb.sorteo.title": "Selection by Lottery",
    "onb.sorteo.text": "Instead of voting, the choice is made at random among the options (or people) that meet certain requirements. That way no one wins by having more money, fame, or social pressure, everyone starts with the same odds.\n\nIt's an ancient practice: in classical Athens, many public offices were assigned by lottery, precisely so power wouldn't concentrate among those with more resources or influence.",
    "onb.combining.title": "Combining these processes",
    "onb.combining.text": "Average, majority, and lottery can be combined to organize complex decisions, in a small group, like a condo, or in a large society, like a city or a country, without handing too much power to a single person or a small group.",
    "onb.3questions.title": "3 questions every group has to answer",
    "onb.3questions.text": "No matter the size, groups and societies tend to face the same questions:",
    "onb.cuotas.title": "Participatory dues or fees",
    "onb.cuotas.text": "The group decides together how much everyone should contribute, using Average-Based Democracy:",
    "onb.cuotas.closing": "Citizens of a city or a country can use this same process to decide their taxes.",
    "onb.presupuesto.title": "Participatory budget",
    "onb.presupuesto.text": "Any group with money available, whether from dues, taxes, business income, or donations, can decide together how to spend it, with a participatory budget.\n\nFirst, everyone proposes categories they'd like to invest the money in. Once everyone can see them, each person splits 100% of the budget among them, based on what seems most important to them. The percentages each person assigned to each category are averaged, reaching the group's decision on how much to spend on each one.",
    "onb.asociaciones.title": "Associations, clubs, and organizations",
    "onb.asociaciones.text": "We combine several processes into one connected flow: first, the group decides everyone's Participatory dues or fees; that money collected automatically becomes the Participatory budget to split among categories.\n\nAfter collectively deciding which categories the money will go to, members can propose specific projects that use each category's resources. For example, if 30% of the budget (about $2,000) was set aside for lighting, members can propose how to use that money: someone might suggest LED light strips costing $1,800, someone else corner lamps for $1,000, and so on. Afterward, everyone votes to choose the winning project in each category.\n\nFinally, the group's responsibilities are assigned by lottery among the members.",
    "onb.scale.title": "From small groups to entire societies",
    "onb.scale.text": "These same processes can be used in small groups or in very large societies, without changing how they fundamentally work.\n\nFor example, a city or a country, instead of choosing dues, can choose its taxes: citizens decide together how much to charge at each income level, the same way a group decides its dues.\n\nIn the same way, they can decide their budget: first, what percentage goes to each government department; over time, they can propose specific projects and detail their budget as much as they want. The budgets each person proposes are averaged among everyone, to reach the final decision.",
    "onbEx.personProposes": "{name} proposes",
    "onbEx.trimmedNote": "the highest and lowest are trimmed",
    "onbEx.collectiveDecision": "Collective decision",

function tf(key, lang, vars = {}) {
  const dict = FRONTEND_STRINGS[lang] || FRONTEND_STRINGS.es;
  let str = dict[key] || FRONTEND_STRINGS.es[key] || key;
  Object.entries(vars).forEach(([k, v]) => {
    str = str.replace(new RegExp(`\\{${k}\\}`, "g"), () => String(v));
  });
  return str;
}

function LangToggle({ lang, onChange }) {
  return (
    <div className="flex rounded-full overflow-hidden" style={{ border: `1px solid ${BLUE}55` }}>
      {["es", "en"].map((code) => (
        <button
          key={code}
          onClick={() => onChange(code)}
          className="dp-mono text-[10px] font-semibold px-2 py-1"
          style={lang === code ? { background: BLUE, color: "#fff" } : { background: "#fff", color: BLUE }}
        >
          {code.toUpperCase()}
        </button>

}

// Reemplazo de window.confirm/window.alert nativos (que muestran el
// dominio de GitHub Pages como remitente) por una ventana propia, con
// la estética de la app. Se puede llamar desde cualquier función async
// en cualquier parte del árbol, sin tener que pasar props de un lado a
// otro — customConfirm/customAlert regresan una Promesa, igual que se
// usaría window.confirm/alert, solo que hay que ponerles "await".
let _dialogResolver = null;
let _setDialogState = null;

function customConfirm(message) {
  return new Promise((resolve) => {
    _dialogResolver = resolve;
    if (_setDialogState) _setDialogState({ message, type: "confirm" });
  });
}

function customAlert(message) {
  return new Promise((resolve) => {
    _dialogResolver = resolve;
    if (_setDialogState) _setDialogState({ message, type: "alert" });
  });
}

function customPrompt(message, defaultValue = "") {
  return new Promise((resolve) => {
    _dialogResolver = resolve;
    if (_setDialogState) _setDialogState({ message, type: "prompt", value: defaultValue });
  });
}

function DialogHost() {
  const [dialog, setDialog] = React.useState(null);
  const [promptValue, setPromptValue] = React.useState("");
  React.useEffect(() => {
    _setDialogState = (d) => {
      setPromptValue(d && d.value !== undefined ? d.value : "");
      setDialog(d);
    };
    return () => {
      _setDialogState = null;
    };
  }, []);

  const respond = (value) => {
    if (_dialogResolver) _dialogResolver(value);
    _dialogResolver = null;
    setDialog(null);
  };

  if (!dialog) return null;

  return (
    <div className="fixed inset-0 flex items-start justify-center p-4 py-10 overflow-y-auto" style={{ background: "rgba(20,33,61,0.55)", zIndex: 80 }}>
      <div className="rounded-2xl p-5 max-w-[320px] w-full shadow-xl" style={{ background: WARM_WHITE }}>
        <div className="dp-body text-sm mb-3 whitespace-pre-line" style={{ color: INK, lineHeight: 1.5 }}>{dialog.message}</div>
        {dialog.type === "prompt" && (
          <input
            autoFocus
            value={promptValue}
            onChange={(e) => setPromptValue(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && respond(promptValue)}
            className="dp-body w-full rounded-lg px-3 py-2 text-sm outline-none mb-4"
            style={{ border: `1.5px solid ${BLUE}55`, color: INK }}
          />
        )}
        {dialog.type !== "prompt" && <div className="mb-1" />}
        <div className="flex gap-2">
          {dialog.type !== "alert" && (
            <button
              onClick={() => respond(dialog.type === "prompt" ? null : false)}
              className="dp-body flex-1 text-xs py-2 rounded-full font-medium"
              style={{ background: "#fff", color: INK, border: `1.5px solid ${BLUE}55` }}
            >
              Cancelar
            </button>
          )}
          <button
            onClick={() => respond(dialog.type === "prompt" ? promptValue : true)}
            className="dp-body flex-1 text-xs py-2 rounded-full text-white font-medium"
            style={{ background: BLUE }}
          >
            {dialog.type === "alert" ? "Entendido" : "Confirmar"}
          </button>
        </div>
      </div>
    </div>
  );
}

// Arma la cadena completa de flujos encadenados (ej. dentro de
// Asociaciones o Cooperativas), del más viejo al más nuevo, siguiendo
// chainedFromFlowId hacia atrás desde el flujo actual.
function getFlowChain(flow, allFlows) {
  const chain = [flow];
  let current = flow;
  while (current.chainedFromFlowId) {
    const parent = (allFlows || []).find((f) => f.id === current.chainedFromFlowId);
    if (!parent) break;
    chain.unshift(parent);
    current = parent;
  }
  return chain;
}

function formatResponseValue(v) {
  if (typeof v === "number") return String(Math.round(v * 100) / 100);
  if (typeof v === "object" && v !== null) {

      .map(([k, val]) => `${k}: ${typeof val === "number" ? Math.round(val * 100) / 100 : val}`)
      .join(", ");
  }
  return String(v);
}

// Convierte el contenido de arriba en un PDF paginado por BLOQUES (cada
// pregunta+respuesta, cada gráfica, cada tarjeta es un bloque completo)
// — así nunca se corte una gráfica a la mitad ni se separe una
// pregunta de su resultado entre dos hojas. Deja márgenes en los 4
// lados de cada hoja.
async function generateResultsPdf(containerNode, filename) {
  const pdf = new window.jspdf.jsPDF("p", "pt", "a4");
  const pageWidth = pdf.internal.pageSize.getWidth();
  const pageHeight = pdf.internal.pageSize.getHeight();
  const marginX = 34;
  const marginTop = 34;
  const marginBottom = 34;
  const usableWidth = pageWidth - marginX * 2;
  const maxBlockHeight = pageHeight - marginTop - marginBottom;
  const gap = 14;

  // Primero se "toma foto" a cada bloque y se mide su altura ya
  // escalada a la hoja — antes de empezar a colocarlos. Así, un bloque
  // marcado "pegado al siguiente" (ej. el título de una sección) puede
  // revisar si el bloque que sigue cabe junto con él en lo que queda
  // de la hoja, sin tener que volver a capturarlo dos veces.
  //
  // Para los bloques que resultan más altos que una hoja completa
  // (ej. una lista larga de respuestas individuales), además se
  // guardan las posiciones de sus hijos DIRECTOS en el DOM — así, si
  // hay que repartirlos en varias hojas, el corte cae siempre justo
  // entre dos elementos, nunca a la mitad de un renglón de texto.
  const blockNodes = Array.from(containerNode.querySelectorAll("[data-pdf-block]"));
  const blocks = [];
  for (const node of blockNodes) {
    const canvas = await window.html2canvas(node, { scale: 2, backgroundColor: "#ffffff", useCORS: true });
    const imgHeight = (canvas.height * usableWidth) / canvas.width;
    let safeBreaksPx = null;
    if (imgHeight > maxBlockHeight && node.children.length > 1) {
      const rect = node.getBoundingClientRect();
      const scaleFactor = rect.height > 0 ? canvas.height / rect.height : 2;
      safeBreaksPx = Array.from(node.children)
        .map((child) => Math.round(child.offsetTop * scaleFactor))
        .filter((y) => y > 0 && y < canvas.height);
    }
    blocks.push({ canvas, imgHeight, keepWithNext: node.getAttribute("data-pdf-keep-with-next") === "true", safeBreaksPx });
  }

  let cursorY = marginTop;
  let placedOnPage = false;

  const placeBlock = (block) => {
    if (block.imgHeight > maxBlockHeight) {
      let remainingPx = block.canvas.height;
      let consumedPx = 0;
      while (remainingPx > 0) {
        if (!placedOnPage) cursorY = marginTop;
        const availablePt = pageHeight - marginBottom - cursorY;
        let availablePx = Math.floor((availablePt * block.canvas.width) / usableWidth);
        // Si hay puntos de corte seguros (entre hijos del bloque), se
        // usa el más grande que quepa en el espacio disponible, en vez
        // de cortar a ciegas por posición de pixel.
        if (block.safeBreaksPx && availablePx < remainingPx) {
          const candidates = block.safeBreaksPx.filter((y) => y > consumedPx && y - consumedPx <= availablePx);
          if (candidates.length > 0) availablePx = candidates[candidates.length - 1] - consumedPx;
        }
        const sliceHeightPx = Math.max(1, Math.min(availablePx, remainingPx));
        const sliceCanvas = document.createElement("canvas");
        sliceCanvas.width = block.canvas.width;
        sliceCanvas.height = sliceHeightPx;
        sliceCanvas.getContext("2d").drawImage(block.canvas, 0, consumedPx, block.canvas.width, sliceHeightPx, 0, 0, block.canvas.width, sliceHeightPx);
        const sliceHeightPt = (sliceHeightPx * usableWidth) / block.canvas.width;
        pdf.addImage(sliceCanvas.toDataURL("image/png"), "PNG", marginX, cursorY, usableWidth, sliceHeightPt);
        consumedPx += sliceHeightPx;
        remainingPx -= sliceHeightPx;
        cursorY += sliceHeightPt;
        placedOnPage = true;
        if (remainingPx > 0) {
          pdf.addPage();
          placedOnPage = false;
        }
      }
      cursorY += gap;
      return;
    }
    pdf.addImage(block.canvas.toDataURL("image/png"), "PNG", marginX, cursorY, usableWidth, block.imgHeight);
    cursorY += block.imgHeight + gap;
    placedOnPage = true;
  };

  for (let i = 0; i < blocks.length; i++) {
    const block = blocks[i];
    const next = blocks[i + 1];

    // Si este bloque debe quedarse pegado al siguiente (ej. un título
    // de sección con su primer contenido), se calcula el espacio que
    // ocupan LOS DOS juntos — así nunca queda un título solo al final
    // de una hoja, con su contenido brincando a la siguiente.
    let neededHeight = block.imgHeight;
    if (block.keepWithNext && next && next.imgHeight <= maxBlockHeight) {
      neededHeight += gap + next.imgHeight;
    }

    if (placedOnPage && block.imgHeight <= maxBlockHeight && cursorY + neededHeight > pageHeight - marginBottom) {
      pdf.addPage();
      cursorY = marginTop;
      placedOnPage = false;
    }

    placeBlock(block);
  }

  pdf.save(filename);
}

const PIE_COLORS = ["#3A6EA5", "#E0A458", "#8B5A8F", "#4C9F70", "#D64550", "#6B4E9E", "#5C8A99", "#B5533C"];



function PieChart({ data, size }) {
  // data: [{ label, value }] — anillo segmentado, con espacio entre cada
  // categoría y puntas redondeadas (estilo dashboard moderno).
  const total = data.reduce((sum, d) => sum + (Number(d.value) || 0), 0);
  const px = size || 88;
  const r = 38;
  const thickness = px < 100 ? 9 : 12;
  const gap = 5;
  const circumference = 2 * Math.PI * r;
  let offset = 0;
  const segments = data.map((d, i) => {
    const frac = total > 0 ? (Number(d.value) || 0) / total : 0;
    const segLen = Math.max(0, frac * circumference - gap);
    const seg = { color: PIE_COLORS[i % PIE_COLORS.length], segLen, offset };
    offset += frac * circumference;
    return seg;
  });
  return (
    <div style={{ display: "flex", alignItems: "center", gap: "12px" }}>
      <svg width={px} height={px} viewBox="0 0 100 100" style={{ flexShrink: 0 }}>
        {total > 0 ? (
          segments.map((s, i) => (
            <circle
              key={i}
              cx="50" cy="50" r={r}
              fill="none"
              stroke={s.color}
              strokeWidth={thickness}
              strokeDasharray={`${s.segLen} ${circumference - s.segLen}`}
              strokeDashoffset={-s.offset}
              strokeLinecap="round"
              transform="rotate(-90 50 50)"
            />
          ))
        ) : (
          <circle cx="50" cy="50" r={r} fill="none" stroke={PAGE_BG} strokeWidth={thickness} />
        )}
      </svg>
      <div style={{ flex: 1 }}>
        {data.map((d, i) => (
          <div key={d.label} className="dp-body flex items-center gap-1.5 text-[11px] mb-0.5" style={{ color: INK + "cc" }}>
            <span style={{ width: "8px", height: "8px", borderRadius: "50%", background: PIE_COLORS[i % PIE_COLORS.length], flexShrink: 0 }} />
            <span style={{ flex: 1 }}>{d.label}</span>
            <span className="dp-mono">{(Number(d.value) || 0).toFixed(1)}%</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function OptionBar({ option, count, percent, highlight }) {
  return (
    <div className="mb-2.5">
      <div className="flex justify-between dp-body text-xs mb-1" style={{ color: INK }}>
        <span>{highlight && <i className="ti ti-trophy" style={{ marginRight: "3px", color: "#E0A458" }}></i>}{option}</span>
        <span className="dp-mono" style={{ color: INK + "99" }}>{count} · {percent}%</span>
      </div>
      <div className="rounded-full h-2 overflow-hidden" style={{ background: "#fff" }}>
        <div className="h-2 rounded-full" style={{ width: `${percent}%`, background: highlight ? GREEN : BLUE }} />
      </div>
    </div>
  );
}

function DetailsToggle({ show, onToggle, color }) {
  const dtLang = useLang();
  return (
    <button
      onClick={onToggle}
      className="dp-body flex items-center gap-1 text-[11px] font-medium mb-2"
      style={{ color: color || INK + "99" }}
    >
      <span style={{ display: "inline-block", transform: show ? "rotate(90deg)" : "rotate(0deg)", transition: "transform 0.15s" }}>▶</span>
      {show ? tf("details.hide", dtLang) : tf("details.show", dtLang)}
    </button>
  );
}

function SorteoRunner({ backendUrl, groupCode, memberId, question, isAdmin }) {
  const lang = useLang();
  const [drawing, setDrawing] = useState(false);
  const [error, setError] = useState("");
  const [showHistory, setShowHistory] = useState(false);
  const [draws, setDraws] = useState(question.draws || []);
  const [excluded, setExcluded] = useState(question.excluded || []);

  const lastDraw = draws.length > 0 ? draws[draws.length - 1] : null;
  const remaining = question.options.filter((o) => !excluded.includes(o));
  const cycleComplete = remaining.length === 0;

  const draw = async () => {
    setDrawing(true);
    setError("");
    try {
      const res = await fetch(`${backendUrl}/api/groups/${groupCode}/questions/${question.id}/draw`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ memberId }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || tf("error.draw", lang));
      setDraws(data.draws);
      setExcluded(data.excluded);
    } catch (e) {
      setError(e.message);
    } finally {
      setDrawing(false);
    }
  };

  return (
    <div className="rounded-2xl p-4 mb-4 shadow-sm" style={{ background: WARM_WHITE, border: `1px solid ${BLUE}33` }}>
      <div className="flex items-start justify-between gap-2 mb-1">
        <div className="dp-body text-[15px]" style={{ color: INK }}>{question.text}</div>
      </div>
      <div className="dp-body text-[11px] mb-3 flex items-center gap-1" style={{ color: INK + "77" }}>
        <i className="ti ti-dice-5"></i> {tf("sorteo.description", lang)}
      </div>

      {lastDraw && (
        <div className="rounded-lg p-3 mb-3 text-center" style={{ background: GREEN + "15" }}>
          <div className="dp-body text-[10px]" style={{ color: INK + "88" }}>{tf("sorteo.lastResult", lang)}</div>
          <div className="dp-display text-xl font-bold" style={{ color: GREEN }}>{lastDraw.winner}</div>
        </div>
      )}

      <div className="mb-2">
        <button onClick={() => setShowHistory(!showHistory)} className="dp-body text-[11px] font-medium mb-1.5" style={{ color: BLUE }}>
          {showHistory ? "▼ " : "▶ "}{cycleComplete ? tf("sorteo.candidatesCycleComplete", lang) : tf("sorteo.candidatesRemaining", lang, { n: remaining.length })}
        </button>
        {showHistory && (
          <div className="flex flex-wrap gap-1.5">
            {question.options.map((opt) => (
              <span
                key={opt}
                className="dp-body text-[11px] px-2 py-1 rounded-full"
                style={excluded.includes(opt) && !cycleComplete ? { background: PAGE_BG, color: INK + "66", textDecoration: "line-through" } : { background: BLUE_SOFT, color: INK }}
              >
                {opt}
              </span>
            ))}
          </div>
        )}
      </div>

      {draws.length > 1 && (
        <div className="dp-body text-[10.5px] mb-3" style={{ color: INK + "77" }}>
          {tf("sorteo.history", lang, { list: draws.slice(0, -1).reverse().map((d) => d.winner).join(", ") })}
        </div>
      )}

      {isAdmin && (
        <button
          onClick={draw}
          disabled={drawing}
          className="dp-body flex items-center justify-center gap-1.5 w-full text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40"
          style={{ background: BLUE }}
        >
          <i className="ti ti-dice-5"></i> {drawing ? tf("sorteo.drawing", lang) : lastDraw ? tf("sorteo.drawAgain", lang) : tf("sorteo.drawButton", lang)}
        </button>
      )}
      {error && <div className="dp-body text-[11px] mt-2" style={{ color: CORAL }}>{error}</div>}
    </div>
  );
}

function QuestionRunner({ backendUrl, groupCode, memberId, question, isAdmin, groupResponses, approvedMemberCount }) {
  const siLang = useLang();
  const rule = question.majorityRule;
  const isRankeado = rule === "rankeado";
  const isSegundaVuelta = rule === "segunda_vuelta";

  const [value, setValue] = useState("");
  const [rankOrder, setRankOrder] = useState([]);
  const [sending, setSending] = useState(false);
  const [sendError, setSendError] = useState("");
  const [sent, setSent] = useState(false);
  const [result, setResult] = useState(null);
  const [computing, setComputing] = useState(false);
  const [resultError, setResultError] = useState("");
  const [closingRound, setClosingRound] = useState(false);
  const [showDetails, setShowDetails] = useState(true);
  const [showStatusCard, setShowStatusCard] = useState(false);

  const freshTieBreak = (result && result.tieBreak) || question.tieBreak;
  const inTieBreak = isRankeado && freshTieBreak && !freshTieBreak.finished;
  const rankeadoResolved = isRankeado && freshTieBreak && freshTieBreak.finished;

  const hasValue = isRankeado && !inTieBreak ? rankOrder.length > 0 : value !== "";

  const toggleRank = (opt) => {
    setRankOrder((prev) => (prev.includes(opt) ? prev.filter((o) => o !== opt) : [...prev, opt]));
  };

  const sendResponse = async () => {
    if (!memberId || !hasValue) return;
    setSending(true);
    setSendError("");
    try {
      const sendValue = isRankeado && !inTieBreak ? rankOrder : question.type === "promedio" ? Number(value) : value;
      const res = await fetch(
        `${backendUrl}/api/groups/${groupCode}/questions/${question.id}/responses`,
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ memberId, value: sendValue }),
        }
      );
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || tf("error.send", siLang));
      setSent(true);
      setValue("");
      setRankOrder([]);
      await computeResults(false);
    } catch (e) {
      setSendError(e.message);
    } finally {
      setSending(false);
    }
  };

  const computeResults = async (silent) => {
    if (!silent) setComputing(true);
    setResultError("");
    try {
      const res = await fetch(`${backendUrl}/api/groups/${groupCode}/questions/${question.id}/results`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || tf("error.calculate", siLang));
      setResult(data);
    } catch (e) {
      if (!silent) setResultError(e.message);
    } finally {
      if (!silent) setComputing(false);
    }
  };

  const closeRound = async () => {
    const ok = await customConfirm(tf("qr.confirmCloseRound", siLang));
    if (!ok) return;
    setClosingRound(true);
    try {
      await fetch(`${backendUrl}/api/groups/${groupCode}/questions/${question.id}/close-round`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ memberId }),
      });
      await computeResults(true);
    } catch (e) {
      setResultError(e.message);
    } finally {
      setClosingRound(false);
    }
  };

  const needsLivePolling = isSegundaVuelta || Boolean(freshTieBreak);

  useEffect(() => {
    if (needsLivePolling) computeResults(true);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [needsLivePolling]);

  useEffect(() => {
    if (!result && !needsLivePolling) return;
    const interval = setInterval(() => computeResults(true), 15000);
    return () => clearInterval(interval);
  }, [Boolean(result), needsLivePolling]);

  const ruleLabel = {
    simple: tf("qr.rule.simple", siLang),
    absoluta: tf("qr.rule.absoluta", siLang),
    calificada: tf("qr.rule.calificada", siLang, { pct: question.qualifiedPct }),
    rankeado: tf("qr.rule.rankeado", siLang),
    segunda_vuelta: tf("qr.rule.segunda_vuelta", siLang, { rounds: question.numRounds, pct: question.eliminationThresholdPercent }),
  }[rule];

  const currentOptions = isSegundaVuelta && result ? result.currentOptions : question.options;

  const liveVoteCount = React.useMemo(() => {
    if (!groupResponses) return null;
    if (isSegundaVuelta) {
      return groupResponses.filter((r) => r.questionId === question.id && r.roundNum === question.currentRound).length;
    }
    if (inTieBreak) {
      return groupResponses.filter((r) => r.questionId === question.id && r.tieBreakRound === freshTieBreak.currentRound).length;
    }
    if (isRankeado) {
      return groupResponses.filter((r) => r.questionId === question.id && !r.tieBreakRound).length;
    }
    return groupResponses.filter((r) => r.questionId === question.id).length;
  }, [groupResponses, question.id, isSegundaVuelta, isRankeado, inTieBreak, question.currentRound, freshTieBreak && freshTieBreak.currentRound]);
  const isClosedForVoting = isSegundaVuelta ? Boolean(result && result.finished) : question.closed;

  // Para la tarjeta de aviso: "resolved" cuando ya hay una decisión
  // final, "tied" cuando se necesita otra ronda por empate. Se guarda
  // en una sola variable para poder detectar el MOMENTO en que cambia
  // (y solo ahí mostrar la tarjeta, no en cada render).
  const decisionStatus = (() => {
    if (question.type === "promedio") return result ? "resolved" : null;
    if (rule === "simple" || rule === "absoluta" || rule === "calificada") {
      if (!result) return null;
      return result.winner ? "resolved" : "tied";
    }
    if (isRankeado) {
      if (freshTieBreak) return freshTieBreak.finished ? "resolved" : "tied";
      if (!result) return null;
      return result.winner ? "resolved" : null;
    }
    if (isSegundaVuelta) {
      if (!result) return null;
      if (result.finished) return "resolved";
      if (result.inTieBreak) return "tied";
    }
    return null;
  })();
  const decisionLabel = question.type === "promedio" ? (result ? result.average.toFixed(2) : "") : result ? result.winner || "" : "";

  const prevDecisionStatus = React.useRef(null);
  useEffect(() => {
    if (decisionStatus && decisionStatus !== prevDecisionStatus.current) {
      setShowStatusCard(true);
    }
    prevDecisionStatus.current = decisionStatus;
  }, [decisionStatus]);

  return (
    <div className="rounded-2xl p-4 mb-4 shadow-sm" style={{ background: WARM_WHITE, border: `1px solid ${BLUE}33` }}>
      <div className="flex items-start justify-between gap-2 mb-1">
        <div className="dp-body text-[15px]" style={{ color: INK }}>{question.text}</div>
        {!isSegundaVuelta && !inTieBreak && !rankeadoResolved && <CountdownBadge closesAt={question.closesAt} closed={question.closed} />}
        {isSegundaVuelta && result && (
          <CountdownBadge closesAt={result.finished ? null : question.roundClosesAt} closed={result.finished} />
        )}
      </div>
      <div className="dp-body text-[11px] mb-3" style={{ color: INK + "77" }}>
        {question.type === "promedio" ? tf("qr.trim", siLang, { pct: question.trimPercent }) : ruleLabel}
        {isSegundaVuelta && result && !result.finished && `${tf("qr.roundNum", siLang, { n: result.currentRound })}${result.inTieBreak ? tf("qr.tieParen", siLang) : ""}`}
        {inTieBreak && tf("qr.tieRoundNum", siLang, { n: freshTieBreak.currentRound })}
      </div>
      {liveVoteCount !== null && (
        <div className="dp-body text-[11px] mb-3 flex items-center gap-1.5" style={{ color: INK + "88" }}>
          <span style={{ display: "inline-block", width: "6px", height: "6px", borderRadius: "50%", background: GREEN }} />
          {tf("qr.votedCount", siLang, { n: liveVoteCount, total: approvedMemberCount })}
        </div>
      )}

      {/* ---------- Proceso / resultados: siempre arriba ---------- */}

      {result && question.type === "promedio" && (
        <div className="mb-4 rounded-xl p-3.5" style={{ background: BLUE_SOFT }}>
          <DetailsToggle show={showDetails} onToggle={() => setShowDetails(!showDetails)} />
          {showDetails && (
            <React.Fragment>
              <div className="dp-body text-[11px] font-medium mb-2.5" style={{ color: INK + "99" }}>
                {tf("qr.proposalsTrimmed", siLang, { n: result.n, trimmed: result.trimmedCount })}
                {result.suggestedMinPercent > question.trimPercent && tf("qr.suggestedMin", siLang, { pct: result.suggestedMinPercent })}
              </div>
              <div className="flex flex-wrap gap-1.5 mb-3">
                {result.sorted.map((v, i) => {
                  const isTrimmed = i < result.trimmedCount || i >= result.sorted.length - result.trimmedCount;
                  const named = result.sortedWithNames && result.sortedWithNames[i];
                  return (
                    <span
                      key={i}
                      className="dp-mono text-xs px-2 py-1 rounded-md"
                      style={isTrimmed ? { background: CORAL + "22", color: CORAL, textDecoration: "line-through" } : { background: "#fff", color: INK }}
                    >
                      {named ? `${named.name}: ${named.value}` : v}
                    </span>
                  );
                })}
              </div>
              <div className="dp-mono text-xs mb-2.5 leading-relaxed" style={{ color: INK + "aa" }}>
                ({result.kept.join(" + ")}) ÷ {result.kept.length} = {result.average.toFixed(2)}
              </div>
            </React.Fragment>
          )}
          <div className="flex items-baseline justify-between pt-2.5" style={{ borderTop: `1px solid ${BLUE}33` }}>
            <span className="dp-body text-xs font-medium" style={{ color: INK + "99" }}>{tf("qr.collectiveDecision", siLang)}</span>
            <span className="dp-display text-3xl font-bold" style={{ color: BLUE }}>{result.average.toFixed(2)}</span>
          </div>
        </div>
      )}

      {result && (rule === "simple" || rule === "absoluta" || rule === "calificada") && (
        <div className="mb-4 rounded-xl p-3.5" style={{ background: BLUE_SOFT }}>
          <DetailsToggle show={showDetails} onToggle={() => setShowDetails(!showDetails)} />
          {showDetails && (
            <React.Fragment>
              <div className="dp-body text-[11px] font-medium mb-3" style={{ color: INK + "99" }}>{tf("qr.votesCount", siLang, { n: result.totalVoters })}</div>
              {result.tally.map((t) => (
                <OptionBar key={t.option} option={t.option} count={t.count} percent={t.percent} highlight={result.winner === t.option} />
              ))}
            </React.Fragment>
          )}
          <div className="flex items-baseline justify-between pt-2.5 mt-1" style={{ borderTop: `1px solid ${BLUE}33` }}>
            <span className="dp-body text-xs font-medium" style={{ color: INK + "99" }}>{tf("qr.collectiveDecision", siLang)}</span>
            <span className="dp-display text-lg font-bold" style={{ color: result.winner ? GREEN : CORAL }}>
              {result.winner || tf("qr.noWinnerYet", siLang)}
            </span>
          </div>
        </div>
      )}

      {result && isRankeado && result.rounds && (
        <div className="mb-4 rounded-xl p-3.5" style={{ background: BLUE_SOFT }}>
          <DetailsToggle show={showDetails} onToggle={() => setShowDetails(!showDetails)} />
          {showDetails && result.rounds.map((rd, i) => (
            <div key={i} className="mb-3">
              <div className="dp-body text-[11px] font-medium mb-1.5" style={{ color: INK + "99" }}>
                {tf("qr.round", siLang, { n: i + 1 })}{rd.eliminated ? tf("qr.eliminatesQuoted", siLang, { option: rd.eliminated }) : ""}{rd.tie ? tf("qr.tieShort", siLang) : ""}
              </div>
              {rd.tally.map((t) => (
                <OptionBar key={t.option} option={t.option} count={t.count} percent={t.percent} highlight={rd.winner === t.option} />
              ))}
            </div>
          ))}
          {result.winner && !freshTieBreak && (
            <div className="flex items-baseline justify-between pt-2.5 mt-1" style={{ borderTop: `1px solid ${BLUE}33` }}>
              <span className="dp-body text-xs font-medium" style={{ color: INK + "99" }}>{tf("qr.collectiveDecision", siLang)}</span>
              <span className="dp-display text-lg font-bold" style={{ color: GREEN }}>{result.winner}</span>
            </div>
          )}
        </div>
      )}

      {freshTieBreak && (
        <div className="mb-4 rounded-xl p-3.5" style={{ background: CORAL + "12", border: `1px solid ${CORAL}33` }}>
          <div className="dp-body text-[11px] font-semibold mb-2" style={{ color: CORAL }}>{tf("qr.tieBreakTitle", siLang)}</div>
          <DetailsToggle show={showDetails} onToggle={() => setShowDetails(!showDetails)} color={CORAL} />
          {showDetails && freshTieBreak.completedRounds.map((rd, i) => (
            <div key={i} className="mb-2">
              <div className="dp-body text-[10px] font-medium mb-1" style={{ color: INK + "99" }}>{tf("qr.tieBreakRound", siLang, { n: rd.roundNum })}</div>
              {rd.tally.map((t) => (
                <OptionBar key={t.option} option={t.option} count={t.count} percent={t.percent} highlight={false} />
              ))}
            </div>
          ))}
          {freshTieBreak.finished ? (
            <div className="flex items-baseline justify-between pt-2 mt-1" style={{ borderTop: `1px solid ${CORAL}33` }}>
              <span className="dp-body text-xs font-medium" style={{ color: INK + "99" }}>{tf("qr.collectiveDecision", siLang)}</span>
              <span className="dp-display text-lg font-bold" style={{ color: GREEN }}>{freshTieBreak.winner}</span>
            </div>
          ) : (
            <div className="dp-body text-[11px]" style={{ color: INK + "88" }}>{tf("qr.tieVotingAmong", siLang, { options: freshTieBreak.currentOptions.join(", ") })}</div>
          )}
        </div>
      )}

      {isSegundaVuelta && result && (
        <div className="mb-4 rounded-xl p-3.5" style={{ background: BLUE_SOFT }}>
          <DetailsToggle show={showDetails} onToggle={() => setShowDetails(!showDetails)} />
          {showDetails && (
            <React.Fragment>
              {result.completedRounds.map((rd) => (
                <div key={rd.roundNum} className="mb-3">
                  <div className="dp-body text-[11px] font-medium mb-1.5" style={{ color: INK + "99" }}>
                    {tf("qr.roundEliminatedList", siLang, { n: rd.roundNum, tie: rd.tieBreak ? tf("qr.tieParen", siLang) : "", list: rd.eliminated.length ? rd.eliminated.join(", ") : tf("qr.nobody", siLang) })}
                  </div>
                  {rd.tally.map((t) => (
                    <OptionBar key={t.option} option={t.option} count={t.count} percent={t.percent} highlight={false} />
                  ))}
                </div>
              ))}
              {!result.finished && result.liveTally && (
                <div className="mb-2">
                  <div className="dp-body text-[11px] font-medium mb-1.5" style={{ color: INK + "99" }}>{tf("qr.roundInProgress", siLang, { n: result.currentRound })}</div>
                  {result.liveTally.map((t) => (
                    <OptionBar key={t.option} option={t.option} count={t.count} percent={t.percent} highlight={false} />
                  ))}
                </div>
              )}
            </React.Fragment>
          )}
          {result.finished && (
            <div className="flex items-baseline justify-between pt-2.5 mt-1" style={{ borderTop: `1px solid ${BLUE}33` }}>
              <span className="dp-body text-xs font-medium" style={{ color: INK + "99" }}>{tf("qr.collectiveDecision", siLang)}</span>
              <span className="dp-display text-lg font-bold" style={{ color: GREEN }}>{result.winner}</span>
            </div>
          )}
        </div>
      )}

      {/* ---------- Lo que hay que responder: siempre al final ---------- */}

      {question.type === "promedio" && (
        <div className="flex items-center gap-2 mb-2">
          <input
            type="number"
            placeholder={tf("qr.yourProposal", siLang)}
            value={value}
            disabled={isClosedForVoting}
            onChange={(e) => setValue(e.target.value)}
            className="dp-mono flex-1 rounded-lg px-2.5 py-1.5 text-sm outline-none disabled:opacity-50"
            style={{ background: BLUE_SOFT, color: INK }}
          />
          <button
            onClick={sendResponse}
            disabled={sending || !hasValue || !memberId || isClosedForVoting}
            className="dp-body flex items-center gap-1.5 text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40"
            style={{ background: GREEN }}
          >
            <i className="ti ti-send" style={{ marginRight: "4px" }}></i>{sending ? tf("flow.sending", siLang) : tf("flow.send", siLang)}
          </button>
        </div>
      )}

      {question.type === "mayoria" && !isRankeado && (
        <div className="flex flex-col gap-1.5 mb-2">
          {currentOptions.map((opt) => (
            <button
              key={opt}
              onClick={() => setValue(opt)}
              disabled={isClosedForVoting}
              className="dp-body text-left text-sm px-3 py-2 rounded-lg disabled:opacity-50"
              style={value === opt ? { background: BLUE, color: "#fff" } : { background: BLUE_SOFT, color: INK }}
            >
              {value === opt ? "● " : "○ "}{opt}
            </button>
          ))}
          <button
            onClick={sendResponse}
            disabled={sending || !hasValue || !memberId || isClosedForVoting}
            className="dp-body flex items-center justify-center gap-1.5 text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40 mt-1"
            style={{ background: GREEN }}
          >
            <i className="ti ti-send" style={{ marginRight: "4px" }}></i>{sending ? tf("flow.sending", siLang) : tf("flow.send", siLang)}
          </button>
        </div>
      )}

      {isRankeado && inTieBreak && (
        <div className="flex flex-col gap-1.5 mb-2">
          <div className="dp-body text-[11px] mb-1" style={{ color: CORAL }}>
            {tf("qr.tieRevote", siLang)}
          </div>
          {freshTieBreak.currentOptions.map((opt) => (
            <button
              key={opt}
              onClick={() => setValue(opt)}
              className="dp-body text-left text-sm px-3 py-2 rounded-lg"
              style={value === opt ? { background: BLUE, color: "#fff" } : { background: BLUE_SOFT, color: INK }}
            >
              {value === opt ? "● " : "○ "}{opt}

          </button>
        </div>
      )}

      {isRankeado && !inTieBreak && !rankeadoResolved && (
        <div className="flex flex-col gap-1.5 mb-2">
          <div className="dp-body text-[11px] mb-1" style={{ color: INK + "77" }}>{tf("input.rankOrderShort", siLang)}</div>

            const idx = rankOrder.indexOf(opt);
            return (
              <button
                key={opt}
                onClick={() => toggleRank(opt)}
                disabled={question.closed}
                className="dp-body flex items-center gap-2 text-left text-sm px-3 py-2 rounded-lg disabled:opacity-50"
                style={idx >= 0 ? { background: BLUE, color: "#fff" } : { background: BLUE_SOFT, color: INK }}
              >
                <span className="dp-mono font-semibold" style={{ minWidth: "16px" }}>{idx >= 0 ? idx + 1 : "–"}</span>
                {opt}
              </button>
            );
          })}
          <button
            onClick={sendResponse}
            disabled={sending || !hasValue || !memberId || question.closed}
            className="dp-body flex items-center justify-center gap-1.5 text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40 mt-1"
            style={{ background: GREEN }}
          >
            <i className="ti ti-send" style={{ marginRight: "4px" }}></i>{sending ? tf("flow.sending", siLang) : tf("flow.send", siLang)}
          </button>
        </div>
      )}

      {sent && (
        <div className="dp-body text-[11px] flex items-center gap-1 mb-2" style={{ color: GREEN }}>
          <i className="ti ti-circle-check" style={{ marginRight: "4px" }}></i>{question.type === "promedio" ? tf("q.proposalSaved", siLang) : tf("q.voteSaved", siLang)}
        </div>
      )}
      {sendError && <div className="dp-body text-[11px] mb-2" style={{ color: CORAL }}>{sendError}</div>}

      {isSegundaVuelta && isAdmin && result && !result.finished && (
        <button
          onClick={closeRound}
          disabled={closingRound}
          className="dp-body flex items-center justify-center gap-1.5 w-full text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40 mb-2"
          style={{ background: BLUE }}
        >
          <i className="ti ti-lock" style={{ marginRight: "4px" }}></i>{closingRound ? tf("q.closing", siLang) : tf("q.closeRoundButton", siLang)}
        </button>
      )}
      {inTieBreak && isAdmin && (
        <button
          onClick={closeRound}
          disabled={closingRound}
          className="dp-body flex items-center justify-center gap-1.5 w-full text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40 mb-2"
          style={{ background: BLUE }}
        >
          <i className="ti ti-lock" style={{ marginRight: "4px" }}></i>{closingRound ? tf("q.closing", siLang) : tf("q.closeTiebreakButton", siLang)}
        </button>
      )}

      {!isSegundaVuelta && !isRankeado && !result && (
        <button
          onClick={() => computeResults(false)}
          disabled={computing}
          className="dp-body flex items-center gap-1.5 text-xs px-3 py-2 rounded-full font-medium disabled:opacity-40"
          style={{ background: BLUE, color: "#fff" }}
        >
          <i className="ti ti-sparkles" style={{ marginRight: "4px" }}></i>{computing ? tf("q.calculating", siLang) : tf("q.calculateDecision", siLang)}
        </button>
      )}
      {isRankeado && !freshTieBreak && !result && (
        <button
          onClick={() => computeResults(false)}
          disabled={computing}
          className="dp-body flex items-center gap-1.5 text-xs px-3 py-2 rounded-full font-medium disabled:opacity-40"
          style={{ background: BLUE, color: "#fff" }}
        >
          <i className="ti ti-sparkles" style={{ marginRight: "4px" }}></i>{computing ? tf("q.calculating", siLang) : tf("q.calculateDecision", siLang)}
        </button>
      )}
      {resultError && <div className="dp-body text-[11px] mt-2" style={{ color: CORAL }}>{resultError}</div>}

      {showStatusCard && decisionStatus && (
        <div className="fixed inset-0 flex items-start justify-center p-4 py-10 overflow-y-auto" style={{ background: "rgba(20,33,61,0.55)", zIndex: 50 }}>
          <div className="rounded-2xl p-5 max-w-[320px] w-full shadow-xl" style={{ background: WARM_WHITE }}>
            <div className="flex justify-end mb-1">
              <button onClick={() => setShowStatusCard(false)} className="dp-body text-sm" style={{ color: INK + "77" }}><i className="ti ti-x"></i></button>
            </div>
            <div className="text-center mb-2">
              <div style={{ fontSize: "36px" }}>{decisionStatus === "resolved" ? <i className="ti ti-confetti" style={{ color: GREEN }}></i> : <i className="ti ti-scale" style={{ color: INK }}></i>}</div>
              <div className="dp-display text-lg font-bold mt-1" style={{ color: INK }}>
                {decisionStatus === "resolved" ? tf("qr.congrats", siLang) : tf("qr.tied", siLang)}
              </div>
              <div className="dp-body text-[13px] mt-1" style={{ color: INK + "99" }}>
                {decisionStatus === "resolved"
                  ? tf("q.reachedDecision", siLang)
                  : tf("q.needsAnotherRound", siLang)}
              </div>
            </div>
            {decisionStatus === "resolved" && decisionLabel && (
              <div className="rounded-lg p-3 text-center" style={{ background: BLUE_SOFT }}>
                <span className="dp-display text-2xl font-bold" style={{ color: GREEN }}>{decisionLabel}</span>

              style={{ background: BLUE }}

              {decisionStatus === "resolved" ? tf("q.viewProcess", siLang) : tf("q.voteNewRound", siLang)}
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

function AdminReturnScreen({ backendUrl, onBack, onEntered }) {
  const lang = useLang();
  const [code, setCode] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");

  const submit = async () => {
    if (!code) return;
    setLoading(true);
    setError("");
    try {
      const res = await fetch(`${backendUrl}/api/groups/${code.trim()}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || tf("adminReturn.error.notFound", lang));
      onEntered({ code: code.trim(), memberId: data.admin.id });
    } catch (e) {
      setError(
        e.message === "Failed to fetch"
          ? tf("createGroup.error.connection", lang)
          : e.message
      );
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="px-4 py-6">
      <BackButton onClick={onBack} />
      <div className="rounded-2xl p-4" style={{ background: WARM_WHITE, border: `1px solid ${BLUE}33` }}>
        <div className="dp-body text-sm font-medium mb-1" style={{ color: INK }}>{tf("entry.adminReturn.title", lang)}</div>
        <p className="dp-body text-[12px] mb-3" style={{ color: INK + "77" }}>
          {tf("adminReturn.subtitle", lang)}
        </p>
        <div className="flex flex-col gap-2.5 mb-3">
          <Field label={tf("adminReturn.field.code", lang)} value={code} onChange={setCode} placeholder={tf("adminReturn.field.code.placeholder", lang)} />
        </div>
        <PrimaryButton onClick={submit} disabled={loading || !code}>
          {loading ? tf("adminReturn.entering", lang) : tf("adminReturn.submit", lang)}
        </PrimaryButton>
        {error && <div className="dp-body text-[12px] mt-2" style={{ color: CORAL }}>{error}</div>}
      </div>
    </div>
  );
}

function buildJoinLink(code) {
  const base = window.location.origin + window.location.pathname;
  return `${base}?code=${code}`;
}

function ShareGroup({ groupName, code }) {
  const lang = useLang();
  const [copiedCode, setCopiedCode] = useState(false);
  const [copiedLink, setCopiedLink] = useState(false);
  const link = buildJoinLink(code);

  const copy = async (text, setFlag) => {
    try {
      await navigator.clipboard.writeText(text);
      setFlag(true);
      setTimeout(() => setFlag(false), 1500);
    } catch (e) {
      // Si el navegador bloquea el portapapeles, no pasa nada grave.
    }
  };

  const mailtoHref =
    `mailto:?subject=${encodeURIComponent(tf("share.emailSubject", lang, { name: groupName }))}` +
    `&body=${encodeURIComponent(tf("share.emailBody", lang, { code, link }))}`;

  return (
    <div className="flex flex-col gap-2">
      <div className="flex items-center justify-between rounded-lg px-2.5 py-1.5" style={{ background: BLUE_SOFT }}>
        <span className="dp-mono text-sm font-semibold" style={{ color: INK }}>{code}</span>
        <button onClick={() => copy(code, setCopiedCode)} className="dp-body text-[11px] font-medium" style={{ color: BLUE }}>
          {copiedCode ? <span><i className="ti ti-check" style={{ marginRight: "3px" }}></i>{tf("share.copied", lang)}</span> : tf("share.copyCode", lang)}
        </button>
      </div>
      <div className="flex items-center justify-between rounded-lg px-2.5 py-1.5" style={{ background: BLUE_SOFT }}>
        <span className="dp-mono text-[11px] truncate mr-2" style={{ color: INK + "aa" }}>{link}</span>
        <button onClick={() => copy(link, setCopiedLink)} className="dp-body text-[11px] font-medium shrink-0" style={{ color: BLUE }}>
          {copiedLink ? <span><i className="ti ti-check" style={{ marginRight: "3px" }}></i>{tf("share.copied", lang)}</span> : tf("share.copyLink", lang)}
        </button>
      </div>
      <a
        href={mailtoHref}
        className="dp-body text-center text-[12px] px-2.5 py-2 rounded-full font-medium"
        style={{ background: BLUE, color: "#fff" }}
      >
        <i className="ti ti-mail" style={{ marginRight: "4px" }}></i>{tf("share.emailInvite", lang)}
      </a>
    </div>
  );
}

// Tarjetas de bienvenida para quien llega invitado a un grupo de
// preguntas (democracia por promedio o por mayoría): saludo con el
// nombre del grupo y de quien invita, la lista de preguntas que
// escribió el facilitador, y la explicación solo de las reglas que
// eligió.
function getQuestionsWelcomeSlides(lang, info) {
  const group = (info && info.group) || "";
  const admin = (info && info.admin) || "";
  const questions = (info && info.questions) || [];
  const promQs = questions.filter((q) => q.type === "promedio");
  const mayQs = questions.filter((q) => q.type === "mayoria");
  const ruleKeys = [];
  mayQs.forEach((q) => {
    const r = q.majorityRule || "simple";
    if (!ruleKeys.includes(r)) ruleKeys.push(r);
  });
  const ruleLabel = {
    simple: tf("nq.rule.simple", lang),
    absoluta: tf("nq.rule.absoluta", lang),
    calificada: tf("nq.rule.calificada", lang),
    rankeado: tf("nq.rule.rankeado", lang),
    segunda_vuelta: tf("nq.rule.segundaVuelta", lang),
  };
  const introText =
    (admin ? tf("qwel.invited", lang, { admin }) : tf("qwel.invitedNoAdmin", lang)) +
    "\n\n" + tf("qwel.decide", lang) + "\n" +
    questions.map((q) => "• " + q.text).join("\n");
  const howParts = [];
  if (promQs.length) howParts.push(tf("qwel.prom", lang));
  if (ruleKeys.length) {
    howParts.push(tf(ruleKeys.length > 1 ? "qwel.ruleIntroN" : "qwel.ruleIntro1", lang));
    ruleKeys.forEach((r) => {
      howParts.push((ruleLabel[r] || r) + ":\n" + tf(`qwel.rule.${r}`, lang));
    });
  }
  const partParts = [];
  if (promQs.length) partParts.push(tf("qwel.promPart", lang));
  if (mayQs.length) {
    partParts.push(tf("qwel.mayPart", lang));
    if (ruleKeys.includes("rankeado")) partParts.push(tf("qwel.mayPartRank", lang));
    if (ruleKeys.includes("segunda_vuelta")) partParts.push(tf("qwel.mayPartSeg", lang));
  }
  return [
    { icon: "ti-heart-handshake", title: tf("qwel.title", lang, { group }), text: introText },
    { icon: "ti-scale", title: tf("qwel.how", lang), text: howParts.join("\n\n") },
    { icon: "ti-send", title: tf("qwel.part", lang), text: partParts.join("\n\n") },
  ];
}

// "locked" = sin botón para cerrar (la persona tiene que leer todas las
// tarjetas). "finalLabel" cambia el texto del botón de la última
// tarjeta, y "onLearnMore" agrega debajo un enlace para conocer más.
function OnboardingCarousel({ slides, onClose, overlay = true, locked = false, finalLabel, onLearnMore }) {
  const lang = useLang();
  const [idx, setIdx] = useState(0);
  const s = slides[idx];
  const touchStartX = React.useRef(null);

  const goNext = () => (idx < slides.length - 1 ? setIdx(idx + 1) : onClose());
  const goBack = () => idx > 0 && setIdx(idx - 1);

  // Swipe hacia la izquierda = siguiente tarjeta; hacia la derecha =
  // tarjeta anterior. Para salir sigue haciendo falta la ✕ a propósito.
  const handleTouchStart = (e) => {
    touchStartX.current = e.touches[0].clientX;
  };
  const handleTouchEnd = (e) => {
    if (touchStartX.current === null) return;
    const deltaX = e.changedTouches[0].clientX - touchStartX.current;
    const threshold = 45;
    if (deltaX < -threshold && idx < slides.length - 1) setIdx(idx + 1);
    else if (deltaX > threshold && idx > 0) setIdx(idx - 1);
    touchStartX.current = null;
  };

  const card = (
    <div
      onTouchStart={handleTouchStart}
      onTouchEnd={handleTouchEnd}
      className="rounded-2xl p-5"
      style={{ background: WARM_WHITE, border: overlay ? "none" : `1px solid ${BLUE}33`, maxWidth: overlay ? "360px" : "none" }}
    >
      {overlay && (
        <div className="flex justify-between items-center mb-1.5">
          <span className="dp-mono text-[10px]" style={{ color: INK + "66" }}>{idx + 1} / {slides.length}</span>
          {!locked && <button onClick={onClose} className="dp-body text-sm" style={{ color: INK + "88" }}><i className="ti ti-x"></i></button>}
        </div>
      )}
      <div className="mb-2.5"><OnbIcon name={s.icon} /></div>
      <div className="dp-display text-base font-bold mb-1.5" style={{ color: INK }}>{s.title}</div>
      <div className="dp-body text-[12.5px] mb-2.5 whitespace-pre-line" style={{ color: INK + "99", lineHeight: 1.55 }}>{s.text}</div>
      {s.example && <div className="mb-2">{s.example()}</div>}
      <div className="flex gap-1 justify-center flex-wrap my-3">
        {slides.map((_, i) => (
          <span key={i} style={{ width: "6px", height: "6px", borderRadius: "50%", background: i === idx ? BLUE : BLUE + "33" }} />
        ))}
      </div>
      <div className="flex gap-2">
        {idx > 0 && (
          <button onClick={goBack} className="dp-body flex-1 text-xs py-2 rounded-full font-medium" style={{ background: "#fff", color: INK, border: `1.5px solid ${BLUE}55` }}>
            {tf("onb.back", lang)}
          </button>
        )}
        <button
          onClick={goNext}
          className="dp-body text-xs py-2 rounded-full text-white font-medium"
          style={{ background: BLUE, flex: idx > 0 ? 2 : 1 }}
        >
          {idx === slides.length - 1 ? (finalLabel || tf("onb.gotIt", lang)) : tf("onb.next", lang)}
        </button>
      </div>
      {idx === slides.length - 1 && onLearnMore && (
        <button onClick={onLearnMore} className="dp-body w-full mt-2.5 text-xs font-medium underline" style={{ color: BLUE }}>
          {tf("welcome.ready.more", lang)}
        </button>
      )}
    </div>
  );

  if (!overlay) return card;

  return (
    <div className="fixed inset-0 flex items-start justify-center p-4 py-10 overflow-y-auto" style={{ background: "rgba(20,33,61,0.55)", zIndex: 60 }}>
      {card}
    </div>
  );
}

function MunPieSVG({ slices }) {
  const total = slices.reduce((s, x) => s + x.value, 0);
  const cx = 70, cy = 70, r = 60;
  let start = -90;
  const paths = slices.map((sl, i) => {
    const angle = (sl.value / total) * 360;
    const end = start + angle;
    const x1 = cx + r * Math.cos((start * Math.PI) / 180), y1 = cy + r * Math.sin((start * Math.PI) / 180);
    const x2 = cx + r * Math.cos((end * Math.PI) / 180), y2 = cy + r * Math.sin((end * Math.PI) / 180);
    const large = angle > 180 ? 1 : 0;
    const d = `M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2} Z`;
    start = end;
    return <path key={i} d={d} fill={sl.color} />;
  });
  return <svg viewBox="0 0 140 140" width="110" height="110">{paths}</svg>;
}

function MunPresupuestoTab({ onNext, onSubmitResult, savedResult }) {
  const lang = useLang();
  const [deptos, setDeptos] = useState(() => getMunDeptosDefault(lang).map((d) => ({ ...d, subs: d.subs.map((n) => ({ n, pct: 0 })) })));
  const [expanded, setExpanded] = useState({});
  const [submitted, setSubmitted] = useState(!!savedResult);
  const [resultExpanded, setResultExpanded] = useState({});

  const setDeptPct = (i, v) => {
    const used = deptos.reduce((s, d, idx) => (idx === i ? s : s + d.pct), 0);
    const clamped = Math.max(0, Math.min(100 - used, v));
    setDeptos(deptos.map((d, idx) => (idx === i ? { ...d, pct: clamped } : d)));
  };
  const setSubPct = (di, si, delta) => {
    const dept = deptos[di];
    const used = dept.subs.reduce((s, x, idx) => (idx === si ? s : s + x.pct), 0);
    const clamped = Math.max(0, Math.min(100 - used, dept.subs[si].pct + delta));
    const newSubs = dept.subs.map((s, idx) => (idx === si ? { ...s, pct: clamped } : s));
    setDeptos(deptos.map((d, idx) => (idx === di ? { ...d, subs: newSubs } : d)));
  };
  const addSub = async (di) => {
    const name = await customPrompt(tf("mun.promptSubName", lang));
    if (!name) return;
    setDeptos(deptos.map((d, idx) => (idx === di ? { ...d, subs: [...d.subs, { n: name, pct: 0 }] } : d)));
  };
  const addDept = async () => {
    const name = await customPrompt(tf("mun.promptDeptName", lang));
    if (!name) return;
    setDeptos([...deptos, { id: `custom_${Date.now()}`, label: name, pct: 0, subs: [] }]);
  };

  const totalPct = deptos.reduce((s, d) => s + d.pct, 0);

  const computeAvgDeptos = () => {
    // Se promedia con 2 respuestas ficticias que favorecen Salud y Educación.
    const favored = { salud: true, educacion: true };
    let avgDeptos = deptos.map((d) => {
      const boost = favored[d.id] ? d.pct * 0.6 + 18 : d.pct * 0.85;
      return { ...d, avgPct: (d.pct + boost + boost) / 3 };
    });
    const sumPct = avgDeptos.reduce((s, d) => s + d.avgPct, 0) || 1;
    return avgDeptos.map((d) => ({ ...d, avgPct: (d.avgPct / sumPct) * 100 }));
  };

  if (submitted) {
    const avgDeptos = savedResult || computeAvgDeptos();
    return (
      <div className="rounded-xl p-3.5" style={{ background: PAGE_BG }}>
        <div className="dp-display text-sm font-bold" style={{ color: INK }}>{tf("mun.proposalSent", lang)}</div>
        <div className="dp-body text-[10.5px] mb-2.5" style={{ color: INK + "88" }}>{tf("mun.averagedWith", lang)}</div>
        <div className="dp-body text-[11px] font-semibold mb-1.5" style={{ color: INK }}>{tf("mun.collectiveByDept", lang)}</div>
        {avgDeptos.map((d, i) => (
          <div key={d.id} className="py-1" style={{ borderTop: `1px solid ${BLUE}15` }}>
            <div className="flex justify-between items-center">
              <span className="dp-body text-[10.5px] font-semibold" style={{ color: INK }}>{d.label}</span>
              <span className="flex items-center gap-1.5">
                <span className="dp-mono text-[11px] font-bold" style={{ color: BLUE }}>{d.avgPct.toFixed(1)}%</span>
                {d.subs.length > 0 && (
                  <button onClick={() => setResultExpanded({ ...resultExpanded, [i]: !resultExpanded[i] })} className="dp-body text-[9px]" style={{ color: BLUE }}>{resultExpanded[i] ? "▼" : "▶"}</button>
                )}
              </span>
            </div>
            <div className="dp-mono text-[9.5px]" style={{ color: INK + "77" }}>{munFmt(MUN_TOTAL_BUDGET * (d.avgPct / 100))}</div>
            {resultExpanded[i] && d.subs.length > 0 && (
              <div className="mt-1 pl-2" style={{ borderLeft: `2px solid ${BLUE}33` }}>
                {d.subs.map((s, si) => {
                  const subPctOfTotal = (d.avgPct * (100 / d.subs.length)) / 100;
                  return (
                    <div key={si} className="flex justify-between dp-body text-[9.5px] py-0.5" style={{ color: INK + "88" }}>
                      <span>{s.n}</span>
                      <span>{munFmt(MUN_TOTAL_BUDGET * (subPctOfTotal / 100))}</span>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        ))}
        <button onClick={onNext} className="dp-body w-full mt-3 text-xs py-2 rounded-full text-white font-medium" style={{ background: BLUE }}>{tf("mun.continue", lang)}</button>
      </div>
    );
  }

  return (
    <div>
      <div className="mb-2"><OnbIcon name="ti-chart-pie" /></div>
      <div className="dp-display text-base font-bold mb-1" style={{ color: INK }}>{tf("mun.tab.presupuesto", lang)}</div>
      <div className="dp-body text-[10.5px] mb-2.5" style={{ color: INK + "99", lineHeight: 1.5 }}>
        {tf("mun.presupuesto.instructions", lang)}
      </div>
      {deptos.map((dept, i) => (
        <MunDeptRow
          key={dept.id}
          dept={dept}
          deptos={deptos}
          idx={i}
          onSetPct={(v) => setDeptPct(i, v)}
          expanded={!!expanded[i]}
          onToggle={() => setExpanded({ ...expanded, [i]: !expanded[i] })}
          onSetSubPct={(si, delta) => setSubPct(i, si, delta)}
          onAddSub={() => addSub(i)}
        />
      ))}
      <div className="dp-body text-xs font-bold text-center my-2 py-2 rounded-lg" style={{ background: totalPct === 100 ? GREEN + "18" : BLUE_SOFT, color: totalPct === 100 ? GREEN : INK }}>

// Texto de Objetivocracia: cada línea que empieza con "• " es un punto de lista;
// si antes de los dos puntos hay una etiqueta corta, se muestra en negritas.
function ObjBody({ text }) {
  const out = [];
  let bullets = [];
  const flush = () => {
    if (!bullets.length) return;
    out.push(
      <ul key={"u" + out.length} className="mb-3 space-y-2">
        {bullets.map((b, i) => {
          const idx = b.indexOf(": ");
          const hasLead = idx > 0 && idx <= 52;
          return (
            <li key={i} className="flex gap-2">
              <span style={{ color: BLUE }}>•</span>
              <span>
                {hasLead ? <strong style={{ color: INK }}>{b.slice(0, idx + 1)}</strong> : null}
                {hasLead ? b.slice(idx + 1) : b}
              </span>
            </li>
          );
        })}
      </ul>
    );
    bullets = [];
  };
  String(text).split("\n").forEach((ln) => {
    if (ln.startsWith("• ")) bullets.push(ln.slice(2));
    else {
      flush();
      if (ln.trim()) out.push(<p key={"p" + out.length} className="mb-3">{ln}</p>);
    }
  });
  flush();
  return <div>{out}</div>;
}

function JoinGroupScreen({ backendUrl, initialCode, onBack, onJoined, prefillName, prefillEmail, userId }) {
  const lang = useLang();
  const [code, setCode] = useState(initialCode || "");
  const [name, setName] = useState(prefillName || "");
  const [email, setEmail] = useState(prefillEmail || "");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [status, setStatus] = useState("");
  const [previewName, setPreviewName] = useState("");
  const [showGroupWelcome, setShowGroupWelcome] = useState(false);
  const [groupTemplate, setGroupTemplate] = useState(null);
  const [inviterName, setInviterName] = useState("");
  const [groupQuestions, setGroupQuestions] = useState([]);
  const [showFullExplanation, setShowFullExplanation] = useState(false);

  // Las bienvenidas nuevas de Cuotas ("cuotasSimple" y "cuotasDemocratic")
  // dependen de la versión que eligió el facilitador. Se recuerdan por
  // grupo (no por tipo de proceso), porque mencionan el nombre del grupo
  // y de quien invitó.
  const isCuotasWelcome = groupTemplate === "cuotasSimple" || groupTemplate === "cuotasDemocratic";
  const isQuestionsWelcome = groupTemplate === "preguntas";
  const seenKey = isCuotasWelcome || isQuestionsWelcome ? `org_onboarding_seen_${(initialCode || code || "").trim()}_${groupTemplate}` : `org_onboarding_seen_${groupTemplate}`;

  useEffect(() => {
    if (!initialCode) return;
    fetch(`${backendUrl}/api/groups/${initialCode}`)
      .then((res) => (res.ok ? res.json() : Promise.reject()))
      .then((data) => {
        setPreviewName(data.name);
        setInviterName((data.admin && data.admin.name) || "");
        const flows = data.flows || [];
        const active = flows.find((f) => f.status === "active") || flows[flows.length - 1];
        if (!active) {
          // Grupo de preguntas sueltas (democracia por promedio o por
          // mayoría): bienvenida con el nombre del grupo, quién invita y
          // las preguntas que escribió el facilitador.
          const qs = Array.isArray(data.questions) ? data.questions.filter((q) => q.type === "promedio" || q.type === "mayoria") : [];
          if (!qs.length) return;
          setGroupQuestions(qs);
          setGroupTemplate("preguntas");
          const qKey = `org_onboarding_seen_${initialCode.trim()}_preguntas`;
          let qSeen = false;
          try { qSeen = Boolean(localStorage.getItem(qKey)); } catch (e) { /* sin almacenamiento: se muestra siempre */ }
          if (!qSeen) setShowGroupWelcome(true);
          return;
        }
        const cuotasMode = active.template === "cuotas" && active.config ? active.config.cuotasMode : null;
        const template =
          cuotasMode === "simple"
            ? "cuotasSimple"
            : cuotasMode === "democratic"
            ? "cuotasDemocratic"
            : active.chainNext === "presupuesto" || active.chainedFromFlowId
            ? "asociaciones"
            : active.template;
        const isNew = template === "cuotasSimple" || template === "cuotasDemocratic";
        if (isNew || (template && ONBOARDING_GROUP_SLIDES[template])) {
          setGroupTemplate(template);
          const key = isNew ? `org_onboarding_seen_${initialCode.trim()}_${template}` : `org_onboarding_seen_${template}`;
          let seen = false;
          try { seen = Boolean(localStorage.getItem(key)); } catch (e) { /* sin almacenamiento: se muestra siempre */ }
          if (!seen) setShowGroupWelcome(true);
        }
      })
      .catch(() => {});
  }, [initialCode]);

  const closeGroupWelcome = () => {
    if (groupTemplate) {
      try { localStorage.setItem(seenKey, "true"); } catch (e) { /* no pasa nada si no se puede guardar */ }
    }
    setShowGroupWelcome(false);
  };

  const submit = async () => {
    if (!code || !name) return;
    setLoading(true);
    setError("");
    try {
      const res = await fetch(`${backendUrl}/api/groups/${code.trim()}/join`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, email, userId: userId || null }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || tf("join.error.generic", lang));
      setStatus(data.status);
      onJoined({ code: code.trim(), memberId: data.memberId });
    } catch (e) {
      setError(
        e.message === "Failed to fetch"
          ? tf("createGroup.error.connection", lang)
          : e.message
      );
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="px-4 py-6">
      <BackButton onClick={onBack} />
      <div className="rounded-2xl p-4" style={{ background: WARM_WHITE, border: `1px solid ${BLUE}33` }}>
        <div className="dp-body text-sm font-medium mb-1" style={{ color: INK }}>{tf("join.title", lang)}</div>
        {previewName && (
          <p className="dp-body text-[12px] mb-3" style={{ color: GREEN }}>
            {tf("join.willJoin", lang)} <b>{previewName}</b>
          </p>
        )}
        {!previewName && <div className="mb-3" />}
        <div className="flex flex-col gap-2.5 mb-3">
          <Field label={tf("adminReturn.field.code", lang)} value={code} onChange={setCode} placeholder={tf("adminReturn.field.code.placeholder", lang)} />
          <Field label={tf("join.field.name", lang)} value={name} onChange={setName} placeholder={tf("join.field.name.placeholder", lang)} />
          <Field label={tf("join.field.email", lang)} value={email} onChange={setEmail} placeholder={tf("join.field.email.placeholder", lang)} type="email" />
        </div>
        <PrimaryButton onClick={submit} disabled={loading || !code || !name}>
          {loading ? tf("flow.sending", lang) : tf("join.submit", lang)}
        </PrimaryButton>
        {error && <div className="dp-body text-[12px] mt-2" style={{ color: CORAL }}>{error}</div>}
      </div>

      {showGroupWelcome && groupTemplate && (
        <OnboardingCarousel
          slides={
            isCuotasWelcome
              ? getCuotasWelcomeSlides(lang, groupTemplate, { group: previewName, admin: inviterName })
              : isQuestionsWelcome
              ? getQuestionsWelcomeSlides(lang, { group: previewName, admin: inviterName, questions: groupQuestions })
              : ONBOARDING_GROUP_SLIDES[groupTemplate].map((i) => getOnboardingSlides(lang)[i])
          }
          onClose={closeGroupWelcome}
          overlay={true}
          locked={groupTemplate === "cuotasSimple"}
          finalLabel={isCuotasWelcome || isQuestionsWelcome ? tf("welcome.ready.yes", lang) : undefined}
          onLearnMore={isCuotasWelcome ? () => setShowFullExplanation(true) : undefined}
        />
      )}

      {showFullExplanation && (
        <div className="fixed inset-0 overflow-y-auto" style={{ background: PAGE_BG, zIndex: 70 }}>
          <div className="mx-auto" style={{ maxWidth: "420px" }}>
            <ExplanationScreen onBack={() => setShowFullExplanation(false)} />
          </div>
        </div>
      )}
    </div>
  );
}

function NewQuestionForm({ backendUrl, groupCode, onAdded, fixedType }) {
  const lang = useLang();
  const [type, setType] = useState(fixedType || "promedio");
  const [text, setText] = useState("");
  const [trimPercent, setTrimPercent] = useState("5");
  const [options, setOptions] = useState(["", ""]);
  const [majorityRule, setMajorityRule] = useState("absoluta");
  const [qualifiedPct, setQualifiedPct] = useState("66");
  const [numRounds, setNumRounds] = useState("3");
  const [eliminationThresholdPercent, setEliminationThresholdPercent] = useState("10");
  const [showDefs, setShowDefs] = useState(false);
  const [useLimit, setUseLimit] = useState(false);
  const [days, setDays] = useState("0");
  const [hours, setHours] = useState("0");
  const [minutes, setMinutes] = useState("0");
  const [adding, setAdding] = useState(false);
  const [error, setError] = useState("");
  const [showPreview, setShowPreview] = useState(false);

  const updateOption = (i, val) => setOptions(options.map((o, idx) => (idx === i ? val : o)));
  const addOption = () => setOptions([...options, ""]);
  const removeOption = (i) => setOptions(options.filter((_, idx) => idx !== i));

  const totalMinutes = () => Number(days || 0) * 1440 + Number(hours || 0) * 60 + Number(minutes || 0);

  const RULE_LABEL = { simple: tf("nq.rule.simple", lang), absoluta: tf("nq.rule.absoluta", lang), calificada: tf("nq.rule.calificada", lang), rankeado: tf("nq.rule.rankeado", lang), segunda_vuelta: tf("nq.rule.segundaVuelta", lang) };
  const RULE_DEF = {
    simple: tf("nq.ruleDef.simple", lang),
    absoluta: tf("nq.ruleDef.absoluta", lang),
    calificada: tf("nq.ruleDef.calificada", lang),
    rankeado: tf("nq.ruleDef.rankeado", lang),
    segunda_vuelta: tf("nq.ruleDef.segundaVuelta", lang),
  };

  const submit = async () => {
    if (!text) return;
    const cleanOptions = options.map((o) => o.trim()).filter(Boolean);
    if (type === "mayoria" && cleanOptions.length < 2) {
      setError(tf("nq.needTwoOptions", lang));
      return;
    }
    if (type === "sorteo" && cleanOptions.length < 2) {
      setError(tf("nq.needTwoCandidates", lang));
      return;
    }
    setAdding(true);
    setError("");
    try {
      const body = { type, text };
      const mins = useLimit ? totalMinutes() : 0;

      if (type === "promedio") {
        body.trimPercent = Number(trimPercent);
        if (mins > 0) body.closesInMinutes = mins;
      } else if (type === "sorteo") {
        body.options = cleanOptions;
      } else {
        body.options = cleanOptions;
        body.majorityRule = majorityRule;
        if (majorityRule === "calificada") body.qualifiedPct = Number(qualifiedPct);
        if (majorityRule === "segunda_vuelta") {
          body.numRounds = Number(numRounds);
          body.eliminationThresholdPercent = Number(eliminationThresholdPercent);
          if (mins > 0) body.roundDurationMinutes = mins;
        } else if (mins > 0) {
          body.closesInMinutes = mins;
        }
      }

      const res = await fetch(`${backendUrl}/api/groups/${groupCode}/questions`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || tf("error.createQuestion", lang));
      setText("");
      setOptions(["", ""]);
      setUseLimit(false);
      setDays("0"); setHours("0"); setMinutes("0");
      await onAdded();
    } catch (e) {
      setError(e.message);
    } finally {
      setAdding(false);
    }
  };

  const isSegundaVuelta = majorityRule === "segunda_vuelta";

  return (
    <div className="rounded-2xl p-4 mb-4" style={{ background: WARM_WHITE, border: `1px solid ${BLUE}33` }}>

      {!fixedType && (
      <div className="flex gap-1.5 mb-3">
        {[{ key: "promedio", label: tf("onbEx.chip.promedio", lang) }, { key: "mayoria", label: tf("onbEx.chip.mayoria", lang) }].map((t) => (
          <button
            key={t.key}
            onClick={() => setType(t.key)}
            className="dp-body text-xs px-3 py-1.5 rounded-full font-medium flex-1"
            style={type === t.key ? { background: BLUE, color: "#fff" } : { background: BLUE_SOFT, color: INK }}
          >
            {t.label}
          </button>
        ))}
      </div>
      )}

        value={text}
        onChange={(e) => setText(e.target.value)}

      {type === "promedio" && (
        <div className="dp-body flex items-center gap-1.5 text-xs px-2.5 py-1.5 rounded-full mb-3 w-fit" style={{ background: BLUE_SOFT, color: INK }}>
          <span style={{ opacity: 0.6 }}>{tf("nq.trim", lang)}</span>
          <input type="number" value={trimPercent} onChange={(e) => setTrimPercent(e.target.value)} className="w-9 bg-transparent dp-mono text-center outline-none font-medium" />
          <span style={{ opacity: 0.6 }}>%</span>
        </div>
