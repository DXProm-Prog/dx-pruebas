<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Democracia por Promedio</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; }
  .dp-display { font-family: 'Space Grotesk', sans-serif; }
  .dp-body { font-family: 'Inter', sans-serif; }
  .dp-mono { font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const INK = "#20302B";
const BLUE = "#1F6E63";
const BLUE_SOFT = "#E3EFEC";
const WARM_WHITE = "#FBFAF7";
const PAGE_BG = "#EDEAE2";
const CORAL = "#A85332";
const GREEN = "#4C7A3D";

function Field({ label, value, onChange, placeholder, type = "text" }) {
  return (
    <label className="dp-body flex flex-col gap-1 text-xs" style={{ color: INK + "99" }}>
      {label}
      <input
        type={type}
        value={value}
        placeholder={placeholder}
        onChange={(e) => onChange(e.target.value)}
        className="dp-mono rounded-lg px-2.5 py-1.5 text-sm outline-none"
        style={{ background: BLUE_SOFT, color: INK }}
      />
    </label>
  );
}

function PrimaryButton({ children, onClick, disabled }) {
  return (
    <button
      onClick={onClick}
      disabled={disabled}
      className="dp-body w-full flex items-center justify-center gap-1.5 text-sm py-2.5 rounded-full text-white font-medium disabled:opacity-40"
      style={{ background: BLUE }}
    >
      {children}
    </button>
  );
}

function CountdownBadge({ closesAt, closed }) {
  const [now, setNow] = useState(Date.now());
  useEffect(() => {
    if (closed || !closesAt) return;
    const interval = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(interval);
  }, [closed, closesAt]);

  if (closed) {
    return (
      <span className="dp-body text-[11px] px-2 py-0.5 rounded-full font-medium" style={{ background: CORAL + "22", color: CORAL }}>
        cerrada
      </span>
    );
  }
  if (!closesAt) return null;

  const msLeft = new Date(closesAt).getTime() - now;
  if (msLeft <= 0) {
    return (
      <span className="dp-body text-[11px] px-2 py-0.5 rounded-full font-medium" style={{ background: CORAL + "22", color: CORAL }}>
        cerrando…
      </span>
    );
  }
  const hours = Math.floor(msLeft / 3600000);
  const mins = Math.floor((msLeft % 3600000) / 60000);
  const label = hours > 0 ? `${hours}h ${mins}m` : `${mins}m`;
  return (
    <span className="dp-body text-[11px] px-2 py-0.5 rounded-full font-medium" style={{ background: BLUE_SOFT, color: INK }}>
      ⏱ cierra en {label}
    </span>
  );
}

function OptionBar({ option, count, percent, highlight }) {
  return (
    <div className="mb-2.5">
      <div className="flex justify-between dp-body text-xs mb-1" style={{ color: INK }}>
        <span>{highlight ? "🏆 " : ""}{option}</span>
        <span className="dp-mono" style={{ color: INK + "99" }}>{count} · {percent}%</span>
      </div>
      <div className="rounded-full h-2 overflow-hidden" style={{ background: "#fff" }}>
        <div className="h-2 rounded-full" style={{ width: `${percent}%`, background: highlight ? GREEN : BLUE }} />
      </div>
    </div>
  );
}

function QuestionRunner({ backendUrl, groupCode, memberId, question }) {
  const isMulti = question.type === "encuesta";
  const [value, setValue] = useState(isMulti ? [] : "");
  const [sending, setSending] = useState(false);
  const [sendError, setSendError] = useState("");
  const [sent, setSent] = useState(false);
  const [result, setResult] = useState(null);
  const [computing, setComputing] = useState(false);
  const [resultError, setResultError] = useState("");

  const toggleOption = (opt) => {
    if (isMulti) {
      setValue((prev) => (prev.includes(opt) ? prev.filter((v) => v !== opt) : [...prev, opt]));
    } else {
      setValue(opt);
    }
  };

  const hasValue = isMulti ? value.length > 0 : value !== "";

  const sendResponse = async () => {
    if (!memberId || !hasValue) return;
    setSending(true);
    setSendError("");
    try {
      const res = await fetch(
        `${backendUrl}/api/groups/${groupCode}/questions/${question.id}/responses`,
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ memberId, value }),
        }
      );
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Error al enviar");
      setSent(true);
      setValue(isMulti ? [] : "");
      await computeResults();
    } catch (e) {
      setSendError(e.message);
    } finally {
      setSending(false);
    }
  };

  const computeResults = async (silent) => {
    if (!silent) setComputing(true);
    setResultError("");
    try {
      const res = await fetch(
        `${backendUrl}/api/groups/${groupCode}/questions/${question.id}/results`
      );
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Error al calcular");
      setResult(data);
    } catch (e) {
      if (!silent) setResultError(e.message);
    } finally {
      if (!silent) setComputing(false);
    }
  };

  useEffect(() => {
    if (!result) return;
    const interval = setInterval(() => computeResults(true), 15000);
    return () => clearInterval(interval);
  }, [Boolean(result)]);

  return (
    <div className="rounded-2xl p-4 mb-4 shadow-sm" style={{ background: WARM_WHITE, border: `1px solid ${BLUE}33` }}>
      <div className="flex items-start justify-between gap-2 mb-1">
        <div className="dp-body text-[15px]" style={{ color: INK }}>{question.text}</div>
        <CountdownBadge closesAt={question.closesAt} closed={question.closed} />
      </div>
      <div className="dp-body text-[11px] mb-3" style={{ color: INK + "77" }}>
        {question.type === "promedio" && `recorte: ${question.trimPercent}%`}
        {question.type === "mayoria" && (question.majorityRule === "pluralidad" ? "gana la más votada" : "necesita más del 50%")}
        {question.type === "encuesta" && "puedes elegir varias opciones"}
      </div>

      {question.type === "promedio" && (
        <div className="flex items-center gap-2 mb-2">
          <input
            type="number"
            placeholder="tu propuesta"
            value={value}
            disabled={question.closed}
            onChange={(e) => setValue(e.target.value)}
            className="dp-mono flex-1 rounded-lg px-2.5 py-1.5 text-sm outline-none disabled:opacity-50"
            style={{ background: BLUE_SOFT, color: INK }}
          />
          <button
            onClick={sendResponse}
            disabled={sending || !hasValue || !memberId || question.closed}
            className="dp-body flex items-center gap-1.5 text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40"
            style={{ background: GREEN }}
          >
            📤 {sending ? "Enviando…" : "Enviar"}
          </button>
        </div>
      )}

      {(question.type === "mayoria" || question.type === "encuesta") && (
        <div className="flex flex-col gap-1.5 mb-2">
          {question.options.map((opt) => {
            const selected = isMulti ? value.includes(opt) : value === opt;
            return (
              <button
                key={opt}
                onClick={() => toggleOption(opt)}
                disabled={question.closed}
                className="dp-body text-left text-sm px-3 py-2 rounded-lg disabled:opacity-50"
                style={selected ? { background: BLUE, color: "#fff" } : { background: BLUE_SOFT, color: INK }}
              >
                {selected ? (isMulti ? "☑ " : "● ") : (isMulti ? "☐ " : "○ ")}
                {opt}
              </button>
            );
          })}
          <button
            onClick={sendResponse}
            disabled={sending || !hasValue || !memberId || question.closed}
            className="dp-body flex items-center justify-center gap-1.5 text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40 mt-1"
            style={{ background: GREEN }}
          >
            📤 {sending ? "Enviando…" : "Enviar"}
          </button>
        </div>
      )}

      {sent && (
        <div className="dp-body text-[11px] flex items-center gap-1 mb-2" style={{ color: GREEN }}>
          ✅ {question.type === "promedio" ? "Propuesta guardada" : "Voto guardado"}
        </div>
      )}
      {sendError && (
        <div className="dp-body text-[11px] mb-2" style={{ color: CORAL }}>{sendError}</div>
      )}

      {!result && (
        <button
          onClick={computeResults}
          disabled={computing}
          className="dp-body flex items-center gap-1.5 text-xs px-3 py-2 rounded-full font-medium disabled:opacity-40"
          style={{ background: BLUE, color: "#fff" }}
        >
          ✨ {computing ? "Calculando…" : "Calcular decisión colectiva"}
        </button>
      )}
      {resultError && (
        <div className="dp-body text-[11px] mt-2" style={{ color: CORAL }}>{resultError}</div>
      )}

      {result && result.type === "promedio" && (
        <div className="mt-4 rounded-xl p-3.5" style={{ background: BLUE_SOFT }}>
          <div className="dp-body text-[11px] font-medium mb-2.5" style={{ color: INK + "99" }}>
            {result.n} propuestas · {result.trimmedCount} recortadas de cada extremo
            {result.suggestedMinPercent > question.trimPercent && (
              <> · mínimo sugerido: {result.suggestedMinPercent}%</>
            )}
          </div>
          <div className="flex flex-wrap gap-1.5 mb-3">
            {result.sorted.map((v, i) => {
              const isTrimmed = i < result.trimmedCount || i >= result.sorted.length - result.trimmedCount;
              const named = result.sortedWithNames && result.sortedWithNames[i];
              return (
                <span
                  key={i}
                  className="dp-mono text-xs px-2 py-1 rounded-md"
                  style={isTrimmed ? { background: CORAL + "22", color: CORAL, textDecoration: "line-through" } : { background: "#fff", color: INK }}
                >
                  {named ? `${named.name}: ${named.value}` : v}
                </span>
              );
            })}
          </div>
          <div className="dp-mono text-xs mb-2.5 leading-relaxed" style={{ color: INK + "aa" }}>
            ({result.kept.join(" + ")}) ÷ {result.kept.length} = {result.average.toFixed(2)}
          </div>
          <div className="flex items-baseline justify-between pt-2.5" style={{ borderTop: `1px solid ${BLUE}33` }}>
            <span className="dp-body text-xs font-medium" style={{ color: INK + "99" }}>Decisión colectiva</span>
            <span className="dp-display text-3xl font-bold" style={{ color: BLUE }}>{result.average.toFixed(2)}</span>
          </div>
        </div>
      )}

      {result && (result.type === "mayoria" || result.type === "encuesta") && (
        <div className="mt-4 rounded-xl p-3.5" style={{ background: BLUE_SOFT }}>
          <div className="dp-body text-[11px] font-medium mb-3" style={{ color: INK + "99" }}>
            {result.totalVoters} voto(s)
          </div>
          {result.tally.map((t) => (
            <OptionBar key={t.option} option={t.option} count={t.count} percent={t.percent} highlight={result.winner === t.option} />
          ))}
          {result.type === "mayoria" && (
            <div className="flex items-baseline justify-between pt-2.5 mt-1" style={{ borderTop: `1px solid ${BLUE}33` }}>
              <span className="dp-body text-xs font-medium" style={{ color: INK + "99" }}>Decisión colectiva</span>
              <span className="dp-display text-lg font-bold" style={{ color: result.winner ? GREEN : CORAL }}>
                {result.winner || "sin ganador todavía"}
              </span>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function ExplanationScreen({ onBack }) {
  return (
    <div className="px-4 py-6">
      <button onClick={onBack} className="dp-body text-xs mb-4" style={{ color: INK + "88" }}>← Volver</button>
      <div className="rounded-2xl p-4 mb-4" style={{ background: WARM_WHITE, border: `1px solid ${BLUE}33` }}>
        <div className="dp-body text-sm font-semibold mb-2" style={{ color: INK }}>¿Qué es la democracia por promedio?</div>
        <p className="dp-body text-[13px] leading-relaxed" style={{ color: INK + "aa" }}>
          Es una forma de tomar decisiones en grupo usando números en vez de
          votos de sí/no. Cada persona propone una cantidad (una cuota, un
          porcentaje, un presupuesto), y la decisión final es el promedio de
          todas las propuestas — pero antes de promediar, se descartan las
          propuestas más extremas para que nadie pueda manipular el
          resultado con un número absurdo.
        </p>
      </div>

      <div className="rounded-2xl p-4 mb-4" style={{ background: WARM_WHITE, border: `1px solid ${BLUE}33` }}>
        <div className="dp-body text-sm font-semibold mb-2" style={{ color: INK }}>Ejemplo</div>
        <p className="dp-body text-[13px] leading-relaxed mb-2" style={{ color: INK + "aa" }}>
          6 vecinos proponen una cuota mensual: $750, $800, $820, $900, $950
          y $3,000 (este último parece un error o un intento de manipular).
        </p>
        <p className="dp-body text-[13px] leading-relaxed mb-2" style={{ color: INK + "aa" }}>
          Con 6 participantes, la app recorta automáticamente al menos la
          propuesta más alta y la más baja antes de promediar. El resultado
          usa solo $800, $820, $900 y $950 → una decisión de <b>$867.50</b>,
          sin que el $3,000 la distorsione.
        </p>
      </div>

      <div className="rounded-2xl p-4" style={{ background: WARM_WHITE, border: `1px solid ${BLUE}33` }}>
        <div className="dp-body text-sm font-semibold mb-2" style={{ color: INK }}>Cómo funciona la app</div>
        <ul className="dp-body text-[13px] leading-relaxed space-y-1.5 list-disc list-outside pl-4" style={{ color: INK + "aa" }}>
          <li>Un administrador crea un grupo y comparte el código con los demás.</li>
          <li>Cada persona se une con ese código y espera la aprobación del administrador.</li>
          <li>El administrador agrega preguntas y define el % de recorte.</li>
          <li>Cada miembro aprobado envía su propuesta numérica.</li>
          <li>La app calcula y muestra la decisión colectiva, con la fórmula visible.</li>
        </ul>
      </div>
    </div>
  );
}

function AdminReturnScreen({ backendUrl, onBack, onEntered }) {
  const [code, setCode] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");

  const submit = async () => {
    if (!code) return;
    setLoading(true);
    setError("");
    try {
      const res = await fetch(`${backendUrl}/api/groups/${code.trim()}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Grupo no encontrado");
      onEntered({ code: code.trim(), memberId: data.admin.id });
    } catch (e) {
      setError(
        e.message === "Failed to fetch"
          ? "No se pudo conectar al backend. ¿Sigue corriendo npm start en tu terminal?"
          : e.message
      );
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="px-4 py-6">
      <button onClick={onBack} className="dp-body text-xs mb-4" style={{ color: INK + "88" }}>← Volver</button>
      <div className="rounded-2xl p-4" style={{ background: WARM_WHITE, border: `1px solid ${BLUE}33` }}>
        <div className="dp-body text-sm font-medium mb-1" style={{ color: INK }}>Ingresar a un grupo que administras</div>
        <p className="dp-body text-[12px] mb-3" style={{ color: INK + "77" }}>
          Solo necesitas el código del grupo que creaste.
        </p>
        <div className="flex flex-col gap-2.5 mb-3">
          <Field label="Código del grupo" value={code} onChange={setCode} placeholder="ej. MC231G" />
        </div>
        <PrimaryButton onClick={submit} disabled={loading || !code}>
          {loading ? "Entrando…" : "Entrar como administrador"}
        </PrimaryButton>
        {error && <div className="dp-body text-[12px] mt-2" style={{ color: CORAL }}>{error}</div>}
      </div>
    </div>
  );
}

function buildJoinLink(code) {
  const base = window.location.origin + window.location.pathname;
  return `${base}?code=${code}`;
}

function ShareGroup({ groupName, code }) {
  const [copiedCode, setCopiedCode] = useState(false);
  const [copiedLink, setCopiedLink] = useState(false);
  const link = buildJoinLink(code);

  const copy = async (text, setFlag) => {
    try {
      await navigator.clipboard.writeText(text);
      setFlag(true);
      setTimeout(() => setFlag(false), 1500);
    } catch (e) {
      // Si el navegador bloquea el portapapeles, no pasa nada grave.
    }
  };

  const mailtoHref =
    `mailto:?subject=${encodeURIComponent(`Invitación a "${groupName}" en Democracia por Promedio`)}` +
    `&body=${encodeURIComponent(`Únete a nuestro grupo con este código: ${code}\n\nO abre este link directo:\n${link}`)}`;

  return (
    <div className="flex flex-col gap-2">
      <div className="flex items-center justify-between rounded-lg px-2.5 py-1.5" style={{ background: BLUE_SOFT }}>
        <span className="dp-mono text-sm font-semibold" style={{ color: INK }}>{code}</span>
        <button onClick={() => copy(code, setCopiedCode)} className="dp-body text-[11px] font-medium" style={{ color: BLUE }}>
          {copiedCode ? "✓ copiado" : "copiar código"}
        </button>
      </div>
      <div className="flex items-center justify-between rounded-lg px-2.5 py-1.5" style={{ background: BLUE_SOFT }}>
        <span className="dp-mono text-[11px] truncate mr-2" style={{ color: INK + "aa" }}>{link}</span>
        <button onClick={() => copy(link, setCopiedLink)} className="dp-body text-[11px] font-medium shrink-0" style={{ color: BLUE }}>
          {copiedLink ? "✓ copiado" : "copiar link"}
        </button>
      </div>
      <a
        href={mailtoHref}
        className="dp-body text-center text-[12px] px-2.5 py-2 rounded-full font-medium"
        style={{ background: BLUE, color: "#fff" }}
      >
        ✉ Enviar código y link por correo
      </a>
    </div>
  );
}

        <div className="text-xs" style={{ color: INK + "88" }}>
          Arma tu propio grupo, preguntas y reglas, sin plantilla.

      </button>
      <button

        style={{ background: WARM_WHITE, border: `1.5px solid ${BLUE}55` }}
      >
        <div className="text-sm font-semibold mb-1" style={{ color: INK }}>
          🏘️ Asociaciones, clubes y orgs
          <span className="dp-body text-[9px] font-semibold ml-1.5 px-1.5 py-0.5 rounded-full" style={{ background: CORAL + "22", color: CORAL }}>
            PRÓXIMAMENTE
          </span>
        </div>
        <div className="text-xs" style={{ color: INK + "88" }}>
          Plantilla con cuotas y presupuesto participativo listos para usar.
        </div>
      </button>
      <button
        onClick={() => showSoon("Municipios o países")}
        className="dp-body text-left rounded-2xl p-4 shadow-sm"
        style={{ background: WARM_WHITE, border: `1.5px solid ${BLUE}55` }}
      >
        <div className="text-sm font-semibold mb-1" style={{ color: INK }}>
          🏛️ Municipios o países
          <span className="dp-body text-[9px] font-semibold ml-1.5 px-1.5 py-0.5 rounded-full" style={{ background: CORAL + "22", color: CORAL }}>

function CustomEntryScreen({ onBack, onChooseCreate, onChooseAdminReturn, onChooseJoin }) {
  return (
    <div className="px-4 py-6 flex flex-col gap-3">
      <button onClick={onBack} className="dp-body text-xs text-left mb-1" style={{ color: INK + "88" }}>← Volver</button>
      <button

      </button>
      <button

      >
        <div className="text-sm font-semibold mb-1" style={{ color: INK }}>🔧 Ingresar a un grupo que administras</div>

      </button>
      <button

function NewQuestionForm({ backendUrl, groupCode, onAdded }) {
  const [type, setType] = useState("promedio");
  const [text, setText] = useState("");
  const [trimPercent, setTrimPercent] = useState("5");
  const [options, setOptions] = useState(["", ""]);
  const [majorityRule, setMajorityRule] = useState("absoluta");
  const [closesInHours, setClosesInHours] = useState("");
  const [adding, setAdding] = useState(false);
  const [error, setError] = useState("");

  const updateOption = (i, val) => setOptions(options.map((o, idx) => (idx === i ? val : o)));
  const addOption = () => setOptions([...options, ""]);
  const removeOption = (i) => setOptions(options.filter((_, idx) => idx !== i));

  const submit = async () => {
    if (!text) return;
    const cleanOptions = options.map((o) => o.trim()).filter(Boolean);
    if (type !== "promedio" && cleanOptions.length < 2) {
      setError("Agrega al menos 2 opciones");
      return;
    }
    setAdding(true);
    setError("");
    try {
      const body = { type, text };
      if (closesInHours) body.closesInHours = Number(closesInHours);
      if (type === "promedio") {
        body.trimPercent = Number(trimPercent);
      } else {
        body.options = cleanOptions;
        if (type === "mayoria") body.majorityRule = majorityRule;
      }
      const res = await fetch(`${backendUrl}/api/groups/${groupCode}/questions`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Error al crear la pregunta");
      setText("");
      setOptions(["", ""]);
      setClosesInHours("");
      await onAdded();
    } catch (e) {
      setError(e.message);
    } finally {
      setAdding(false);
    }
  };

  return (
    <div className="rounded-2xl p-4 mb-4" style={{ background: WARM_WHITE, border: `1px solid ${BLUE}33` }}>
      <div className="dp-body text-xs font-medium mb-3" style={{ color: INK }}>Nueva pregunta</div>

      <div className="flex gap-1.5 mb-3">
        {[
          { key: "promedio", label: "Promedio" },
          { key: "mayoria", label: "Mayoría" },
          { key: "encuesta", label: "Encuesta" },
        ].map((t) => (
          <button
            key={t.key}
            onClick={() => setType(t.key)}
            className="dp-body text-xs px-3 py-1.5 rounded-full font-medium flex-1"
            style={type === t.key ? { background: BLUE, color: "#fff" } : { background: BLUE_SOFT, color: INK }}
          >
            {t.label}
          </button>
        ))}
      </div>

      <textarea
        rows={2}
        value={text}
        onChange={(e) => setText(e.target.value)}
        placeholder="Escribe la pregunta…"
        className="dp-body w-full resize-none rounded-lg px-2.5 py-2 text-sm outline-none mb-2"
        style={{ background: BLUE_SOFT, color: INK }}
      />

      {type === "promedio" && (
        <div className="dp-body flex items-center gap-1.5 text-xs px-2.5 py-1.5 rounded-full mb-3 w-fit" style={{ background: BLUE_SOFT, color: INK }}>
          <span style={{ opacity: 0.6 }}>Recorte</span>
          <input type="number" value={trimPercent} onChange={(e) => setTrimPercent(e.target.value)} className="w-9 bg-transparent dp-mono text-center outline-none font-medium" />
          <span style={{ opacity: 0.6 }}>%</span>
        </div>
      )}

      {(type === "mayoria" || type === "encuesta") && (
        <div className="mb-3">
          {options.map((opt, i) => (
            <div key={i} className="flex items-center gap-2 mb-1.5">
              <input
                value={opt}
                onChange={(e) => updateOption(i, e.target.value)}
                placeholder={`Opción ${i + 1}`}
                className="dp-body flex-1 rounded-lg px-2.5 py-1.5 text-sm outline-none"
                style={{ background: BLUE_SOFT, color: INK }}
              />
              {options.length > 2 && (
                <button onClick={() => removeOption(i)} className="dp-body text-xs px-1" style={{ color: CORAL }}>✕</button>
              )}
            </div>
          ))}
          <button onClick={addOption} className="dp-body text-xs font-medium" style={{ color: BLUE }}>
            + agregar opción
          </button>
        </div>
      )}

      {type === "mayoria" && (
        <div className="flex gap-1.5 mb-3">
          <button
            onClick={() => setMajorityRule("absoluta")}
            className="dp-body text-[11px] px-2.5 py-1.5 rounded-full font-medium flex-1"
            style={majorityRule === "absoluta" ? { background: BLUE, color: "#fff" } : { background: BLUE_SOFT, color: INK }}
          >
            Mayoría absoluta (+50%)
          </button>
          <button
            onClick={() => setMajorityRule("pluralidad")}
            className="dp-body text-[11px] px-2.5 py-1.5 rounded-full font-medium flex-1"
            style={majorityRule === "pluralidad" ? { background: BLUE, color: "#fff" } : { background: BLUE_SOFT, color: INK }}
          >
            Pluralidad (la más votada)
          </button>
        </div>
      )}

      <label className="dp-body flex items-center gap-1.5 text-xs mb-3" style={{ color: INK + "99" }}>
        Cierra en (horas, opcional)
        <input
          type="number"
          value={closesInHours}
          onChange={(e) => setClosesInHours(e.target.value)}
          placeholder="sin límite"
          className="dp-mono w-20 rounded-lg px-2 py-1 outline-none"
          style={{ background: BLUE_SOFT, color: INK }}
        />
      </label>

      {error && <div className="dp-body text-[12px] mb-2" style={{ color: CORAL }}>{error}</div>}

      <button
        onClick={submit}
        disabled={adding || !text}
        className="dp-body w-full flex items-center justify-center gap-1.5 text-xs py-2 rounded-full text-white font-medium disabled:opacity-40"
        style={{ background: BLUE }}
      >
        ➕ {adding ? "Agregando…" : "Agregar pregunta"}
      </button>
    </div>
  );
}

function ConnectedScreen({ backendUrl, groupCode, memberId, onExit }) {
  const [group, setGroup] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");
  const [approving, setApproving] = useState("");
  const prevPendingCount = React.useRef(null);

  const fetchGroup = async () => {
    setLoading(true);
    setError("");
    try {
      const res = await fetch(`${backendUrl}/api/groups/${groupCode}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Grupo no encontrado");
      setGroup(data);

      const isAdminNow = data.admin.id === memberId;
      const pendingCount = data.members.filter((m) => !m.approved).length;
      if (
        isAdminNow &&
        prevPendingCount.current !== null &&
        pendingCount > prevPendingCount.current &&
        typeof Notification !== "undefined" &&
        Notification.permission === "granted"
      ) {
        new Notification("Nueva solicitud pendiente", {
          body: `Alguien quiere unirse a "${data.name}". Entra a la app para aprobar o rechazar.`,
        });
      }
      prevPendingCount.current = pendingCount;
    } catch (e) {
      setError(
        e.message === "Failed to fetch"
          ? "No se pudo conectar al backend. ¿Sigue corriendo npm start en tu terminal?"
          : e.message
      );
    } finally {
      setLoading(false);
    }
  };

  useEffect(() => {
    fetchGroup();
    const interval = setInterval(fetchGroup, 15000);
    if (typeof Notification !== "undefined" && Notification.permission === "default") {
      Notification.requestPermission();
    }
    return () => clearInterval(interval);
  }, []);

  const approve = async (id) => {
    setApproving(id);
    try {
      await fetch(`${backendUrl}/api/groups/${groupCode}/members/${id}/approve`, { method: "POST" });
      await fetchGroup();
    } catch (e) {
      setError(e.message);
    } finally {
      setApproving("");
    }
  };

  const reject = async (id) => {
    setApproving(id);
    try {
      await fetch(`${backendUrl}/api/groups/${groupCode}/members/${id}/reject`, { method: "POST" });
      await fetchGroup();
    } catch (e) {
      setError(e.message);
    } finally {
      setApproving("");
    }
  };

  if (loading && !group) {
    return <div className="dp-body text-sm text-center py-10" style={{ color: INK + "88" }}>Conectando…</div>;
  }
  if (error && !group) {
    return (
      <div className="px-4 py-6">
        <div className="dp-body text-[13px]" style={{ color: CORAL }}>{error}</div>
        <button onClick={onExit} className="dp-body text-xs mt-3" style={{ color: INK + "88" }}>← Volver</button>
      </div>
    );
  }
  if (!group) return null;

  const me = group.members.find((m) => m.id === memberId);
  const isAdmin = group.admin.id === memberId;
  const pendingMembers = group.members.filter((m) => !m.approved);

  return (
    <div className="px-4 py-4">
      <div className="rounded-2xl p-4 mb-4" style={{ background: WARM_WHITE, border: `1px solid ${BLUE}33` }}>
        <div className="flex items-start justify-between">
          <div>
            <div className="dp-body text-sm font-semibold" style={{ color: INK }}>{group.name}</div>
            <div className="dp-mono text-xs mt-0.5" style={{ color: INK + "88" }}>código: {group.code}</div>
          </div>
          <button onClick={onExit} className="dp-body text-[11px]" style={{ color: INK + "77" }}>Salir</button>
        </div>
        <div className="dp-body text-[11px] mt-2" style={{ color: INK + "88" }}>
          {group.members.filter((m) => m.approved).length} miembro(s) aprobado(s)
          {isAdmin && " · eres el administrador"}
        </div>
        {me && !me.approved && (
          <div className="dp-body text-[12px] mt-2 rounded-lg px-2.5 py-1.5" style={{ background: CORAL + "22", color: CORAL }}>
            Tu participación está pendiente de aprobación del administrador.
          </div>
        )}
        <div className="flex gap-2 mt-2.5">
          <a href={`${backendUrl}/api/groups/${groupCode}/export/respuestas.csv`} className="dp-body text-[11px] px-2.5 py-1.5 rounded-full font-medium" style={{ background: BLUE_SOFT, color: INK }}>⬇ Respuestas (CSV)</a>
          <a href={`${backendUrl}/api/groups/${groupCode}/export/resultados.csv`} className="dp-body text-[11px] px-2.5 py-1.5 rounded-full font-medium" style={{ background: BLUE_SOFT, color: INK }}>⬇ Resultados (CSV)</a>
        </div>
        {isAdmin && (
          <div className="mt-3 pt-3" style={{ borderTop: `1px solid ${BLUE}22` }}>
            <div className="dp-body text-xs font-medium mb-2" style={{ color: INK }}>
              Link directo para invitar usuarios a este grupo
            </div>
            <ShareGroup groupName={group.name} code={group.code} />
          </div>
        )}
      </div>

      {isAdmin && pendingMembers.length > 0 && (
        <div className="rounded-2xl p-4 mb-4" style={{ background: CORAL + "15", border: `1.5px solid ${CORAL}55` }}>
          <div className="dp-body text-xs font-semibold mb-2.5" style={{ color: CORAL }}>
            {pendingMembers.length} solicitud(es) pendiente(s)
          </div>
          <div className="flex flex-col gap-2">
            {pendingMembers.map((m) => (
              <div key={m.id} className="flex items-center justify-between">
                <span className="dp-body text-sm" style={{ color: INK }}>{m.name}</span>
                <div className="flex gap-1.5">
                  <button
                    onClick={() => approve(m.id)}
                    disabled={approving === m.id}
                    className="dp-body text-[11px] px-2.5 py-1.5 rounded-full text-white font-medium disabled:opacity-40"
                    style={{ background: GREEN }}
                  >
                    {approving === m.id ? "…" : "Aprobar"}
                  </button>
                  <button
                    onClick={() => reject(m.id)}
                    disabled={approving === m.id}
                    className="dp-body text-[11px] px-2.5 py-1.5 rounded-full font-medium disabled:opacity-40"
                    style={{ background: "#fff", color: CORAL, border: `1px solid ${CORAL}55` }}
                  >
                    Rechazar
                  </button>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {isAdmin && <NewQuestionForm backendUrl={backendUrl} groupCode={groupCode} onAdded={fetchGroup} />}

      {group.questions.length === 0 && (
        <div className="dp-body text-xs text-center py-4" style={{ color: INK + "77" }}>
          Este grupo todavía no tiene preguntas.
        </div>
      )}

      {group.questions.map((q) => (
        <QuestionRunner key={q.id} backendUrl={backendUrl} groupCode={groupCode} memberId={memberId} question={q} />
      ))}
    </div>
  );
}

        )}
        {view === "explain" && <ExplanationScreen onBack={() => setView("home")} />}
        {view === "create" && (
          <CreateGroupScreen
            backendUrl={backendUrl}
            onBack={() => setView("custom")}
            onCreated={({ code, memberId, groupName }) => {
              setGroupCode(code);
              setMemberId(memberId);
              setCreatedGroupName(groupName);
              persistSession(code, memberId);
              setView("groupCreated");
            }}
          />
        )}
        {view === "groupCreated" && (
          <GroupCreatedScreen
            groupName={createdGroupName}
            code={groupCode}
            onContinue={() => setView("connected")}
          />
        )}
        {view === "adminReturn" && (
          <AdminReturnScreen
            backendUrl={backendUrl}
            onBack={() => setView("custom")}
            onEntered={({ code, memberId }) => {
              setGroupCode(code);
              setMemberId(memberId);
              persistSession(code, memberId);
              setView("connected");
            }}
          />
        )}
        {view === "join" && (
          <JoinGroupScreen
            backendUrl={backendUrl}
            initialCode={urlCode}
            onBack={() => setView("custom")}
            onJoined={({ code, memberId }) => {
              setGroupCode(code);
              setMemberId(memberId);
              persistSession(code, memberId);
              setView("connected");
            }}
          />
        )}
        {view === "connected" && (
          <ConnectedScreen
            backendUrl={backendUrl}
            groupCode={groupCode}
            memberId={memberId}
            onExit={() => {
              setGroupCode("");
              setMemberId("");
              clearSession();
              setView("home");
            }}
          />
        )}

        <div className="px-4 pb-4">
          <button
            onClick={() => setShowSettings(!showSettings)}
            className="dp-body text-[10px]"
            style={{ color: INK + "55" }}
          >
            servidor: {backendUrl} {showSettings ? "▲" : "▼"}
          </button>
          {showSettings && (
            <input
              value={backendUrl}
              onChange={(e) => setBackendUrl(e.target.value)}
              className="dp-mono w-full mt-1.5 rounded-lg px-2.5 py-1.5 text-xs outline-none"
              style={{ background: BLUE_SOFT, color: INK }}
            />
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<DemocraciaPorPromedioConectada />);
</script>
</body>
</html>
