<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Democracia por Promedio</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.47.0/iconfont/tabler-icons.min.css" rel="stylesheet" />
<style>
  body { margin: 0; }
  .dp-display { font-family: 'Sora', sans-serif; }
  .dp-body { font-family: 'Inter', sans-serif; }
  .dp-mono { font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const INK = "#14213D";
const BLUE = "#3A6EA5";
const BLUE_SOFT = "#E8EDFB";
const WARM_WHITE = "#FFFFFF";
const PAGE_BG = "#F5F5F7";
const CORAL = "#D64550";
const GREEN = "#2E8B57";

function Field({ label, value, onChange, placeholder, type = "text" }) {
  return (
    <label className="dp-body flex flex-col gap-1 text-xs" style={{ color: INK + "99" }}>
      {label}
      <input
        type={type}
        value={value}
        placeholder={placeholder}
        onChange={(e) => onChange(e.target.value)}
        className="dp-mono rounded-lg px-2.5 py-1.5 text-sm outline-none"
        style={{ background: BLUE_SOFT, color: INK }}
      />
    </label>
  );
}

function PrimaryButton({ children, onClick, disabled }) {
  return (
    <button
      onClick={onClick}
      disabled={disabled}
      className="dp-body w-full flex items-center justify-center gap-1.5 text-sm py-2.5 rounded-full text-white font-medium disabled:opacity-40"
      style={{ background: BLUE }}
    >
      {children}
    </button>
  );
}

function CountdownBadge({ closesAt, closed }) {
  const [now, setNow] = useState(Date.now());
  useEffect(() => {
    if (closed || !closesAt) return;
    const interval = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(interval);
  }, [closed, closesAt]);

  if (closed) {
    return (
      <span className="dp-body text-[11px] px-2 py-0.5 rounded-full font-medium" style={{ background: CORAL + "22", color: CORAL }}>
        cerrada
      </span>
    );
  }
  if (!closesAt) return null;

  const msLeft = new Date(closesAt).getTime() - now;
  if (msLeft <= 0) {
    return (
      <span className="dp-body text-[11px] px-2 py-0.5 rounded-full font-medium" style={{ background: CORAL + "22", color: CORAL }}>
        cerrando…
      </span>
    );
  }
  const hours = Math.floor(msLeft / 3600000);
  const mins = Math.floor((msLeft % 3600000) / 60000);
  const label = hours > 0 ? `${hours}h ${mins}m` : `${mins}m`;
  return (
    <span className="dp-body text-[11px] px-2 py-0.5 rounded-full font-medium" style={{ background: BLUE_SOFT, color: INK }}>
      ⏱ cierra en {label}
    </span>
  );
}

function formatMoney(n) {
  return "$" + Math.round(n).toLocaleString("es-MX");
}

const PIE_COLORS = ["#3A6EA5", "#E0A458", "#8B5A8F", "#4C9F70", "#D64550", "#6B4E9E", "#5C8A99", "#B5533C"];

function PieChart({ data, size }) {
  // data: [{ label, value }] — anillo segmentado, con espacio entre cada
  // categoría y puntas redondeadas (estilo dashboard moderno).
  const total = data.reduce((sum, d) => sum + (Number(d.value) || 0), 0);
  const px = size || 88;
  const r = 38;
  const thickness = px < 100 ? 9 : 12;
  const gap = 5;
  const circumference = 2 * Math.PI * r;
  let offset = 0;
  const segments = data.map((d, i) => {
    const frac = total > 0 ? (Number(d.value) || 0) / total : 0;
    const segLen = Math.max(0, frac * circumference - gap);
    const seg = { color: PIE_COLORS[i % PIE_COLORS.length], segLen, offset };
    offset += frac * circumference;
    return seg;
  });
  return (
    <div style={{ display: "flex", alignItems: "center", gap: "12px" }}>
      <svg width={px} height={px} viewBox="0 0 100 100" style={{ flexShrink: 0 }}>
        {total > 0 ? (
          segments.map((s, i) => (
            <circle
              key={i}
              cx="50" cy="50" r={r}
              fill="none"
              stroke={s.color}
              strokeWidth={thickness}
              strokeDasharray={`${s.segLen} ${circumference - s.segLen}`}
              strokeDashoffset={-s.offset}
              strokeLinecap="round"
              transform="rotate(-90 50 50)"
            />
          ))
        ) : (
          <circle cx="50" cy="50" r={r} fill="none" stroke={PAGE_BG} strokeWidth={thickness} />
        )}
      </svg>
      <div style={{ flex: 1 }}>
        {data.map((d, i) => (
          <div key={d.label} className="dp-body flex items-center gap-1.5 text-[11px] mb-0.5" style={{ color: INK + "cc" }}>
            <span style={{ width: "8px", height: "8px", borderRadius: "50%", background: PIE_COLORS[i % PIE_COLORS.length], flexShrink: 0 }} />
            <span style={{ flex: 1 }}>{d.label}</span>
            <span className="dp-mono">{(Number(d.value) || 0).toFixed(1)}%</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function OptionBar({ option, count, percent, highlight }) {
  return (
    <div className="mb-2.5">
      <div className="flex justify-between dp-body text-xs mb-1" style={{ color: INK }}>
        <span>{highlight ? "🏆 " : ""}{option}</span>
        <span className="dp-mono" style={{ color: INK + "99" }}>{count} · {percent}%</span>
      </div>
      <div className="rounded-full h-2 overflow-hidden" style={{ background: "#fff" }}>
        <div className="h-2 rounded-full" style={{ width: `${percent}%`, background: highlight ? GREEN : BLUE }} />
      </div>
    </div>
  );
}

function DetailsToggle({ show, onToggle, color }) {
  return (
    <button
      onClick={onToggle}
      className="dp-body flex items-center gap-1 text-[11px] font-medium mb-2"
      style={{ color: color || INK + "99" }}
    >
      <span style={{ display: "inline-block", transform: show ? "rotate(90deg)" : "rotate(0deg)", transition: "transform 0.15s" }}>▶</span>
      {show ? "Ocultar proceso" : "Ver proceso"}
    </button>
  );
}

function QuestionRunner({ backendUrl, groupCode, memberId, question, isAdmin, groupResponses, approvedMemberCount }) {
  const rule = question.majorityRule;
  const isRankeado = rule === "rankeado";
  const isSegundaVuelta = rule === "segunda_vuelta";

  const [value, setValue] = useState("");
  const [rankOrder, setRankOrder] = useState([]);
  const [sending, setSending] = useState(false);
  const [sendError, setSendError] = useState("");
  const [sent, setSent] = useState(false);
  const [result, setResult] = useState(null);
  const [computing, setComputing] = useState(false);
  const [resultError, setResultError] = useState("");
  const [closingRound, setClosingRound] = useState(false);
  const [showDetails, setShowDetails] = useState(true);

  const freshTieBreak = (result && result.tieBreak) || question.tieBreak;
  const inTieBreak = isRankeado && freshTieBreak && !freshTieBreak.finished;
  const rankeadoResolved = isRankeado && freshTieBreak && freshTieBreak.finished;

  const hasValue = isRankeado && !inTieBreak ? rankOrder.length > 0 : value !== "";

  const toggleRank = (opt) => {
    setRankOrder((prev) => (prev.includes(opt) ? prev.filter((o) => o !== opt) : [...prev, opt]));
  };

  const sendResponse = async () => {
    if (!memberId || !hasValue) return;
    setSending(true);
    setSendError("");
    try {
      const sendValue = isRankeado && !inTieBreak ? rankOrder : question.type === "promedio" ? Number(value) : value;
      const res = await fetch(
        `${backendUrl}/api/groups/${groupCode}/questions/${question.id}/responses`,
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ memberId, value: sendValue }),
        }
      );
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Error al enviar");
      setSent(true);
      setValue("");
      setRankOrder([]);
      await computeResults(false);
    } catch (e) {
      setSendError(e.message);
    } finally {
      setSending(false);
    }
  };

  const computeResults = async (silent) => {
    if (!silent) setComputing(true);
    setResultError("");
    try {
      const res = await fetch(`${backendUrl}/api/groups/${groupCode}/questions/${question.id}/results`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Error al calcular");
      setResult(data);
    } catch (e) {
      if (!silent) setResultError(e.message);
    } finally {
      if (!silent) setComputing(false);
    }
  };

  const closeRound = async () => {
    const ok = window.confirm(
      "¿Seguro que quieres cerrar esta ronda? Nadie más podrá votar en ella después de esto. Esta acción no se puede deshacer."
    );
    if (!ok) return;
    setClosingRound(true);
    try {
      await fetch(`${backendUrl}/api/groups/${groupCode}/questions/${question.id}/close-round`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ memberId }),
      });
      await computeResults(true);
    } catch (e) {
      setResultError(e.message);
    } finally {
      setClosingRound(false);
    }
  };

  const needsLivePolling = isSegundaVuelta || Boolean(freshTieBreak);

  useEffect(() => {
    if (needsLivePolling) computeResults(true);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [needsLivePolling]);

  useEffect(() => {
    if (!result && !needsLivePolling) return;
    const interval = setInterval(() => computeResults(true), 15000);
    return () => clearInterval(interval);
  }, [Boolean(result), needsLivePolling]);

  const ruleLabel = {
    simple: "gana la más votada",
    absoluta: "necesita más del 50%",
    calificada: `necesita más del ${question.qualifiedPct}%`,
    rankeado: "voto ranqueado (automático)",
    segunda_vuelta: `${question.numRounds} rondas · elimina menos del ${question.eliminationThresholdPercent}%`,
  }[rule];

  const currentOptions = isSegundaVuelta && result ? result.currentOptions : question.options;

  const liveVoteCount = React.useMemo(() => {
    if (!groupResponses) return null;
    if (isSegundaVuelta) {
      return groupResponses.filter((r) => r.questionId === question.id && r.roundNum === question.currentRound).length;
    }
    if (inTieBreak) {
      return groupResponses.filter((r) => r.questionId === question.id && r.tieBreakRound === freshTieBreak.currentRound).length;
    }
    if (isRankeado) {
      return groupResponses.filter((r) => r.questionId === question.id && !r.tieBreakRound).length;
    }
    return groupResponses.filter((r) => r.questionId === question.id).length;
  }, [groupResponses, question.id, isSegundaVuelta, isRankeado, inTieBreak, question.currentRound, freshTieBreak && freshTieBreak.currentRound]);
  const isClosedForVoting = isSegundaVuelta ? Boolean(result && result.finished) : question.closed;

  return (
    <div className="rounded-2xl p-4 mb-4 shadow-sm" style={{ background: WARM_WHITE, border: `1px solid ${BLUE}33` }}>
      <div className="flex items-start justify-between gap-2 mb-1">
        <div className="dp-body text-[15px]" style={{ color: INK }}>{question.text}</div>
        {!isSegundaVuelta && !inTieBreak && !rankeadoResolved && <CountdownBadge closesAt={question.closesAt} closed={question.closed} />}
        {isSegundaVuelta && result && (
          <CountdownBadge closesAt={result.finished ? null : question.roundClosesAt} closed={result.finished} />
        )}
      </div>
      <div className="dp-body text-[11px] mb-3" style={{ color: INK + "77" }}>
        {question.type === "promedio" ? `recorte: ${question.trimPercent}%` : ruleLabel}
        {isSegundaVuelta && result && !result.finished && ` · ronda ${result.currentRound}${result.inTieBreak ? " (desempate)" : ""}`}
        {inTieBreak && ` · ronda de desempate ${freshTieBreak.currentRound}`}
      </div>
      {liveVoteCount !== null && (
        <div className="dp-body text-[11px] mb-3 flex items-center gap-1.5" style={{ color: INK + "88" }}>
          <span style={{ display: "inline-block", width: "6px", height: "6px", borderRadius: "50%", background: GREEN }} />
          {liveVoteCount} de {approvedMemberCount} miembro(s) han votado
        </div>
      )}

      {question.type === "promedio" && (
        <div className="flex items-center gap-2 mb-2">
          <input
            type="number"
            placeholder="tu propuesta"
            value={value}
            disabled={isClosedForVoting}
            onChange={(e) => setValue(e.target.value)}
            className="dp-mono flex-1 rounded-lg px-2.5 py-1.5 text-sm outline-none disabled:opacity-50"
            style={{ background: BLUE_SOFT, color: INK }}
          />
          <button
            onClick={sendResponse}
            disabled={sending || !hasValue || !memberId || isClosedForVoting}
            className="dp-body flex items-center gap-1.5 text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40"
            style={{ background: GREEN }}
          >
            📤 {sending ? "Enviando…" : "Enviar"}
          </button>
        </div>
      )}

      {question.type === "mayoria" && !isRankeado && (
        <div className="flex flex-col gap-1.5 mb-2">
          {currentOptions.map((opt) => (
            <button
              key={opt}
              onClick={() => setValue(opt)}
              disabled={isClosedForVoting}
              className="dp-body text-left text-sm px-3 py-2 rounded-lg disabled:opacity-50"
              style={value === opt ? { background: BLUE, color: "#fff" } : { background: BLUE_SOFT, color: INK }}
            >
              {value === opt ? "● " : "○ "}{opt}
            </button>
          ))}
          <button
            onClick={sendResponse}
            disabled={sending || !hasValue || !memberId || isClosedForVoting}
            className="dp-body flex items-center justify-center gap-1.5 text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40 mt-1"
            style={{ background: GREEN }}
          >
            📤 {sending ? "Enviando…" : "Enviar"}
          </button>
        </div>
      )}

      {isRankeado && inTieBreak && (
        <div className="flex flex-col gap-1.5 mb-2">
          <div className="dp-body text-[11px] mb-1" style={{ color: CORAL }}>
            Hubo empate — vota de nuevo solo entre las opciones empatadas.
          </div>
          {freshTieBreak.currentOptions.map((opt) => (
            <button
              key={opt}
              onClick={() => setValue(opt)}
              className="dp-body text-left text-sm px-3 py-2 rounded-lg"
              style={value === opt ? { background: BLUE, color: "#fff" } : { background: BLUE_SOFT, color: INK }}
            >
              {value === opt ? "● " : "○ "}{opt}
            </button>
          ))}
          <button
            onClick={sendResponse}
            disabled={sending || !hasValue || !memberId}
            className="dp-body flex items-center justify-center gap-1.5 text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40 mt-1"
            style={{ background: GREEN }}
          >
            📤 {sending ? "Enviando…" : "Enviar"}
          </button>
        </div>
      )}

      {isRankeado && !inTieBreak && !rankeadoResolved && (
        <div className="flex flex-col gap-1.5 mb-2">
          <div className="dp-body text-[11px] mb-1" style={{ color: INK + "77" }}>toca en orden de preferencia (1ª, 2ª…)</div>
          {question.options.map((opt) => {
            const idx = rankOrder.indexOf(opt);
            return (
              <button
                key={opt}
                onClick={() => toggleRank(opt)}
                disabled={question.closed}
                className="dp-body flex items-center gap-2 text-left text-sm px-3 py-2 rounded-lg disabled:opacity-50"
                style={idx >= 0 ? { background: BLUE, color: "#fff" } : { background: BLUE_SOFT, color: INK }}
              >
                <span className="dp-mono font-semibold" style={{ minWidth: "16px" }}>{idx >= 0 ? idx + 1 : "–"}</span>
                {opt}
              </button>
            );
          })}
          <button
            onClick={sendResponse}
            disabled={sending || !hasValue || !memberId || question.closed}
            className="dp-body flex items-center justify-center gap-1.5 text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40 mt-1"
            style={{ background: GREEN }}
          >
            📤 {sending ? "Enviando…" : "Enviar"}
          </button>
        </div>
      )}

      {sent && (
        <div className="dp-body text-[11px] flex items-center gap-1 mb-2" style={{ color: GREEN }}>
          ✅ {question.type === "promedio" ? "Propuesta guardada" : "Voto guardado"}
        </div>
      )}
      {sendError && <div className="dp-body text-[11px] mb-2" style={{ color: CORAL }}>{sendError}</div>}

      {isSegundaVuelta && isAdmin && result && !result.finished && (
        <button
          onClick={closeRound}
          disabled={closingRound}
          className="dp-body flex items-center justify-center gap-1.5 w-full text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40 mb-2"
          style={{ background: BLUE }}
        >
          🔒 {closingRound ? "Cerrando…" : "Cerrar ronda y avanzar"}
        </button>
      )}
      {inTieBreak && isAdmin && (
        <button
          onClick={closeRound}
          disabled={closingRound}
          className="dp-body flex items-center justify-center gap-1.5 w-full text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40 mb-2"
          style={{ background: BLUE }}
        >
          🔒 {closingRound ? "Cerrando…" : "Cerrar ronda de desempate"}
        </button>
      )}

      {!isSegundaVuelta && !isRankeado && !result && (
        <button
          onClick={() => computeResults(false)}
          disabled={computing}
          className="dp-body flex items-center gap-1.5 text-xs px-3 py-2 rounded-full font-medium disabled:opacity-40"
          style={{ background: BLUE, color: "#fff" }}
        >
          ✨ {computing ? "Calculando…" : "Calcular decisión colectiva"}
        </button>
      )}
      {isRankeado && !freshTieBreak && !result && (
        <button
          onClick={() => computeResults(false)}
          disabled={computing}
          className="dp-body flex items-center gap-1.5 text-xs px-3 py-2 rounded-full font-medium disabled:opacity-40"
          style={{ background: BLUE, color: "#fff" }}
        >
          ✨ {computing ? "Calculando…" : "Calcular decisión colectiva"}
        </button>
      )}
      {resultError && <div className="dp-body text-[11px] mt-2" style={{ color: CORAL }}>{resultError}</div>}

      {result && question.type === "promedio" && (
        <div className="mt-4 rounded-xl p-3.5" style={{ background: BLUE_SOFT }}>
          <DetailsToggle show={showDetails} onToggle={() => setShowDetails(!showDetails)} />
          {showDetails && (
            <React.Fragment>
              <div className="dp-body text-[11px] font-medium mb-2.5" style={{ color: INK + "99" }}>
                {result.n} propuestas · {result.trimmedCount} recortadas de cada extremo
                {result.suggestedMinPercent > question.trimPercent && <> · mínimo sugerido: {result.suggestedMinPercent}%</>}
              </div>
              <div className="flex flex-wrap gap-1.5 mb-3">
                {result.sorted.map((v, i) => {
                  const isTrimmed = i < result.trimmedCount || i >= result.sorted.length - result.trimmedCount;
                  const named = result.sortedWithNames && result.sortedWithNames[i];
                  return (
                    <span
                      key={i}
                      className="dp-mono text-xs px-2 py-1 rounded-md"
                      style={isTrimmed ? { background: CORAL + "22", color: CORAL, textDecoration: "line-through" } : { background: "#fff", color: INK }}
                    >
                      {named ? `${named.name}: ${named.value}` : v}
                    </span>
                  );
                })}
              </div>
              <div className="dp-mono text-xs mb-2.5 leading-relaxed" style={{ color: INK + "aa" }}>
                ({result.kept.join(" + ")}) ÷ {result.kept.length} = {result.average.toFixed(2)}
              </div>
            </React.Fragment>
          )}
          <div className="flex items-baseline justify-between pt-2.5" style={{ borderTop: `1px solid ${BLUE}33` }}>
            <span className="dp-body text-xs font-medium" style={{ color: INK + "99" }}>Decisión colectiva</span>
            <span className="dp-display text-3xl font-bold" style={{ color: BLUE }}>{result.average.toFixed(2)}</span>
          </div>
        </div>
      )}

      {result && (rule === "simple" || rule === "absoluta" || rule === "calificada") && (
        <div className="mt-4 rounded-xl p-3.5" style={{ background: BLUE_SOFT }}>
          <DetailsToggle show={showDetails} onToggle={() => setShowDetails(!showDetails)} />
          {showDetails && (
            <React.Fragment>
              <div className="dp-body text-[11px] font-medium mb-3" style={{ color: INK + "99" }}>{result.totalVoters} voto(s)</div>
              {result.tally.map((t) => (
                <OptionBar key={t.option} option={t.option} count={t.count} percent={t.percent} highlight={result.winner === t.option} />
              ))}
            </React.Fragment>
          )}
          <div className="flex items-baseline justify-between pt-2.5 mt-1" style={{ borderTop: `1px solid ${BLUE}33` }}>
            <span className="dp-body text-xs font-medium" style={{ color: INK + "99" }}>Decisión colectiva</span>
            <span className="dp-display text-lg font-bold" style={{ color: result.winner ? GREEN : CORAL }}>
              {result.winner || "sin ganador todavía"}
            </span>
          </div>
        </div>
      )}

      {result && isRankeado && result.rounds && (
        <div className="mt-4 rounded-xl p-3.5" style={{ background: BLUE_SOFT }}>
          <DetailsToggle show={showDetails} onToggle={() => setShowDetails(!showDetails)} />
          {showDetails && result.rounds.map((rd, i) => (
            <div key={i} className="mb-3">
              <div className="dp-body text-[11px] font-medium mb-1.5" style={{ color: INK + "99" }}>
                Ronda {i + 1}{rd.eliminated ? ` · se elimina "${rd.eliminated}"` : ""}{rd.tie ? " · empate" : ""}
              </div>
              {rd.tally.map((t) => (
                <OptionBar key={t.option} option={t.option} count={t.count} percent={t.percent} highlight={rd.winner === t.option} />
              ))}
            </div>
          ))}
          {result.winner && !freshTieBreak && (
            <div className="flex items-baseline justify-between pt-2.5 mt-1" style={{ borderTop: `1px solid ${BLUE}33` }}>
              <span className="dp-body text-xs font-medium" style={{ color: INK + "99" }}>Decisión colectiva</span>
              <span className="dp-display text-lg font-bold" style={{ color: GREEN }}>{result.winner}</span>
            </div>
          )}
        </div>
      )}

      {freshTieBreak && (
        <div className="mt-3 rounded-xl p-3.5" style={{ background: CORAL + "12", border: `1px solid ${CORAL}33` }}>

              <span className="dp-display text-lg font-bold" style={{ color: GREEN }}>{result.winner}</span>

      )}
    </div>
  );
}

function buildJoinLink(code) {
  const base = window.location.origin + window.location.pathname;
  return `${base}?code=${code}`;
}

function ShareGroup({ groupName, code }) {
  const [copiedCode, setCopiedCode] = useState(false);
  const [copiedLink, setCopiedLink] = useState(false);
  const link = buildJoinLink(code);

  const copy = async (text, setFlag) => {
    try {
      await navigator.clipboard.writeText(text);
      setFlag(true);
      setTimeout(() => setFlag(false), 1500);
    } catch (e) {
      // Si el navegador bloquea el portapapeles, no pasa nada grave.
    }
  };

  const mailtoHref =
    `mailto:?subject=${encodeURIComponent(`Invitación a "${groupName}" en Democracia por Promedio`)}` +
    `&body=${encodeURIComponent(`Únete a nuestro grupo con este código: ${code}\n\nO abre este link directo:\n${link}`)}`;

  return (
    <div className="flex flex-col gap-2">
      <div className="flex items-center justify-between rounded-lg px-2.5 py-1.5" style={{ background: BLUE_SOFT }}>
        <span className="dp-mono text-sm font-semibold" style={{ color: INK }}>{code}</span>
        <button onClick={() => copy(code, setCopiedCode)} className="dp-body text-[11px] font-medium" style={{ color: BLUE }}>
          {copiedCode ? "✓ copiado" : "copiar código"}
        </button>
      </div>
      <div className="flex items-center justify-between rounded-lg px-2.5 py-1.5" style={{ background: BLUE_SOFT }}>
        <span className="dp-mono text-[11px] truncate mr-2" style={{ color: INK + "aa" }}>{link}</span>
        <button onClick={() => copy(link, setCopiedLink)} className="dp-body text-[11px] font-medium shrink-0" style={{ color: BLUE }}>
          {copiedLink ? "✓ copiado" : "copiar link"}
        </button>
      </div>
      <a

function JoinGroupScreen({ backendUrl, initialCode, onBack, onJoined }) {
  const [code, setCode] = useState(initialCode || "");
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [status, setStatus] = useState("");
  const [previewName, setPreviewName] = useState("");

  useEffect(() => {
    if (!initialCode) return;
    fetch(`${backendUrl}/api/groups/${initialCode}`)
      .then((res) => (res.ok ? res.json() : Promise.reject()))
      .then((data) => setPreviewName(data.name))
      .catch(() => {});
  }, [initialCode]);

  const submit = async () => {
    if (!code || !name) return;
    setLoading(true);
    setError("");
    try {
      const res = await fetch(`${backendUrl}/api/groups/${code.trim()}/join`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, email }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "No se pudo unir al grupo");
      setStatus(data.status);
      onJoined({ code: code.trim(), memberId: data.memberId });
    } catch (e) {
      setError(
        e.message === "Failed to fetch"
          ? "No se pudo conectar al backend. ¿Sigue corriendo npm start en tu terminal?"
          : e.message
      );
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="px-4 py-6">
      <button onClick={onBack} className="dp-body text-xs mb-4" style={{ color: INK + "88" }}>← Volver</button>
      <div className="rounded-2xl p-4" style={{ background: WARM_WHITE, border: `1px solid ${BLUE}33` }}>
        <div className="dp-body text-sm font-medium mb-1" style={{ color: INK }}>Unirme con un código</div>
        {previewName && (
          <p className="dp-body text-[12px] mb-3" style={{ color: GREEN }}>
            Te vas a unir a: <b>{previewName}</b>
          </p>
        )}
        {!previewName && <div className="mb-3" />}
        <div className="flex flex-col gap-2.5 mb-3">
          <Field label="Código del grupo" value={code} onChange={setCode} placeholder="ej. MC231G" />
          <Field label="Tu nombre" value={name} onChange={setName} placeholder="ej. Luis" />
          <Field label="Tu correo (opcional, para recibir resultados)" value={email} onChange={setEmail} placeholder="ej. luis@correo.com" type="email" />
        </div>
        <PrimaryButton onClick={submit} disabled={loading || !code || !name}>
          {loading ? "Enviando…" : "Unirme"}
        </PrimaryButton>
        {error && <div className="dp-body text-[12px] mt-2" style={{ color: CORAL }}>{error}</div>}
      </div>
    </div>
  );
}

function NewQuestionForm({ backendUrl, groupCode, onAdded }) {
  const [type, setType] = useState("promedio");
  const [text, setText] = useState("");
  const [trimPercent, setTrimPercent] = useState("5");
  const [options, setOptions] = useState(["", ""]);
  const [majorityRule, setMajorityRule] = useState("absoluta");
  const [qualifiedPct, setQualifiedPct] = useState("66");
  const [numRounds, setNumRounds] = useState("3");
  const [eliminationThresholdPercent, setEliminationThresholdPercent] = useState("10");
  const [showDefs, setShowDefs] = useState(false);
  const [useLimit, setUseLimit] = useState(false);
  const [days, setDays] = useState("0");
  const [hours, setHours] = useState("0");
  const [minutes, setMinutes] = useState("0");
  const [adding, setAdding] = useState(false);
  const [error, setError] = useState("");
  const [showPreview, setShowPreview] = useState(false);

  const updateOption = (i, val) => setOptions(options.map((o, idx) => (idx === i ? val : o)));
  const addOption = () => setOptions([...options, ""]);
  const removeOption = (i) => setOptions(options.filter((_, idx) => idx !== i));

  const totalMinutes = () => Number(days || 0) * 1440 + Number(hours || 0) * 60 + Number(minutes || 0);

  const RULE_LABEL = { simple: "Simple", absoluta: "Absoluta", calificada: "Calificada", rankeado: "Voto ranqueado", segunda_vuelta: "Segunda vuelta electoral" };
  const RULE_DEF = {
    simple: "Gana la opción con más votos, sin importar el porcentaje.",
    absoluta: "La opción ganadora necesita más del 50% de los votos.",
    calificada: "La opción ganadora necesita superar el porcentaje que tú definas (mayor al 50%).",
    rankeado: "Cada quien ordena las opciones por preferencia. La app calcula sola, en rondas, quién gana: elimina la menos votada y reparte esos votos a la siguiente preferencia, hasta que alguien pase el 50%.",
    segunda_vuelta: "Se vota por una sola opción a la vez, en rondas. Al cerrarse una ronda (por tiempo o porque tú la cierras), se elimina a las opciones menos votadas que definas, y se vuelve a votar entre las que quedan.",
  };

  const submit = async () => {
    if (!text) return;
    const cleanOptions = options.map((o) => o.trim()).filter(Boolean);
    if (type === "mayoria" && cleanOptions.length < 2) {
      setError("Agrega al menos 2 opciones");
      return;
    }
    setAdding(true);
    setError("");
    try {
      const body = { type, text };
      const mins = useLimit ? totalMinutes() : 0;

      if (type === "promedio") {
        body.trimPercent = Number(trimPercent);
        if (mins > 0) body.closesInMinutes = mins;
      } else {
        body.options = cleanOptions;
        body.majorityRule = majorityRule;
        if (majorityRule === "calificada") body.qualifiedPct = Number(qualifiedPct);
        if (majorityRule === "segunda_vuelta") {
          body.numRounds = Number(numRounds);
          body.eliminationThresholdPercent = Number(eliminationThresholdPercent);
          if (mins > 0) body.roundDurationMinutes = mins;
        } else if (mins > 0) {
          body.closesInMinutes = mins;
        }
      }

      const res = await fetch(`${backendUrl}/api/groups/${groupCode}/questions`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Error al crear la pregunta");
      setText("");
      setOptions(["", ""]);
      setUseLimit(false);
      setDays("0"); setHours("0"); setMinutes("0");
      await onAdded();
    } catch (e) {
      setError(e.message);
    } finally {
      setAdding(false);
    }
  };

  const isSegundaVuelta = majorityRule === "segunda_vuelta";

  return (
    <div className="rounded-2xl p-4 mb-4" style={{ background: WARM_WHITE, border: `1px solid ${BLUE}33` }}>
      <div className="dp-body text-xs font-medium mb-3" style={{ color: INK }}>Nueva pregunta</div>

      <div className="flex gap-1.5 mb-3">
        {[{ key: "promedio", label: "Promedio" }, { key: "mayoria", label: "Mayoría" }].map((t) => (
          <button
            key={t.key}
            onClick={() => setType(t.key)}
            className="dp-body text-xs px-3 py-1.5 rounded-full font-medium flex-1"
            style={type === t.key ? { background: BLUE, color: "#fff" } : { background: BLUE_SOFT, color: INK }}
          >
            {t.label}
          </button>
        ))}
      </div>

      <textarea
        rows={2}
        value={text}
        onChange={(e) => setText(e.target.value)}
        placeholder="Escribe la pregunta…"
        className="dp-body w-full resize-none rounded-lg px-2.5 py-2 text-sm outline-none mb-2"
        style={{ background: BLUE_SOFT, color: INK }}
      />

      {type === "promedio" && (
        <div className="dp-body flex items-center gap-1.5 text-xs px-2.5 py-1.5 rounded-full mb-3 w-fit" style={{ background: BLUE_SOFT, color: INK }}>
          <span style={{ opacity: 0.6 }}>Recorte</span>
          <input type="number" value={trimPercent} onChange={(e) => setTrimPercent(e.target.value)} className="w-9 bg-transparent dp-mono text-center outline-none font-medium" />
          <span style={{ opacity: 0.6 }}>%</span>
        </div>
      )}

      {type === "mayoria" && (
        <React.Fragment>
          <div className="mb-3">
            {options.map((opt, i) => (
              <div key={i} className="flex items-center gap-2 mb-1.5">
                <input
                  value={opt}
                  onChange={(e) => updateOption(i, e.target.value)}
                  placeholder={`Opción ${i + 1}`}
                  className="dp-body flex-1 rounded-lg px-2.5 py-1.5 text-sm outline-none"
                  style={{ background: BLUE_SOFT, color: INK }}
                />
                {options.length > 2 && (
                  <button onClick={() => removeOption(i)} className="dp-body text-xs px-1" style={{ color: CORAL }}>✕</button>
                )}
              </div>
            ))}
            <button onClick={addOption} className="dp-body text-xs font-medium" style={{ color: BLUE }}>+ agregar opción</button>
          </div>

          <div className="dp-body text-[10px] font-semibold mb-1.5" style={{ color: INK + "88", textTransform: "uppercase", letterSpacing: "0.03em" }}>
            Mayoría
          </div>
          <div className="flex gap-1.5 mb-2">
            {["simple", "absoluta", "calificada"].map((r) => (
              <button
                key={r}
                onClick={() => setMajorityRule(r)}
                className="dp-body text-[11px] px-2 py-1.5 rounded-full font-medium flex-1"
                style={majorityRule === r ? { background: BLUE, color: "#fff" } : { background: BLUE_SOFT, color: INK }}
              >
                {RULE_LABEL[r]}
              </button>
            ))}
          </div>
          {majorityRule === "calificada" && (
            <div className="dp-body flex items-center gap-2 text-xs mb-3" style={{ color: INK }}>
              requiere más de
              <input type="number" min="51" max="99" value={qualifiedPct} onChange={(e) => setQualifiedPct(e.target.value)} className="dp-mono w-14 rounded-lg px-2 py-1 text-center outline-none" style={{ background: BLUE_SOFT }} />
              %
            </div>
          )}

          <div style={{ height: "1px", background: BLUE + "22", margin: "8px 0" }} />
          <button
            onClick={() => setMajorityRule("rankeado")}
            className="dp-body block w-full text-left text-xs font-medium px-2.5 py-2 rounded-lg mb-2"
            style={majorityRule === "rankeado" ? { background: BLUE, color: "#fff" } : { background: BLUE_SOFT, color: INK }}
          >
            Voto ranqueado
          </button>

          <div style={{ height: "1px", background: BLUE + "22", margin: "8px 0" }} />
          <button
            onClick={() => setMajorityRule("segunda_vuelta")}
            className="dp-body block w-full text-left text-xs font-medium px-2.5 py-2 rounded-lg mb-2"
            style={majorityRule === "segunda_vuelta" ? { background: BLUE, color: "#fff" } : { background: BLUE_SOFT, color: INK }}
          >
            Segunda vuelta electoral
          </button>
          {isSegundaVuelta && (
            <div className="flex gap-3 mb-2">
              <label className="dp-body flex items-center gap-1.5 text-xs" style={{ color: INK }}>
                Número de rondas
                <input type="number" min="1" value={numRounds} onChange={(e) => setNumRounds(e.target.value)} className="dp-mono w-11 rounded-lg px-1.5 py-1 text-center outline-none" style={{ background: BLUE_SOFT }} />
              </label>
            </div>
          )}
          {isSegundaVuelta && (
            <div className="flex gap-3 mb-1">
              <label className="dp-body flex items-center gap-1.5 text-xs" style={{ color: INK }}>
                % mínimo para sobrevivir
                <input type="number" min="0" max="100" value={eliminationThresholdPercent} onChange={(e) => setEliminationThresholdPercent(e.target.value)} className="dp-mono w-11 rounded-lg px-1.5 py-1 text-center outline-none" style={{ background: BLUE_SOFT }} />
              </label>
            </div>
          )}
          {isSegundaVuelta && (
            <div className="dp-body text-[10px] mb-3" style={{ color: INK + "77" }}>
              en cada ronda se eliminan las opciones sin votos y las que estén por debajo de este %
            </div>
          )}

          <button onClick={() => setShowDefs(!showDefs)} className="dp-body text-[11px] font-medium mb-2" style={{ color: BLUE }}>
            {showDefs ? "ocultar definiciones" : "¿qué significa cada una?"}
          </button>
          {showDefs && (
            <div className="rounded-lg p-2.5 mb-3 text-[11px] leading-relaxed" style={{ background: BLUE_SOFT, color: INK + "cc" }}>
              {Object.entries(RULE_LABEL).map(([k, l]) => (
                <div key={k} className="mb-1">
                  <b style={{ color: INK }}>{l}:</b> {RULE_DEF[k]}
                </div>
              ))}
            </div>
          )}
        </React.Fragment>
      )}

      <div className="dp-body text-xs font-medium mb-1.5" style={{ color: INK }}>
        Límite de tiempo{isSegundaVuelta ? " por ronda" : " para responder"}:
      </div>
      <div className="flex gap-1.5 mb-2">
        <button onClick={() => setUseLimit(false)} className="dp-body text-xs px-3 py-1.5 rounded-full font-medium flex-1" style={!useLimit ? { background: BLUE, color: "#fff" } : { background: BLUE_SOFT, color: INK }}>No</button>
        <button onClick={() => setUseLimit(true)} className="dp-body text-xs px-3 py-1.5 rounded-full font-medium flex-1" style={useLimit ? { background: BLUE, color: "#fff" } : { background: BLUE_SOFT, color: INK }}>Sí</button>
      </div>
      {useLimit && (
        <div className="flex gap-2 mb-1">
          <label className="dp-body flex items-center gap-1.5 text-xs" style={{ color: INK + "99" }}>
            Días <input type="number" min="0" value={days} onChange={(e) => setDays(e.target.value)} className="dp-mono w-11 rounded-lg px-1.5 py-1 text-center outline-none" style={{ background: BLUE_SOFT }} />
          </label>
          <label className="dp-body flex items-center gap-1.5 text-xs" style={{ color: INK + "99" }}>
            Horas <input type="number" min="0" max="23" value={hours} onChange={(e) => setHours(e.target.value)} className="dp-mono w-11 rounded-lg px-1.5 py-1 text-center outline-none" style={{ background: BLUE_SOFT }} />
          </label>
          <label className="dp-body flex items-center gap-1.5 text-xs" style={{ color: INK + "99" }}>
            Min <input type="number" min="0" max="59" value={minutes} onChange={(e) => setMinutes(e.target.value)} className="dp-mono w-11 rounded-lg px-1.5 py-1 text-center outline-none" style={{ background: BLUE_SOFT }} />
          </label>
        </div>
      )}
      {isSegundaVuelta && (
        <div className="dp-body text-[10px] mb-3" style={{ color: INK + "77" }}>
          {useLimit ? "al pasar el tiempo, la ronda se cierra sola y avanza." : "sin límite: tú cierras cada ronda a mano."}
        </div>
      )}
      {!isSegundaVuelta && <div className="mb-3" />}

      <button
        type="button"
        onClick={() => setShowPreview(!showPreview)}
        className="dp-body w-full flex items-center justify-center gap-1.5 text-xs py-2 rounded-full font-medium mb-2"
        style={{ background: BLUE_SOFT, color: INK }}
      >
        👁 {showPreview ? "Ocultar vista previa" : "Vista previa"}
      </button>

      {showPreview && (
        <div className="rounded-2xl p-3 mb-3" style={{ background: PAGE_BG, border: `1.5px dashed ${BLUE}55` }}>
          <div className="dp-body text-[10px] font-semibold mb-2" style={{ color: INK + "77", textTransform: "uppercase", letterSpacing: "0.03em" }}>
            Así lo verán los participantes
          </div>
          <div className="rounded-xl p-3.5" style={{ background: WARM_WHITE, border: `1px solid ${BLUE}33` }}>
            <div className="dp-body text-[15px] mb-1" style={{ color: INK }}>{text || "Escribe tu pregunta arriba…"}</div>
            <div className="dp-body text-[11px] mb-3" style={{ color: INK + "77" }}>
              {type === "promedio"
                ? `recorte: ${trimPercent || 0}%`
                : majorityRule === "calificada"
                ? `necesita más del ${qualifiedPct || 66}%`
                : majorityRule === "absoluta"
                ? "necesita más del 50%"
                : majorityRule === "simple"
                ? "gana la más votada"
                : majorityRule === "rankeado"
                ? "voto ranqueado (automático)"
                : `${numRounds || 3} rondas · elimina menos del ${eliminationThresholdPercent || 10}%`}
            </div>

            {type === "promedio" && (
              <div className="flex items-center gap-2">
                <div className="flex-1 rounded-lg px-2.5 py-1.5 text-sm dp-mono" style={{ background: BLUE_SOFT, color: INK + "77" }}>tu propuesta</div>
                <div className="text-xs px-3 py-2 rounded-full text-white font-medium" style={{ background: GREEN, opacity: 0.6 }}>📤 Enviar</div>
              </div>
            )}

            {type === "mayoria" && majorityRule !== "rankeado" && (
              <div className="flex flex-col gap-1.5">
                {(options.map((o) => o.trim()).filter(Boolean).length ? options.map((o) => o.trim()).filter(Boolean) : ["Opción 1", "Opción 2"]).map((opt, i) => (
                  <div key={i} className="dp-body text-left text-sm px-3 py-2 rounded-lg" style={{ background: BLUE_SOFT, color: INK }}>
                    ○ {opt}
                  </div>
                ))}
              </div>
            )}

            {type === "mayoria" && majorityRule === "rankeado" && (
              <div className="flex flex-col gap-1.5">
                <div className="dp-body text-[11px] mb-1" style={{ color: INK + "77" }}>toca en orden de preferencia (1ª, 2ª…)</div>
                {(options.map((o) => o.trim()).filter(Boolean).length ? options.map((o) => o.trim()).filter(Boolean) : ["Opción 1", "Opción 2"]).map((opt, i) => (
                  <div key={i} className="dp-body flex items-center gap-2 text-left text-sm px-3 py-2 rounded-lg" style={{ background: BLUE_SOFT, color: INK }}>
                    <span className="dp-mono font-semibold" style={{ minWidth: "16px" }}>–</span>{opt}
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      )}

      {error && <div className="dp-body text-[12px] mb-2" style={{ color: CORAL }}>{error}</div>}

      <button
        onClick={submit}
        disabled={adding || !text}
        className="dp-body w-full flex items-center justify-center gap-1.5 text-xs py-2 rounded-full text-white font-medium disabled:opacity-40"
        style={{ background: BLUE }}
      >
        ➕ {adding ? "Agregando…" : "Agregar pregunta"}
      </button>
    </div>
  );
}


function StageInput({ stage, onSend, sending, disabled, flowConfig }) {
  const [numValue, setNumValue] = useState("");
  const [selected, setSelected] = useState("");
  const [texts, setTexts] = useState(Array(stage.config.maxItemsPerPerson || 1).fill(""));
  const [rankOrder, setRankOrder] = useState([]);
  const [catValues, setCatValues] = useState({});
  const [selectedMulti, setSelectedMulti] = useState([]);

  if (stage.type === "promedio") {
    const singleMemberCount = stage.key === "singleQuota" ? flowConfig?.memberCounts?.single : null;
    return (
      <div className="mb-2">
        <div className="flex items-center gap-2">
          <input
            type="number"
            placeholder="tu propuesta"
            value={numValue}
            disabled={disabled}
            onChange={(e) => setNumValue(e.target.value)}
            className="dp-mono flex-1 rounded-lg px-2.5 py-1.5 text-sm outline-none disabled:opacity-50"
            style={{ background: BLUE_SOFT, color: INK }}
          />
          <button
            onClick={() => onSend(Number(numValue))}
            disabled={sending || disabled || numValue === ""}
            className="dp-body flex items-center gap-1.5 text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40"
            style={{ background: GREEN }}
          >
            📤 {sending ? "Enviando…" : "Enviar"}
          </button>
        </div>
        {singleMemberCount > 0 && numValue !== "" && (
          <div className="dp-mono text-[11px] mt-1" style={{ color: INK + "77" }}>
            {singleMemberCount} miembros × {numValue} = {formatMoney(singleMemberCount * Number(numValue))} recaudados
          </div>
        )}
      </div>
    );
  }

  if (stage.type === "mayoria") {
    return (
      <div className="flex flex-col gap-1.5 mb-2">
        {stage.config.options.map((opt) => (
          <button
            key={opt}
            onClick={() => setSelected(opt)}
            disabled={disabled}
            className="dp-body text-left text-sm px-3 py-2 rounded-lg disabled:opacity-50"
            style={selected === opt ? { background: BLUE, color: "#fff" } : { background: BLUE_SOFT, color: INK }}
          >
            {selected === opt ? "● " : "○ "}{opt}
          </button>
        ))}
        <button
          onClick={() => onSend(selected)}
          disabled={sending || disabled || !selected}
          className="dp-body flex items-center justify-center gap-1.5 text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40 mt-1"
          style={{ background: GREEN }}
        >
          📤 {sending ? "Enviando…" : "Enviar"}
        </button>
      </div>
    );
  }

  if (stage.type === "recoleccion_abierta") {
    return (
      <div className="mb-2">
        {texts.map((t, i) => (
          <input
            key={i}
            value={t}
            disabled={disabled}
            onChange={(e) => {
              const arr = [...texts];
              arr[i] = e.target.value;
              setTexts(arr);
            }}
            placeholder={`Propuesta ${i + 1}`}
            className="dp-body w-full rounded-lg px-2.5 py-1.5 text-sm outline-none mb-1.5 disabled:opacity-50"
            style={{ background: BLUE_SOFT, color: INK }}
          />
        ))}
        {!disabled && (
          <button
            onClick={() => setTexts([...texts, ""])}
            className="dp-body text-xs font-medium mb-2"
            style={{ color: BLUE }}
          >
            + agregar recuadro
          </button>
        )}
        <button
          onClick={() => onSend(texts.filter((t) => t.trim()))}
          disabled={sending || disabled || texts.every((t) => !t.trim())}
          className="dp-body flex items-center justify-center gap-1.5 w-full text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40"
          style={{ background: GREEN }}
        >
          📤 {sending ? "Enviando…" : "Enviar"}
        </button>
      </div>
    );
  }

  if (stage.type === "ranking_multiganador") {
    return (
      <div className="flex flex-col gap-1.5 mb-2">
        <div className="dp-body text-[11px] mb-1" style={{ color: INK + "77" }}>toca en orden de preferencia (1ª, 2ª…)</div>
        {stage.config.options.map((opt) => {
          const idx = rankOrder.indexOf(opt);
          return (
            <button
              key={opt}
              onClick={() => setRankOrder((prev) => (prev.includes(opt) ? prev.filter((o) => o !== opt) : [...prev, opt]))}
              disabled={disabled}
              className="dp-body flex items-center gap-2 text-left text-sm px-3 py-2 rounded-lg disabled:opacity-50"
              style={idx >= 0 ? { background: BLUE, color: "#fff" } : { background: BLUE_SOFT, color: INK }}
            >
              <span className="dp-mono font-semibold" style={{ minWidth: "16px" }}>{idx >= 0 ? idx + 1 : "–"}</span>
              {opt}
            </button>
          );
        })}
        <button
          onClick={() => onSend(rankOrder)}
          disabled={sending || disabled || rankOrder.length === 0}
          className="dp-body flex items-center justify-center gap-1.5 text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40 mt-1"
          style={{ background: GREEN }}
        >
          📤 {sending ? "Enviando…" : "Enviar"}
        </button>
      </div>
    );
  }

  if (stage.type === "promedio_por_categoria") {
    const memberCounts = flowConfig?.memberCounts || {};
    const hasAnyMemberCount = stage.config.categories.some((cat) => memberCounts[cat] > 0);
    const liveTotal = stage.config.categories.reduce((sum, cat) => {
      const mc = memberCounts[cat];
      const v = Number(catValues[cat]);
      return mc > 0 && !isNaN(v) ? sum + mc * v : sum;
    }, 0);
    return (
      <div className="mb-2">
        {stage.config.categories.map((cat) => {
          const mc = memberCounts[cat];
          return (
            <div key={cat} className="mb-1.5">
              <div className="flex items-center gap-2">
                <span className="dp-body text-xs flex-1" style={{ color: INK }}>{cat}</span>
                <input
                  type="number"
                  value={catValues[cat] || ""}
                  disabled={disabled}
                  onChange={(e) => setCatValues({ ...catValues, [cat]: e.target.value })}
                  className="dp-mono w-24 rounded-lg px-2 py-1.5 text-sm outline-none disabled:opacity-50"
                  style={{ background: BLUE_SOFT, color: INK }}
                />
              </div>
              {mc > 0 && catValues[cat] !== undefined && catValues[cat] !== "" && (
                <div className="dp-mono text-[10px] text-right" style={{ color: INK + "77" }}>
                  {mc} miembros × {catValues[cat]} = {formatMoney(mc * Number(catValues[cat]))}
                </div>
              )}
            </div>
          );
        })}
        {hasAnyMemberCount && (
          <div className="dp-mono text-[11px] mb-2" style={{ color: INK + "88" }}>
            total recaudado con estos números: {formatMoney(liveTotal)}
          </div>
        )}
        <button
          onClick={() => {
            const obj = {};
            Object.entries(catValues).forEach(([k, v]) => {
              const n = Number(v);
              if (!isNaN(n)) obj[k] = n;
            });
            onSend(obj);
          }}
          disabled={sending || disabled}
          className="dp-body flex items-center justify-center gap-1.5 w-full text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40"
          style={{ background: GREEN }}
        >
          📤 {sending ? "Enviando…" : "Enviar"}
        </button>
      </div>
    );
  }

  if (stage.type === "seleccion_multiple") {
    return (
      <div className="mb-2">
        {stage.config.options.map((opt) => {
          const isSelected = selectedMulti.includes(opt);
          return (
            <button
              key={opt}
              onClick={() => setSelectedMulti((prev) => (isSelected ? prev.filter((o) => o !== opt) : [...prev, opt]))}
              disabled={disabled}
              className="dp-body flex items-center gap-2 text-left text-sm px-3 py-2 rounded-lg mb-1.5 disabled:opacity-50 w-full"
              style={isSelected ? { background: BLUE, color: "#fff" } : { background: BLUE_SOFT, color: INK }}
            >
              {isSelected ? "☑" : "☐"} {opt}
            </button>
          );
        })}
        <button
          onClick={() => onSend(selectedMulti)}
          disabled={sending || disabled || selectedMulti.length === 0}
          className="dp-body flex items-center justify-center gap-1.5 w-full text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40"
          style={{ background: GREEN }}
        >
          📤 {sending ? "Enviando…" : "Enviar"}
        </button>
      </div>
    );
  }

  if (stage.type === "porcentaje_por_categoria") {
    const total = Object.values(catValues).reduce((a, v) => a + (Number(v) || 0), 0);
    const totalRounded = Math.round(total * 10) / 10;
    const totalBudget = flowConfig?.totalBudget ?? stage.config.totalBudget;
    const pieData = stage.config.categories.map((cat) => ({ label: cat, value: Number(catValues[cat]) || 0 }));
    return (
      <div className="mb-2">
        <div className="mb-3">
          <PieChart data={pieData} />
        </div>
        {stage.config.categories.map((cat) => (
          <div key={cat} className="flex items-center gap-2 mb-1.5">
            <span className="dp-body text-xs flex-1" style={{ color: INK }}>{cat}</span>
            <input
              type="number"
              value={catValues[cat] || ""}
              disabled={disabled}
              onChange={(e) => setCatValues({ ...catValues, [cat]: e.target.value })}
              className="dp-mono w-20 rounded-lg px-2 py-1.5 text-sm outline-none disabled:opacity-50"
              style={{ background: BLUE_SOFT, color: INK }}
            />
            <span className="dp-mono text-xs" style={{ color: INK + "77" }}>%</span>
            {totalBudget > 0 && (
              <span className="dp-mono text-[11px]" style={{ color: INK + "77" }}>
                = {formatMoney(((Number(catValues[cat]) || 0) / 100) * totalBudget)}
              </span>
            )}
          </div>
        ))}
        <div className="dp-mono text-[11px] mb-2 font-semibold" style={{ color: totalRounded === 100 ? GREEN : CORAL }}>
          asignado: {total}% de 100%{totalBudget > 0 ? ` (${formatMoney((total / 100) * totalBudget)} de ${formatMoney(totalBudget)})` : ""}
          {totalRounded > 100 ? ` — te pasaste por ${(totalRounded - 100).toFixed(1)}%` : ""}
          {totalRounded < 100 ? ` — te faltan ${(100 - totalRounded).toFixed(1)}%` : ""}
          {totalRounded === 100 ? " — ¡listo!" : ""}
        </div>
        <button
          onClick={() => {
            if (totalRounded > 100) {
              window.alert(`Te pasaste por ${(totalRounded - 100).toFixed(1)}%. Ajusta tus porcentajes para que sumen exactamente 100% antes de enviar.`);
              return;
            }
            if (totalRounded < 100) {
              window.alert(`Te faltan ${(100 - totalRounded).toFixed(1)}% para llegar a 100%. Ajusta tus porcentajes antes de enviar.`);
              return;
            }
            const obj = {};
            Object.entries(catValues).forEach(([k, v]) => {
              const n = Number(v);
              if (!isNaN(n)) obj[k] = n;
            });
            onSend(obj);
          }}
          disabled={sending || disabled}
          className="dp-body flex items-center justify-center gap-1.5 w-full text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40"
          style={{ background: GREEN }}
        >
          📤 {sending ? "Enviando…" : "Enviar"}
        </button>
      </div>
    );
  }

  return null;
}
