function formatTimeLeft(ms) {
  const totalMin = Math.max(1, Math.ceil(ms / 60000));
  const d = Math.floor(totalMin / 1440);
  const h = Math.floor((totalMin % 1440) / 60);
  const m = totalMin % 60;
  const parts = [];
  if (d) parts.push(`${d} d`);
  if (h) parts.push(`${h} h`);
  if (!d && (m || parts.length === 0)) parts.push(`${m} min`);
  return parts.join(" ");
}

// Cuenta regresiva de una etapa con límite de tiempo. Cuando llega a
// cero, el servidor cierra la etapa solo en la siguiente actualización.
// Etapas que solo le importan al facilitador (elegir la versión y escribir
// las categorías): el resto del grupo no las ve, solo ve la pregunta.
const STAGES_HIDDEN_FROM_MEMBERS = ["eleccion_modo", "configurar_cuotas_simple"];

// Reloj de cuenta regresiva: HH:MM:SS (o MM:SS si falta menos de una hora).
function formatCountdown(ms) {
  const total = Math.max(0, Math.ceil(ms / 1000));
  const d = Math.floor(total / 86400);
  const h = Math.floor((total % 86400) / 3600);
  const m = Math.floor((total % 3600) / 60);
  const sec = total % 60;
  const pad = (n) => String(n).padStart(2, "0");
  const clock = h > 0 || d > 0 ? `${pad(h)}:${pad(m)}:${pad(sec)}` : `${pad(m)}:${pad(sec)}`;
  return d > 0 ? `${d} d ${clock}` : clock;
}

function StageCountdown({ closesAt, extended }) {
  const lang = useLang();
  const [now, setNow] = useState(Date.now());
  useEffect(() => {
    const id = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(id);
  }, []);
  const msLeft = new Date(closesAt).getTime() - now;
  const over = msLeft <= 0;
  return (
    <div className="mb-2">
      <div
        className="dp-body text-[12px] font-medium rounded-lg px-3 py-2 inline-flex items-center gap-2"
        style={{ background: over ? CORAL + "15" : BLUE_SOFT, color: over ? CORAL : INK, border: `1px solid ${over ? CORAL : BLUE}33` }}
      >
        <i className="ti ti-clock"></i>
        {over ? (
          tf("timer.over", lang)
        ) : (
          <React.Fragment>
            <span>{tf("timer.left", lang, { time: "" }).replace(/[:\s]+$/, "")}</span>
            <span className="dp-mono font-semibold text-[16px]" style={{ color: BLUE }}>{formatCountdown(msLeft)}</span>
          </React.Fragment>
        )}
      </div>
      {extended > 0 && !over && (
        <div className="dp-body text-[10px] mt-1" style={{ color: INK + "77" }}>{tf("timer.extended", lang)}</div>
      )}
    </div>
  );
}

const EMAIL_PATTERN = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const TIME_UNIT_MINUTES = { minutes: 1, hours: 60, days: 1440 };

// Asistente del facilitador en la versión simplificada de Cuotas, en 3
// pasos: 1) categorías, 2) límite de tiempo, 3) enviar las preguntas al
// grupo (por correo y/o copiando el link).
function SimpleCuotasSetup({ stage, backendUrl, groupCode, memberId, onSubmit, sending, sendError }) {
  const lang = useLang();
  const prefill = stage.config.prefillCategories || [];
  const prefillTime = stage.config.prefillTimeLimit || null;
  const [step, setStep] = useState(1);
  const [cats, setCats] = useState(
    prefill.length > 0 ? prefill.map((c) => ({ name: c.name, members: c.members ? String(c.members) : "" })) : [{ name: "", members: "" }]
  );
  const [useLimit, setUseLimit] = useState(Boolean(prefillTime));
  const [amount, setAmount] = useState(prefillTime ? String(prefillTime.amount) : "1");
  const [unit, setUnit] = useState(prefillTime ? prefillTime.unit : "days");
  const [emails, setEmails] = useState([]);
  const [emailDraft, setEmailDraft] = useState("");
  const [emailError, setEmailError] = useState("");
  const [inviting, setInviting] = useState(false);
  const [inviteWarning, setInviteWarning] = useState("");
  const [copied, setCopied] = useState(false);
  const link = buildJoinLink(groupCode);

  const filledCats = cats.filter((c) => c.name.trim());
  const timeOk = !useLimit || (Number(amount) > 0 && Number(amount) * TIME_UNIT_MINUTES[unit] <= 60 * 1440);
  const updateCat = (i, field, val) => setCats(cats.map((c, idx) => (idx === i ? { ...c, [field]: val } : c)));

  // Acepta uno o varios correos a la vez (separados por coma, espacio o salto de línea).
  const addEmailsFromText = (text) => {
    const parts = text.split(/[\s,;]+/).map((p) => p.trim().toLowerCase()).filter(Boolean);
    if (parts.length === 0) return true;
    const good = parts.filter((p) => EMAIL_PATTERN.test(p));
    const bad = parts.filter((p) => !EMAIL_PATTERN.test(p));
    if (good.length > 0) setEmails([...new Set([...emails, ...good])]);
    if (bad.length > 0) {
      setEmailError(tf("simple.send.invalidEmail", lang));
      setEmailDraft(bad.join(" "));
      return false;
    }
    setEmailError("");
    setEmailDraft("");
    return true;
  };

  const copyLink = async () => {
    try {
      await navigator.clipboard.writeText(link);
      setCopied(true);
      setTimeout(() => setCopied(false), 1500);
    } catch (e) {
      // Si el navegador bloquea el portapapeles, no pasa nada grave.
    }
  };

  const finish = async (skipInvites) => {
    setInviteWarning("");
    let list = emails;
    if (emailDraft.trim()) {
      const parts = emailDraft.split(/[\s,;]+/).map((p) => p.trim().toLowerCase()).filter((p) => EMAIL_PATTERN.test(p));
      list = [...new Set([...emails, ...parts])];
    }
    if (list.length > 0 && !skipInvites) {
      setInviting(true);
      try {
        const res = await fetch(`${backendUrl}/api/groups/${groupCode}/invite`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ memberId, emails: list }),
        });
        const data = await res.json();
        if (!res.ok) {
          setInviteWarning(tf("simple.send.noneSent", lang, { msg: data.error || "" }));
          setInviting(false);
          return;
        }
        if (data.failed && data.failed.length > 0) {
          setInviteWarning(tf("simple.send.partial", lang, { n: data.sent, list: data.failed.join(", ") }));
          setInviting(false);
          return;
        }
      } catch (e) {
        setInviteWarning(tf("simple.send.noneSent", lang, { msg: e.message }));
        setInviting(false);
        return;
      }
      setInviting(false);
    }
    await onSubmit({
      categories: filledCats.map((c) => ({ name: c.name.trim(), members: c.members === "" ? null : Number(c.members) })),
      timeLimit: useLimit ? { amount: Number(amount), unit } : null,
    });
  };

  const inputStyle = { background: "#fff", color: INK, border: `1px solid ${BLUE}33` };
  const secondaryBtn = { background: "#fff", color: INK, border: `1.5px solid ${BLUE}55` };

  return (
    <div className="rounded-xl p-3.5" style={{ background: BLUE_SOFT }}>
      <div className="dp-mono text-[10px] mb-1.5" style={{ color: INK + "77" }}>{tf("simple.step", lang, { n: step })}</div>

      {step === 1 && (
        <div>
          <div className="dp-body text-[14px] font-semibold mb-1" style={{ color: INK }}>{tf("simple.cat.title", lang)}</div>
          <div className="dp-body text-[11.5px] mb-3" style={{ color: INK + "99", lineHeight: 1.5 }}>{tf("simple.cat.help", lang)}</div>
          {cats.map((c, i) => (
            <div key={i} className="rounded-lg p-2.5 mb-2" style={{ background: "#fff" }}>
              <div className="flex items-center gap-2 mb-1.5">
                <input
                  value={c.name}
                  onChange={(e) => updateCat(i, "name", e.target.value)}
                  placeholder={tf("simple.cat.placeholder", lang)}
                  maxLength={60}
                  className="dp-body flex-1 rounded-lg px-2.5 py-1.5 text-sm outline-none"
                  style={{ background: BLUE_SOFT, color: INK }}
                />
                {cats.length > 1 && (
                  <button onClick={() => setCats(cats.filter((_, idx) => idx !== i))} className="dp-body text-xs px-1" style={{ color: CORAL }}><i className="ti ti-x"></i></button>
                )}
              </div>
              <input
                type="number" min="1" value={c.members}
                onChange={(e) => updateCat(i, "members", e.target.value)}
                placeholder={tf("simple.cat.membersPlaceholder", lang)}
                className="dp-body w-full rounded-lg px-2.5 py-1.5 text-xs outline-none"
                style={{ background: BLUE_SOFT, color: INK }}
              />
            </div>
          ))}
          {cats.length < 12 && (
            <button onClick={() => setCats([...cats, { name: "", members: "" }])} className="dp-body text-xs font-medium mb-2" style={{ color: BLUE }}>
              {tf("simple.cat.add", lang)}
            </button>
          )}
          <div className="dp-body text-[10.5px] mb-3" style={{ color: INK + "77" }}>{tf("simple.cat.membersHint", lang)}</div>
          {filledCats.length === 0 && <div className="dp-body text-[10.5px] mb-2" style={{ color: CORAL }}>{tf("simple.cat.needOne", lang)}</div>}
          <button
            onClick={() => setStep(2)}
            disabled={filledCats.length === 0}
            className="dp-body w-full text-xs py-2 rounded-full text-white font-medium disabled:opacity-40"
            style={{ background: BLUE }}
          >
            {tf("onb.next", lang)}
          </button>
        </div>
      )}

      {step === 2 && (
        <div>
          <div className="dp-body text-[14px] font-semibold mb-1" style={{ color: INK }}>{tf("simple.time.title", lang)}</div>
          <div className="dp-body text-[11.5px] mb-3" style={{ color: INK + "99", lineHeight: 1.5 }}>{tf("simple.time.help", lang)}</div>
          <div className="flex gap-2 mb-3">
            <button
              onClick={() => setUseLimit(false)}
              className="dp-body flex-1 text-xs py-2 rounded-full font-medium"
              style={!useLimit ? { background: BLUE, color: "#fff" } : secondaryBtn}
            >
              {tf("simple.time.no", lang)}
            </button>
            <button
              onClick={() => setUseLimit(true)}
              className="dp-body flex-1 text-xs py-2 rounded-full font-medium"
              style={useLimit ? { background: BLUE, color: "#fff" } : secondaryBtn}
            >
              {tf("simple.time.yes", lang)}
            </button>
          </div>
          {useLimit && (
            <div className="rounded-lg p-2.5 mb-3" style={{ background: "#fff" }}>
              <div className="flex items-center gap-2 mb-2">
                <span className="dp-body text-xs" style={{ color: INK }}>{tf("simple.time.amount", lang)}</span>
                <input
                  type="number" min="1" value={amount}
                  onChange={(e) => setAmount(e.target.value)}
                  className="dp-mono w-20 rounded-lg px-2 py-1.5 text-sm text-center outline-none"
                  style={{ background: BLUE_SOFT, color: INK }}
                />
              </div>
              <div className="flex gap-1.5">
                {["minutes", "hours", "days"].map((u) => (
                  <button
                    key={u}
                    onClick={() => setUnit(u)}
                    className="dp-body flex-1 text-[11px] py-1.5 rounded-full font-medium"
                    style={unit === u ? { background: BLUE, color: "#fff" } : { background: BLUE_SOFT, color: INK }}
                  >
                    {tf(`simple.time.unit.${u}`, lang)}
                  </button>
                ))}
              </div>
              <div className="dp-body text-[10px] mt-2" style={{ color: timeOk ? INK + "77" : CORAL }}>{tf("simple.time.max", lang)}</div>
            </div>
          )}
          <div className="flex gap-2">
            <button onClick={() => setStep(1)} className="dp-body flex-1 text-xs py-2 rounded-full font-medium" style={secondaryBtn}>{tf("onb.back", lang)}</button>
            <button
              onClick={() => setStep(3)}
              disabled={!timeOk}
              className="dp-body text-xs py-2 rounded-full text-white font-medium disabled:opacity-40"
              style={{ background: BLUE, flex: 2 }}
            >
              {tf("onb.next", lang)}
            </button>
          </div>
        </div>
      )}

      {step === 3 && (
        <div>
          <div className="dp-body text-[14px] font-semibold mb-1" style={{ color: INK }}>{tf("simple.send.title", lang)}</div>
          <div className="dp-body text-[11.5px] mb-3" style={{ color: INK + "99", lineHeight: 1.5 }}>{tf("simple.send.help", lang)}</div>

          <div className="dp-body text-[11px] font-medium mb-1.5" style={{ color: INK }}>{tf("simple.send.emails", lang)}</div>
          {emails.length > 0 && (
            <div className="flex flex-wrap gap-1.5 mb-2">
              {emails.map((e) => (
                <span key={e} className="dp-body text-[11px] px-2.5 py-1 rounded-full flex items-center gap-1.5" style={{ background: "#fff", color: INK }}>
                  {e}
                  <button onClick={() => setEmails(emails.filter((x) => x !== e))} style={{ color: CORAL }}><i className="ti ti-x"></i></button>
                </span>
              ))}
            </div>
          )}
          <div className="flex items-center gap-2 mb-1">
            <input
              type="email"
              value={emailDraft}
              onChange={(e) => { setEmailDraft(e.target.value); setEmailError(""); }}
              onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); addEmailsFromText(emailDraft); } }}
              placeholder={tf("simple.send.emailPlaceholder", lang)}
              className="dp-body flex-1 rounded-lg px-2.5 py-1.5 text-sm outline-none"
              style={inputStyle}
            />
            <button onClick={() => addEmailsFromText(emailDraft)} disabled={!emailDraft.trim()} className="dp-body text-xs font-medium px-2 disabled:opacity-40" style={{ color: BLUE }}>
              {tf("simple.send.addEmail", lang)}
            </button>
          </div>
          {emailError && <div className="dp-body text-[10.5px] mb-1" style={{ color: CORAL }}>{emailError}</div>}

          <div className="dp-body text-[11px] font-medium mt-3 mb-1.5" style={{ color: INK }}>{tf("simple.send.orLink", lang)}</div>
          <div className="flex items-center justify-between rounded-lg px-2.5 py-1.5 mb-3" style={{ background: "#fff" }}>
            <span className="dp-mono text-[11px] truncate mr-2" style={{ color: INK + "aa" }}>{link}</span>
            <button onClick={copyLink} className="dp-body text-[11px] font-medium shrink-0" style={{ color: BLUE }}>
              {copied ? <span><i className="ti ti-check" style={{ marginRight: "3px" }}></i>{tf("share.copied", lang)}</span> : tf("share.copyLink", lang)}
            </button>
          </div>

          {inviteWarning && (
            <div className="dp-body text-[11px] mb-2 rounded-lg p-2" style={{ background: CORAL + "15", color: CORAL }}>{inviteWarning}</div>
          )}
          {sendError && <div className="dp-body text-[11px] mb-2" style={{ color: CORAL }}>{sendError}</div>}

          <div className="flex gap-2">
            <button onClick={() => setStep(2)} disabled={sending || inviting} className="dp-body flex-1 text-xs py-2 rounded-full font-medium disabled:opacity-40" style={secondaryBtn}>{tf("onb.back", lang)}</button>
            <button
              onClick={() => finish(Boolean(inviteWarning))}
              disabled={sending || inviting || filledCats.length === 0 || !timeOk}
              className="dp-body text-xs py-2 rounded-full text-white font-medium disabled:opacity-40"
              style={{ background: GREEN, flex: 2 }}
            >
              {inviting || sending ? tf("simple.send.sending", lang) : inviteWarning ? tf("simple.send.continueAnyway", lang) : tf("simple.send.button", lang)}
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

function FlowRunner({ backendUrl, groupCode, memberId, flow, allFlows, isAdmin, groupResponses, approvedMemberCount, approvedMemberNames, onAdvance, onSwitchFlow, cooperativasMode, onFinishedStandalone, onDownloadPdf }) {
  const uiLang = useLang();
  const [sending, setSending] = useState(false);
  const [sendError, setSendError] = useState("");
  const [sent, setSent] = useState(false);
  const [closingStage, setClosingStage] = useState(false);
  const [categoryThresholdPercent, setCategoryThresholdPercent] = useState(
    flow.config?.categoryThresholdPercent ?? flow.config?.selectionThresholdPercent ?? flow.config?.puestosThresholdPercent ?? 10
  );
  const [quotaTrimPercent, setQuotaTrimPercent] = useState(flow.config?.quotaTrimPercent ?? 10);
  const [sueldoTrimPercent, setSueldoTrimPercent] = useState(flow.config?.sueldoTrimPercent ?? 10);
  const [totalBudget, setTotalBudget] = useState(flow.config?.totalBudget ?? "");
  const [extraAmount, setExtraAmount] = useState(flow.config?.extraAmount ?? "");
  const [memberCounts, setMemberCounts] = useState(flow.config?.memberCounts || {});
  const [roleDrafts, setRoleDrafts] = useState(null);
  const [candidateDrafts, setCandidateDrafts] = useState(null);
  const [ingresosDraft, setIngresosDraft] = useState(() => (flow.currentStage && flow.currentStage.config.suggestedIngresos) || "");
  const [mergeGroups, setMergeGroups] = useState([]);
  const [reopeningCandidatos, setReopeningCandidatos] = useState(false);
  const [selectedForMerge, setSelectedForMerge] = useState([]);
  const [choosingPrimaryFor, setChoosingPrimaryFor] = useState(null);
  const [gastosDraft, setGastosDraft] = useState([{ nombre: "", monto: "" }]);
  const [montoPorPuestoDrafts, setMontoPorPuestoDrafts] = useState({});
  const [ajusteFijosDrafts, setAjusteFijosDrafts] = useState(null);
  const [newCandidateName, setNewCandidateName] = useState("");
  const [tieRoundMinutes, setTieRoundMinutes] = useState(flow.config?.tieRoundMinutes ?? "");
  const [reopenEmptyMinutes, setReopenEmptyMinutes] = useState(flow.config?.reopenEmptyMinutes ?? "");
  const [savingConfig, setSavingConfig] = useState(false);
  const lastClosedStage = flow.stages[flow.stages.length - 1];
  const justApproved = Boolean(lastClosedStage && lastClosedStage.key === "approval" && lastClosedStage.result.winner === "Sí");
  // Se deriva directamente del estado actual del flujo (en vez de
  // "detectar" la transición con referencias a un valor anterior) —
  // así nunca se pierde el aviso por una carrera entre actualizaciones,
  // sin importar quién haya sido el que cerró la etapa.
  const [celebrationDismissed, setCelebrationDismissed] = useState(false);
  const showCelebration = (justApproved || flow.status === "finished") && !celebrationDismissed;
  const setShowCelebration = (value) => setCelebrationDismissed(!value);
  const stage = flow.status === "active" ? flow.currentStage : null;
  const TEMPLATE_LABELS = { cuotas: tf("template.cuotas", uiLang), presupuesto: tf("template.presupuesto", uiLang) };
  const nextStepLabel = stage ? stage.text : flow.chainNext ? TEMPLATE_LABELS[flow.chainNext] || flow.chainNext : null;

  // Si este presupuesto viene encadenado de un flujo de cuotas ya
  // terminado (Asociaciones), y esa etapa de cuotas calculó cuánto se
  // recauda, el presupuesto total sale solo de ahí + el monto extra.
  const cuotasFlow = flow.chainedFromFlowId ? (allFlows || []).find((f) => f.id === flow.chainedFromFlowId) : null;
  const cuotasFinalStage = cuotasFlow ? [...cuotasFlow.stages].reverse().find((s) => s.key === "quotas" || s.key === "singleQuota") : null;
  const cuotasTotal = cuotasFinalStage && cuotasFinalStage.result.totalCollected ? cuotasFinalStage.result.totalCollected : null;
  const isChainedBudget = flow.template === "presupuesto" && cuotasTotal !== null;
  const effectiveTotalBudget = isChainedBudget ? Math.round((cuotasTotal + (Number(extraAmount) || 0)) * 100) / 100 : (totalBudget === "" ? null : Number(totalBudget));

  const saveConfig = async () => {
    setSavingConfig(true);
    try {
      const licitacionConfig = { tieRoundMinutes: tieRoundMinutes === "" ? null : Number(tieRoundMinutes), reopenEmptyMinutes: reopenEmptyMinutes === "" ? null : Number(reopenEmptyMinutes) };
      const config =
        flow.template === "cuotas"
          ? { categoryThresholdPercent: Number(categoryThresholdPercent), quotaTrimPercent: Number(quotaTrimPercent) }
          : flow.template === "tabuladorSueldos"
          ? { sueldoTrimPercent: Number(sueldoTrimPercent) }
          : flow.template === "responsabilidades"
          ? { puestosThresholdPercent: Number(categoryThresholdPercent) }
          : isChainedBudget
          ? { selectionThresholdPercent: Number(categoryThresholdPercent), extraAmount: extraAmount === "" ? 0 : Number(extraAmount), ...licitacionConfig }
          : { selectionThresholdPercent: Number(categoryThresholdPercent), totalBudget: totalBudget === "" ? null : Number(totalBudget), ...licitacionConfig };
      await fetch(`${backendUrl}/api/groups/${groupCode}/flows/${flow.id}/config`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ memberId, config }),
      });
      await onAdvance();
    } catch (e) {
      setSendError(e.message);
    } finally {
      setSavingConfig(false);
    }
  };

  useEffect(() => {
    setSent(false);
    setSendError("");
  }, [stage && stage.key]);

  const liveCount = stage
    ? (groupResponses || []).filter((r) => r.flowId === flow.id && r.stageInstanceIndex === stage.instanceIndex).length
    : 0;

  const sendResponse = async (value) => {
    setSending(true);
    setSendError("");
    try {
      const res = await fetch(`${backendUrl}/api/groups/${groupCode}/flows/${flow.id}/responses`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ memberId, value }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || tf("error.send", uiLang));
      setSent(true);
    } catch (e) {
      setSendError(e.message);
    } finally {
      setSending(false);
    }
  };

  const closeStage = async () => {
    const ok = await customConfirm(tf("flow.confirmClose", uiLang));
    if (!ok) return;
    setClosingStage(true);
    try {
      const res = await fetch(`${backendUrl}/api/groups/${groupCode}/flows/${flow.id}/close-stage`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ memberId }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || tf("error.closeStage", uiLang));
      await onAdvance();
    } catch (e) {
      setSendError(e.message);
    } finally {
      setClosingStage(false);
    }
  };

  const submitAndClose = async (value) => {
    setSending(true);
    setSendError("");
    try {
      const res1 = await fetch(`${backendUrl}/api/groups/${groupCode}/flows/${flow.id}/responses`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ memberId, value }),
      });
      const data1 = await res1.json();
      if (!res1.ok) throw new Error(data1.error || tf("error.save", uiLang));
      const res2 = await fetch(`${backendUrl}/api/groups/${groupCode}/flows/${flow.id}/close-stage`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ memberId }),
      });
      const data2 = await res2.json();
      if (!res2.ok) throw new Error(data2.error || tf("error.continueFlow", uiLang));
      await onAdvance();
    } catch (e) {
      setSendError(e.message);
    } finally {
      setSending(false);
    }
  };

  const submitMemberSetup = async (rawCounts) => {
    setSending(true);
    setSendError("");
    try {
      const cleaned = {};
      Object.entries(rawCounts).forEach(([k, v]) => {
        const n = Number(v);
        if (!isNaN(n) && n > 0) cleaned[k] = n;
      });
      const res1 = await fetch(`${backendUrl}/api/groups/${groupCode}/flows/${flow.id}/responses`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ memberId, value: cleaned }),
      });
      const data1 = await res1.json();
      if (!res1.ok) throw new Error(data1.error || tf("error.save", uiLang));
      const res2 = await fetch(`${backendUrl}/api/groups/${groupCode}/flows/${flow.id}/close-stage`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ memberId }),
      });
      const data2 = await res2.json();
      if (!res2.ok) throw new Error(data2.error || tf("error.continueFlow", uiLang));
      await onAdvance();
    } catch (e) {
      setSendError(e.message);
    } finally {
      setSending(false);
    }
  };

  return (
    <div className="rounded-2xl p-4 mb-4" style={{ background: WARM_WHITE, border: `1px solid ${BLUE}33` }}>
      <div className="dp-body text-xs font-semibold mb-3" style={{ color: BLUE }}>
        {flowTemplateLabel(flow.template, uiLang)}
        {flow.status === "finished" ? ` · ${tf("flow.finished", uiLang)}` : ""}
      </div>

      {isAdmin && flow.status === "active" && flow.template !== "tabuladorSueldos" && (
        <AdvancedSettings>
          {!(flow.template === "cuotas" && flow.config?.cuotasMode === "simple") && (
            <label className="dp-body flex items-center justify-between text-xs mb-3" style={{ color: INK }}>
              <span className="flex items-center">
                {flow.template === "responsabilidades" ? tf("flow.thresholdLabel.puestos", uiLang) : tf("flow.thresholdLabel", uiLang)}
                <InfoButton
                  title={tf("flow.thresholdInfo.title", uiLang)}
                  text={flow.template === "responsabilidades" ? tf("flow.thresholdInfo.text.puestos", uiLang) : tf("flow.thresholdInfo.text.categorias", uiLang)}
                />
              </span>
              <input
                type="number" min="0" max="100" value={categoryThresholdPercent}
                onChange={(e) => setCategoryThresholdPercent(e.target.value)}
                className="dp-mono w-14 rounded-lg px-2 py-1 text-center outline-none ml-2"
                style={{ background: "#fff" }}
              />
            </label>
          )}
          {flow.template === "cuotas" && (
            <label className="dp-body flex items-center justify-between text-xs mb-3" style={{ color: INK }}>
              <span className="flex items-center">
                {tf("flow.trimLabel.cuotas", uiLang)}
                <InfoButton
                  title={tf("flow.trimInfo.title", uiLang)}
                  text={tf("flow.trimInfo.text.cuotas", uiLang)}
                />
              </span>
              <input
                type="number" min="0" max="45" value={quotaTrimPercent}
                onChange={(e) => setQuotaTrimPercent(e.target.value)}
                className="dp-mono w-14 rounded-lg px-2 py-1 text-center outline-none ml-2"
                style={{ background: "#fff" }}
              />
            </label>
          )}
          {flow.template === "presupuesto" && isChainedBudget && flow.stages.length === 0 && (
            <div className="mb-3">
              <div className="dp-body text-xs mb-1.5" style={{ color: INK }}>{tf("adv.budgetTotalTitle", uiLang)}</div>
              <div className="dp-mono text-[11px] mb-1.5" style={{ color: INK + "99" }}>
                {tf("adv.fromCuotas", uiLang, { amount: formatMoney(cuotasTotal) })}
              </div>
              <label className="dp-body flex items-center justify-between text-xs mb-1.5" style={{ color: INK }}>
                {tf("adv.extraAmount", uiLang)}
                <input
                  type="number" min="0" value={extraAmount}
                  onChange={(e) => setExtraAmount(e.target.value)}
                  placeholder="0"
                  className="dp-mono w-24 rounded-lg px-2 py-1 text-center outline-none ml-2"
                  style={{ background: "#fff" }}
                />
              </label>
              <div className="dp-mono text-xs font-semibold" style={{ color: BLUE }}>
                {tf("adv.total", uiLang, { amount: formatMoney(effectiveTotalBudget) })}
              </div>
            </div>
          )}
          {flow.licitacion && (
            <React.Fragment>
              <label className="dp-body flex items-center justify-between text-xs mb-1.5" style={{ color: INK }}>
                {tf("adv.tieMinutes", uiLang)}
                <input
                  type="number" min="0" value={tieRoundMinutes}
                  onChange={(e) => setTieRoundMinutes(e.target.value)}
                  placeholder={tf("adv.minutesPlaceholder", uiLang)}
                  className="dp-mono w-20 rounded-lg px-2 py-1 text-center outline-none ml-2"
                  style={{ background: "#fff" }}
                />
              </label>
              <label className="dp-body flex items-center justify-between text-xs mb-1.5" style={{ color: INK }}>
                {tf("adv.reopenMinutes", uiLang)}
                <input
                  type="number" min="0" value={reopenEmptyMinutes}
                  onChange={(e) => setReopenEmptyMinutes(e.target.value)}
                  placeholder={tf("adv.minutesPlaceholder", uiLang)}
                  className="dp-mono w-20 rounded-lg px-2 py-1 text-center outline-none ml-2"
                  style={{ background: "#fff" }}
                />
              </label>
            </React.Fragment>
          )}
          <div className="dp-body text-[10px] mb-2" style={{ color: INK + "77" }}>
            {tf("flow.onlyAffectsFuture", uiLang)}
          </div>
          <button
            onClick={saveConfig}
            disabled={savingConfig}
            className="dp-body w-full text-xs py-1.5 rounded-full text-white font-medium disabled:opacity-40"
            style={{ background: BLUE }}
          >
            {savingConfig ? tf("flow.saving", uiLang) : tf("flow.save", uiLang)}
          </button>
        </AdvancedSettings>
      )}

      {isAdmin && flow.status === "active" && flow.template === "tabuladorSueldos" && (
        <AdvancedSettings>
          <label className="dp-body flex items-center justify-between text-xs mb-1.5" style={{ color: INK }}>
            <span className="flex items-center">
              {tf("adv.sueldoTrim.label", uiLang)}
              <InfoButton
                title={tf("adv.sueldoTrim.title", uiLang)}
                text={tf("adv.sueldoTrim.text", uiLang)}
              />
            </span>
            <input
              type="number" min="0" max="45" value={sueldoTrimPercent}
              onChange={(e) => setSueldoTrimPercent(e.target.value)}
              className="dp-mono w-14 rounded-lg px-2 py-1 text-center outline-none ml-2"
              style={{ background: "#fff" }}
            />
          </label>
          <div className="dp-body text-[10px] mb-2" style={{ color: INK + "77" }}>
            {tf("adv.sueldoTrim.note", uiLang)}
          </div>
          <button
            onClick={saveConfig}
            disabled={savingConfig}
            className="dp-body w-full text-xs py-1.5 rounded-full text-white font-medium disabled:opacity-40"
            style={{ background: BLUE }}
          >
            {savingConfig ? tf("flow.saving", uiLang) : tf("flow.save", uiLang)}
          </button>
        </AdvancedSettings>
      )}

      {flow.stages.map((s, i) => (!isAdmin && STAGES_HIDDEN_FROM_MEMBERS.includes(s.type)) ? null : (
        <div key={i} className="mb-3 pb-3" style={{ borderBottom: `1px dashed ${BLUE}33`, opacity: 0.55 }}>
          <div className="dp-body text-[12px] font-medium mb-1 flex items-center gap-1.5" style={{ color: INK }}>
            <i className="ti ti-lock"></i>
            <span>{s.text}</span>
          </div>
          <StageResultView stage={s} />
        </div>
      ))}

      {flow.status === "finished" && (() => {
        const finalStage = [...flow.stages].reverse().find((s) => s.key === "quotas" || s.key === "singleQuota" || s.key === "budget" || s.key === "montoPorPuesto");
        if (!finalStage && !flow.licitacion) return null;
        return (
          <div className="rounded-xl p-3.5 mb-3" style={{ background: BLUE_SOFT }}>
            <div className="dp-display text-lg font-bold mb-2" style={{ color: INK }}>{tf("flow.collectiveDecision", uiLang)}</div>
            {finalStage && <BigDecisionDisplay stage={finalStage} />}
            <LicitacionResultsDisplay flow={flow} />
          </div>
        );
      })()}

      {stage && stage.type === "eleccion_modo" && (
        <div className="rounded-xl p-3.5" style={{ background: BLUE_SOFT }}>
          <div className="dp-body text-[14px] mb-3" style={{ color: INK, lineHeight: 1.5 }}>{stage.text}</div>
          {isAdmin ? (
            <React.Fragment>
              {[["simple", "ti-bolt"], ["democratic", "ti-users-group"]].map(([mode, icon]) => (
                <button
                  key={mode}
                  onClick={() => submitAndClose(mode)}
                  disabled={sending}
                  className="dp-body w-full text-left rounded-xl p-3.5 mb-2.5 disabled:opacity-40"
                  style={{ background: "#fff", border: `1.5px solid ${BLUE}55` }}
                >
                  <div className="flex items-center justify-between mb-1">
                    <span className="text-sm font-semibold flex items-center gap-1.5" style={{ color: INK }}>
                      <i className={`ti ${icon}`} style={{ color: BLUE }}></i>{tf(`cuotasMode.${mode}.title`, uiLang)}
                    </span>
                    <span className="text-[9px] font-semibold px-2 py-0.5 rounded-full" style={{ background: BLUE_SOFT, color: BLUE }}>{tf(`cuotasMode.${mode}.badge`, uiLang)}</span>
                  </div>
                  <div className="text-xs" style={{ color: INK + "99", lineHeight: 1.5 }}>{tf(`cuotasMode.${mode}.desc`, uiLang)}</div>
                </button>
              ))}
              {sendError && <div className="dp-body text-[11px] mt-1" style={{ color: CORAL }}>{sendError}</div>}
            </React.Fragment>
          ) : (
            <div className="dp-body text-[13px] text-center py-3" style={{ color: INK + "88" }}>⏳ {tf("cuotasMode.waiting", uiLang)}</div>
          )}
        </div>
      )}

      {stage && stage.type === "configurar_cuotas_simple" && (
        isAdmin ? (
          <SimpleCuotasSetup
            key={stage.instanceIndex}
            stage={stage}
            backendUrl={backendUrl}
            groupCode={groupCode}
            memberId={memberId}
            onSubmit={submitAndClose}
            sending={sending}
            sendError={sendError}
          />
        ) : (
          <div className="rounded-xl p-3.5" style={{ background: BLUE_SOFT }}>
            <div className="dp-body text-[13px] text-center py-3" style={{ color: INK + "88" }}>⏳ {tf("simple.waiting", uiLang)}</div>
          </div>
        )
      )}

      {stage && stage.type === "conteo_miembros" && (
        <div className="rounded-xl p-3.5" style={{ background: BLUE_SOFT }}>
          <div className="dp-body text-[14px] mb-2" style={{ color: INK }}>{stage.text}</div>
          {isAdmin ? (() => {
            const fields = stage.config.mode === "single" ? ["single"] : stage.config.categories;
            const allFilled = fields.every((k) => memberCounts[k] !== undefined && memberCounts[k] !== "" && Number(memberCounts[k]) > 0);
            return (
              <React.Fragment>
                {stage.config.mode === "single" && (
                  <label className="dp-body flex items-center justify-between text-xs mb-2" style={{ color: INK }}>
                    {tf("memberSetup.number", uiLang)}
                    <input
                      type="number" min="0" value={memberCounts.single ?? ""}
                      onChange={(e) => setMemberCounts({ ...memberCounts, single: e.target.value })}
                      className="dp-mono w-20 rounded-lg px-2 py-1 text-center outline-none ml-2"
                      style={{ background: "#fff" }}
                    />
                  </label>
                )}
                {stage.config.mode === "categories" && stage.config.categories.map((cat) => (
                  <label key={cat} className="dp-body flex items-center justify-between text-xs mb-1.5" style={{ color: INK }}>
                    {cat}
                    <input
                      type="number" min="0" value={memberCounts[cat] ?? ""}
                      onChange={(e) => setMemberCounts({ ...memberCounts, [cat]: e.target.value })}
                      className="dp-mono w-20 rounded-lg px-2 py-1 text-center outline-none ml-2"
                      style={{ background: "#fff" }}
                    />
                  </label>
                ))}

              <button
                onClick={() => onDownloadPdf()}
                className="dp-body w-full mt-2 text-xs py-2 rounded-full font-medium"
                style={{ border: `1.5px solid ${BLUE}55`, color: BLUE, background: "#fff" }}
              >
                ⬇ {tf("flow.downloadPdf", uiLang)}
              </button>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

function ConnectedScreen({ backendUrl, groupCode, memberId, onExit, onGroupNameChange, hideFlowStarters, tabuladorMode, questionType, cooperativasMode }) {
  const csLang = useLang();
  const [group, setGroup] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");
  const [approving, setApproving] = useState("");
  const [pinnedFlowId, setPinnedFlowId] = useState(null);
  const [showCooperativasChooser, setShowCooperativasChooser] = useState(false);
  const [generatingPdf, setGeneratingPdf] = useState(false);
  const pdfContentRef = React.useRef(null);
  const prevPendingCount = React.useRef(null);

  const flows = group ? group.flows || [] : [];
  // Si venimos de "Selección de responsables" o de "Cooperativas" (sin
  // pasar por Asociaciones), solo nos interesan flujos de esos tipos —
  // así, un grupo reciclado que ya tuviera Cuotas o Presupuesto de
  // pruebas anteriores no se cuela aquí ni confunde la pantalla.
  const relevantFlows = hideFlowStarters
    ? flows.filter((f) => f.template === "responsabilidades")
    : tabuladorMode
    ? flows.filter((f) => f.template === "tabuladorSueldos")
    : cooperativasMode
    ? flows.filter((f) => ["tabuladorSueldos", "presupuestoCooperativa", "responsabilidades"].includes(f.template))
    : flows;
  const latestOrActive = [...relevantFlows].reverse().find((f) => f.status === "active") || relevantFlows[relevantFlows.length - 1];
  // Se muestra el flujo "fijado" (para que una tarjeta de felicidades o
  // resultado recién terminado no desaparezca de golpe si se encadena a
  // otro flujo) — solo se avanza al siguiente cuando el usuario lo pide
  // explícitamente (ej. el botón "Continuar hacia" de la celebración).
  React.useEffect(() => {
    if (!pinnedFlowId && latestOrActive) setPinnedFlowId(latestOrActive.id);
  }, [latestOrActive ? latestOrActive.id : null, pinnedFlowId]);

  const fetchGroup = async () => {
    setLoading(true);
    setError("");
    try {
      const res = await fetch(`${backendUrl}/api/groups/${groupCode}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || tf("connected.notFound", csLang));
      setGroup(data);
      if (onGroupNameChange) onGroupNameChange(data.name);

      const isAdminNow = data.admin.id === memberId;
      const pendingCount = data.members.filter((m) => !m.approved).length;
      if (
        isAdminNow &&
        prevPendingCount.current !== null &&
        pendingCount > prevPendingCount.current &&
        typeof Notification !== "undefined" &&
        Notification.permission === "granted"
      ) {
        new Notification(tf("connected.newRequest.title", csLang), {
          body: tf("connected.newRequest.body", csLang, { name: data.name }),
        });
      }
      prevPendingCount.current = pendingCount;
      return data;
    } catch (e) {
      setError(
        e.message === "Failed to fetch"
          ? tf("createGroup.error.connection", csLang)
          : e.message
      );
      return null;
    } finally {
      setLoading(false);
    }
  };

  React.useEffect(() => {
    if (generatingPdf && pdfContentRef.current) {
      generateResultsPdf(pdfContentRef.current, `${(group && group.name) || "resultados"}.pdf`)
        .catch((e) => customAlert(tf("lic.pdfError", csLang, { msg: e.message })))
        .finally(() => setGeneratingPdf(false));
    }
  }, [generatingPdf]);

  // El PDF se arma siempre con los textos en español, sin importar el
  // idioma en que se esté viendo la app.
  const [pdfFlows, setPdfFlows] = useState(null);
  const downloadPdf = async () => {
    try {
      const res = await fetch(`${backendUrl}/api/groups/${groupCode}?lang=es`);
      const data = await res.json();
      setPdfFlows(res.ok && Array.isArray(data.flows) ? data.flows : null);
    } catch (e) {
      setPdfFlows(null);
    }
    setGeneratingPdf(true);
  };

  useEffect(() => {
    fetchGroup();
    const interval = setInterval(fetchGroup, 15000);
    if (typeof Notification !== "undefined" && Notification.permission === "default") {
      Notification.requestPermission();
    }
    return () => clearInterval(interval);
  }, [csLang]);

  const approve = async (id) => {
    setApproving(id);
    try {
      await fetch(`${backendUrl}/api/groups/${groupCode}/members/${id}/approve`, { method: "POST" });
      await fetchGroup();
    } catch (e) {
      setError(e.message);
    } finally {
      setApproving("");
    }
  };

  const reject = async (id) => {
    setApproving(id);
    try {
      await fetch(`${backendUrl}/api/groups/${groupCode}/members/${id}/reject`, { method: "POST" });
      await fetchGroup();
    } catch (e) {
      setError(e.message);
    } finally {
      setApproving("");
    }
  };

  if (loading && !group) {
    return <div className="dp-body text-sm text-center py-10" style={{ color: INK + "88" }}>{tf("connected.connecting", csLang)}</div>;
  }
  if (error && !group) {
    return (
      <div className="px-4 py-6">
        <div className="dp-body text-[13px]" style={{ color: CORAL }}>{error}</div>
        <BackButton onClick={onExit} />
      </div>
    );
  }
  if (!group) return null;

  const me = group.members.find((m) => m.id === memberId);
  const isAdmin = group.admin.id === memberId;
  const activeFlow = relevantFlows.find((f) => f.id === pinnedFlowId) || latestOrActive;
  const pendingMembers = group.members.filter((m) => !m.approved);

  return (
    <div className="px-4 py-4">
      <div className="rounded-2xl p-4 mb-4" style={{ background: WARM_WHITE, border: `1px solid ${BLUE}33` }}>
        <div className="flex items-start justify-between">
          <div>
            <div className="dp-body text-sm font-semibold" style={{ color: INK }}>{group.name}</div>
            <div className="dp-mono text-xs mt-0.5" style={{ color: INK + "88" }}>{tf("connected.code", csLang, { code: group.code })}</div>
          </div>
          <button onClick={onExit} className="dp-body text-[11px]" style={{ color: INK + "77" }}>{tf("connected.exit", csLang)}</button>
        </div>
        <div className="dp-body text-[11px] mt-2" style={{ color: INK + "88" }}>
          {tf("connected.approvedCount", csLang, { n: group.members.filter((m) => m.approved).length })}
          {isAdmin && tf("connected.youAreFacilitator", csLang)}
        </div>
        {me && !me.approved && (
          <div className="dp-body text-[12px] mt-2 rounded-lg px-2.5 py-1.5" style={{ background: CORAL + "22", color: CORAL }}>
            {tf("connected.pendingApproval", csLang)}
          </div>
        )}
        {flows.length > 0 && (
          <div className="mt-2.5">
            <button
              onClick={downloadPdf}
              disabled={generatingPdf}
              className="dp-body text-[11px] px-3 py-1.5 rounded-full font-medium disabled:opacity-50"
              style={{ background: BLUE_SOFT, color: INK }}
            >
              {generatingPdf ? tf("flow.generatingPdf", csLang) : `⬇ ${tf("flow.downloadPdf", csLang)}`}
            </button>
          </div>
        )}
        {isAdmin && (
          <div className="mt-3 pt-3" style={{ borderTop: `1px solid ${BLUE}22` }}>
            <div className="dp-body text-xs font-medium mb-2" style={{ color: INK }}>
              {tf("connected.inviteLink", csLang)}
            </div>
            {activeFlow && activeFlow.template === "cuotas" && activeFlow.status === "active" && activeFlow.currentStage && activeFlow.currentStage.key === "modo" ? (
              <div className="dp-body text-[11.5px]" style={{ color: INK + "99" }}>{tf("connected.inviteAfterMode", csLang)}</div>
            ) : (
              <ShareGroup groupName={group.name} code={group.code} />
            )}
          </div>
        )}
      </div>

      {isAdmin && pendingMembers.length > 0 && (
        <div className="rounded-2xl p-4 mb-4" style={{ background: CORAL + "15", border: `1.5px solid ${CORAL}55` }}>
          <div className="dp-body text-xs font-semibold mb-2.5" style={{ color: CORAL }}>
            {tf("connected.pendingRequests", csLang, { n: pendingMembers.length })}
          </div>
          <div className="flex flex-col gap-2">
            {pendingMembers.map((m) => (
              <div key={m.id} className="flex items-center justify-between">
                <span className="dp-body text-sm" style={{ color: INK }}>{m.name}</span>
                <div className="flex gap-1.5">
                  <button
                    onClick={() => approve(m.id)}
                    disabled={approving === m.id}
                    className="dp-body text-[11px] px-2.5 py-1.5 rounded-full text-white font-medium disabled:opacity-40"
                    style={{ background: GREEN }}
                  >
                    {approving === m.id ? "…" : tf("connected.approve", csLang)}
                  </button>
                  <button
                    onClick={() => reject(m.id)}
                    disabled={approving === m.id}
                    className="dp-body text-[11px] px-2.5 py-1.5 rounded-full font-medium disabled:opacity-40"
                    style={{ background: "#fff", color: CORAL, border: `1px solid ${CORAL}55` }}
                  >
                    {tf("connected.reject", csLang)}
                  </button>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {activeFlow && !showCooperativasChooser ? (
        <React.Fragment>
          {getFlowChain(activeFlow, flows)
            .slice(0, -1)
            .map((f) => (
              <PreviousFlowSummary key={f.id} flow={f} />
            ))}
          <FlowRunner
            key={activeFlow.id}
            backendUrl={backendUrl}
            groupCode={groupCode}
            memberId={memberId}
            flow={activeFlow}
            allFlows={flows}
            isAdmin={isAdmin}
            groupResponses={group.responses}
            approvedMemberCount={group.members.filter((m) => m.approved).length}
            approvedMemberNames={group.members.filter((m) => m.approved).map((m) => m.name)}
            onAdvance={fetchGroup}
            onSwitchFlow={setPinnedFlowId}
            cooperativasMode={cooperativasMode}
            onFinishedStandalone={() => setShowCooperativasChooser(true)}
            onDownloadPdf={downloadPdf}
          />
        </React.Fragment>
      ) : (
        isAdmin && !hideFlowStarters && !tabuladorMode && !cooperativasMode && (
          <div className="flex flex-col gap-2 mb-4">
            <button
              onClick={async () => {
                await fetch(`${backendUrl}/api/groups/${groupCode}/flows`, {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ template: "cuotas", memberId }),
                });
                setPinnedFlowId(null);
                await fetchGroup();
              }}
              className="dp-body w-full text-left rounded-2xl p-4 shadow-sm"
              style={{ background: BLUE_SOFT, border: `1.5px solid ${BLUE}` }}
            >
              <div className="text-sm font-semibold mb-1 flex items-center gap-1.5" style={{ color: INK }}><i className="ti ti-coin"></i>{tf("starter.cuotas.title", csLang)}</div>
              <div className="text-xs" style={{ color: INK + "88" }}>
                {tf("starter.cuotas.desc", csLang)}
              </div>
            </button>
            <button
              onClick={async () => {
                await fetch(`${backendUrl}/api/groups/${groupCode}/flows`, {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ template: "presupuesto", memberId }),
                });
                setPinnedFlowId(null);
                await fetchGroup();
              }}
              className="dp-body w-full text-left rounded-2xl p-4 shadow-sm"
              style={{ background: BLUE_SOFT, border: `1.5px solid ${BLUE}` }}
            >
              <div className="text-sm font-semibold mb-1 flex items-center gap-1.5" style={{ color: INK }}><i className="ti ti-chart-pie"></i>{tf("starter.presupuesto.title", csLang)}</div>
              <div className="text-xs" style={{ color: INK + "88" }}>
                {tf("starter.presupuesto.desc", csLang)}
              </div>
            </button>
            <button
              onClick={async () => {
                await fetch(`${backendUrl}/api/groups/${groupCode}/flows`, {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ template: "cuotas", memberId, chainNext: "presupuesto" }),
                });
                setPinnedFlowId(null);
                await fetchGroup();
              }}
              className="dp-body w-full text-left rounded-2xl p-4 shadow-sm"
              style={{ background: BLUE_SOFT, border: `1.5px solid ${BLUE}` }}
            >
              <div className="text-sm font-semibold mb-1 flex items-center gap-1.5" style={{ color: INK }}><i className="ti ti-building-community"></i>{tf("starter.asociaciones.title", csLang)}</div>
              <div className="text-xs" style={{ color: INK + "88" }}>
                {tf("starter.asociaciones.desc", csLang)}
              </div>
            </button>
          </div>
        )
      )}

      {(!activeFlow || showCooperativasChooser) && cooperativasMode && (
        isAdmin ? (
          <div className="flex flex-col gap-2 mb-4">
            <div className="dp-body text-[12.5px] rounded-xl p-3 mb-1" style={{ background: BLUE_SOFT, color: INK + "cc", lineHeight: 1.5 }}>
              {showCooperativasChooser
                ? tf("coop.chooseAnother", csLang)
                : tf("coop.intro", csLang)}
            </div>
            <button
              onClick={async () => {
                await fetch(`${backendUrl}/api/groups/${groupCode}/flows`, {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ template: "tabuladorSueldos", memberId }),
                });
                setShowCooperativasChooser(false);
                setPinnedFlowId(null);
                await fetchGroup();
              }}
              className="dp-body w-full text-left rounded-2xl p-4 shadow-sm"
              style={{ background: BLUE_SOFT, border: `1.5px solid ${BLUE}` }}
            >
              <div className="text-sm font-semibold mb-1 flex items-center gap-1.5" style={{ color: INK }}><i className="ti ti-cash"></i>{tf("coop.wageTable.title", csLang)}</div>
              <div className="text-xs" style={{ color: INK + "88" }}>
                {tf("coop.wageTable.subtitle", csLang)}
              </div>
            </button>
            <button
              onClick={async () => {
                await fetch(`${backendUrl}/api/groups/${groupCode}/flows`, {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ template: "presupuestoCooperativa", memberId }),
                });
                setShowCooperativasChooser(false);
                setPinnedFlowId(null);
                await fetchGroup();
              }}
              className="dp-body w-full text-left rounded-2xl p-4 shadow-sm"
              style={{ background: BLUE_SOFT, border: `1.5px solid ${BLUE}` }}
            >
              <div className="text-sm font-semibold mb-1 flex items-center gap-1.5" style={{ color: INK }}><i className="ti ti-chart-pie"></i>{tf("coop.budget.title", csLang)}</div>
              <div className="text-xs" style={{ color: INK + "88" }}>
                {tf("coop.budget.subtitle", csLang)}
              </div>
            </button>
            <button
              onClick={async () => {
                await fetch(`${backendUrl}/api/groups/${groupCode}/flows`, {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ template: "responsabilidades", memberId }),
                });
                setShowCooperativasChooser(false);
                setPinnedFlowId(null);
                await fetchGroup();
              }}
              className="dp-body w-full text-left rounded-2xl p-4 shadow-sm"
              style={{ background: BLUE_SOFT, border: `1.5px solid ${BLUE}` }}
            >
              <div className="text-sm font-semibold mb-1 flex items-center gap-1.5" style={{ color: INK }}><i className="ti ti-dice-5"></i>{tf("coop.roles.title", csLang)}</div>
              <div className="text-xs" style={{ color: INK + "88" }}>
                {tf("coop.roles.subtitle", csLang)}
              </div>
            </button>
            {showCooperativasChooser && (
              <button onClick={() => setShowCooperativasChooser(false)} className="dp-body text-xs mt-1" style={{ color: INK + "77" }}>
                {tf("coop.noneForNow", csLang)}
              </button>
            )}
          </div>
        ) : (
          <div className="dp-body text-[13px] text-center py-4" style={{ color: INK + "88" }}>⏳ {tf("coop.waitingChoice", csLang)}</div>
        )
      )}

      {!activeFlow && !cooperativasMode && !tabuladorMode && (
        <React.Fragment>
          {isAdmin && <NewQuestionForm backendUrl={backendUrl} groupCode={groupCode} onAdded={fetchGroup} fixedType={questionType} />}

          {group.questions.length === 0 && (
            <div className="dp-body text-xs text-center py-4" style={{ color: INK + "77" }}>
              {tf("connected.noQuestions", csLang)}
            </div>
          )}

          {group.questions.map((q) =>
            q.type === "sorteo" ? (
              <SorteoRunner key={q.id} backendUrl={backendUrl} groupCode={groupCode} memberId={memberId} question={q} isAdmin={isAdmin} />
            ) : (
              <QuestionRunner
                key={q.id}
                backendUrl={backendUrl}
                groupCode={groupCode}
                memberId={memberId}
                question={q}
                isAdmin={isAdmin}
                groupResponses={group.responses}
                approvedMemberCount={group.members.filter((m) => m.approved).length}
              />
            )
          )}
        </React.Fragment>
      )}

      {generatingPdf && (
        <div style={{ position: "fixed", left: "-9999px", top: 0, zIndex: -1 }}>
          <div ref={pdfContentRef}>
            <PdfExportContent groupName={group.name} flowChain={(pdfFlows || flows).filter((f) => f.stages.length > 0)} showNames={group.secretResponses === false} />
          </div>
        </div>
      )}
    </div>
  );
}

function MyGroupsScreen({ backendUrl, userId, onBack, onEnterGroup, onGoJoin, onGoCreate }) {
  const lang = useLang();
  const [groups, setGroups] = useState(null);
  const [error, setError] = useState("");

  useEffect(() => {
    fetch(`${backendUrl}/api/my-groups?userId=${userId}`)
      .then((res) => (res.ok ? res.json() : Promise.reject(new Error(tf("myGroups.loadError", lang)))))
      .then((data) => setGroups(data.groups))
      .catch((e) => setError(e.message));

  return (
    <div className="px-4 py-6">
      <BackButton onClick={onBack} />

      {error && <div className="dp-body text-[12px] mb-3" style={{ color: CORAL }}>{error}</div>}

      {groups === null && !error && (
        <div className="dp-body text-xs text-center py-6" style={{ color: INK + "77" }}>{tf("myGroups.loading", lang)}</div>
      )}

      {groups && groups.length === 0 && (
        <div className="dp-body text-xs text-center py-6" style={{ color: INK + "77" }}>
          {tf("myGroups.empty", lang)}

      {groups && groups.map((g) => (
        <button
          key={g.code}
          onClick={() => onEnterGroup(g)}
          className="dp-body w-full text-left rounded-2xl p-3.5 mb-2 flex items-center justify-between"
          style={{ background: WARM_WHITE, border: `1px solid ${BLUE}33` }}
        >
          <div>
            <div className="text-sm font-semibold" style={{ color: INK }}>{g.name}</div>
            <div className="dp-mono text-[10px] mt-0.5" style={{ color: INK + "77" }}>{g.code}</div>
          </div>
          <span
            className="dp-body text-[9px] font-semibold px-2 py-1 rounded-full"
            style={g.isAdmin ? { background: GREEN + "22", color: GREEN } : { background: BLUE_SOFT, color: BLUE }}
          >
            {g.isAdmin ? tf("myGroups.admin", lang) : tf("myGroups.participant", lang)}
          </span>
        </button>
      ))}

      <button
        onClick={onGoJoin}
        className="dp-body w-full text-left rounded-2xl p-3.5 mb-2 mt-2"
        style={{ background: "none", border: `1.5px dashed ${BLUE}55`, color: BLUE }}
      >
        <i className="ti ti-door-enter" style={{ marginRight: "6px" }}></i>{tf("myGroups.joinAnother", lang)}
      </button>
      <button
        onClick={onGoCreate}
        className="dp-body w-full text-left rounded-2xl p-3.5"
        style={{ background: "none", border: `1.5px dashed ${BLUE}55`, color: BLUE }}
      >
        <i className="ti ti-plus" style={{ marginRight: "6px" }}></i>{tf("entry.create.title", lang)}
      </button>
    </div>
  );
}

function LoginScreen({ onBack }) {
  const lang = useLang();
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [sending, setSending] = useState(false);
  const [sent, setSent] = useState(false);
  const [error, setError] = useState("");

  const sendLink = async () => {
    if (!email.trim() || !name.trim()) return;
    setSending(true);
    setError("");
    try {
      const { error: sendError } = await supabaseClient.auth.signInWithOtp({
        email: email.trim(),
        options: {
          emailRedirectTo: window.location.origin + window.location.pathname,
          data: { name: name.trim() },
        },
      });
      if (sendError) throw sendError;
      setSent(true);
    } catch (e) {
      setError(e.message || tf("login.error.generic", lang));
    } finally {
      setSending(false);
    }
  };

  if (sent) {
    return (
      <div className="px-4 py-6">
        <div className="rounded-2xl p-5 text-center" style={{ background: WARM_WHITE, border: `1px solid ${BLUE}33` }}>
          <i className="ti ti-mail-opened" style={{ fontSize: "32px", color: BLUE }}></i>
          <div className="dp-display text-base font-semibold mt-2 mb-1.5" style={{ color: INK }}>{tf("login.checkEmail", lang)}</div>
          <div className="dp-body text-[13px] leading-relaxed" style={{ color: INK + "99" }}>
            {tf("login.linkSentTo", lang)}<br /><b style={{ color: INK }}>{email}</b><br />{tf("login.openIt", lang)}
          </div>
          <div className="rounded-lg p-2.5 mt-3 text-left" style={{ background: CORAL + "15" }}>
            <span className="dp-body text-[11px]" style={{ color: CORAL }}>
              <i className="ti ti-alert-triangle" style={{ marginRight: "4px" }}></i>{tf("login.careWithLink", lang)}
            </span>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="px-4 py-6">
      <BackButton onClick={onBack} />
      <div className="rounded-2xl p-4" style={{ background: WARM_WHITE, border: `1px solid ${BLUE}33` }}>
        <div className="dp-body text-sm font-medium mb-1" style={{ color: INK }}>{tf("login.title", lang)}</div>
        <p className="dp-body text-[12px] mb-3" style={{ color: INK + "88" }}>
          {tf("login.subtitle", lang)}
        </p>
        <div className="flex flex-col gap-2.5">
          <Field label={tf("join.field.name", lang)} value={name} onChange={setName} placeholder={tf("join.field.name.placeholder", lang)} />
          <Field label={tf("createGroup.field.email", lang).split(" (")[0]} value={email} onChange={setEmail} placeholder={tf("join.field.email.placeholder", lang)} type="email" />
        </div>
        <div className="mt-3">
          <PrimaryButton onClick={sendLink} disabled={sending || !email.trim() || !name.trim()}>
            {sending ? tf("flow.sending", lang) : tf("login.sendLink", lang)}
          </PrimaryButton>
        </div>
        {error && <div className="dp-body text-[12px] mt-2" style={{ color: CORAL }}>{error}</div>}
      </div>
    </div>
  );
}

const STEP_CHAIN_KEYS = ["promedio", "mayoria", "tabulador", "responsables", "cuotas", "presupuesto", "asociaciones", "municipios", "cooperativas"];

function DemocraciaPorPromedioConectada() {
  const [backendUrl, setBackendUrl] = useState("https://democracia-por-promedio.onrender.com");
  const [showSettings, setShowSettings] = useState(false);
  const [view, setView] = useState("home"); // home | login | myGroups | custom | explain | create | groupCreated | adminReturn | join | connected
  const [groupCode, setGroupCode] = useState("");
  const [memberId, setMemberId] = useState("");
  const [createdGroupName, setCreatedGroupName] = useState("");
  const [urlCode, setUrlCode] = useState("");
  const [entryPurpose, setEntryPurpose] = useState(null); // null | "cuotas"
  const [selectedOption, setSelectedOption] = useState(null); // null | "explain" | "custom" | "cuotas" | "presupuesto" | "asociaciones"
  const [connectedGroupName, setConnectedGroupName] = useState("");
  const [session, setSession] = useState(null);
  const [showWelcome, setShowWelcome] = useState(false);
  const [lang, setLang] = useState(() => localStorage.getItem("org_lang") || "es");
  const changeLang = (code) => {
    localStorage.setItem("org_lang", code);
    setLang(code);
  };

  useEffect(() => {
    document.title = tf("home.title", lang);
  }, [lang]);

  const closeWelcome = () => {
    localStorage.setItem("org_onboarding_seen", "true");
    setShowWelcome(false);
  };

  useEffect(() => {
    supabaseClient.auth.getSession().then(({ data }) => {
      setSession(data.session);
      // Solo se muestra la bienvenida si no hay sesión iniciada Y nunca
      // se ha visto antes en este navegador.
      if (!data.session && !localStorage.getItem("org_onboarding_seen")) {
        setShowWelcome(true);
      }
    });
    const { data: listener } = supabaseClient.auth.onAuthStateChange((event, newSession) => {
      setSession(newSession);
      if (newSession) setShowWelcome(false);
      if (event === "SIGNED_IN" && window.location.hash.includes("access_token")) {
        window.history.replaceState({}, "", window.location.pathname + window.location.search);
      }
    });
    return () => listener.subscription.unsubscribe();
  }, []);

  const optionTitle = (opt) => {
    if (!opt) return "";
    if (opt === "responsables") return tf("hdr.title.responsables", lang);
    return tf(`home.${opt}.title`, lang);
  };
  const stepChain = (opt) => tf(`hdr.steps.${STEP_CHAIN_KEYS.includes(opt) ? opt : "default"}`, lang).split("|");
  const HOME_TAGLINE = tf("home.tagline", lang);
  const headerTitle = connectedGroupName || optionTitle(selectedOption) || tf("home.title", lang);
  const sessionName = session ? (session.user.user_metadata && session.user.user_metadata.name) || "" : "";
  const sessionEmail = session ? session.user.email : "";
  const isHomeHeader = !connectedGroupName && !selectedOption;
  const headerSteps = stepChain(selectedOption);

  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const member = params.get("member");
    if (code && member) {
      // Link de sesión propia (admin o miembro ya identificado): entra directo, sin pedir nada.
      setGroupCode(code);
      setMemberId(member);
      setView("connected");
    } else if (code) {
      // Link de invitación compartido: pide nombre antes de unirse.
      setUrlCode(code);
      setView("join");
    }
  }, []);

  const persistSession = (code, member) => {
    const url = `${window.location.pathname}?code=${code}&member=${member}`;
    window.history.replaceState(null, "", url);
  };

  const clearSession = () => {
    window.history.replaceState(null, "", window.location.pathname);
  };

  return (
    <LangContext.Provider value={lang}>
    <div className="min-h-screen flex justify-center py-8 px-3" style={{ background: PAGE_BG }}>
      <div className="w-full max-w-[420px] rounded-[32px] overflow-hidden shadow-xl" style={{ background: PAGE_BG, border: `1px solid ${BLUE}33` }}>
        <div className="px-6 pt-7 pb-5" style={{ background: WARM_WHITE }}>
          <div className="flex items-center justify-between mb-2.5">
            <div className="flex items-center gap-2">
              <LangToggle lang={lang} onChange={changeLang} />
              {!isHomeHeader && (
                <div
                  className="dp-body inline-block text-[10px] font-semibold tracking-wide px-2.5 py-1 rounded-full"
                  style={{ background: BLUE_SOFT, color: INK + "aa" }}
                >
                  {tf("header.badge", lang)}
                </div>
              )}
            </div>
            {view === "home" && (
              session ? (
                <div className="flex flex-col items-start gap-1">
                  <span className="dp-body text-[10px]" style={{ color: INK + "88" }}>
                    <i className="ti ti-user-circle" style={{ marginRight: "3px" }}></i>{session.user.email}
                  </span>
                  <button
                    onClick={() => setView("myGroups")}
                    className="dp-body flex items-center gap-1 text-[10px] font-semibold px-2.5 py-1 rounded-full"
                    style={{ background: BLUE_SOFT, color: BLUE }}
                  >
                    <i className="ti ti-users-group" style={{ fontSize: "11px" }}></i>{tf("header.myGroups", lang)}
                  </button>
                </div>
              ) : isHomeHeader ? (
                <button onClick={() => setView("login")} className="dp-body text-[10px] font-semibold" style={{ color: BLUE }}>
                  <i className="ti ti-login" style={{ marginRight: "3px" }}></i>{tf("header.login", lang)}
                </button>
              ) : null
            )}
          </div>
          <h1 className="dp-display text-2xl font-bold leading-tight" style={{ color: INK }}>{headerTitle}</h1>
          <div className="dp-body text-[12px] mt-2.5 leading-relaxed" style={{ color: INK + "99" }}>
            {isHomeHeader ? (
              <span>{HOME_TAGLINE}</span>
            ) : (
              headerSteps.map((f, i, arr) => (
                <React.Fragment key={i}>
                  <span>{f}</span>
                  {i < arr.length - 1 && <span style={{ color: BLUE, margin: "0 4px" }}>→</span>}
                </React.Fragment>
              ))
            )}
          </div>
        </div>

        {view === "login" && <LoginScreen onBack={() => setView("home")} />}

        {view === "myGroups" && session && (
          <MyGroupsScreen
            backendUrl={backendUrl}
            userId={session.user.id}
            onBack={() => setView("home")}
            onEnterGroup={(g) => {
              setGroupCode(g.code);
              setMemberId(g.memberId);
              persistSession(g.code, g.memberId);
              setView("connected");
            }}
            onGoJoin={() => {
              setSelectedOption("custom");
              setView("join");
            }}
            onGoCreate={() => {
              setSelectedOption("custom");
              setEntryPurpose(null);
              setView("create");
            }}
          />
        )}

        {view === "home" && (
          <HomeScreen
            onChooseExplain={() => {
              setSelectedOption("explain");
              setView("explain");
            }}
            onChoosePromedio={() => {
              setEntryPurpose("promedio");
              setSelectedOption("promedio");
              setView("custom");
            }}
            onChooseMayoria={() => {
              setEntryPurpose("mayoria");
              setSelectedOption("mayoria");
              setView("custom");
            }}
            onChooseTabulador={() => {
              setEntryPurpose("tabulador");
              setSelectedOption("tabulador");
              setView("custom");
            }}
            onChooseCuotas={() => {
              setEntryPurpose("cuotas");
              setSelectedOption("cuotas");
              setView("custom");
            }}
            onChoosePresupuesto={() => {
              setEntryPurpose("presupuesto");
              setSelectedOption("presupuesto");
              setView("custom");
            }}
            onChooseAsociaciones={() => {
              setEntryPurpose("asociaciones");
              setSelectedOption("asociaciones");
              setView("custom");
            }}
            onChooseResponsables={() => {
              setEntryPurpose("responsabilidades");
              setSelectedOption("responsables");
              setView("custom");
            }}
            onChooseMunicipios={() => {
              setSelectedOption("municipios");
              setView("municipios");
            }}
          />
        )}
        {view === "municipios" && (
          <MunicipiosDemo
            onBack={() => {
              setSelectedOption(null);
              setView("home");
            }}
          />
        )}
        {view === "custom" && (
          <CustomEntryScreen
            onBack={() => {
              setSelectedOption(null);
              setView("home");
            }}
            onChooseCreate={() => setView("create")}
            onChooseAdminReturn={() => setView("adminReturn")}
            onChooseJoin={() => setView("join")}
          />
        )}
        {view === "explain" && (
          <ExplanationScreen
            onBack={() => {
              setSelectedOption(null);
              setView("home");
            }}
          />
        )}
        {view === "create" && (
          <CreateGroupScreen
            backendUrl={backendUrl}
            section={SECEX_SECTIONS.includes(selectedOption) ? selectedOption : null}
            onBack={() => setView("custom")}
            prefillName={sessionName}
            prefillEmail={sessionEmail}
            userId={session ? session.user.id : null}
            onCreated={async ({ code, memberId, groupName }) => {
              setGroupCode(code);
              setMemberId(memberId);
              setCreatedGroupName(groupName);
              persistSession(code, memberId);
              if (entryPurpose === "cuotas" || entryPurpose === "presupuesto" || entryPurpose === "responsabilidades") {
                await fetch(`${backendUrl}/api/groups/${code}/flows`, {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ template: entryPurpose, memberId }),
                });
              } else if (entryPurpose === "tabulador") {
                await fetch(`${backendUrl}/api/groups/${code}/flows`, {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ template: "tabuladorSueldos", memberId }),
                });
              } else if (entryPurpose === "asociaciones") {
                await fetch(`${backendUrl}/api/groups/${code}/flows`, {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ template: "cuotas", memberId, chainNext: "presupuesto" }),
                });
              }
              setView("groupCreated");
            }}
          />
        )}
        {view === "groupCreated" && (
          <GroupCreatedScreen
            groupName={createdGroupName}
            code={groupCode}
            deferShare={entryPurpose === "cuotas" || entryPurpose === "asociaciones"}
            onContinue={() => setView("connected")}
          />
        )}
        {view === "adminReturn" && (
          <AdminReturnScreen
            backendUrl={backendUrl}
            onBack={() => setView("custom")}
            onEntered={({ code, memberId }) => {
              setGroupCode(code);
              setMemberId(memberId);
              persistSession(code, memberId);
              setView("connected");
            }}
          />
        )}
        {view === "join" && (
          <JoinGroupScreen
            backendUrl={backendUrl}
            initialCode={urlCode}
            onBack={() => setView("custom")}
            prefillName={sessionName}
            prefillEmail={sessionEmail}
            userId={session ? session.user.id : null}
            onJoined={({ code, memberId }) => {
              setGroupCode(code);
              setMemberId(memberId);
              persistSession(code, memberId);
              setView("connected");
            }}
          />
        )}
        {view === "connected" && (
          <ConnectedScreen
            backendUrl={backendUrl}
            groupCode={groupCode}
            memberId={memberId}
            onGroupNameChange={setConnectedGroupName}
            hideFlowStarters={selectedOption === "responsables"}
            tabuladorMode={selectedOption === "tabulador"}
            questionType={selectedOption === "promedio" || selectedOption === "mayoria" ? selectedOption : null}
            cooperativasMode={selectedOption === "cooperativas"}
            onExit={() => {
              setGroupCode("");
              setMemberId("");
              setEntryPurpose(null);
              setSelectedOption(null);
              setConnectedGroupName("");
              clearSession();
              setView("home");
            }}
          />
        )}

        <div className="px-4 pb-4">
          <button
            onClick={() => setShowSettings(!showSettings)}
            className="dp-body text-[10px]"
            style={{ color: INK + "55" }}
          >
            {tf("footer.server", lang)}: {backendUrl} {showSettings ? "▲" : "▼"}
          </button>
          {showSettings && (
            <input
              value={backendUrl}
              onChange={(e) => setBackendUrl(e.target.value)}
              className="dp-mono w-full mt-1.5 rounded-lg px-2.5 py-1.5 text-xs outline-none"
              style={{ background: BLUE_SOFT, color: INK }}
            />
          )}
        </div>
      </div>

      {showWelcome && view === "home" && <OnboardingCarousel slides={getOnboardingSlides(lang)} onClose={closeWelcome} overlay={true} />}
      <DialogHost />
    </div>
    </LangContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<DemocraciaPorPromedioConectada />);
</script>
</body>
</html>
