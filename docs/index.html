function JoinGroupScreen({ backendUrl, initialCode, onBack, onJoined, prefillName, prefillEmail, userId }) {
  const lang = useLang();
  const [code, setCode] = useState(initialCode || "");
  const [name, setName] = useState(prefillName || "");
  const [email, setEmail] = useState(prefillEmail || "");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [status, setStatus] = useState("");
  const [previewName, setPreviewName] = useState("");
  const [showGroupWelcome, setShowGroupWelcome] = useState(false);
  const [groupTemplate, setGroupTemplate] = useState(null);

  useEffect(() => {
    if (!initialCode) return;
    fetch(`${backendUrl}/api/groups/${initialCode}`)
      .then((res) => (res.ok ? res.json() : Promise.reject()))
      .then((data) => {
        setPreviewName(data.name);
        const flows = data.flows || [];
        const active = flows.find((f) => f.status === "active") || flows[flows.length - 1];
        if (!active) return;
        const template = active.chainNext === "presupuesto" || active.chainedFromFlowId ? "asociaciones" : active.template;
        if (template && ONBOARDING_GROUP_SLIDES[template]) {
          setGroupTemplate(template);
          if (!localStorage.getItem(`org_onboarding_seen_${template}`)) {
            setShowGroupWelcome(true);
          }
        }
      })
      .catch(() => {});
  }, [initialCode]);

  const closeGroupWelcome = () => {
    if (groupTemplate) localStorage.setItem(`org_onboarding_seen_${groupTemplate}`, "true");
    setShowGroupWelcome(false);
  };

  const submit = async () => {
    if (!code || !name) return;
    setLoading(true);
    setError("");
    try {
      const res = await fetch(`${backendUrl}/api/groups/${code.trim()}/join`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, email, userId: userId || null }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || tf("join.error.generic", lang));
      setStatus(data.status);
      onJoined({ code: code.trim(), memberId: data.memberId });
    } catch (e) {
      setError(
        e.message === "Failed to fetch"
          ? tf("createGroup.error.connection", lang)
          : e.message
      );
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="px-4 py-6">
      <BackButton onClick={onBack} />
      <div className="rounded-2xl p-4" style={{ background: WARM_WHITE, border: `1px solid ${BLUE}33` }}>
        <div className="dp-body text-sm font-medium mb-1" style={{ color: INK }}>{tf("join.title", lang)}</div>
        {previewName && (
          <p className="dp-body text-[12px] mb-3" style={{ color: GREEN }}>
            {tf("join.willJoin", lang)} <b>{previewName}</b>
          </p>
        )}
        {!previewName && <div className="mb-3" />}
        <div className="flex flex-col gap-2.5 mb-3">
          <Field label={tf("adminReturn.field.code", lang)} value={code} onChange={setCode} placeholder={tf("adminReturn.field.code.placeholder", lang)} />
          <Field label={tf("join.field.name", lang)} value={name} onChange={setName} placeholder={tf("join.field.name.placeholder", lang)} />
          <Field label={tf("join.field.email", lang)} value={email} onChange={setEmail} placeholder={tf("join.field.email.placeholder", lang)} type="email" />
        </div>
        <PrimaryButton onClick={submit} disabled={loading || !code || !name}>
          {loading ? tf("flow.sending", lang) : tf("join.submit", lang)}
        </PrimaryButton>
        {error && <div className="dp-body text-[12px] mt-2" style={{ color: CORAL }}>{error}</div>}
      </div>

      {showGroupWelcome && groupTemplate && (
        <OnboardingCarousel
          slides={ONBOARDING_GROUP_SLIDES[groupTemplate].map((i) => getOnboardingSlides(lang)[i])}
          onClose={closeGroupWelcome}
          overlay={true}
        />
      )}
    </div>
  );
}

function NewQuestionForm({ backendUrl, groupCode, onAdded }) {
  const [type, setType] = useState("promedio");
  const [text, setText] = useState("");
  const [trimPercent, setTrimPercent] = useState("5");
  const [options, setOptions] = useState(["", ""]);
  const [majorityRule, setMajorityRule] = useState("absoluta");
  const [qualifiedPct, setQualifiedPct] = useState("66");
  const [numRounds, setNumRounds] = useState("3");
  const [eliminationThresholdPercent, setEliminationThresholdPercent] = useState("10");
  const [showDefs, setShowDefs] = useState(false);
  const [useLimit, setUseLimit] = useState(false);
  const [days, setDays] = useState("0");
  const [hours, setHours] = useState("0");
  const [minutes, setMinutes] = useState("0");
  const [adding, setAdding] = useState(false);
  const [error, setError] = useState("");
  const [showPreview, setShowPreview] = useState(false);

  const updateOption = (i, val) => setOptions(options.map((o, idx) => (idx === i ? val : o)));
  const addOption = () => setOptions([...options, ""]);
  const removeOption = (i) => setOptions(options.filter((_, idx) => idx !== i));

  const totalMinutes = () => Number(days || 0) * 1440 + Number(hours || 0) * 60 + Number(minutes || 0);

  const RULE_LABEL = { simple: "Simple", absoluta: "Absoluta", calificada: "Calificada", rankeado: "Voto ranqueado", segunda_vuelta: "Segunda vuelta electoral" };
  const RULE_DEF = {
    simple: "Gana la opción con más votos, sin importar el porcentaje.",
    absoluta: "La opción ganadora necesita más del 50% de los votos.",
    calificada: "La opción ganadora necesita superar el porcentaje que tú definas (mayor al 50%).",
    rankeado: "Cada quien ordena las opciones por preferencia. La app calcula sola, en rondas, quién gana: elimina la menos votada y reparte esos votos a la siguiente preferencia, hasta que alguien pase el 50%.",
    segunda_vuelta: "Se vota por una sola opción a la vez, en rondas. Al cerrarse una ronda (por tiempo o porque tú la cierras), se elimina a las opciones menos votadas que definas, y se vuelve a votar entre las que quedan.",
  };

  const submit = async () => {
    if (!text) return;
    const cleanOptions = options.map((o) => o.trim()).filter(Boolean);
    if (type === "mayoria" && cleanOptions.length < 2) {
      setError("Agrega al menos 2 opciones");
      return;
    }
    if (type === "sorteo" && cleanOptions.length < 2) {
      setError("Agrega al menos 2 candidatos");
      return;
    }
    setAdding(true);
    setError("");
    try {
      const body = { type, text };
      const mins = useLimit ? totalMinutes() : 0;

      if (type === "promedio") {
        body.trimPercent = Number(trimPercent);
        if (mins > 0) body.closesInMinutes = mins;
      } else if (type === "sorteo") {
        body.options = cleanOptions;
      } else {
        body.options = cleanOptions;
        body.majorityRule = majorityRule;
        if (majorityRule === "calificada") body.qualifiedPct = Number(qualifiedPct);
        if (majorityRule === "segunda_vuelta") {
          body.numRounds = Number(numRounds);
          body.eliminationThresholdPercent = Number(eliminationThresholdPercent);
          if (mins > 0) body.roundDurationMinutes = mins;
        } else if (mins > 0) {
          body.closesInMinutes = mins;
        }
      }

      const res = await fetch(`${backendUrl}/api/groups/${groupCode}/questions`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Error al crear la pregunta");
      setText("");
      setOptions(["", ""]);
      setUseLimit(false);
      setDays("0"); setHours("0"); setMinutes("0");
      await onAdded();
    } catch (e) {
      setError(e.message);
    } finally {
      setAdding(false);
    }
  };

  const isSegundaVuelta = majorityRule === "segunda_vuelta";

  return (
    <div className="rounded-2xl p-4 mb-4" style={{ background: WARM_WHITE, border: `1px solid ${BLUE}33` }}>
      <div className="dp-body text-xs font-medium mb-3" style={{ color: INK }}>Nueva pregunta</div>

      <div className="flex gap-1.5 mb-3">
        {[{ key: "promedio", label: "Promedio" }, { key: "mayoria", label: "Mayoría" }, { key: "sorteo", label: "Sorteo" }].map((t) => (
          <button
            key={t.key}
            onClick={() => setType(t.key)}
            className="dp-body text-xs px-3 py-1.5 rounded-full font-medium flex-1"
            style={type === t.key ? { background: BLUE, color: "#fff" } : { background: BLUE_SOFT, color: INK }}
          >
            {t.label}
          </button>
        ))}
      </div>

      <textarea
        rows={2}
        value={text}
        onChange={(e) => setText(e.target.value)}
        placeholder="Escribe la pregunta…"
        className="dp-body w-full resize-none rounded-lg px-2.5 py-2 text-sm outline-none mb-2"
        style={{ background: BLUE_SOFT, color: INK }}
      />

      {type === "promedio" && (
        <div className="dp-body flex items-center gap-1.5 text-xs px-2.5 py-1.5 rounded-full mb-3 w-fit" style={{ background: BLUE_SOFT, color: INK }}>
          <span style={{ opacity: 0.6 }}>Recorte</span>
          <input type="number" value={trimPercent} onChange={(e) => setTrimPercent(e.target.value)} className="w-9 bg-transparent dp-mono text-center outline-none font-medium" />
          <span style={{ opacity: 0.6 }}>%</span>
        </div>
      )}

      {type === "sorteo" && (
        <div className="mb-3">
          <div className="dp-body text-[11px] mb-2" style={{ color: INK + "88" }}>
            <i className="ti ti-dice-5" style={{ marginRight: "4px" }}></i>
            Se elige al azar entre estos candidatos. Nunca se repite el mismo ganador hasta que todos los demás hayan salido una vez.
          </div>
          {options.map((opt, i) => (
            <div key={i} className="flex items-center gap-2 mb-1.5">
              <input
                value={opt}
                onChange={(e) => updateOption(i, e.target.value)}
                placeholder={`Candidato ${i + 1}`}
                className="dp-body flex-1 rounded-lg px-2.5 py-1.5 text-sm outline-none"
                style={{ background: BLUE_SOFT, color: INK }}
              />
              {options.length > 2 && (
                <button onClick={() => removeOption(i)} className="dp-body text-xs px-1" style={{ color: CORAL }}><i className="ti ti-x"></i></button>
              )}
            </div>
          ))}
          <button onClick={addOption} className="dp-body text-xs font-medium" style={{ color: BLUE }}>+ agregar candidato</button>
        </div>
      )}

      {type === "mayoria" && (
        <React.Fragment>
          <div className="mb-3">
            {options.map((opt, i) => (
              <div key={i} className="flex items-center gap-2 mb-1.5">
                <input
                  value={opt}
                  onChange={(e) => updateOption(i, e.target.value)}
                  placeholder={`Opción ${i + 1}`}
                  className="dp-body flex-1 rounded-lg px-2.5 py-1.5 text-sm outline-none"
                  style={{ background: BLUE_SOFT, color: INK }}
                />
                {options.length > 2 && (
                  <button onClick={() => removeOption(i)} className="dp-body text-xs px-1" style={{ color: CORAL }}><i className="ti ti-x"></i></button>
                )}
              </div>
            ))}
            <button onClick={addOption} className="dp-body text-xs font-medium" style={{ color: BLUE }}>+ agregar opción</button>
          </div>

          <div className="dp-body text-[10px] font-semibold mb-1.5" style={{ color: INK + "88", textTransform: "uppercase", letterSpacing: "0.03em" }}>
            Mayoría
          </div>
          <div className="flex gap-1.5 mb-2">
            {["simple", "absoluta", "calificada"].map((r) => (
              <button
                key={r}
                onClick={() => setMajorityRule(r)}
                className="dp-body text-[11px] px-2 py-1.5 rounded-full font-medium flex-1"
                style={majorityRule === r ? { background: BLUE, color: "#fff" } : { background: BLUE_SOFT, color: INK }}
              >
                {RULE_LABEL[r]}
              </button>
            ))}
          </div>
          {majorityRule === "calificada" && (
            <div className="dp-body flex items-center gap-2 text-xs mb-3" style={{ color: INK }}>
              requiere más de
              <input type="number" min="51" max="99" value={qualifiedPct} onChange={(e) => setQualifiedPct(e.target.value)} className="dp-mono w-14 rounded-lg px-2 py-1 text-center outline-none" style={{ background: BLUE_SOFT }} />
              %
            </div>
          )}

          <div style={{ height: "1px", background: BLUE + "22", margin: "8px 0" }} />
          <button
            onClick={() => setMajorityRule("rankeado")}
            className="dp-body block w-full text-left text-xs font-medium px-2.5 py-2 rounded-lg mb-2"
            style={majorityRule === "rankeado" ? { background: BLUE, color: "#fff" } : { background: BLUE_SOFT, color: INK }}
          >
            Voto ranqueado
          </button>

          <div style={{ height: "1px", background: BLUE + "22", margin: "8px 0" }} />
          <button
            onClick={() => setMajorityRule("segunda_vuelta")}
            className="dp-body block w-full text-left text-xs font-medium px-2.5 py-2 rounded-lg mb-2"
            style={majorityRule === "segunda_vuelta" ? { background: BLUE, color: "#fff" } : { background: BLUE_SOFT, color: INK }}
          >
            Segunda vuelta electoral
          </button>
          {isSegundaVuelta && (
            <div className="flex gap-3 mb-2">
              <label className="dp-body flex items-center gap-1.5 text-xs" style={{ color: INK }}>
                Número de rondas
                <input type="number" min="1" value={numRounds} onChange={(e) => setNumRounds(e.target.value)} className="dp-mono w-11 rounded-lg px-1.5 py-1 text-center outline-none" style={{ background: BLUE_SOFT }} />
              </label>
            </div>
          )}
          {isSegundaVuelta && (
            <div className="flex gap-3 mb-1">
              <label className="dp-body flex items-center gap-1.5 text-xs" style={{ color: INK }}>
                % mínimo para sobrevivir
                <input type="number" min="0" max="100" value={eliminationThresholdPercent} onChange={(e) => setEliminationThresholdPercent(e.target.value)} className="dp-mono w-11 rounded-lg px-1.5 py-1 text-center outline-none" style={{ background: BLUE_SOFT }} />
              </label>
            </div>
          )}
          {isSegundaVuelta && (
            <div className="dp-body text-[10px] mb-3" style={{ color: INK + "77" }}>
              en cada ronda se eliminan las opciones sin votos y las que estén por debajo de este %
            </div>
          )}

          <button onClick={() => setShowDefs(!showDefs)} className="dp-body text-[11px] font-medium mb-2" style={{ color: BLUE }}>
            {showDefs ? "ocultar definiciones" : "¿qué significa cada una?"}
          </button>
          {showDefs && (
            <div className="rounded-lg p-2.5 mb-3 text-[11px] leading-relaxed" style={{ background: BLUE_SOFT, color: INK + "cc" }}>
              {Object.entries(RULE_LABEL).map(([k, l]) => (
                <div key={k} className="mb-1">
                  <b style={{ color: INK }}>{l}:</b> {RULE_DEF[k]}
                </div>
              ))}
            </div>
          )}
        </React.Fragment>
      )}

      {type !== "sorteo" && (
        <React.Fragment>
          <div className="dp-body text-xs font-medium mb-1.5" style={{ color: INK }}>
            Límite de tiempo{isSegundaVuelta ? " por ronda" : " para responder"}:
          </div>
          <div className="flex gap-1.5 mb-2">
            <button onClick={() => setUseLimit(false)} className="dp-body text-xs px-3 py-1.5 rounded-full font-medium flex-1" style={!useLimit ? { background: BLUE, color: "#fff" } : { background: BLUE_SOFT, color: INK }}>No</button>
            <button onClick={() => setUseLimit(true)} className="dp-body text-xs px-3 py-1.5 rounded-full font-medium flex-1" style={useLimit ? { background: BLUE, color: "#fff" } : { background: BLUE_SOFT, color: INK }}>Sí</button>
          </div>
          {useLimit && (
            <div className="flex gap-2 mb-1">
              <label className="dp-body flex items-center gap-1.5 text-xs" style={{ color: INK + "99" }}>
                Días <input type="number" min="0" value={days} onChange={(e) => setDays(e.target.value)} className="dp-mono w-11 rounded-lg px-1.5 py-1 text-center outline-none" style={{ background: BLUE_SOFT }} />
              </label>
              <label className="dp-body flex items-center gap-1.5 text-xs" style={{ color: INK + "99" }}>
                Horas <input type="number" min="0" max="23" value={hours} onChange={(e) => setHours(e.target.value)} className="dp-mono w-11 rounded-lg px-1.5 py-1 text-center outline-none" style={{ background: BLUE_SOFT }} />
              </label>
              <label className="dp-body flex items-center gap-1.5 text-xs" style={{ color: INK + "99" }}>
                Min <input type="number" min="0" max="59" value={minutes} onChange={(e) => setMinutes(e.target.value)} className="dp-mono w-11 rounded-lg px-1.5 py-1 text-center outline-none" style={{ background: BLUE_SOFT }} />
              </label>
            </div>
          )}
          {isSegundaVuelta && (
            <div className="dp-body text-[10px] mb-3" style={{ color: INK + "77" }}>
              {useLimit ? "al pasar el tiempo, la ronda se cierra sola y avanza." : "sin límite: tú cierras cada ronda a mano."}
            </div>
          )}
          {!isSegundaVuelta && <div className="mb-3" />}
        </React.Fragment>
      )}

      <button
        type="button"
        onClick={() => setShowPreview(!showPreview)}
        className="dp-body w-full flex items-center justify-center gap-1.5 text-xs py-2 rounded-full font-medium mb-2"
        style={{ background: BLUE_SOFT, color: INK }}
      >
        <i className="ti ti-eye" style={{ marginRight: "4px" }}></i>{showPreview ? "Ocultar vista previa" : "Vista previa"}
      </button>

      {showPreview && (
        <div className="rounded-2xl p-3 mb-3" style={{ background: PAGE_BG, border: `1.5px dashed ${BLUE}55` }}>
          <div className="dp-body text-[10px] font-semibold mb-2" style={{ color: INK + "77", textTransform: "uppercase", letterSpacing: "0.03em" }}>
            Así lo verán los participantes
          </div>
          <div className="rounded-xl p-3.5" style={{ background: WARM_WHITE, border: `1px solid ${BLUE}33` }}>
            <div className="dp-body text-[15px] mb-1" style={{ color: INK }}>{text || "Escribe tu pregunta arriba…"}</div>
            <div className="dp-body text-[11px] mb-3" style={{ color: INK + "77" }}>
              {type === "promedio"
                ? `recorte: ${trimPercent || 0}%`
                : type === "sorteo"
                ? "se elige al azar entre los candidatos"
                : majorityRule === "calificada"
                ? `necesita más del ${qualifiedPct || 66}%`
                : majorityRule === "absoluta"
                ? "necesita más del 50%"
                : majorityRule === "simple"
                ? "gana la más votada"
                : majorityRule === "rankeado"
                ? "voto ranqueado (automático)"
                : `${numRounds || 3} rondas · elimina menos del ${eliminationThresholdPercent || 10}%`}
            </div>

            {type === "promedio" && (
              <div className="flex items-center gap-2">
                <div className="flex-1 rounded-lg px-2.5 py-1.5 text-sm dp-mono" style={{ background: BLUE_SOFT, color: INK + "77" }}>tu propuesta</div>
                <div className="text-xs px-3 py-2 rounded-full text-white font-medium" style={{ background: GREEN, opacity: 0.6 }}><i className="ti ti-send" style={{ marginRight: "4px" }}></i>Enviar</div>
              </div>
            )}

            {type === "sorteo" && (
              <div className="flex flex-col gap-1.5">
                {(options.map((o) => o.trim()).filter(Boolean).length ? options.map((o) => o.trim()).filter(Boolean) : ["Candidato 1", "Candidato 2"]).map((opt, i) => (
                  <div key={i} className="dp-body text-left text-sm px-3 py-2 rounded-lg" style={{ background: BLUE_SOFT, color: INK }}>
                    {opt}
                  </div>
                ))}
                <div className="text-xs px-3 py-2 rounded-full text-white font-medium text-center" style={{ background: BLUE, opacity: 0.6 }}><i className="ti ti-dice-5" style={{ marginRight: "4px" }}></i>Sortear</div>
              </div>
            )}

            {type === "mayoria" && majorityRule !== "rankeado" && (
              <div className="flex flex-col gap-1.5">
                {(options.map((o) => o.trim()).filter(Boolean).length ? options.map((o) => o.trim()).filter(Boolean) : ["Opción 1", "Opción 2"]).map((opt, i) => (
                  <div key={i} className="dp-body text-left text-sm px-3 py-2 rounded-lg" style={{ background: BLUE_SOFT, color: INK }}>
                    ○ {opt}
                  </div>
                ))}
              </div>
            )}

            {type === "mayoria" && majorityRule === "rankeado" && (
              <div className="flex flex-col gap-1.5">
                <div className="dp-body text-[11px] mb-1" style={{ color: INK + "77" }}>{tf("input.rankOrderShort", siLang)}</div>
                {(options.map((o) => o.trim()).filter(Boolean).length ? options.map((o) => o.trim()).filter(Boolean) : ["Opción 1", "Opción 2"]).map((opt, i) => (
                  <div key={i} className="dp-body flex items-center gap-2 text-left text-sm px-3 py-2 rounded-lg" style={{ background: BLUE_SOFT, color: INK }}>
                    <span className="dp-mono font-semibold" style={{ minWidth: "16px" }}>–</span>{opt}
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      )}

      {error && <div className="dp-body text-[12px] mb-2" style={{ color: CORAL }}>{error}</div>}

      <button
        onClick={submit}
        disabled={adding || !text}
        className="dp-body w-full flex items-center justify-center gap-1.5 text-xs py-2 rounded-full text-white font-medium disabled:opacity-40"
        style={{ background: BLUE }}
      >
        <i className="ti ti-plus" style={{ marginRight: "4px" }}></i>{adding ? "Agregando…" : "Agregar pregunta"}
      </button>
    </div>
  );
}


function StageInput({ stage, onSend, sending, disabled, flowConfig, approvedMemberNames }) {
  const siLang = useLang();
  const [numValue, setNumValue] = useState("");
  const [selected, setSelected] = useState("");
  const [texts, setTexts] = useState(() => {
    const suggested = stage.config.suggestedItems || [];
    const blanks = Array(Math.max(0, (stage.config.maxItemsPerPerson || 1) - suggested.length)).fill("");
    return suggested.length ? [...suggested, ...blanks] : Array(stage.config.maxItemsPerPerson || 1).fill("");
  });
  const [rankOrder, setRankOrder] = useState([]);
  const [catValues, setCatValues] = useState(() => stage.config.presetPercentages || {});
  const [selectedMulti, setSelectedMulti] = useState([]);
  const [myMergeGroups, setMyMergeGroups] = useState([]);

  if (stage.type === "promedio") {
    const singleMemberCount = stage.key === "singleQuota" ? flowConfig?.memberCounts?.single : null;
    return (
      <div className="mb-2">
        <div className="flex items-center gap-2">
          <input
            type="number"
            placeholder={tf("input.yourProposal", siLang)}
            value={numValue}
            disabled={disabled}
            onChange={(e) => setNumValue(e.target.value)}
            className="dp-mono flex-1 rounded-lg px-2.5 py-1.5 text-sm outline-none disabled:opacity-50"
            style={{ background: BLUE_SOFT, color: INK }}
          />
          <button
            onClick={() => onSend(Number(numValue))}
            disabled={sending || disabled || numValue === ""}
            className="dp-body flex items-center gap-1.5 text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40"
            style={{ background: GREEN }}
          >
            <i className="ti ti-send" style={{ marginRight: "4px" }}></i>{sending ? tf("flow.sending", siLang) : tf("flow.send", siLang)}
          </button>
        </div>
        {singleMemberCount > 0 && numValue !== "" && (
          <div className="dp-mono text-[11px] mt-1" style={{ color: INK + "77" }}>
            {tf("input.membersCollected", siLang, { count: singleMemberCount, value: numValue, total: formatMoney(singleMemberCount * Number(numValue)) })}
          </div>
        )}
      </div>
    );
  }

  if (stage.type === "mayoria") {
    return (
      <div className="flex flex-col gap-1.5 mb-2">
        {stage.config.explanation && (
          <div className="dp-body text-[11px] mb-1 p-2.5 rounded-lg whitespace-pre-line" style={{ background: PAGE_BG, color: INK + "99", lineHeight: 1.5 }}>
            {stage.config.explanation}
          </div>
        )}
        {stage.config.options.map((opt) => (
          <button
            key={opt}
            onClick={() => setSelected(opt)}
            disabled={disabled}
            className="dp-body text-left text-sm px-3 py-2 rounded-lg disabled:opacity-50"
            style={selected === opt ? { background: BLUE, color: "#fff" } : { background: BLUE_SOFT, color: INK }}
          >
            {selected === opt ? "● " : "○ "}{opt}
          </button>
        ))}
        <button
          onClick={() => onSend(selected)}
          disabled={sending || disabled || !selected}
          className="dp-body flex items-center justify-center gap-1.5 text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40 mt-1"
          style={{ background: GREEN }}
        >
          <i className="ti ti-send" style={{ marginRight: "4px" }}></i>{sending ? tf("flow.sending", siLang) : tf("flow.send", siLang)}
        </button>
      </div>
    );
  }

  if (stage.type === "recoleccion_abierta") {
    return (
      <div className="mb-2">
        {stage.config.fixedExpenseNames && stage.config.fixedExpenseNames.length > 0 && (
          <div className="rounded-lg p-2.5 mb-3" style={{ background: PAGE_BG }}>
            <div className="dp-body text-[10.5px] font-semibold mb-1" style={{ color: INK + "99" }}>{tf("input.alreadyCovered", siLang)}</div>
            <div className="dp-body text-[11px]" style={{ color: INK }}>{stage.config.fixedExpenseNames.join(", ")}</div>
          </div>
        )}
        {texts.map((t, i) => (
          <input
            key={i}
            value={t}
            disabled={disabled}
            onChange={(e) => {
              const arr = [...texts];
              arr[i] = e.target.value;
              setTexts(arr);
            }}
            placeholder={tf("input.proposalPlaceholder", siLang, { n: i + 1 })}
            className="dp-body w-full rounded-lg px-2.5 py-1.5 text-sm outline-none mb-1.5 disabled:opacity-50"
            style={{ background: BLUE_SOFT, color: INK }}
          />
        ))}
        {!disabled && (
          <button
            onClick={() => setTexts([...texts, ""])}
            className="dp-body text-xs font-medium mb-2"
            style={{ color: BLUE }}
          >
            {tf("input.addBox", siLang)}
          </button>
        )}
        <button
          onClick={() => onSend(texts.filter((t) => t.trim()))}
          disabled={sending || disabled || texts.every((t) => !t.trim())}
          className="dp-body flex items-center justify-center gap-1.5 w-full text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40"
          style={{ background: GREEN }}
        >
          <i className="ti ti-send" style={{ marginRight: "4px" }}></i>{sending ? tf("flow.sending", siLang) : tf("flow.send", siLang)}
        </button>
      </div>
    );
  }

  if (stage.type === "ranking_multiganador") {
    return (
      <div className="flex flex-col gap-1.5 mb-2">
        <div className="dp-body text-[11px] mb-1" style={{ color: INK + "77" }}>{tf("input.rankOrderShort", siLang)}</div>
        {stage.config.options.map((opt) => {
          const idx = rankOrder.indexOf(opt);
          return (
            <button
              key={opt}
              onClick={() => setRankOrder((prev) => (prev.includes(opt) ? prev.filter((o) => o !== opt) : [...prev, opt]))}
              disabled={disabled}
              className="dp-body flex items-center gap-2 text-left text-sm px-3 py-2 rounded-lg disabled:opacity-50"
              style={idx >= 0 ? { background: BLUE, color: "#fff" } : { background: BLUE_SOFT, color: INK }}
            >
              <span className="dp-mono font-semibold" style={{ minWidth: "16px" }}>{idx >= 0 ? idx + 1 : "–"}</span>
              {opt}
            </button>
          );
        })}
        <button
          onClick={() => onSend(rankOrder)}
          disabled={sending || disabled || rankOrder.length === 0}
          className="dp-body flex items-center justify-center gap-1.5 text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40 mt-1"
          style={{ background: GREEN }}
        >
          <i className="ti ti-send" style={{ marginRight: "4px" }}></i>{sending ? tf("flow.sending", siLang) : tf("flow.send", siLang)}
        </button>
      </div>
    );
  }

  if (stage.type === "promedio_por_categoria") {
    const memberCounts = flowConfig?.memberCounts || {};
    const hasAnyMemberCount = stage.config.categories.some((cat) => memberCounts[cat] > 0);
    const liveTotal = stage.config.categories.reduce((sum, cat) => {
      const mc = memberCounts[cat];
      const v = Number(catValues[cat]);
      return mc > 0 && !isNaN(v) ? sum + mc * v : sum;
    }, 0);
    return (
      <div className="mb-2">
        {stage.config.categories.map((cat) => {
          const mc = memberCounts[cat];
          return (
            <div key={cat} className="mb-1.5">
              <div className="flex items-center gap-2">
                <span className="dp-body text-xs flex-1" style={{ color: INK }}>{cat}</span>
                <input
                  type="number"
                  value={catValues[cat] || ""}
                  disabled={disabled}
                  onChange={(e) => setCatValues({ ...catValues, [cat]: e.target.value })}
                  className="dp-mono w-24 rounded-lg px-2 py-1.5 text-sm outline-none disabled:opacity-50"
                  style={{ background: BLUE_SOFT, color: INK }}
                />
              </div>
              {mc > 0 && catValues[cat] !== undefined && catValues[cat] !== "" && (
                <div className="dp-mono text-[10px] text-right" style={{ color: INK + "77" }}>
                  {tf("input.membersCollectedShort", siLang, { count: mc, value: catValues[cat], total: formatMoney(mc * Number(catValues[cat])) })}
                </div>
              )}
            </div>
          );
        })}
        {hasAnyMemberCount && (
          <div className="dp-mono text-[11px] mb-2" style={{ color: INK + "88" }}>
            {tf("input.totalCollected", siLang, { total: formatMoney(liveTotal) })}
          </div>
        )}
        <button
          onClick={() => {
            const obj = {};
            Object.entries(catValues).forEach(([k, v]) => {
              const n = Number(v);
              if (!isNaN(n)) obj[k] = n;
            });
            onSend(obj);
          }}
          disabled={sending || disabled}
          className="dp-body flex items-center justify-center gap-1.5 w-full text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40"
          style={{ background: GREEN }}
        >
          <i className="ti ti-send" style={{ marginRight: "4px" }}></i>{sending ? tf("flow.sending", siLang) : tf("flow.send", siLang)}
        </button>
      </div>
    );
  }

  if (stage.type === "seleccion_multiple") {
    return (
      <div className="mb-2">
        {stage.config.options.map((opt) => {
          const isSelected = selectedMulti.includes(opt);
          return (
            <button
              key={opt}
              onClick={() => setSelectedMulti((prev) => (isSelected ? prev.filter((o) => o !== opt) : [...prev, opt]))}
              disabled={disabled}
              className="dp-body flex items-center gap-2 text-left text-sm px-3 py-2 rounded-lg mb-1.5 disabled:opacity-50 w-full"
              style={isSelected ? { background: BLUE, color: "#fff" } : { background: BLUE_SOFT, color: INK }}
            >
              <i className={`ti ${isSelected ? "ti-square-check" : "ti-square"}`} style={{ marginRight: "5px" }}></i>{opt}
            </button>
          );
        })}
        <button
          onClick={() => onSend(selectedMulti)}
          disabled={sending || disabled || selectedMulti.length === 0}
          className="dp-body flex items-center justify-center gap-1.5 w-full text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40"
          style={{ background: GREEN }}
        >
          <i className="ti ti-send" style={{ marginRight: "4px" }}></i>{sending ? tf("flow.sending", siLang) : tf("flow.send", siLang)}
        </button>
      </div>
    );
  }

  if (stage.type === "porcentaje_por_categoria") {
    const total = Object.values(catValues).reduce((a, v) => a + (Number(v) || 0), 0);
    const totalRounded = Math.round(total * 10) / 10;
    const totalBudget = stage.config.totalBudget ?? flowConfig?.totalBudget;
    const pieData = stage.config.categories.map((cat) => ({ label: cat, value: Number(catValues[cat]) || 0 }));
    return (
      <div className="mb-2">
        <div className="mb-3">
          <PieChart data={pieData} />
        </div>
        {stage.config.categories.map((cat) => {
          const val = Number(catValues[cat]) || 0;
          const usedByOthers = stage.config.categories.reduce((s, c) => (c === cat ? s : s + (Number(catValues[c]) || 0)), 0);
          const maxForThis = Math.max(0, 100 - usedByOthers);
          const setCatVal = (v) => setCatValues({ ...catValues, [cat]: Math.max(0, Math.min(maxForThis, v)) });
          return (
            <div key={cat} className="rounded-lg p-2.5 mb-2" style={{ background: BLUE_SOFT }}>
              <div className="dp-body text-xs font-semibold mb-1.5" style={{ color: INK }}>{cat}</div>
              <div className="flex items-center gap-1.5">
                <button
                  onClick={() => setCatVal(val - 1)}
                  disabled={disabled}
                  className="rounded-full flex items-center justify-center disabled:opacity-40"
                  style={{ width: "24px", height: "24px", border: `1px solid ${BLUE}55`, background: "#fff", color: BLUE, flexShrink: 0 }}
                >
                  −
                </button>
                <input
                  type="range"
                  min="0"
                  max="100"
                  value={val}
                  disabled={disabled}
                  onChange={(e) => setCatVal(Number(e.target.value))}
                  className="flex-1"
                  style={{ background: `linear-gradient(to right, ${BLUE} ${val}%, #dfe3ea ${val}%)`, height: "6px", borderRadius: "3px", appearance: "none", WebkitAppearance: "none", outline: "none" }}
                />
                <button
                  onClick={() => setCatVal(val + 1)}
                  disabled={disabled}
                  className="rounded-full flex items-center justify-center disabled:opacity-40"
                  style={{ width: "24px", height: "24px", border: `1px solid ${BLUE}55`, background: "#fff", color: BLUE, flexShrink: 0 }}
                >
                  +
                </button>
                <input
                  type="number"
                  value={catValues[cat] || ""}
                  disabled={disabled}
                  onChange={(e) => setCatVal(Number(e.target.value) || 0)}
                  className="dp-mono text-center rounded-lg disabled:opacity-50"
                  style={{ width: "42px", border: `1px solid ${BLUE}55`, padding: "3px 4px", fontSize: "12px", color: BLUE, fontWeight: 700, background: "#fff", flexShrink: 0 }}
                />
                <span className="dp-mono text-xs" style={{ color: INK + "77", flexShrink: 0 }}>%</span>
              </div>
              {totalBudget > 0 && (
                <div className="dp-mono text-[10.5px] text-right mt-1" style={{ color: INK + "77" }}>
                  {tf("input.assignedAmount", siLang, { amount: formatMoney((val / 100) * totalBudget) })}
                </div>
              )}
            </div>
          );
        })}
        <div className="dp-mono text-[11px] mb-2 font-semibold" style={{ color: totalRounded === 100 ? GREEN : CORAL }}>
          {tf("input.assignedPercent", siLang, { pct: total })}{totalBudget > 0 ? ` (${formatMoney((total / 100) * totalBudget)} ${siLang === "en" ? "of" : "de"} ${formatMoney(totalBudget)})` : ""}
          {totalRounded > 100 ? tf("input.overBy", siLang, { pct: (totalRounded - 100).toFixed(1) }) : ""}
          {totalRounded < 100 ? tf("input.underBy", siLang, { pct: (100 - totalRounded).toFixed(1) }) : ""}
          {totalRounded === 100 ? tf("input.percentDone", siLang) : ""}
        </div>
        <button
          onClick={async () => {
            if (totalRounded > 100) {
              await customAlert(tf("input.alertOver", siLang, { pct: (totalRounded - 100).toFixed(1) }));
              return;
            }
            if (totalRounded < 100) {
              await customAlert(tf("input.alertUnder", siLang, { pct: (100 - totalRounded).toFixed(1) }));
              return;
            }
            const obj = {};
            Object.entries(catValues).forEach(([k, v]) => {
              const n = Number(v);
              if (!isNaN(n)) obj[k] = n;
            });
            onSend(obj);
          }}
          disabled={sending || disabled}
          className="dp-body flex items-center justify-center gap-1.5 w-full text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40"
          style={{ background: GREEN }}
        >
          <i className="ti ti-send" style={{ marginRight: "4px" }}></i>{sending ? tf("flow.sending", siLang) : tf("flow.send", siLang)}
        </button>
      </div>
    );
  }

  if (stage.type === "monto_por_puesto") {
    const amounts = stage.config.roles.map((role) => Number(catValues[role.id])).filter((n) => !isNaN(n) && n > 0);
    const ratio = amounts.length >= 2 ? Math.max(...amounts) / Math.min(...amounts) : 0;
    const overLimit = stage.config.limitTimes && ratio > stage.config.limitTimes + 0.001;
    const allFilled = stage.config.roles.every((role) => catValues[role.id] && Number(catValues[role.id]) > 0);
    return (
      <div className="mb-2">
        {stage.config.limitTimes && (
          <div className="dp-body text-[10.5px] mb-2 rounded-lg p-2" style={{ background: BLUE_SOFT, color: INK + "99" }}>
            {tf("montoPuesto.limitReminder", siLang, { limit: stage.config.limitTimes })}
          </div>
        )}
        {stage.config.roles.map((role) => (
          <div key={role.id} className="flex items-center gap-2 mb-1.5">
            <span className="dp-body text-xs flex-1" style={{ color: INK }}>{role.name}</span>
            <input
              type="number"
              value={catValues[role.id] || ""}
              disabled={disabled}
              onChange={(e) => setCatValues({ ...catValues, [role.id]: e.target.value })}
              placeholder="$"
              className="dp-mono w-24 rounded-lg px-2 py-1.5 text-sm outline-none disabled:opacity-50"
              style={{ background: BLUE_SOFT, color: INK }}
            />
            <span className="dp-mono text-xs" style={{ color: INK + "77" }}>/{tf(`tabulador.freq.${stage.config.frequency}`, siLang)}</span>
          </div>
        ))}
        {overLimit && (
          <div className="dp-body text-[10.5px] mb-2 rounded-lg p-2" style={{ background: CORAL + "15", color: CORAL }}>
            {tf("montoPuesto.overLimit", siLang, { ratio: ratio.toFixed(2), limit: stage.config.limitTimes })}
          </div>
        )}
        <button
          onClick={() => {
            const obj = {};
            stage.config.roles.forEach((role) => {
              const n = Number(catValues[role.id]);
              if (!isNaN(n)) obj[role.id] = n;
            });
            onSend(obj);
          }}
          disabled={sending || disabled || !allFilled || overLimit}
          className="dp-body flex items-center justify-center gap-1.5 w-full text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40"
          style={{ background: GREEN }}
        >
          <i className="ti ti-send" style={{ marginRight: "4px" }}></i>{sending ? tf("flow.sending", siLang) : tf("flow.send", siLang)}
        </button>
      </div>
    );
  }

  if (stage.type === "fusionar_categorias") {
    const groupedNames = new Set(myMergeGroups.flat());
    const available = stage.config.categories.filter((c) => !groupedNames.has(c));
    const toggleSelect = (name) => {
      setSelectedMulti(selectedMulti.includes(name) ? selectedMulti.filter((n) => n !== name) : [...selectedMulti, name]);
    };
    const confirmGroup = () => {
      if (selectedMulti.length < 2) return;
      setMyMergeGroups([...myMergeGroups, selectedMulti]);
      setSelectedMulti([]);
    };
    return (
      <div className="mb-2">
        {myMergeGroups.length > 0 && (
          <div className="mb-3">
            <div className="dp-body text-[11px] font-medium mb-1.5" style={{ color: INK }}>{tf("fusion.markedAs", siLang)}</div>
            {myMergeGroups.map((g, i) => (
              <div key={i} className="flex items-center justify-between rounded-lg p-2 mb-1.5" style={{ background: BLUE_SOFT }}>
                <span className="dp-body text-xs" style={{ color: INK }}>{g.join(" + ")}</span>
                <button onClick={() => setMyMergeGroups(myMergeGroups.filter((_, idx) => idx !== i))} style={{ color: CORAL }}>
                  <i className="ti ti-x"></i>
                </button>
              </div>
            ))}
          </div>
        )}
        {available.length > 0 && (
          <React.Fragment>
            <div className="dp-body text-[11px] font-semibold mb-1.5" style={{ color: INK }}>{tf("fusion.selectPrompt", siLang)}</div>
            {available.map((c) => (
              <label key={c} className="flex items-center gap-2 mb-1.5">
                <input type="checkbox" checked={selectedMulti.includes(c)} disabled={disabled} onChange={() => toggleSelect(c)} />
                <span className="dp-body text-sm" style={{ color: INK }}>{c}</span>
              </label>
            ))}
            {selectedMulti.length >= 2 && (
              <button
                onClick={confirmGroup}
                className="dp-body flex items-center justify-center gap-1.5 w-full text-sm py-2.5 rounded-full text-white font-semibold mb-3"
                style={{ background: "#E0A458" }}
              >
                <i className="ti ti-git-merge"></i> {tf("fusion.mergeButton", siLang, { n: selectedMulti.length })}
              </button>
            )}
          </React.Fragment>
        )}
        <button
          onClick={() => onSend(myMergeGroups)}
          disabled={sending || disabled}
          className="dp-body flex items-center justify-center gap-1.5 w-full text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40"
          style={{ background: GREEN }}
        >
          <i className="ti ti-send" style={{ marginRight: "4px" }}></i>
          {sending ? tf("flow.sending", siLang) : myMergeGroups.length > 0 ? tf("flow.send", siLang) : tf("fusion.continueWithout", siLang)}
        </button>
      </div>
    );
  }

  if (stage.type === "ajustar_candidatos") {
    const toggleRemove = (name) => {
      setSelectedMulti(selectedMulti.includes(name) ? selectedMulti.filter((n) => n !== name) : [...selectedMulti, name]);
    };
    return (
      <div className="mb-2">
        <div className="dp-body text-[11px] font-semibold mb-1.5" style={{ color: INK }}>{tf("ajustar.removePrompt", siLang)}</div>
        {stage.config.candidates.map((c) => (
          <label key={c} className="flex items-center gap-2 mb-1.5">
            <input type="checkbox" checked={selectedMulti.includes(c)} disabled={disabled} onChange={() => toggleRemove(c)} />
            <span className="dp-body text-sm" style={{ color: INK, textDecoration: selectedMulti.includes(c) ? "line-through" : "none" }}>{c}</span>
          </label>
        ))}
        <div className="dp-body text-[11px] font-semibold mt-3 mb-1.5" style={{ color: INK }}>{tf("ajustar.proposeNew", siLang)}</div>
        {texts.map((t, i) => (
          <input
            key={i}
            value={t}
            disabled={disabled}
            onChange={(e) => {
              const arr = [...texts];
              arr[i] = e.target.value;
              setTexts(arr);
            }}
            placeholder={tf("ajustar.newPlaceholder", siLang, { n: i + 1 })}
            className="dp-body w-full rounded-lg px-2.5 py-1.5 text-sm outline-none mb-1.5 disabled:opacity-50"
            style={{ background: BLUE_SOFT, color: INK }}
          />
        ))}
        {!disabled && (
          <button onClick={() => setTexts([...texts, ""])} className="dp-body text-xs font-medium mb-2" style={{ color: BLUE }}>
            {tf("ajustar.addNew", siLang)}
          </button>
        )}
        <button
          onClick={() => onSend({ remove: selectedMulti, add: texts.filter((t) => t.trim()) })}
          disabled={sending || disabled}
          className="dp-body flex items-center justify-center gap-1.5 w-full text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40"
          style={{ background: GREEN }}
        >
          <i className="ti ti-send" style={{ marginRight: "4px" }}></i>{sending ? tf("flow.sending", siLang) : tf("flow.send", siLang)}
        </button>
      </div>
    );
  }

  if (stage.type === "ajustar_gastos_fijos") {
    return (
      <div className="mb-2">
        {stage.config.gastos.map((g) => {
          const current = catValues[g.nombre] !== undefined ? catValues[g.nombre] : g.monto;
          const lowered = Number(current) < g.monto;
          return (
            <div key={g.nombre} className="mb-2.5">
              <div className="flex items-center gap-2 mb-1">
                <span className="dp-body text-xs flex-1" style={{ color: INK }}>{g.nombre}</span>
                <span className="dp-mono text-[10px]" style={{ color: INK + "77" }}>original: {formatMoney(g.monto)}</span>
              </div>
              <input
                type="number"
                value={current}
                disabled={disabled}
                onChange={(e) => setCatValues({ ...catValues, [g.nombre]: e.target.value })}
                className="dp-mono w-full rounded-lg px-2.5 py-1.5 text-sm outline-none disabled:opacity-50"
                style={{ background: BLUE_SOFT, color: lowered ? CORAL : INK }}
              />
              {lowered && (
                <div className="dp-body text-[10px] mt-1" style={{ color: CORAL }}>
                  <i className="ti ti-alert-triangle" style={{ marginRight: "4px" }}></i>Estás bajando este gasto fijo — confirma que la cooperativa pueda cubrirlo con ese monto.
                </div>
              )}
            </div>
          );
        })}
        <button
          onClick={() => {
            const obj = {};
            stage.config.gastos.forEach((g) => {
              const n = Number(catValues[g.nombre] !== undefined ? catValues[g.nombre] : g.monto);
              if (!isNaN(n)) obj[g.nombre] = n;
            });
            onSend(obj);
          }}
          disabled={sending || disabled}
          className="dp-body flex items-center justify-center gap-1.5 w-full text-xs px-3 py-2 rounded-full text-white font-medium disabled:opacity-40"
          style={{ background: GREEN }}
        >
          <i className="ti ti-send" style={{ marginRight: "4px" }}></i>{sending ? tf("flow.sending", siLang) : tf("flow.send", siLang)}
        </button>
      </div>
    );
  }

  return null;
}

function BigDecisionDisplay({ stage }) {
  const bLang = useLang();
  const r = stage.result;
  if (stage.key === "singleQuota") {
    return (
      <div className="text-center">
        <div className="dp-display text-4xl font-extrabold" style={{ color: BLUE }}>
          {r.average.toFixed(2)}
        </div>
        {r.totalCollected !== undefined && (
          <div className="dp-mono text-sm mt-1" style={{ color: GREEN }}>
            {tf("big.membersCollected", bLang, { count: r.memberCount, total: formatMoney(r.totalCollected) })}
          </div>
        )}
      </div>
    );
  }
  if (stage.key === "quotas") {
    return (
      <div>
        {Object.entries(r.categories).map(([cat, cr]) => (
          <div key={cat} className="flex justify-between items-baseline mb-1.5">
            <span className="dp-body text-sm" style={{ color: INK }}>{cat}</span>
            <span className="text-right">
              <span className="dp-display text-2xl font-extrabold" style={{ color: BLUE }}>{cr.average.toFixed(2)}</span>
              {cr.collected !== undefined && (
                <div className="dp-mono text-xs" style={{ color: GREEN }}>{formatMoney(cr.collected)}</div>
              )}
            </span>
          </div>
        ))}
        {r.totalCollected !== undefined && r.totalCollected !== null && (
          <div className="flex justify-between pt-2 mt-2" style={{ borderTop: `2px solid ${BLUE}33` }}>
            <span className="dp-body text-sm font-semibold" style={{ color: INK }}>{tf("result.totalCollectedLabel", bLang)}</span>
            <span className="dp-display text-xl font-extrabold" style={{ color: GREEN }}>{formatMoney(r.totalCollected)}</span>
          </div>
        )}
      </div>
    );
  }
  if (stage.key === "budget") {
    return (
      <div>
        <div className="mb-3 flex justify-center">
          <PieChart data={Object.entries(r.categories).map(([cat, cr]) => ({ label: cat, value: cr.normalizedPercent }))} size={110} />
        </div>
        {Object.entries(r.categories).map(([cat, cr]) => (
          <div key={cat} className="flex justify-between items-baseline mb-1.5">
            <span className="dp-body text-sm" style={{ color: INK }}>{cat}</span>
            <span className="text-right">
              <span className="dp-display text-2xl font-extrabold" style={{ color: BLUE }}>{cr.normalizedPercent}%</span>
              {cr.amount !== undefined && (
                <div className="dp-mono text-xs" style={{ color: INK + "88" }}>{formatMoney(cr.amount)}</div>
              )}
            </span>
          </div>
        ))}
      </div>
    );
  }
  if (stage.key === "montoPorPuesto") {
    const roleName = (id) => (stage.config.roles.find((role) => role.id === id) || {}).name || id;
    return (
      <div>
        {Object.entries(r.puestos).map(([id, p]) => (
          <div key={id} className="flex justify-between items-baseline mb-1.5">
            <span className="dp-body text-sm" style={{ color: INK }}>{roleName(id)}</span>
            <span className="text-right">
              <span className="dp-display text-xl font-extrabold" style={{ color: p.adjusted ? CORAL : BLUE }}>{formatMoney(p.amount)}</span>
              <div className="dp-mono text-[10px]" style={{ color: INK + "77" }}>{tf("big.perFrequency", bLang, { frequency: tf(`tabulador.freq.${stage.config.frequency}`, bLang) })}{p.adjusted ? tf("big.adjustedWasOriginal", bLang, { original: formatMoney(p.original) }) : ""}</div>
            </span>
          </div>
        ))}
        {r.wasAdjusted && (
          <div className="dp-body text-[10.5px] mt-2 pt-2" style={{ color: CORAL, borderTop: `1px solid ${CORAL}33` }}>
            {tf("big.someAdjusted", bLang, { limit: r.limitTimes })}
          </div>
        )}
      </div>
    );
  }
  return null;
}

                    <td key={role.id} className="pb-1.5 px-1 text-center font-semibold">{role.name}</td>

              </thead>

                {r.months.map((m) => (

                      <td key={role.id} className="py-1 px-1 text-center dp-mono font-semibold" style={{ color: GREEN }}>

    return (
      <div>
        <DetailsToggle show={showDetails} onToggle={() => setShowDetails(!showDetails)} />

          <div key={cat} className="mb-2.5">

                      >
                        {v}
                      </span>

                  })}
                </div>
                <div className="dp-mono text-[11px] mb-1" style={{ color: INK + "aa" }}>
                  ({cr.kept.join(" + ")}) ÷ {cr.kept.length} = {cr.average.toFixed(2)}

              </React.Fragment>

            {cr.collected !== undefined && (
              <div className="dp-mono text-[11px]" style={{ color: GREEN }}>
                {tf("input.membersCollectedShort", rLang, { count: cr.memberCount, value: cr.average.toFixed(2), total: formatMoney(cr.collected) })}

            )}
